name: Bug report
description: Something in axiom is broken or behaves wrongly
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Two commands give us most of what we need: `axiom bug-info` (your versions and setup; `~/.local/bin/axiom bug-info` if `axiom` isn't on your `PATH`) and `log.sh` (the shell's log), in axiom's `scripts/` folder: `~/.config/quickshell/axiom/scripts/` for a clone, `/usr/share/axiom/scripts/` for a distribution package.

        Asking how to do something? [Discussions](https://github.com/axiom-shell/axiom/discussions/categories/q-a) is the place.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the overlay (Super + Tab)
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bar or bar popouts
        - Overlay pages, or their editors
        - Edge menus
        - Dock
        - Desktop widgets
        - Settings
        - Launcher
        - Notifications
        - OSD
        - Lock screen
        - Login screen (greeter)
        - Workspaces or overview
        - Keybinds, monitors or compositor setup
        - Themes and app integrations
        - Chat, calendar or notes
        - First-start setup
        - Installer or distribution package
        - The axiom command or its daemon (axiom run, axiom config, …)
        - Self-update
        - Other
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System info
      description: The output of `axiom bug-info`.
      placeholder: |
        axiom:      clone v1.2.0
        Binary:     axiom v1.2.0 (commit 1a2b3c4d5e6f), running
        Quickshell: Quickshell 0.3.2
        Compositor: Hyprland 0.55.0
        ...
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The output of `scripts/log.sh`, right after the problem happens. `scripts/log.sh --debug` gives more detail. If the shell won't start, crashes, or doesn't save settings, add `axiom daemon logs` too.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, your monitor setup, or the relevant part of `~/.config/axiom/config.json`.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues, and this isn't one of them.
          required: true
        - label: I'm on the latest release (Settings → Maintenance → axiom updates), or on a distribution package's latest version.
