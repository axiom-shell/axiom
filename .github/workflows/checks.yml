name: Checks

# Pull requests only: a PR's run checks its merge commit, which is what
# lands on main (merges are serial), so main isn't checked again. Run by hand
# (Actions → Checks → Run workflow) for a full run on any branch. Weekly on
# main, the go job alone: govulncheck sees advisories published since the
# last PR touching Go
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Build with the container's go, never a download. Its caches outside any
# home, so the go job's user and the other jobs' root find what
# actions/cache restores
env:
  GOTOOLCHAIN: local
  GOCACHE: /var/cache/go/build
  GOMODCACHE: /var/cache/go/mod

# A new push to a PR cancels its older run
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Arch, for a go new enough to build the schema (the other jobs' image)
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git python go

      # The org only allows its own SHA-pinned actions, so check out with plain
      # git. Whole history (a few MB): the doc drift counts commits since each
      # doc changed. The workspace is mounted from the runner, owned by
      # another user than the container's root, which git refuses without
      # safe.directory
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          python3 --version
          echo "GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

      # Go's build and module caches across runs (generate.sh compiles the
      # binary). Both are content-addressed, so a hit only skips compiling
      # what didn't change, and the key needs only the Go version and the
      # dependencies (go.sum): it changes rarely, so a run saves only when
      # it's new. The tests run with -count=1, never from cache. A PR's run
      # restores main's cache, which the go job's weekly run saves (also
      # under this key: the two jobs share one; when both save a new key,
      # the later one only logs that it exists). Never re-saved under one
      # key, it goes stale only in axiom's own packages, recompiled each
      # run; the key rolls with each Go release Arch ships
      - name: Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/go
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-

      # The generated files (config/json/config.schema.json, built from
      # config/schema/, and the reference docs; gen_docs.py also fails when
      # the shell calls a daemon method or push the daemon doesn't define,
      # and on unread settings or unused reader members),
      # then structure, sizes, docs, package lists, JSON and translations:
      # each job runs its part of scripts/check_all.sh, the one list of checks
      - name: Checks (scripts/check_all.sh checks)
        run: scripts/check_all.sh --ci checks

      # The job's summary page: each check's result and findings as tables,
      # the docs describing what a pull request changes, and doc drift.
      # Runs whatever failed above; reports only (the steps fail)
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # A pull request's HEAD is its merge commit: HEAD^1 is the base
            python3 scripts/ci_summary.py --changed-from HEAD^1 >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
          fi

  # Qt tooling, on Arch so qmllint and the tests see the same Qt and
  # Quickshell (with its type info) as the shell does. A container image is
  # not an action, so the org's action policy doesn't apply to it.
  qt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git diffutils qt6-declarative quickshell python go
          /usr/lib/qt6/bin/qmllint --version

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The schema and the shared fixtures tst_Shared replays (recorded
      # from SchemaValidation against the live schema), then qmlformat,
      # qmllint (failing only on warnings not in
      # scripts/qmllint-baseline.json) and the unit tests
      - name: Checks (scripts/check_all.sh qt)
        run: scripts/check_all.sh --ci qt

  # backend/ (the axiom binary): generated files, gofmt, vet, staticcheck,
  # tests under -race and govulncheck (the release cross-builds are
  # release.yml's). Arch's go and gcc (for -race), like the other jobs'
  # containers; Qt and Quickshell to record the shared fixtures the tests
  # replay (from SchemaValidation). Skipped when a PR changes nothing the
  # binary is built or tested from
  go:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # What the binary is built or tested from: backend/, the schema and
      # the files it embeds (config/), the JS helpers and tests the shared
      # fixtures are recorded from, and the scripts building them (the same
      # list as verify.sh's, a little wider); the tests also read examples/
      # and the generated ipc.md (from every QML file with an IpcTarget). A
      # PR's HEAD is its merge commit: HEAD^1 is the base
      - name: Does the change reach the binary?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          ipc=$(printf '%s\n' "$changed" | grep '\.qml$' | while read -r f; do
            { git show "HEAD:$f"; git show "HEAD^1:$f"; } 2>/dev/null | grep -qE 'IpcTarget[[:space:]]*[{]' && echo "$f" || true
          done)
          if [ "$EVENT" != pull_request ] || [ -n "$ipc" ] || printf '%s\n' "$changed" |
            grep -qE '^(backend/|config/(schema|json)/|components/methods/|examples/|tests/(Shared|RepoFiles|tst_)|scripts/(check_all|check_go|generate|gen_docs|qml_modules|run_tests)\.|scripts/dev/fixtures\.py|\.github/workflows/)'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the binary is built or tested from changed: skipping the Go checks"
          fi

      - name: Install tools
        if: steps.scope.outputs.run
        run: |
          pacman -S --noconfirm --needed go gcc python qt6-declarative quickshell lua
          go version
          echo "GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

      # The checks job's Go caches (the same key)
      - name: Go caches
        if: steps.scope.outputs.run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/go
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-

      # scripts/check_go.sh --ci, and that the cases the JS helpers and the
      # axiom binary share (both replay them) are indexed. A shared runner
      # is slower than the machine the tests' waits were tuned on: they
      # wait three times as long (testkit.Bound). As a user, not the
      # container's root, who reads and writes any file: the tests of a
      # file the user can't read or write would skip. setpriv keeps the
      # environment (the wait factor, the Go cache paths)
      - name: Checks (scripts/check_all.sh go)
        if: steps.scope.outputs.run
        env:
          AXIOM_TEST_WAIT_FACTOR: "3"
        run: |
          useradd -m ci
          mkdir -p /var/cache/go
          chown -R ci:ci "$PWD" /var/cache/go
          setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci scripts/check_all.sh --ci go

  # The script tests (the slowest checks) and the shell script lint, beside
  # the qt job rather than after it
  scripts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git diffutils shellcheck lua jq python go

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The generated files the script tests read, shellcheck, the script
      # tests (themes, the Neovim module, the dev scripts) and the agent
      # guard's tests (.claude/hooks/guard.py, AGENTS.md's "Never" rules)
      - name: Checks (scripts/check_all.sh scripts)
        run: scripts/check_all.sh --ci scripts
