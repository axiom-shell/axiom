name: Checks

on:
  # Pushes run only on main (after a merge); branches are checked by their PR
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Arch, for a go new enough to build the schema (the other jobs' image)
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git python go

      # The org only allows its own SHA-pinned actions, so check out with plain
      # git. Whole history (a few MB): the doc drift counts commits since each
      # doc changed. The workspace is mounted from the runner, owned by
      # another user than the container's root, which git refuses without
      # safe.directory
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          python3 --version

      # config/json/config.schema.json, which the docs and checks read, is
      # built from config/schema/, and the reference docs from the code and
      # the schema (never committed). gen_docs.py also fails here when the
      # shell calls a daemon method or push the daemon doesn't define
      - name: Generated files (scripts/generate.sh)
        env:
          GOTOOLCHAIN: local
        run: scripts/generate.sh

      - name: Structure (naming conventions, imports, singleton references)
        run: python3 scripts/check_structure.py

      - name: Sizes follow the Interface scale (no literal px outside the bars)
        run: python3 scripts/check_sizes.py

      - name: Docs match the code (links, paths, members)
        run: python3 scripts/check_docs.py

      # install.sh, Packages.qml (the onboarder's hints) and the AUR PKGBUILDs
      - name: Package lists agree
        run: python3 scripts/check_packages.py

      - name: JSON is valid
        run: git ls-files -z '*.json' | xargs -0 -n1 python3 -m json.tool --no-ensure-ascii > /dev/null

      # Missing entries fall back to English at runtime, so this only warns
      - name: Translations
        continue-on-error: true
        run: python3 scripts/check_i18n.py

      # The job's summary page: each check's result and findings as tables,
      # the docs describing what a pull request changes, and doc drift.
      # Runs whatever failed above; reports only (the steps fail)
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # A pull request's HEAD is its merge commit: HEAD^1 is the base
            python3 scripts/ci_summary.py --changed-from HEAD^1 >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
          fi

  # Qt tooling, on Arch so qmllint and the tests see the same Qt and
  # Quickshell (with its type info) as the shell does. A container image is
  # not an action, so the org's action policy doesn't apply to it.
  qt:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git diffutils qt6-declarative quickshell lua python go
          /usr/lib/qt6/bin/qmllint --version

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The schema and the shared fixtures tst_Shared replays (recorded
      # from SchemaValidation against the live schema)
      - name: Generated files (scripts/generate.sh --fixtures)
        env:
          GOTOOLCHAIN: local
        run: scripts/generate.sh --fixtures

      - name: qmlformat
        run: scripts/check_qmlformat.sh

      # Fails only on warnings not in scripts/qmllint-baseline.json
      - name: qmllint
        run: python3 scripts/check_qmllint.py

      - name: Unit tests (components/methods, schema, migrations)
        run: scripts/run_tests.sh

  # backend/ (the axiom binary): generated files, gofmt, vet, staticcheck,
  # tests under -race, govulncheck and the release cross-builds. Arch's go
  # and gcc (for -race), like the other jobs' containers; Qt and Quickshell
  # to record the shared fixtures the tests replay (from SchemaValidation)
  go:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git go gcc python qt6-declarative quickshell lua
          go version

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # GOTOOLCHAIN=local: build with the container's go, never a download
      - name: Go checks
        env:
          GOTOOLCHAIN: local
        run: scripts/check_go.sh --ci

      # The cases the JS helpers and the axiom binary share (both replay them)
      - name: Shared fixtures are indexed
        run: python3 scripts/dev/fixtures.py check

  # The script tests (the slowest checks) and the shell script lint, beside
  # the qt job rather than after it
  scripts:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        # numpy, Pillow and icalendar for theme generation and calendars, as
        # users install them: never python-recurring-ical-events, which
        # Fedora doesn't package (the calendar tests make importing it fail)
        run: pacman -Syu --noconfirm --needed git diffutils shellcheck lua jq gettext python python-numpy python-pillow python-icalendar go

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        # The workspace is mounted from the runner, owned by another user
        # than the container's root, which git refuses without this
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # config/json/config.schema.json, which the hookup tests read
      - name: Generated files (scripts/generate.sh)
        env:
          GOTOOLCHAIN: local
        run: scripts/generate.sh

      - name: shellcheck
        run: shellcheck -x -S warning install.sh scripts/*.sh scripts/lib/*.sh scripts/greeter/*.sh scripts/dev/*.sh .githooks/pre-commit

      # Theme integrations, self-update on scratch clones, theme generation
      - name: Script tests
        run: python3 tests/scripts/test_scripts.py -v

      # The agent guard (.claude/hooks/guard.py) enforcing AGENTS.md's "Never" rules
      - name: Guard tests
        run: python3 tests/scripts/test_guard.py -v
