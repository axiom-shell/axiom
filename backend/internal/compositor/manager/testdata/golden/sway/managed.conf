# Generated by axiom (sway mode: managed) from its settings, and
# rewritten whenever they (or the theme) change: edit those, not this file.
# Your own config goes in /nonexistent/home/.config/sway/user/, included after this in name
# order, so it overrides it.

mode "axiom_layer" bindsym --no-warn F35 mode default

bindsym --no-warn --no-repeat Mod4+Shift+g nop axiom special move gaming
bindsym --no-warn --no-repeat Mod4+g nop axiom special toggle gaming
bindsym --no-warn --no-repeat Mod4+Ctrl+s exec "'/home/user/.local/bin/axiom' ipc screenshot take 'region'"
bindsym --no-warn --whole-window --no-repeat Mod4+button5 focus right
bindsym --no-warn --whole-window --no-repeat Mod4+button4 focus left
bindsym --no-warn --no-repeat Ctrl+Shift+Tab nop axiom switcher step -1
bindsym --no-warn --no-repeat Mod4+Shift+r exec /home/user/.config/hypr/user/scripts/rotateMonitor.sh
bindsym --no-warn --no-repeat Mod4+f fullscreen toggle
bindsym --no-warn --no-repeat Mod4+c kill
bindsym --no-warn --no-repeat Mod4+z floating toggle
bindsym --no-warn --release --no-repeat Mod4+Ctrl+r exec "'/home/user/.local/bin/axiom' restart"
bindsym --no-warn --no-repeat Mod4+v nop axiom special toggle special
bindsym --no-warn --no-repeat Mod4+Shift+v nop axiom special move special
bindsym --no-warn --no-repeat Mod4+q exec kitty
bindsym --no-warn --no-repeat Mod4+Shift+q exec flatpak run app.zen_browser.zen
bindsym --no-warn --no-repeat Mod4+e exec nemo
bindsym --no-warn --no-repeat Mod4+t exec kitty --title btop -e btop
bindsym --no-warn --no-repeat Mod4+b exec pavucontrol
bindsym --no-warn --no-repeat Mod4+Shift+c exec element-desktop
bindsym --no-warn --no-repeat Mod4+Shift+e exec vesktop
bindsym --no-warn --no-repeat Mod4+Ctrl+Shift+s exec "rm -f /tmp/ocr-input.png /tmp/ocr-done && grim -g "'"'"$(slurp)"'"'" /tmp/ocr-input.png"
bindsym --no-warn --release --no-repeat Mod4+Shift+Escape exit
bindsym --no-warn --no-repeat Ctrl+Tab nop axiom switcher step 1
bindsym --no-warn --no-repeat Mod4+x layout toggle split
bindsym --no-warn --no-repeat Mod4+1 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '1' go"
bindsym --no-warn --no-repeat Mod4+Shift+1 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '1' move"
bindsym --no-warn --no-repeat Mod4+2 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '2' go"
bindsym --no-warn --no-repeat Mod4+Shift+2 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '2' move"
bindsym --no-warn --no-repeat Mod4+3 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '3' go"
bindsym --no-warn --no-repeat Mod4+Shift+3 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '3' move"
bindsym --no-warn --no-repeat Mod4+4 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '4' go"
bindsym --no-warn --no-repeat Mod4+Shift+4 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '4' move"
bindsym --no-warn --no-repeat Mod4+5 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '5' go"
bindsym --no-warn --no-repeat Mod4+Shift+5 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '5' move"
bindsym --no-warn --no-repeat Mod4+6 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '6' go"
bindsym --no-warn --no-repeat Mod4+Shift+6 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '6' move"
bindsym --no-warn --no-repeat Mod4+7 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '7' go"
bindsym --no-warn --no-repeat Mod4+Shift+7 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '7' move"
bindsym --no-warn --no-repeat Mod4+8 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '8' go"
bindsym --no-warn --no-repeat Mod4+Shift+8 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '8' move"
bindsym --no-warn --no-repeat Mod4+9 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '9' go"
bindsym --no-warn --no-repeat Mod4+Shift+9 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '9' move"
bindsym --no-warn Mod4+Ctrl+h resize shrink width 50 px
bindsym --no-warn Mod4+Ctrl+j resize grow height 50 px
bindsym --no-warn Mod4+Ctrl+k resize shrink height 50 px
bindsym --no-warn Mod4+Ctrl+l resize grow width 50 px
bindsym --no-warn --no-repeat Mod4+space exec "'/home/user/.local/bin/axiom' ipc appLauncher toggle"
bindsym --no-warn --no-repeat Mod4+Escape exec "'/home/user/.local/bin/axiom' ipc powermenu toggle"
bindsym --no-warn --no-repeat Mod4+Tab exec "'/home/user/.local/bin/axiom' ipc overlay toggle"
bindsym --no-warn --no-repeat Mod4+Shift+space exec "'/home/user/.local/bin/axiom' ipc workspaceOverlay toggle"
bindsym --no-warn --locked XF86AudioRaiseVolume exec "'/home/user/.local/bin/axiom' ipc audio volumeUp"
bindsym --no-warn --locked XF86AudioLowerVolume exec "'/home/user/.local/bin/axiom' ipc audio volumeDown"
bindsym --no-warn --locked --no-repeat XF86AudioMute exec "'/home/user/.local/bin/axiom' ipc audio toggleMute"
bindsym --no-warn --locked --no-repeat XF86AudioMicMute exec "'/home/user/.local/bin/axiom' ipc audio toggleMicMute"
bindsym --no-warn --locked XF86MonBrightnessUp exec "'/home/user/.local/bin/axiom' ipc brightness up"
bindsym --no-warn --locked XF86MonBrightnessDown exec "'/home/user/.local/bin/axiom' ipc brightness down"
bindsym --no-warn --locked --no-repeat XF86AudioPlay exec "'/home/user/.local/bin/axiom' ipc media playPause"
bindsym --no-warn --locked --no-repeat XF86AudioPause exec "'/home/user/.local/bin/axiom' ipc media playPause"
bindsym --no-warn --locked --no-repeat XF86AudioNext exec "'/home/user/.local/bin/axiom' ipc media next"
bindsym --no-warn --locked --no-repeat XF86AudioPrev exec "'/home/user/.local/bin/axiom' ipc media previous"
bindsym --no-warn --locked --no-repeat XF86AudioStop exec "'/home/user/.local/bin/axiom' ipc media stop"
bindsym --no-warn --no-repeat Mod4+w exec "'/home/user/.local/bin/axiom' ipc workspaces step 'up' go"
bindsym --no-warn --no-repeat Mod4+Shift+w exec "'/home/user/.local/bin/axiom' ipc workspaces step 'up' move"
bindsym --no-warn --no-repeat Mod4+s exec "'/home/user/.local/bin/axiom' ipc workspaces step 'down' go"
bindsym --no-warn --no-repeat Mod4+Shift+s exec "'/home/user/.local/bin/axiom' ipc workspaces step 'down' move"
bindsym --no-warn --no-repeat Mod4+a exec "'/home/user/.local/bin/axiom' ipc workspaces step 'left' go"
bindsym --no-warn --no-repeat Mod4+Shift+a exec "'/home/user/.local/bin/axiom' ipc workspaces step 'left' move"
bindsym --no-warn --no-repeat Mod4+d exec "'/home/user/.local/bin/axiom' ipc workspaces step 'right' go"
bindsym --no-warn --no-repeat Mod4+Shift+d exec "'/home/user/.local/bin/axiom' ipc workspaces step 'right' move"
bindsym --no-warn --no-repeat Mod4+j focus down
bindsym --no-warn --no-repeat Mod4+Shift+j move down
bindsym --no-warn --no-repeat Mod4+k focus up
bindsym --no-warn --no-repeat Mod4+Shift+k move up
bindsym --no-warn --no-repeat Mod4+h focus left
bindsym --no-warn --no-repeat Mod4+Shift+h move left
bindsym --no-warn --no-repeat Mod4+l focus right
bindsym --no-warn --no-repeat Mod4+Shift+l move right
bindsym --no-warn --no-repeat Mod4+0 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '10' go"
bindsym --no-warn --no-repeat Mod4+Shift+0 exec "'/home/user/.local/bin/axiom' ipc workspaces nth '10' move"
bindsym --no-warn --no-repeat Mod4+Ctrl+r nop
bindsym --no-warn --no-repeat Mod4+Shift+Escape nop
floating_modifier Mod4 normal

client.focused #9ccfd8 #9ccfd8 #000000 #9ccfd8 #9ccfd8
client.focused_inactive #403d52 #403d52 #ffffff #403d52 #403d52
client.unfocused #403d52 #403d52 #ffffff #403d52 #403d52
default_border pixel 2
default_floating_border pixel 2
gaps inner 3
gaps outer 6

input type:keyboard xkb_layout us
input type:keyboard xkb_variant ""
input type:keyboard xkb_options ""
input type:keyboard repeat_rate 50
input type:keyboard repeat_delay 300
input type:keyboard xkb_numlock enabled
input type:pointer accel_profile flat
input type:pointer pointer_accel 0
input type:pointer left_handed disabled
input type:touchpad natural_scroll disabled
input type:touchpad tap enabled
input type:touchpad dwt enabled
input type:touchpad scroll_factor 0.99
seat * xcursor_theme axiom-cursor-Oxygen_White 24

output "Example Display 0001" enable mode 3440x1440@240Hz pos 0 0 scale 1 transform normal adaptive_sync off render_bit_depth 8

# Windows, focus and sway's own options
focus_follows_mouse yes
focus_on_window_activation focus
workspace_auto_back_and_forth no
seat * hide_cursor 0
seat * hide_cursor when-typing disable
mouse_warping container
workspace_layout default
hide_edge_borders none
smart_gaps off
focus_wrapping yes
popup_during_fullscreen smart
xwayland enable

# The session
exec "dbus-update-activation-environment --systemd GDK_BACKEND='wayland,x11,*' QT_QPA_PLATFORM='wayland;xcb' CLUTTER_BACKEND='wayland' ELECTRON_OZONE_PLATFORM_HINT='auto' QT_AUTO_SCREEN_SCALE_FACTOR='1' QT_WAYLAND_DISABLE_WINDOWDECORATION='1' QT_QPA_PLATFORMTHEME='qt5ct' XCURSOR_THEME='axiom-cursor-Oxygen_White' XCURSOR_SIZE='24' XDG_CONFIG_HOME='/home/user/.config'"
exec "env GDK_BACKEND='wayland,x11,*' QT_QPA_PLATFORM='wayland;xcb' CLUTTER_BACKEND='wayland' ELECTRON_OZONE_PLATFORM_HINT='auto' QT_AUTO_SCREEN_SCALE_FACTOR='1' QT_WAYLAND_DISABLE_WINDOWDECORATION='1' QT_QPA_PLATFORMTHEME='qt5ct' XCURSOR_THEME='axiom-cursor-Oxygen_White' XCURSOR_SIZE='24' XDG_CONFIG_HOME='/home/user/.config' '/home/user/.local/bin/axiom' run"
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec nm-applet
exec tailscale systray
exec fcitx5 -d --replace
exec xrandr --output DP-1 --primary
exec easyeffects --gapplication-service
exec wl-paste --type text --watch cliphist store
exec protonmail-bridge --no-window

include /nonexistent/home/.config/sway/user/*
