# Generated by axiom from the "${THEME_NAME}" theme.
# Rewritten on every theme change: edit the template instead.
# The keys are fcitx5 5.1's classicui ThemeConfig (src/ui/classic/theme.h).
# No [AccentColorField]: the system accent color never repaints it.

[Metadata]
Name=Axiom
Version=1
Author=axiom
Description=Follows the axiom theme

[InputPanel]
NormalColor=${FOREGROUND}
HighlightCandidateColor=${BACKGROUND}
HighlightColor=${FOREGROUND_HIGHLIGHT}
HighlightBackgroundColor=${BACKGROUND_HIGHLIGHT}
CandidateLabelColor=${FOREGROUND_ALT}
HighlightCandidateLabelColor=${BACKGROUND}
CandidateCommentColor=${FOREGROUND_ALT}
HighlightCandidateCommentColor=${BACKGROUND}
PageButtonAlignment=Last Candidate

[InputPanel/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/TextMargin]
Left=7
Right=7
Top=5
Bottom=5

# Color and BorderColor are what fcitx5 draws when it can't load the image
[InputPanel/Background]
Image=panel.svg
Color=${BACKGROUND}
BorderColor=${BORDER}
BorderWidth=2

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.svg
Color=${ACCENT}

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=${FOREGROUND}
HighlightCandidateColor=${FOREGROUND_HIGHLIGHT}

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/TextMargin]
Left=7
Right=7
Top=5
Bottom=5

[Menu/Background]
Image=panel.svg
Color=${BACKGROUND}
BorderColor=${BORDER}
BorderWidth=2

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/Highlight]
Image=menu-highlight.svg
Color=${BACKGROUND_HIGHLIGHT}

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=${BORDER}

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg
