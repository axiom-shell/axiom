# From the "${THEME_NAME}" theme. The cursor row and the selected tab
# (highlight) are the accent; a list without focus keeps a quieter one
background = "${BACKGROUND}"
primary = "${FOREGROUND}"
secondary = "${FOREGROUND_ALT}"
title = "${ACCENT}"
playing = "${ACCENT}"
playing_selected = "${BACKGROUND}"
playing_bg = "${BACKGROUND}"
highlight = "${BACKGROUND}"
highlight_bg = "${ACCENT}"
highlight_inactive_bg = "${BACKGROUND_HIGHLIGHT}"
error = "${BACKGROUND}"
error_bg = "${ERROR}"
statusbar = "${FOREGROUND}"
statusbar_progress = "${ACCENT}"
statusbar_bg = "${BACKGROUND_ALT}"
cmdline = "${FOREGROUND}"
cmdline_bg = "${BACKGROUND}"
search_match = "${WARNING}"
