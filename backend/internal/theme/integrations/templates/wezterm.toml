# Generated by axiom from the "${THEME_NAME}" theme.
# Rewritten on every theme change: edit the template instead.

[metadata]
name = "axiom"
origin_url = "axiom: ${THEME_NAME}"

[colors]
foreground = "${FOREGROUND}"
background = "${BACKGROUND}"
cursor_bg = "${ACCENT}"
cursor_fg = "${BACKGROUND}"
cursor_border = "${ACCENT}"
selection_bg = "${FOREGROUND}"
selection_fg = "${BACKGROUND}"
split = "${BORDER}"
ansi = ["${ANSI_0}", "${ANSI_1}", "${ANSI_2}", "${ANSI_3}", "${ANSI_4}", "${ANSI_5}", "${ANSI_6}", "${ANSI_7}"]
brights = ["${ANSI_8}", "${ANSI_9}", "${ANSI_10}", "${ANSI_11}", "${ANSI_12}", "${ANSI_13}", "${ANSI_14}", "${ANSI_15}"]

[colors.tab_bar]
background = "${BACKGROUND_ALT}"

[colors.tab_bar.active_tab]
bg_color = "${BORDER_FOCUS}"
fg_color = "${BACKGROUND}"

[colors.tab_bar.inactive_tab]
bg_color = "${BACKGROUND_ALT}"
fg_color = "${FOREGROUND_INACTIVE}"
