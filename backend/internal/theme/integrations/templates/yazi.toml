# Generated by axiom from the "${THEME_NAME}" theme.
# Rewritten on every theme change: edit the template instead.
# Written for Yazi 25.5+ ([mgr], [tabs], [indicator], [pick], [cmp]; filetype
# rules by url, mime globs with a **/ scheme prefix, as Yazi 26 requires).

[mgr]
cwd = { fg = "${ACCENT}" }
find_keyword = { fg = "${WARNING}", bold = true, italic = true, underline = true }
find_position = { fg = "${ACCENT_ALT}", bold = true, italic = true }
marker_copied = { fg = "${SUCCESS}", bg = "${SUCCESS}" }
marker_cut = { fg = "${ERROR}", bg = "${ERROR}" }
marker_marked = { fg = "${INFO}", bg = "${INFO}" }
marker_selected = { fg = "${WARNING}", bg = "${WARNING}" }
count_copied = { fg = "${BACKGROUND}", bg = "${SUCCESS}" }
count_cut = { fg = "${BACKGROUND}", bg = "${ERROR}" }
count_selected = { fg = "${BACKGROUND}", bg = "${WARNING}" }
border_style = { fg = "${BORDER}" }

[indicator]
current = { fg = "${BACKGROUND}", bg = "${ACCENT}" }
parent = { fg = "${FOREGROUND}", bg = "${BACKGROUND_HIGHLIGHT}" }
preview = { fg = "${FOREGROUND}", bg = "${BACKGROUND_HIGHLIGHT}" }

[tabs]
active = { fg = "${BACKGROUND}", bg = "${ACCENT}", bold = true }
inactive = { fg = "${FOREGROUND}", bg = "${BACKGROUND_ALT}" }

[mode]
normal_main = { fg = "${BACKGROUND}", bg = "${ACCENT}", bold = true }
normal_alt = { fg = "${ACCENT}", bg = "${BACKGROUND_ALT}" }
select_main = { fg = "${BACKGROUND}", bg = "${SUCCESS}", bold = true }
select_alt = { fg = "${SUCCESS}", bg = "${BACKGROUND_ALT}" }
unset_main = { fg = "${BACKGROUND}", bg = "${ACCENT_ALT}", bold = true }
unset_alt = { fg = "${ACCENT_ALT}", bg = "${BACKGROUND_ALT}" }

[status]
overall = { fg = "${FOREGROUND}", bg = "${BACKGROUND_ALT}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "${ACCENT}" }
perm_read = { fg = "${WARNING}" }
perm_write = { fg = "${ERROR}" }
perm_exec = { fg = "${SUCCESS}" }
perm_sep = { fg = "${FOREGROUND_INACTIVE}" }
progress_label = { fg = "${FOREGROUND}", bold = true }
progress_normal = { fg = "${ACCENT}", bg = "${BACKGROUND_HIGHLIGHT}" }
progress_error = { fg = "${ERROR}", bg = "${BACKGROUND_HIGHLIGHT}" }

[input]
border = { fg = "${BORDER_FOCUS}" }
title = { fg = "${FOREGROUND}" }
value = { fg = "${FOREGROUND}" }
selected = { bg = "${BACKGROUND_HIGHLIGHT}" }

[pick]
border = { fg = "${BORDER_FOCUS}" }
active = { fg = "${ACCENT}", bold = true }
inactive = { fg = "${FOREGROUND}" }

[confirm]
border = { fg = "${BORDER_FOCUS}" }
title = { fg = "${FOREGROUND}" }
body = { fg = "${FOREGROUND}" }

[cmp]
border = { fg = "${BORDER_FOCUS}" }
active = { fg = "${ACCENT}", bg = "${BACKGROUND_HIGHLIGHT}" }
inactive = { fg = "${FOREGROUND}" }

[tasks]
border = { fg = "${BORDER_FOCUS}" }
title = { fg = "${FOREGROUND}" }
hovered = { fg = "${ACCENT}", underline = true }

[which]
border = { fg = "${BORDER_FOCUS}" }
mask = { bg = "${BACKGROUND_ALT}" }
cand = { fg = "${INFO}" }
rest = { fg = "${FOREGROUND_INACTIVE}" }
desc = { fg = "${ACCENT_ALT}" }
separator_style = { fg = "${FOREGROUND_INACTIVE}" }

[help]
border = { fg = "${BORDER_FOCUS}" }
chord = { fg = "${INFO}" }
action = { fg = "${ACCENT_ALT}" }
hovered = { bg = "${BACKGROUND_HIGHLIGHT}", bold = true }

[notify]
title_info = { fg = "${INFO}" }
title_warn = { fg = "${WARNING}" }
title_error = { fg = "${ERROR}" }

[filetype]
rules = [
    { mime = "**/image/*", fg = "${YELLOW}" },
    { mime = "**/{audio,video}/*", fg = "${MAGENTA}" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "${RED}" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "${CYAN}" },
    { url = "*", is = "orphan", fg = "${ERROR}" },
    { url = "*", is = "exec", fg = "${GREEN}" },
    { url = "*/", fg = "${BLUE}" },
]
