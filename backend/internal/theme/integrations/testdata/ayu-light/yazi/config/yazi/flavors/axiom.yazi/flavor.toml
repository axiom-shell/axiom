# Generated by axiom from the "Ayu Light" theme.
# Rewritten on every theme change: edit the template instead.
# Written for Yazi 25.5+ ([mgr], [tabs], [indicator], [pick], [cmp]; filetype
# rules by url, mime globs with a **/ scheme prefix, as Yazi 26 requires).

[mgr]
cwd = { fg = "#399ee6" }
find_keyword = { fg = "#9c6700", bold = true, italic = true, underline = true }
find_position = { fg = "#a37acc", bold = true, italic = true }
marker_copied = { fg = "#358200", bg = "#358200" }
marker_cut = { fg = "#c2484b", bg = "#c2484b" }
marker_marked = { fg = "#008262", bg = "#008262" }
marker_selected = { fg = "#9c6700", bg = "#9c6700" }
count_copied = { fg = "#f8f9fa", bg = "#358200" }
count_cut = { fg = "#f8f9fa", bg = "#c2484b" }
count_selected = { fg = "#f8f9fa", bg = "#9c6700" }
border_style = { fg = "#d2d4d8" }

[indicator]
current = { fg = "#f8f9fa", bg = "#399ee6" }
parent = { fg = "#5c6166", bg = "#d2d4d8" }
preview = { fg = "#5c6166", bg = "#d2d4d8" }

[tabs]
active = { fg = "#f8f9fa", bg = "#399ee6", bold = true }
inactive = { fg = "#5c6166", bg = "#edeff1" }

[mode]
normal_main = { fg = "#f8f9fa", bg = "#399ee6", bold = true }
normal_alt = { fg = "#399ee6", bg = "#edeff1" }
select_main = { fg = "#f8f9fa", bg = "#358200", bold = true }
select_alt = { fg = "#358200", bg = "#edeff1" }
unset_main = { fg = "#f8f9fa", bg = "#a37acc", bold = true }
unset_alt = { fg = "#a37acc", bg = "#edeff1" }

[status]
overall = { fg = "#5c6166", bg = "#edeff1" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#399ee6" }
perm_read = { fg = "#9c6700" }
perm_write = { fg = "#c2484b" }
perm_exec = { fg = "#358200" }
perm_sep = { fg = "#a0a6ac" }
progress_label = { fg = "#5c6166", bold = true }
progress_normal = { fg = "#399ee6", bg = "#d2d4d8" }
progress_error = { fg = "#c2484b", bg = "#d2d4d8" }

[input]
border = { fg = "#399ee6" }
title = { fg = "#5c6166" }
value = { fg = "#5c6166" }
selected = { bg = "#d2d4d8" }

[pick]
border = { fg = "#399ee6" }
active = { fg = "#399ee6", bold = true }
inactive = { fg = "#5c6166" }

[confirm]
border = { fg = "#399ee6" }
title = { fg = "#5c6166" }
body = { fg = "#5c6166" }

[cmp]
border = { fg = "#399ee6" }
active = { fg = "#399ee6", bg = "#d2d4d8" }
inactive = { fg = "#5c6166" }

[tasks]
border = { fg = "#399ee6" }
title = { fg = "#5c6166" }
hovered = { fg = "#399ee6", underline = true }

[which]
border = { fg = "#399ee6" }
mask = { bg = "#edeff1" }
cand = { fg = "#008262" }
rest = { fg = "#a0a6ac" }
desc = { fg = "#a37acc" }
separator_style = { fg = "#a0a6ac" }

[help]
border = { fg = "#399ee6" }
chord = { fg = "#008262" }
action = { fg = "#a37acc" }
hovered = { bg = "#d2d4d8", bold = true }

[notify]
title_info = { fg = "#008262" }
title_warn = { fg = "#9c6700" }
title_error = { fg = "#c2484b" }

[filetype]
rules = [
    { mime = "**/image/*", fg = "#9c6700" },
    { mime = "**/{audio,video}/*", fg = "#885faf" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c2484b" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#008262" },
    { url = "*", is = "orphan", fg = "#c2484b" },
    { url = "*", is = "exec", fg = "#358200" },
    { url = "*/", fg = "#0076b7" },
]
