# Generated by axiom from the "Catppuccin Mocha" theme.
# Rewritten on every theme change: edit the template instead.
# Written for Yazi 25.5+ ([mgr], [tabs], [indicator], [pick], [cmp]; filetype
# rules by url, mime globs with a **/ scheme prefix, as Yazi 26 requires).

[mgr]
cwd = { fg = "#89b4fa" }
find_keyword = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#cba6f7", bold = true, italic = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }
count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#f9e2af" }
border_style = { fg = "#45475a" }

[indicator]
current = { fg = "#1e1e2e", bg = "#89b4fa" }
parent = { fg = "#cdd6f4", bg = "#45475a" }
preview = { fg = "#cdd6f4", bg = "#45475a" }

[tabs]
active = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
inactive = { fg = "#cdd6f4", bg = "#313244" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt = { fg = "#89b4fa", bg = "#313244" }
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#313244" }
unset_main = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
unset_alt = { fg = "#cba6f7", bg = "#313244" }

[status]
overall = { fg = "#cdd6f4", bg = "#313244" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }
perm_sep = { fg = "#585b70" }
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#45475a" }
progress_error = { fg = "#f38ba8", bg = "#45475a" }

[input]
border = { fg = "#89b4fa" }
title = { fg = "#cdd6f4" }
value = { fg = "#cdd6f4" }
selected = { bg = "#45475a" }

[pick]
border = { fg = "#89b4fa" }
active = { fg = "#89b4fa", bold = true }
inactive = { fg = "#cdd6f4" }

[confirm]
border = { fg = "#89b4fa" }
title = { fg = "#cdd6f4" }
body = { fg = "#cdd6f4" }

[cmp]
border = { fg = "#89b4fa" }
active = { fg = "#89b4fa", bg = "#45475a" }
inactive = { fg = "#cdd6f4" }

[tasks]
border = { fg = "#89b4fa" }
title = { fg = "#cdd6f4" }
hovered = { fg = "#89b4fa", underline = true }

[which]
border = { fg = "#89b4fa" }
mask = { bg = "#313244" }
cand = { fg = "#94e2d5" }
rest = { fg = "#585b70" }
desc = { fg = "#cba6f7" }
separator_style = { fg = "#585b70" }

[help]
border = { fg = "#89b4fa" }
chord = { fg = "#94e2d5" }
action = { fg = "#cba6f7" }
hovered = { bg = "#45475a", bold = true }

[notify]
title_info = { fg = "#94e2d5" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
    { mime = "**/image/*", fg = "#f9e2af" },
    { mime = "**/{audio,video}/*", fg = "#cba6f7" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#94e2d5" },
    { url = "*", is = "orphan", fg = "#f38ba8" },
    { url = "*", is = "exec", fg = "#a6e3a1" },
    { url = "*/", fg = "#89b4fa" },
]
