label: Battery Status
icon: battery_full
group: System
popout: menu
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments, stacked]
    description: Stacked puts the charge over the time to full or left.
colors: standard
settings:
  showPercentage: {type: boolean, title: Show percentage, default: true}
  chargingColor: {$ref: '#/definitions/WidgetColor', title: Charging color, x-autoColor: alt}
  lowColor:
    $ref: '#/definitions/WidgetColor'
    x-link: {setting: Battery.lowThreshold}
    title: Low color
    x-autoColor: warning
    description: At or below Battery > Low at (in settings).
  criticalColor:
    $ref: '#/definitions/WidgetColor'
    x-link: {setting: Battery.criticalThreshold}
    title: Critical color
    x-autoColor: critical
    description: At or below Battery > Critical at (in settings).
