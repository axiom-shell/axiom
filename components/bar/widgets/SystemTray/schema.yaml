label: System Tray
icon: apps
group: Desktop
popout:
  variant: plain
  enabled: {title: Menus, description: Open an item's menu when it's hovered.}
settings:
  showPassive:
    type: boolean
    title: Show passive
    default: true
    description: Also show items that report themselves as passive (idle).
  backgroundColor:
    type: string
    title: Background
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      anyOf:
        - {$bar.widgetStyle: [filled, tinted, outline], $bar.widgetGrouping: {not: merged}}
        - {$bar.widgetStyle: underline}
