label: Tailscale Status
icon: vpn_lock
group: Network & devices
popout: menu
settings:
  showLabel: {type: boolean, title: Show label, default: true}
  label:
    type: string
    title: Label
    default: ''
    description: Text shown while connected. Empty shows the tailnet name.
  interval:
    type: integer
    title: Poll interval
    description: How often Tailscale is asked; never more often than every 5 seconds.
    x-unit: ms
    default: 10000
    minimum: 250
    maximum: 60000
  connectedColor: {$ref: '#/definitions/WidgetColor', title: Connected color}
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: 'off'
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    x-showIf:
      $bar.widgetStyle: filled
      $bar.widgetGrouping: {not: merged}
      $bar.widgetTextColor: ''
