label: Window Title
icon: wrap_text
group: Desktop
popout: menu
appearance:
  variant: value
  style:
    enum: [label, icon, ticker, stacked]
    description: "Ticker scrolls a long title; stacked puts it over the app's id."
colors: standard
settings:
  icon:
    type: string
    title: Icon
    default: ''
    description: 'Icon shown before the title: a Material Symbols name (fonts.google.com/icons), or text. Empty shows none.'
  emptyText:
    type: string
    title: Empty text
    default: '—'
    description: Shown when no window is focused.
