label: Toggle
icon: toggle_on
defaultSize: [5, 1]
slots: [state, label]
actions: ['on', 'off']
settings:
  look:
    type: string
    title: Look
    default: switch
    enum: [switch, pill]
    x-enumLabels: {switch: A switch beside the label, pill: A quick-settings pill}
  label: {type: string, title: Label, default: '', description: Shown unless the label slot is bound.}
  icon: {type: string, title: Icon, default: toggle_on, x-showIf: {look: pill}}
