# The OSDEntry definition (#/definitions/OSDEntry).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name:
    type: string
    title: Name
    default: ''
    description: Shown on its tab here. Empty names it by its bars.
  enabled: {type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all, named]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
          named: These monitors
        x-link: {setting: General.screen}
  edge:
    type: string
    title: Screen edge
    default: bottom
    enum: [top, bottom, left, right]
    description: Screen edge the OSD slides out of.
  position:
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where along the edge it opens: 0 is the start (left/top), 100 the end.'
  detached:
    type: boolean
    title: Detach from edge
    default: false
    description: A separate box held off the edge. Off, the OSD grows out of the screen border or a solid bar, as popouts do, and runs straight off a bare screen edge.
  gap:
    type: integer
    x-control: stepper
    x-auto: {value: -1, start: 8}
    x-beside: true
    title: Gap
    default: -1
    minimum: -1
    maximum: 200
    x-unit: px
    description: Space between the OSD and the border or bar on its edge, and at the ends. Auto lines it up with a floating bar on its edge, else with your windows.
    x-showIf: {detached: true}
  orientation:
    type: string
    title: Bar orientation
    default: vertical
    enum: [vertical, horizontal]
    description: Vertical bars sit side by side; horizontal bars stack as rows.
  alongEdge:
    type: boolean
    title: Line up along the edge
    default: false
    x-showIf:
      anyOf:
        - {edge: [top, bottom], orientation: horizontal}
        - {edge: [left, right], orientation: vertical}
    description: 'Put the bars end to end in one line along the edge, instead of stacked away from it: the OSD is longer but sticks out less. Shown only while the bars run along the edge.'
  openOnHover:
    type: boolean
    title: Open on hover
    default: false
    description: Also open the OSD when the mouse touches the screen edge where it appears.
  timeout:
    type: integer
    title: Timeout
    x-unit: ms
    default: 1000
    minimum: 250
    maximum: 10000
    description: How long the OSD stays open after the last change.
  showPercent:
    type: boolean
    title: Show percentages
    default: true
    description: Show each level's value as a percentage beside its icon.
  items:
    type: array
    title: Shows
    description: 'What the OSD shows and reacts to, in order. Levels (volumes, microphone, brightness) show as bars; a change to one of the others (a lock key, the keyboard layout, a toggle) shows as one line with its icon instead, and the track as a card. The OSD shows whichever changed last. System volume is the output device''s volume, Other apps is the first playing stream no App bar (in any OSD) matches, Microphone is the input device''s volume, and Brightness is the monitor''s own (a laptop panel through its backlight, an external monitor over DDC/CI through ddcutil; left out on a monitor that has neither). The same item in two OSDs opens both.'
    default:
      - {type: other, icon: music_note, showOsd: true}
      - {type: master, icon: '', showOsd: true}
      - {type: lockKeys, icon: '', showOsd: true}
      - {type: keyboardLayout, icon: '', showOsd: true}
      - {type: micMute, icon: '', showOsd: true}
      - {type: outputDevice, icon: '', showOsd: true}
    items:
      x-scopeIf: {when: {type: app}, scope: personal}
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          title: Kind
          enum: [master, other, app, microphone, brightness, lockKeys, keyboardLayout, micMute, outputDevice, powerProfile, caffeine, dnd, nightLight, wifi, bluetooth, airplane, charger, message, media]
          x-enumLabels:
            master: System volume
            other: Other apps
            app: An app
            microphone: Microphone
            brightness: Brightness
            lockKeys: Lock keys
            keyboardLayout: Keyboard layout
            micMute: Microphone muted
            outputDevice: Output device switched
            powerProfile: Power profile
            caffeine: Caffeine
            dnd: Do not disturb
            nightLight: Night light
            wifi: Wi-Fi on or off
            bluetooth: Bluetooth on or off
            airplane: Airplane mode
            charger: Charger plugged in or out
            message: Messages (axiom ipc osd message)
            media: Now playing
          default: app
        apps:
          x-scope: personal
          type: array
          items: {type: string}
          title: Apps
          default: []
          x-showIf: {type: app}
          x-suggestions: audioApps
          description: Comma-separated; each matched as a substring of a stream's binary or name. The bar shows the first listed app with a stream open, and a change sets every matching stream.
        allMonitors:
          type: boolean
          title: All monitors
          default: false
          x-showIf: {type: brightness}
          description: The bar sets every monitor with a brightness control at once, instead of only the one the OSD is on.
        caps:
          type: boolean
          title: Caps Lock
          default: true
          x-showIf: {type: lockKeys}
        num:
          type: boolean
          title: Num Lock
          default: true
          x-showIf: {type: lockKeys}
        scroll:
          type: boolean
          title: Scroll Lock
          default: false
          x-showIf: {type: lockKeys}
        onTrackChange:
          type: boolean
          title: On a new track
          default: true
          x-showIf: {type: media}
        onPlayPause:
          type: boolean
          title: On play and pause
          default: false
          x-showIf: {type: media}
        icon:
          type: string
          title: Icon
          default: ''
          description: 'Icon shown with it: a Material Symbols name (fonts.google.com/icons), or text. Empty follows what it shows (the level, the device, on or off); a message''s own icon wins.'
        showOsd:
          type: boolean
          title: Opens the OSD
          default: true
          description: A change on it opens the OSD. Off, a level still shows while the OSD is open, and a level change keeps an open OSD open.
required: [id]
