# The OSDEntry definition (#/definitions/OSDEntry).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name:
    type: string
    title: Name
    default: ''
    description: Shown on its tab here. Empty names it by what it shows.
  enabled: {type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all, named]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
          named: These monitors
        x-link: {setting: General.screen}
  edge:
    type: string
    title: Screen edge
    default: bottom
    enum: [top, bottom, left, right]
    description: Screen edge the OSD slides out of.
  position:
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where along the edge it opens: 0 is the start (left/top), 100 the end.'
  detached:
    type: boolean
    title: Detach from edge
    default: false
    description: A separate box held off the edge. Off, the OSD grows out of the screen border or a solid bar, as popouts do, and runs straight off a bare screen edge.
  gap:
    type: integer
    x-control: stepper
    x-auto: {value: -1, start: 8}
    x-beside: true
    title: Gap
    default: -1
    minimum: -1
    maximum: 200
    x-unit: px
    description: Space between the OSD and the border or bar on its edge, and at the ends. Auto lines it up with a floating bar on its edge, else with your windows.
    x-showIf: {detached: true}
  openOnHover:
    type: boolean
    title: Open on hover
    default: false
    description: Also open the OSD when the mouse touches the screen edge where it appears.
  timeout:
    type: integer
    title: Timeout
    x-unit: ms
    default: 1000
    minimum: 250
    maximum: 10000
    description: How long the bars and the status icons stay out after the last change. A card has its own (Status icons › Card timeout).
  openTogether:
    type: boolean
    title: Bars and status icons together
    default: false
    description: 'A change to a bar or a status icon brings out both. Off, each comes out on its own; while both are out they close together.'
  iconsPlace:
    type: string
    title: Status icons
    default: outside
    enum: [outside, inside]
    x-enumLabels:
      outside: Past the bars
      inside: By the edge
    description: 'Where the status icons go when they''re out with the bars: past them, away from the edge, or between the bars and the edge. A card always goes last.'
  holdStill:
    type: boolean
    title: Hold still under the mouse
    default: true
    description: 'While the mouse is on the OSD, the bars or the status icons coming in go after the others, so nothing you''re pointing at moves. Off, they take their usual place (Status icons). A card always goes last.'
  bars:
    type: object
    title: Bars
    description: 'The levels the OSD shows as bars, and how they''re laid out. A change to one shows the bars.'
    additionalProperties: false
    properties:
      orientation:
        type: string
        title: Bar orientation
        default: vertical
        enum: [vertical, horizontal]
        description: Vertical bars sit side by side; horizontal bars stack as rows.
      alongEdge:
        type: boolean
        title: Line up along the edge
        default: false
        x-showIf:
          anyOf:
            - {../edge: [top, bottom], orientation: horizontal}
            - {../edge: [left, right], orientation: vertical}
        description: 'Put the bars end to end in one line along the edge, instead of stacked away from it: the OSD is longer but sticks out less. Shown only while the bars run along the edge.'
      showPercent:
        type: boolean
        title: Show percentages
        default: true
        description: Show each level's value as a percentage beside its icon.
      items:
        type: array
        title: Bars
        description: 'In order. System volume is the output device''s volume, Other apps is the first playing stream no App bar (in any OSD) matches, Microphone is the input device''s volume, and Brightness is the monitor''s own (a laptop panel through its backlight, an external monitor over DDC/CI through ddcutil; left out on a monitor that has neither). The same bar in two OSDs opens both.'
        x-link: {setting: OSD.scrollToChange}
        default:
          - {type: other, icon: music_note, showOsd: true}
          - {type: master, icon: '', showOsd: true}
        items:
          x-scopeIf: {when: {type: app}, scope: personal}
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              title: Kind
              enum: [master, other, app, microphone, brightness]
              x-enumLabels:
                master: System volume
                other: Other apps
                app: An app
                microphone: Microphone
                brightness: Brightness
              default: app
            apps:
              x-scope: personal
              type: array
              items: {type: string}
              title: Apps
              default: []
              x-showIf: {type: app}
              x-suggestions: audioApps
              description: Comma-separated; each matched as a substring of a stream's binary or name. The bar shows the first listed app with a stream open, and a change sets every matching stream.
            allMonitors:
              type: boolean
              title: All monitors
              default: false
              x-showIf: {type: brightness}
              description: The bar sets every monitor with a brightness control at once, instead of only the one the OSD is on.
            icon:
              type: string
              x-control: icon
              title: Icon
              default: ''
              description: 'Icon shown with it: a Material Symbols name (fonts.google.com/icons), or text. Empty follows what it shows (the level, the device).'
            showOsd:
              type: boolean
              title: Opens the OSD
              default: true
              description: A change on it opens the OSD. Off, it still shows while the OSD is open, and a change keeps an open OSD open.
  statuses:
    type: object
    title: Status icons
    description: 'The state of the machine as icons: a change to one shows the icons. A change with a card (a drive plugged in, a VPN connecting) shows only the card; its icon is lit the next time the icons show.'
    additionalProperties: false
    properties:
      row:
        type: string
        title: Icons shown
        default: notable
        enum: [notable, all, changed]
        x-enumLabels:
          notable: What's unusual
          all: Every one picked
          changed: Only the one that changed
        description: 'What''s unusual shows only the states out of the ordinary (Caps Lock on, muted, do not disturb, on battery, …) and the one that just changed. Every one picked shows each, lit when on.'
      cards:
        type: boolean
        title: Detail cards
        default: true
        description: 'Some changes show a card with more to say: an audio device switching, a VPN connecting, an app starting to use the camera or microphone or share the screen, a Wi-Fi network joined, the charger plugged in, the battery running low, a monitor connected or removed, a screenshot taken, something done to a removable drive. Off, they show as their icon like any other change, and a drive, low battery, monitor or screenshot is a notification instead (a message is always a card).'
      cardTimeout:
        type: integer
        title: Card timeout
        x-unit: ms
        default: 4000
        minimum: 1000
        maximum: 15000
        description: 'How long a card stays out below the icons, keeping the OSD open. Then it slides back in, and the OSD closes with it unless the mouse is on it. Hovering the card keeps it out. Messages use it too.'
      items:
        type: array
        title: Shows
        items:
          type: string
          enum: [capsLock, numLock, scrollLock, keyboardLayout, audio, microphone, powerProfile, caffeine, dnd, nightLight, wifi, bluetooth, airplane, vpn, drive, charger, battery, monitor, recording, screenshot, camera, micUse, screenShare, message]
        x-enumLabels:
          capsLock: Caps Lock
          numLock: Num Lock
          scrollLock: Scroll Lock
          keyboardLayout: Keyboard layout
          audio: Audio
          microphone: Microphone
          powerProfile: Power profile
          caffeine: Caffeine
          dnd: Do not disturb
          nightLight: Night light
          wifi: Wi-Fi
          bluetooth: Bluetooth
          airplane: Airplane mode
          vpn: VPN
          drive: Removable drives
          charger: Charger
          battery: Low battery
          monitor: Monitors
          recording: Screen recording
          screenshot: Screenshots
          camera: Camera
          micUse: Microphone in use
          screenShare: Screen sharing
          message: Messages
        x-enumIcons:
          capsLock: keyboard_capslock
          numLock: dialpad
          scrollLock: swap_vert
          keyboardLayout: keyboard
          audio: volume_up
          microphone: mic
          powerProfile: speed
          caffeine: coffee
          dnd: do_not_disturb_on
          nightLight: nightlight
          wifi: wifi
          bluetooth: bluetooth
          airplane: airplanemode_active
          vpn: vpn_key
          drive: usb
          charger: power
          battery: battery_alert
          monitor: monitor
          recording: screen_record
          screenshot: screenshot_monitor
          camera: videocam
          micUse: record_voice_over
          screenShare: screen_share
          message: chat
        default: [capsLock, numLock, keyboardLayout, microphone, audio, dnd, caffeine, nightLight, recording, drive]
        description: 'A VPN (Tailscale too) shows each time one goes up or down, a drop included, with a card naming it as one connects. Camera, Microphone in use and Screen sharing show a card naming the app as one starts (one card for an app taking the camera and the microphone together), Wi-Fi one naming the network it joins, Charger one with the battery level when plugged in, and Removable drives one as a drive is plugged in, mounted, unmounted, safe to remove or unplugged, or fails to eject (a click opens the drive, or unlocks an encrypted one). Low battery shows one as the battery drops to low and to critical, Monitors one naming a monitor connected or removed and its resolution, and Screenshots one with the picture as one is taken (a click opens it). Removable drives, Low battery, Monitors and Screenshots picked here show as a card instead of a notification, unless they''re among those that don''t open the OSD or detail cards are off. Messages are what `axiom message <icon> <text>` sends (on the OSD picking Messages, else the first).'
      quiet:
        type: array
        title: Without opening the OSD
        items:
          type: string
          enum: [capsLock, numLock, scrollLock, keyboardLayout, audio, microphone, powerProfile, caffeine, dnd, nightLight, wifi, bluetooth, airplane, vpn, drive, charger, battery, monitor, recording, screenshot, camera, micUse, screenShare, message]
        x-enumFrom: items
        x-showIf: {items: {notEmpty: true}}
        x-enumLabels:
          capsLock: Caps Lock
          numLock: Num Lock
          scrollLock: Scroll Lock
          keyboardLayout: Keyboard layout
          audio: Audio
          microphone: Microphone
          powerProfile: Power profile
          caffeine: Caffeine
          dnd: Do not disturb
          nightLight: Night light
          wifi: Wi-Fi
          bluetooth: Bluetooth
          airplane: Airplane mode
          vpn: VPN
          drive: Removable drives
          charger: Charger
          battery: Low battery
          monitor: Monitors
          recording: Screen recording
          screenshot: Screenshots
          camera: Camera
          micUse: Microphone in use
          screenShare: Screen sharing
          message: Messages
        x-enumIcons:
          capsLock: keyboard_capslock
          numLock: dialpad
          scrollLock: swap_vert
          keyboardLayout: keyboard
          audio: volume_up
          microphone: mic
          powerProfile: speed
          caffeine: coffee
          dnd: do_not_disturb_on
          nightLight: nightlight
          wifi: wifi
          bluetooth: bluetooth
          airplane: airplanemode_active
          vpn: vpn_key
          drive: usb
          charger: power
          battery: battery_alert
          monitor: monitor
          recording: screen_record
          screenshot: screenshot_monitor
          camera: videocam
          micUse: record_voice_over
          screenShare: screen_share
          message: chat
        default: []
        description: "Shown among the icons, but a change to one doesn't open the OSD (it shows if the OSD is already open). A drive, low battery, monitor, screenshot or message picked here is a notification instead, as it would be without the OSD."
  media:
    type: object
    title: Now playing
    description: The cover, title and artist of the track playing, as a card.
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Show the track playing
        default: false
      onTrackChange:
        type: boolean
        title: On a new track
        default: true
        x-showIf: {enabled: true}
      onPlayPause:
        type: boolean
        title: On play and pause
        default: false
        x-showIf: {enabled: true}
required: [id]
