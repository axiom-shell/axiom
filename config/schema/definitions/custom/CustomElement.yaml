# The CustomElement definition (#/definitions/CustomElement): one piece of a
# custom widget's module, on its lattice of 4 sub-cells a grid unit.

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  type:
    type: string
    enum: [Text, Figure, Icon, Ring, Gauge, Bar, Segments, Sparkline, List, Image, Button, Toggle, Status, Separator, TextBlock]
    default: Text
  place:
    type: object
    additionalProperties: false
    description: In sub-cells from the top left (4 to a grid unit).
    properties:
      x: {type: integer, default: 0, minimum: 0}
      'y': {type: integer, default: 0, minimum: 0}
      w: {type: integer, default: 4, minimum: 1, maximum: 64}
      h: {type: integer, default: 4, minimum: 1, maximum: 64}
  bind:
    type: object
    default: {}
    additionalProperties: {type: string}
    description: 'Each slot of the element → a field ("percentage"), a path ("data.temp") or a format ("{text}%"). Empty slots read the widget''s own.'
  options:
    type: object
    default: {}
    description: The element's look (its kind's options).
  actions:
    type: object
    additionalProperties: false
    description: 'Commands it runs ({value} is filled in): a Button''s click, a Bar''s change, a Toggle''s on and off.'
    properties:
      click: {x-scope: commands, type: string, default: ''}
      change: {x-scope: commands, type: string, default: ''}
      'on': {x-scope: commands, type: string, default: ''}
      'off': {x-scope: commands, type: string, default: ''}
required: [id]
