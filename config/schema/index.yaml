# The root of the config schema. `axiom schema build` joins it, the sections
# (sections/<Name>.yaml, in the order `sections` lists them, after `properties`)
# and the definitions (definitions/**/<Name>.yaml, then each kind's type
# folders, <root>/<Type>/schema.yaml expanded into the kind's base) into
# config/json/config.schema.json (docs/dev/core/config-v2.md).

$schema: 'http://json-schema.org/draft-07/schema#'
title: Axiom Configuration Schema
type: object
x-categories:
  - {name: General, icon: home}
  - {name: Look & Feel, icon: palette}
  - {name: Compositor, icon: desktop_windows}
  - {name: Workspaces, icon: grid_view}
  - {name: Overlay & Popouts, icon: layers}
  - {name: Dock & OSD, icon: dock_to_bottom}
  - {name: Launcher, icon: rocket_launch}
  - {name: Notifications, icon: notifications}
  - {name: Screen & Power, icon: power_settings_new}
  - {name: Calendar, icon: calendar_month}
  - {name: Modules, icon: widgets}
  - {name: Theme integrations, icon: format_paint}
  - {name: Maintenance, icon: build, card: SavedConfigs, cardTitle: Saved configurations}
x-libraryGroups:
  - Desktop
  - Time & weather
  - Media & audio
  - Network & devices
  - System
  - Tools
  - Look & layout
  - Session
  - Custom
additionalProperties: false
properties:
  $schema: {type: string, x-settings: false}
  format:
    type: integer
    const: 2
    default: 2
    x-settings: false
    description: "The config file's grammar: 2. A file without it is format 1 (versions 1 to 75), which axiom converts once."
  version:
    type: integer
    default: 83
    x-settings: false
    description: Config version within format 2, used for automatic migration.
  meta:
    type: object
    x-settings: false
    x-scope: personal
    description: 'What a saved or exported config is: its title, description and source (where it came from). A live config.json has none.'
    additionalProperties: {type: string}
sections:
  - Lockscreen
  - Greeter
  - Idle
  - Polkit
  - NightLight
  - General
  - Launcher
  - Apps
  - PowerMenu
  - Screenshots
  - Battery
  - Notifications
  - Compositor
  - Keybinds
  - Monitors
  - WindowBehaviour
  - Input
  - Session
  - WindowLook
  - Appearance
  - Interface
  - Popouts
  - Chat
  - Notes
  - Calendar
  - Weather
  - ClaudeUsage
  - Tailscale
  - CustomWidgets
  - Updates
  - Todo
  - Stopwatch
  - Pomodoro
  - OSD
  - Dock
  - ThemeIntegrations
  - Icons
  - Overlay
  - HotCorners
  - Workspaces
  - WorkspaceOverlay
  - WindowSwitcher
  - SelfUpdate
  - CommunitySetups
  - Bars
  - EdgeMenus
  - Desktop
kinds:
  BarWidget: {root: components/bar/widgets, suffix: Widget, base: WidgetBase}
  OverlayModule: {root: components/content, suffix: OverlayModule, base: ModuleBase}
  OverlayView: {root: components/views, suffix: OverlayView, base: ViewBase}
  CustomElement: {root: components/content/parts/custom/elements, suffix: CustomElement, base: CustomElementBase}
