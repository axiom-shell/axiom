# The Drives section of the config (config.json's "Drives").

type: object
x-category: Modules
title: Removable drives
description: "How USB sticks, memory cards and other removable drives are announced, what plugging one in does, and the drives left alone. Drives are reached through udisks2."
additionalProperties: false
x-order: [announce, onInsert, warnUnplugged, ignore]
properties:
  announce:
    type: string
    title: Show drive events
    enum: [osd, notification, 'off']
    x-enumLabels:
      osd: On the OSD
      notification: As notifications
      'off': Don't
    default: osd
    description: "How a drive being plugged in, mounted, unmounted, safe to remove or unplugged is shown, and what went wrong. On the OSD shows a card (a click opens the drive, or unlocks an encrypted one); it needs an enabled OSD with Removable drives among its statuses, and with none falls back to notifications. As notifications sends each as a notification, with Open, Eject or Unlock buttons where they help. Don't leaves them to the Drives widget and module. Asking what to do with a drive plugged in is always a notification."
    x-link: {setting: OSD}
  onInsert:
    type: string
    title: When a drive is plugged in
    enum: [ask, mount, nothing]
    x-enumLabels:
      ask: Ask
      mount: Mount it
      nothing: Do nothing
    default: ask
    description: "Ask sends a notification offering to mount or open it (or, for an encrypted drive, to unlock it), whatever Show drive events says. Mount it mounts it at once (an encrypted drive waits to be unlocked); nothing is mounted while the screen is locked, it waits for the unlock. Do nothing leaves it to the Drives widget and module. Drives open in the file manager."
    x-link: {setting: Apps.fileManager}
  warnUnplugged:
    type: boolean
    title: Warn when unplugged without ejecting
    default: true
    description: "Warn when a mounted drive is unplugged before it's ejected: files still being written to it can be lost."
  ignore:
    x-scope: machine
    type: array
    items: {type: string}
    title: Ignored drives
    default: []
    description: "Volume UUIDs or labels of drives to leave alone: no notification, no mounting, and not listed. Find them with `lsblk -f`."
