# The HotCorners section of the config (config.json's "HotCorners").

x-scope: personal
type: object
x-category: Overlay & Popouts
title: Hot corners
description: Screen corners that run an action when the pointer reaches them, on every compositor.
additionalProperties: false
properties:
  items:
    x-wide: true
    type: array
    title: Hot corners
    default: []
    description: "Each runs its action once the pointer has rested in its corner for its delay, and again only after the pointer has left. A corner takes the screen's last pixel: a click there doesn't reach what's under it. Quiet over fullscreen windows."
    items:
      x-scopeIf:
        when: {action: exec}
        scope: commands
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        corner:
          type: string
          title: Corner
          enum: [topLeft, topRight, bottomLeft, bottomRight]
          x-enumLabels: {topLeft: Top left, topRight: Top right, bottomLeft: Bottom left, bottomRight: Bottom right}
          default: topLeft
        action:
          type: string
          title: Action
          enum:
            - launcher
            - launcherSearch
            - overlay
            - overlayPage
            - edgeMenu
            - dock
            - workspaceOverview
            - powerMenu
            - lock
            - toggleDnd
            - clearNotifications
            - idleInhibit
            - nightLight
            - nextWallpaper
            - randomWallpaper
            - monitorsIdentify
            - darkMode
            - wifi
            - bluetooth
            - vpn
            - workspaceStep
            - moveWindowStep
            - workspaceNth
            - moveWindowStepSilent
            - moveWindowNth
            - moveWindowNthSilent
            - scrollStep
            - volumeUp
            - volumeDown
            - toggleMute
            - toggleMicMute
            - brightnessUp
            - brightnessDown
            - mediaPlayPause
            - mediaNext
            - mediaPrevious
            - mediaStop
            - audioOutputNext
            - clipboard
            - emoji
            - calculator
            - notes
            - calendar
            - calendarNewEvent
            - chat
            - chatNew
            - pomodoro
            - pomodoroSkip
            - pomodoroStop
            - stopwatch
            - stopwatchLap
            - stopwatchReset
            - timerStart
            - timerToggle
            - timerReset
            - screenshot
            - screenRecord
            - exec
          x-enumLabels:
            launcher: App launcher
            launcherSearch: Launcher with text
            overlay: Overlay
            overlayPage: Overlay page
            edgeMenu: Edge menu
            dock: Dock
            workspaceOverview: Workspace overview
            powerMenu: Power menu
            lock: Lock
            toggleDnd: Do not disturb
            clearNotifications: Clear notifications
            idleInhibit: Caffeine
            nightLight: Night light
            nextWallpaper: Next wallpaper
            randomWallpaper: Random wallpaper
            monitorsIdentify: Identify monitors
            darkMode: Dark mode
            wifi: Wi-Fi
            bluetooth: Bluetooth
            vpn: VPN on or off
            workspaceStep: Workspace in a direction
            moveWindowStep: Move window in a direction
            workspaceNth: Workspace by number
            moveWindowStepSilent: Send window in a direction
            moveWindowNth: Move window to number
            moveWindowNthSilent: Send window to number
            scrollStep: Scroll along the layout
            volumeUp: Volume up
            volumeDown: Volume down
            toggleMute: Mute
            toggleMicMute: Mute microphone
            brightnessUp: Brightness up
            brightnessDown: Brightness down
            mediaPlayPause: Play/Pause
            mediaNext: Next track
            mediaPrevious: Previous track
            mediaStop: Stop playback
            audioOutputNext: Switch audio output
            clipboard: Clipboard history
            emoji: Emoji picker
            calculator: Calculator
            notes: Notes
            calendar: Calendar
            calendarNewEvent: New calendar event
            chat: Chat
            chatNew: New chat
            pomodoro: Pomodoro start or pause
            pomodoroSkip: Skip pomodoro phase
            pomodoroStop: Stop pomodoro
            stopwatch: Stopwatch start or pause
            stopwatchLap: Stopwatch lap
            stopwatchReset: Reset stopwatch
            timerStart: Start a timer
            timerToggle: Pause or resume timer
            timerReset: Reset timer
            screenshot: Screenshot
            screenRecord: Screen recording
            exec: Run a command
          default: workspaceOverview
        argument:
          type: string
          title: Argument
          default: ''
          description: 'Search text, page, edge menu or dock id, direction, workspace number, screenshot kind (region, window or screen), timer length (10m, 1:30), or the command.'
          x-showIf:
            action:
              - launcherSearch
              - overlayPage
              - edgeMenu
              - dock
              - workspaceStep
              - moveWindowStep
              - workspaceNth
              - moveWindowStepSilent
              - moveWindowNth
              - moveWindowNthSilent
              - scrollStep
              - timerStart
              - screenshot
              - exec
        screen:
          $ref: '#/definitions/ScreenTarget'
          title: Monitors
          x-properties:
            mode:
              x-scope: machine
              type: string
              title: Monitors
              enum: [all, primary, named]
              default: all
              x-enumLabels: {all: Every monitor, primary: Primary monitor, named: These monitors}
            names:
              x-scope: machine
              x-monitorRef: drop
              type: array
              title: Monitors
              default: []
              items: {type: string, x-options: screens}
              x-showIf: {mode: named}
        delay:
          type: integer
          title: Delay
          x-unit: ms
          default: 0
          minimum: 0
          maximum: 5000
          description: How long the pointer rests in the corner before the action runs.
      required: [id]
