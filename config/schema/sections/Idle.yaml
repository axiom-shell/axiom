# The Idle section of the config (config.json's "Idle").

x-scope: personal
type: object
x-category: Screen & Power
x-card: {file: IdleStatus, title: Idle}
title: Idle
description: 'What happens when you step away: dimming, locking, turning the screens off and suspending, and locking before the computer sleeps.'
additionalProperties: false
properties:
  enabled:
    x-scope: machine
    type: boolean
    x-takeover: true
    title: Handle idle
    default: false
    description: axiom watches for idle itself and answers lock and sleep requests, so it replaces an idle daemon such as hypridle. Remove your own hypridle autostart line while this is on.
  dim:
    type: object
    title: Dim
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Dim the screens after
        x-unit: s
        default: 150000
        minimum: 0
        maximum: 7200000
        description: '0 never dims. Brightness comes back when you return.'
      mode:
        type: string
        title: Dim
        default: to
        enum: [to, by]
        x-enumLabels: {to: To a set brightness, by: By a share of the current brightness}
        description: A set brightness leaves screens already darker as they are. A share always dims, unless a screen is already at 0.
      level:
        type: integer
        title: Dim to
        x-unit: '%'
        default: 30
        minimum: 5
        maximum: 100
        description: Screens already darker stay as they are.
        x-showIf: {mode: to}
      by:
        type: integer
        title: Dim by
        x-unit: '%'
        default: 50
        minimum: 5
        maximum: 95
        description: "How much of each screen's current brightness to take away: 50% takes 80% down to 40%."
        x-showIf: {mode: by}
    x-showIf: {enabled: true}
    x-group: Idle
  lock:
    type: object
    title: Lock
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Lock after
        x-unit: s
        default: 300000
        minimum: 0
        maximum: 7200000
        description: "0 never locks on idle. Locks with the Lockscreen settings' locker."
    x-showIf: {enabled: true}
    x-group: Idle
  screenOff:
    type: object
    title: Screen off
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Turn the screens off after
        x-unit: s
        default: 330000
        minimum: 0
        maximum: 7200000
        description: '0 keeps them on.'
    x-showIf: {enabled: true}
    x-group: Idle
  suspend:
    type: object
    title: Suspend
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Suspend after
        x-unit: s
        default: 0
        minimum: 0
        maximum: 14400000
        description: '0 never suspends on idle.'
    x-showIf: {enabled: true}
    x-group: Idle
  lockBeforeSleep:
    type: boolean
    title: Lock before sleep
    x-group: Sleep
    default: true
    description: Lock the session before the computer suspends or hibernates.
    x-showIf: {enabled: true}
  screenOnAfterSleep:
    type: boolean
    title: Screens on after sleep
    x-group: Sleep
    default: true
    description: Turn the screens back on when the computer wakes.
    x-showIf: {enabled: true}
  respectInhibitors:
    type: boolean
    title: Respect apps that keep the screen on
    x-group: Sleep
    default: true
    description: Video players and browsers can ask to stay awake through the compositor, D-Bus and systemd. The caffeine widget works either way.
    x-showIf: {enabled: true}
  items:
    x-scope: commands
    type: array
    title: Extra listeners
    x-group: Idle listeners
    default: []
    description: Commands of your own to run after a time idle, and when you return.
    x-showIf: {enabled: true}
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        timeout:
          type: integer
          title: After
          x-unit: s
          default: 600000
          minimum: 1000
          maximum: 14400000
        onTimeout: {type: string, title: Run, default: ''}
        onResume: {type: string, title: On return, default: ''}
        enabled: {type: boolean, title: 'On', default: true}
      required: [id]
