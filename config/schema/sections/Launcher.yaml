# The Launcher section of the config (config.json's "Launcher").

x-scope: personal
type: object
x-category: Launcher
title: Launcher
description: 'The search launcher: apps, open windows, a calculator, web search, running commands, and / commands that control the shell.'
x-intro: LauncherPlace
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the launcher opens. As in General follows General > Monitors; the primary monitor is the one set in General; the focused monitor is the one with your active workspace (and mouse); every monitor shows it on all of them at once.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
    description: Screen edge the launcher opens from, or is held off when detached.
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where along the edge its centre sits: 0 is the start (left/top), 100 the end. It never runs off the screen.'
  detached:
    x-scope: look
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box floating off the edge. Off, the launcher grows out of the screen border or a solid bar, as popouts do, and runs straight off a bare screen edge.
  distance:
    x-scope: look
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 30
    minimum: 0
    maximum: 50
    description: 'How far across the free screen it sits: 0 lines it up with a detached dock or OSD on that edge, 50 centres it.'
    x-showIf: {detached: true}
  reverse:
    x-scope: look
    type: boolean
    title: Search bar at the bottom
    default: false
    description: Put the search field under the results, with the best match nearest to it. Suits the bottom edge.
  width:
    x-scope: look
    type: integer
    title: Width
    x-unit: px
    default: 680
    minimum: 400
    maximum: 1200
    description: Width of the launcher.
  maxResults:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Results shown
    default: 8
    minimum: 3
    maximum: 20
    description: How many rows fit before the list scrolls.
  iconSize:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Icon size
    x-unit: px
    default: 32
    minimum: 16
    maximum: 64
    description: Size of the result icons.
  showBackdrop:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Dim background
    default: true
    description: Dim the whole screen behind the launcher, under the bars and border.
  backdrop:
    x-scope: look
    x-group: Launcher look
    type: integer
    title: Backdrop darkness
    x-unit: '%'
    default: 25
    minimum: 0
    maximum: 90
    description: How dark the screen behind the launcher goes.
    x-showIf: {showBackdrop: true}
  showDescriptions:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Descriptions
    default: true
    description: Show a second line under each result (an app's generic name, a window's class, a command's description).
  showRecent:
    x-group: Launcher look
    type: boolean
    title: Frequent apps when empty
    default: true
    description: List your most used apps before you type anything.
  showHint:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Controls hint
    default: true
    description: Show the search prefixes and keys under the results.
  hiddenApps:
    x-group: Launcher search
    type: array
    title: Hidden apps
    default: []
    items: {type: string}
    description: Desktop entry ids never shown, comma-separated (e.g. avahi-discover, qv4l2).
  providers:
    type: object
    title: Launcher search
    description: What the launcher searches besides apps.
    additionalProperties: false
    properties:
      windows:
        type: boolean
        title: Open windows
        default: true
        description: Also match open windows by title and class; picking one focuses it.
      calculator:
        type: boolean
        title: Calculator
        default: true
        description: Show the result of math as you type it (or after =), using qalc. Enter copies the result.
      commands:
        type: boolean
        title: Shell commands (/)
        default: true
        description: 'Type / for commands that control the shell: themes, volume, wifi, bluetooth, overlay pages, session and more.'
      run:
        type: boolean
        title: Run commands (>)
        default: true
        description: Type > and a command to run it. Shift+Enter runs it in the terminal.
      web:
        type: object
        title: Web search
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Web search (?)
            default: true
            description: Offer a web search for what you typed, last in the list (or first after ?).
          engine:
            type: string
            title: Search engine URL
            default: 'https://duckduckgo.com/?q={}'
            description: '{} is replaced by the search terms.'
            x-showIf: {enabled: true}
      chat:
        x-link: {setting: Chat}
        type: boolean
        title: Ask chat (@)
        default: true
        description: Type @ and a question to ask it in the overlay's Chat module, with the default preset.
      clipboard:
        type: object
        title: Clipboard history
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: 'Clipboard history (:)'
            default: true
            description: "Type : (or /clipboard) to search what you've copied; Enter copies it again, Shift+Enter removes it. axiom keeps the history in memory only, never on disk, and skips anything a password manager marks as sensitive. Turn this off if you copy passwords from apps that don't; turning it off clears the history."
          source:
            x-scope: machine
            type: string
            title: Clipboard history source
            default: axiom
            enum: [axiom, cliphist]
            x-enumLabels: {axiom: axiom (in memory), cliphist: cliphist}
            description: axiom records text clips itself. cliphist uses cliphist's history instead, images included, and records text and images into it while this is on (alongside any cliphist store you run yourself).
            x-showIf: {enabled: true}
          maxEntries:
            type: integer
            title: Clipboard history size
            default: 100
            minimum: 10
            maximum: 1000
            description: How many clips axiom keeps.
            x-showIf: {enabled: true, source: axiom}
      emoji:
        type: boolean
        title: Emoji (;)
        default: true
        description: Type ; (or /emoji) to search emoji by name or keyword; Enter copies one, and Shift+Enter types it into the focused window.
