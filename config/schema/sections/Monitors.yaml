# The Monitors section of the config (config.json's "Monitors").

type: object
x-category: Compositor
title: Monitors
description: Telling when a monitor is connected or removed. The monitor layouts are edited on the Monitors page.
additionalProperties: false
properties:
  notify:
    type: boolean
    title: Monitor notifications
    default: false
    description: "Send a notification naming a monitor and its resolution when one is connected or removed. An OSD with Monitors among its status icons (one whose detail cards are on, where it opens the OSD) shows it as a card instead, whether this is on or not."
    x-link: {setting: OSD}
  items:
    type: array
    x-settings: false
    default: []
    description: Monitor layouts, one per set of connected monitors.
    items: {$ref: '#/definitions/MonitorProfile'}
