# The Notifications section of the config (config.json's "Notifications").

x-scope: personal
type: object
x-category: Notifications
x-intro: NotificationsPreview
title: Notifications
description: "Where notification toasts appear, how they move, how long they stay, and what the history keeps. Toasts sit inside the space the bars and screen border leave free and make way for popouts open over them."
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where toasts appear. As in General follows General > Monitors; the primary monitor is the one set in General; the focused monitor is the one with your active workspace when the notification arrives; every monitor shows each toast on all of them, and closing one closes the rest.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
    x-enumLabels: {top: Top, bottom: Bottom, left: Left, right: Right}
    description: Screen edge the toasts stack from. On the top or bottom they stack away from the edge; on a side, along it.
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 100
    description: 'Where along the edge they sit: 0 is the start (left/top), 100 the end.'
  detached:
    x-scope: look
    type: boolean
    title: Detach from edge
    default: true
    description: Separate cards held off the edge. Off, the stack is one box growing out of the screen border or a solid bar, as popouts do, and running straight off a bare screen edge.
  gap:
    x-scope: look
    type: integer
    x-control: stepper
    x-auto: {value: -1, start: 12}
    x-beside: true
    title: Gap
    default: -1
    minimum: -1
    maximum: 200
    x-unit: px
    description: Space between the toasts and the border or bar on their edge, and at the ends. Auto lines them up with a floating bar on their edge, else with your windows.
    x-showIf: {detached: true}
  motion:
    type: object
    title: Motion
    additionalProperties: false
    properties:
      style:
        x-scope: look
        type: string
        title: Animation
        default: slide
        enum: [slide, fade, none]
        x-enumLabels: {slide: Slide, fade: Fade, none: None}
        description: How toasts come and go. Either way the others glide into place.
      direction:
        x-scope: look
        type: string
        title: Slide from
        default: auto
        enum: [auto, top, bottom, left, right]
        x-enumLabels: {auto: Auto, top: Top, bottom: Bottom, left: Left, right: Right}
        description: The edge toasts slide in from and out to. Auto is their own edge when attached, else the screen edge nearest them, so centred ones come from their edge and corner ones from the side.
        x-showIf: {style: slide}
  timeout:
    type: integer
    x-control: stepper
    title: Toast duration
    x-unit: s
    x-group: Toasts
    default: 5000
    minimum: 1000
    maximum: 60000
    description: How long a toast stays up. Hovering it pauses the countdown.
  followApps:
    type: boolean
    title: Let apps manage their notifications
    x-group: Toasts
    default: true
    description: When an app asks for its own duration, or for its notification to stay until dismissed, use that instead of the duration above; and when it withdraws a notification (once you've read it there, say), take it out of the history too. Off, a withdrawn notification stays in the history without its actions.
  criticalStays:
    type: boolean
    title: Critical toasts stay
    x-group: Toasts
    default: true
    description: Critical notifications stay up until you dismiss them.
  maxToasts:
    x-scope: look
    type: integer
    x-control: stepper
    title: Visible toasts
    x-group: Toasts
    default: 5
    minimum: 1
    maximum: 10
    description: How many toasts stack up at once. A new one pushes out the oldest.
  width:
    x-scope: look
    type: integer
    title: Toast width
    x-unit: px
    x-group: Toasts
    default: 360
    minimum: 240
    maximum: 600
    description: Width of each toast.
  quietFullscreen:
    type: boolean
    title: Quiet over fullscreen
    x-group: Toasts
    default: true
    description: Show no toasts on a monitor whose workspace has a fullscreen window. Critical ones still show, and everything still goes to the history.
  dnd:
    type: object
    title: Do not disturb
    x-group: Do not disturb
    additionalProperties: false
    properties:
      schedule:
        type: boolean
        title: On a schedule
        default: false
        description: Turn do not disturb on and off at set times. Switching it by hand lasts until the next scheduled change.
      startAt:
        type: string
        title: Turn on at
        default: '22:00'
        pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
        description: '24-hour time, like 22:00.'
        x-showIf: {schedule: true}
      endAt:
        type: string
        title: Turn off at
        default: '07:00'
        pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
        description: '24-hour time, like 07:00. Earlier than the start runs past midnight.'
        x-showIf: {schedule: true}
      allowCritical:
        type: boolean
        title: Critical ones still show
        default: true
        description: While do not disturb is on, critical notifications (a low battery, say) still toast. Off, they only go to the history too.
  apps:
    type: array
    title: Per-app rules
    x-group: Per-app rules
    x-wide: true
    default: []
    description: 'Rules for one app''s notifications: whether they toast, whether they''re kept, their urgency and how long they stay. An app is matched by its name or desktop entry, as its windows are (Vesktop finds dev.vencord.Vesktop).'
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        app:
          type: string
          title: App
          default: ''
          description: Its name, as its notifications show it, or its desktop entry (firefox, org.telegram.desktop).
        toasts:
          type: boolean
          title: Show toasts
          default: true
          description: Off, its notifications go only to the history.
        history:
          type: boolean
          title: Keep in the history
          default: true
          description: Off, its notifications only toast, and go once they're closed.
        urgency:
          type: string
          title: Urgency
          default: app
          enum: [app, low, normal, critical]
          x-enumLabels: {app: As the app sends it, low: Low, normal: Normal, critical: Critical}
          description: Treat its notifications as this urgent. Critical ones stay until dismissed (with Critical toasts stay) and can show through do not disturb.
        timeout:
          type: integer
          x-control: stepper
          x-auto: {value: -1, start: 5000}
          title: Toast duration
          x-unit: s
          default: -1
          minimum: -1
          maximum: 60000
          description: How long its toasts stay. Auto follows the duration above.
      required: [id]
  clearOnFocus:
    type: boolean
    title: Clear when the app is focused
    x-group: Notification history
    default: false
    description: Focusing an app's window removes its notifications from the history.
  clickFocuses:
    type: boolean
    title: Clicking focuses the app
    x-group: Notification history
    default: true
    description: After a click runs a notification's action, bring its app's window forward. Apps can't always do this themselves (niri, for one, only lets them with a token the notification doesn't carry).
  removeOnClick:
    type: boolean
    title: Remove when clicked
    x-group: Notification history
    default: false
    description: Clicking a notification, or one of its actions, removes it from the history.
  closeRemoves:
    type: boolean
    title: Closing a toast removes it
    x-group: Notification history
    default: false
    description: Closing a toast (its close button or a swipe) also removes the notification from the history. Off, it only hides the toast.
  maxEntries:
    type: integer
    title: History size
    x-group: Notification history
    default: 100
    minimum: 10
    maximum: 500
    description: How many notifications the history keeps. The oldest go first.
  maxAge:
    type: integer
    title: Keep for
    x-unit: d
    x-group: Notification history
    default: 0
    minimum: 0
    maximum: 31536000000
    description: Remove notifications older than this many days. 0 keeps them until removed.
