# The Notifications section of the config (config.json's "Notifications").

x-scope: personal
type: object
x-category: Notifications
x-intro: NotificationsPreview
title: Notifications
description: "Where notification toasts appear, how long they stay, and what the history keeps. Toasts sit inside the work area, the space the bars and screen border leave free, so a gap is measured from whatever is at that edge: a bar, the border's stroke, or the bare screen edge."
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where toasts appear. As in General follows General > Monitors; the primary monitor is the one set in General; the focused monitor is the one with your active workspace when the notification arrives; every monitor shows each toast on all of them, and closing one closes the rest.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  position:
    x-scope: look
    type: string
    title: Corner
    enum: [topLeft, topRight, bottomLeft, bottomRight]
    x-enumLabels:
      topLeft: Top left
      topRight: Top right
      bottomLeft: Bottom left
      bottomRight: Bottom right
    default: topLeft
    description: Corner of the work area the toasts stack from. Bottom corners stack upwards.
  gaps:
    type: object
    title: Gaps
    description: How far toasts sit from the edges of the work area.
    additionalProperties: false
    properties:
      even:
        x-scope: look
        type: boolean
        title: Even gaps
        default: true
        description: Use one gap for both sides of the corner. Turn off to set each side on its own.
      all:
        x-scope: look
        type: integer
        x-control: stepper
        title: Gap
        x-unit: px
        default: 12
        minimum: 0
        maximum: 200
        description: Space between the toasts and the edges of the work area.
        x-showIf: {even: true}
      top:
        x-scope: look
        type: integer
        x-control: stepper
        title: Top gap
        x-unit: px
        default: 12
        minimum: 0
        maximum: 200
        description: Space between the toasts and the top of the work area.
        x-showIf: {even: false, ../position: [topLeft, topRight]}
      bottom:
        x-scope: look
        type: integer
        x-control: stepper
        title: Bottom gap
        x-unit: px
        default: 12
        minimum: 0
        maximum: 200
        description: Space between the toasts and the bottom of the work area.
        x-showIf: {even: false, ../position: [bottomLeft, bottomRight]}
      left:
        x-scope: look
        type: integer
        x-control: stepper
        title: Left gap
        x-unit: px
        default: 12
        minimum: 0
        maximum: 200
        description: Space between the toasts and the left of the work area.
        x-showIf: {even: false, ../position: [topLeft, bottomLeft]}
      right:
        x-scope: look
        type: integer
        x-control: stepper
        title: Right gap
        x-unit: px
        default: 12
        minimum: 0
        maximum: 200
        description: Space between the toasts and the right of the work area.
        x-showIf: {even: false, ../position: [topRight, bottomRight]}
    x-group: Notifications
  timeout:
    type: integer
    x-control: stepper
    title: Toast duration
    x-unit: s
    x-group: Toasts
    default: 5000
    minimum: 1000
    maximum: 60000
    description: How long a toast stays up. Hovering it pauses the countdown.
  appTimeouts:
    type: boolean
    title: Use app timeouts
    x-group: Toasts
    default: true
    description: When an app asks for its own duration, or for its notification to stay until dismissed, use that instead of the duration above.
  criticalStays:
    type: boolean
    title: Critical toasts stay
    x-group: Toasts
    default: true
    description: Critical notifications stay up until you dismiss them.
  maxToasts:
    x-scope: look
    type: integer
    x-control: stepper
    title: Visible toasts
    x-group: Toasts
    default: 5
    minimum: 1
    maximum: 10
    description: How many toasts stack up at once. A new one pushes out the oldest.
  width:
    x-scope: look
    type: integer
    title: Toast width
    x-unit: px
    x-group: Toasts
    default: 360
    minimum: 240
    maximum: 600
    description: Width of each toast.
  quietFullscreen:
    type: boolean
    title: Quiet over fullscreen
    x-group: Toasts
    default: true
    description: Show no toasts on a monitor whose workspace has a fullscreen window. Critical ones still show, and everything still goes to the history.
  clearOnFocus:
    type: boolean
    title: Clear when the app is focused
    x-group: Notification history
    default: false
    description: Focusing an app's window removes its notifications from the history.
  removeOnClick:
    type: boolean
    title: Remove when clicked
    x-group: Notification history
    default: false
    description: Clicking a notification, or one of its actions, removes it from the history.
  closeRemoves:
    type: boolean
    title: Closing a toast removes it
    x-group: Notification history
    default: false
    description: Closing a toast (its close button or a swipe) also removes the notification from the history. Off, it only hides the toast.
  maxEntries:
    type: integer
    title: History size
    x-group: Notification history
    default: 100
    minimum: 10
    maximum: 500
    description: How many notifications the history keeps. The oldest go first.
  maxAge:
    type: integer
    title: Keep for
    x-unit: d
    x-group: Notification history
    default: 0
    minimum: 0
    maximum: 31536000000
    description: Remove notifications older than this many days. 0 keeps them until removed.
