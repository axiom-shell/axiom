# The Overlay section of the config (config.json's "Overlay").

x-scope: personal
type: object
x-category: Overlay & Popouts
x-links: [Layouts]
title: Overlay
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the overlay opens. As in General follows General > Monitors; the primary monitor is the one set in General; the focused monitor is the one with your active workspace (and mouse); every monitor shows it on all of them at once.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  moduleScale:
    x-link: {setting: Interface.cardSize}
    x-scope: look
    x-group: Size
    type: integer
    x-control: stepper
    title: Module size
    default: 100
    minimum: 50
    maximum: 100
    x-unit: '%'
    description: Size of the overlay's cards, relative to the card size in Look & Feel. Their text and content shrink with them. For bigger cards, raise the card size.
  moduleBorders:
    x-scope: look
    x-group: Look
    type: boolean
    title: Module borders
    default: true
    description: Draw each module's card box. Off shows the modules straight on the overlay's box.
  navigator:
    x-scope: look
    x-group: Page switcher
    type: string
    title: Position
    enum: [bottom, top]
    x-enumLabels: {bottom: Bottom, top: Top}
    default: bottom
    description: The screen edge the page switcher sits on.
  navigatorLabels:
    x-scope: look
    x-group: Page switcher
    type: string
    title: Page names
    enum: [auto, current, icons]
    x-enumLabels: {auto: 'All, while they fit', current: Current page only, icons: Icons only}
    default: auto
    description: Which pages show their name beside their icon. Tool pages are always icons, named in a tooltip.
  animation:
    x-scope: look
    x-group: Look
    type: string
    title: Opening animation
    enum: [top, bottom, fade]
    x-enumLabels: {top: Slide from the top, bottom: Slide from the bottom, fade: Fade}
    default: top
    description: How the overlay and its dim background come in and go.
  showBackdrop:
    x-scope: look
    x-group: Look
    type: boolean
    title: Dim background
    default: true
    description: Dim the whole screen behind the overlay, under the bars and border.
  backdrop:
    x-scope: look
    x-group: Look
    type: integer
    title: Backdrop darkness
    x-unit: '%'
    default: 85
    minimum: 0
    maximum: 90
    description: How dark the screen behind the overlay goes.
    x-showIf: {showBackdrop: true}
  closeOnEscape:
    type: boolean
    title: Close on Escape
    default: false
    description: Close the overlay when Escape is pressed (unless something in it, like a popup, uses the key first).
  closeOnOutsideClick:
    type: boolean
    title: Close on outside click
    default: false
    description: 'Close the overlay when you click outside it: on a bar, the screen border or another monitor.'
  items:
    x-scope: look
    type: array
    x-settings: false
    description: 'Pages shown in the overlay, in order: your Custom pages, each a grid of modules, and the tool pages (shown as icons after them).'
    default:
      - id: home
        type: Custom
        name: Home
        layout:
          modules:
            - id: clockCalendar
              type: ClockCalendar
              place: {x: 0, 'y': 0, w: 4, h: 8}
            - id: quickActions
              type: QuickActions
              place: {x: 4, 'y': 0, w: 4, h: 2}
            - id: quickActions-2
              type: QuickActions
              properties:
                actions: [lock, suspend, hibernate, logout, reboot, poweroff]
              place: {x: 4, 'y': 2, w: 4, h: 2}
            - id: systemGraphs
              type: SystemGraphs
              place: {x: 4, 'y': 4, w: 4, h: 4}
            - id: nowPlaying
              type: NowPlaying
              place: {x: 8, 'y': 0, w: 8, h: 4}
            - id: notifications
              type: Notifications
              place: {x: 8, 'y': 4, w: 4, h: 4}
            - id: volumeDials
              type: VolumeDials
              place: {x: 12, 'y': 4, w: 4, h: 4}
      - {id: settings, type: Settings}
      - {id: keybinds, type: Keybinds}
      - {id: barEditor, type: BarEditor}
      - {id: themes, type: Themes}
      - {id: monitors, type: Monitors}
      - {id: calendarPage, type: CalendarPage}
      - {id: customWidgets, type: CustomWidgets}
    items: {$ref: '#/definitions/OverlayView'}
