# The Screenshots section of the config (config.json's "Screenshots").

type: object
x-category: General
title: Screenshots & recordings
description: "Where screenshots and screen recordings are saved, whichever way they're taken: the screenshot and screenRecord binds, the launcher, the Screenshot and Screen recording cards."
additionalProperties: false
properties:
  folder:
    type: string
    title: Screenshot folder
    x-control: folder
    default: ''
    description: Where screenshots are saved (~ is your home). Empty uses Pictures/Screenshots.
  recordingFolder:
    type: string
    title: Recording folder
    x-control: folder
    default: ''
    description: Where recordings are saved, and listed from by the Screen recording card. Empty saves them with the screenshots.
  notify:
    type: boolean
    title: Screenshot notifications
    default: true
    description: "Send a notification when a screenshot is taken (a click opens it; Edit in … opens it in the annotator). An enabled OSD with Screenshots among its statuses shows it as a card instead. Off, and with no such OSD, nothing is shown."
    x-link: {setting: OSD}
