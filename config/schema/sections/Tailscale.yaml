# The Tailscale section of the config (config.json's "Tailscale").

type: object
x-category: Modules
x-scope: personal
title: Tailscale
description: How every Tailscale widget and module reads and shows the tailnet.
additionalProperties: false
properties:
  interval:
    type: integer
    title: Check interval
    x-unit: ms
    default: 10000
    minimum: 1000
    maximum: 60000
    description: How often `tailscale status` is read while something shows it.
  showOffline:
    type: boolean
    title: Show offline devices
    default: true
    description: List the tailnet's offline devices too, after the online ones.
  actions:
    type: boolean
    title: Actions
    default: true
    description: 'Show Connect / Disconnect, switching and adding accounts, the exit node and the node''s options. They need operator rights once (`tailscale set --operator=$USER`): the popout''s Grant access button asks for them.'
