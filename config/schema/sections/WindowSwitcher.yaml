# The WindowSwitcher section of the config (config.json's "WindowSwitcher").

x-scope: personal
type: object
x-category: Workspaces
title: Window switcher
description: Your windows, most recently used first, while the switch windows keys are held (ALT + Tab and ALT + SHIFT + Tab on the Keybinds page). Releasing the modifier focuses the chosen window; Escape keeps the current one.
x-intro: WindowSwitcherPlace
additionalProperties: false
properties:
  compositorSwitcher:
    type: boolean
    title: Use the compositor's switcher
    x-showIf: {/$supports.compositorSwitcher: true}
    default: true
    description: The switch windows keys open the compositor's own window switcher instead of this one. Only while axiom writes the compositor's config (included or managed mode).
  scope:
    type: string
    title: Windows listed
    default: all
    enum: [all, monitor, workspace]
    x-enumLabels:
      all: Every window
      monitor: Windows on the focused monitor
      workspace: Windows on the focused workspace
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
    description: Screen edge the switcher opens from, or is held off when detached.
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where along the edge its centre sits: 0 is the start (left/top), 100 the end. It never runs off the screen.'
  detached:
    x-scope: look
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box floating off the edge. Off, the switcher grows out of the screen border or a solid bar, as popouts do, and runs straight off a bare screen edge.
  distance:
    x-scope: look
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 50
    description: 'How far across the free screen it sits: 0 lines it up with a detached dock or OSD on that edge, 50 centres it.'
    x-showIf: {detached: true}
  order:
    x-scope: look
    type: string
    title: Tile order
    default: leftToRight
    enum: [leftToRight, rightToLeft, topToBottom, bottomToTop]
    x-enumLabels:
      leftToRight: Left to right
      rightToLeft: Right to left
      topToBottom: Top to bottom
      bottomToTop: Bottom to top
    description: Which way the windows run, most recently used first. They wrap to another row (or column) only once one runs out of room.
  previews:
    x-scope: look
    type: boolean
    title: Window previews
    default: true
    description: Show each window's live contents; off shows app icons.
  tileSize:
    x-scope: look
    type: integer
    x-control: stepper
    title: Tile size
    x-unit: px
    default: 200
    minimum: 64
    maximum: 480
    description: Width of each window's tile.
  showDelay:
    type: integer
    x-control: stepper
    title: Show after
    x-unit: ms
    default: 120
    minimum: 0
    maximum: 1000
    description: How long the keys must be held before the switcher shows. A quicker tap swaps to the last window without showing it.
