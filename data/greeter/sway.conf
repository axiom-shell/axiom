# The greeter's sway (greeter-session.sh starts it as greetd's user):
# nothing but axiom's greeter. No binds, no bar, no XWayland, and nothing of
# the user's: monitors and, when the user's axiom sets them, their keyboard,
# mouse, touchpad and cursor come from the bundle once the greeter starts
# (GreetdManager); these are what holds until then, and without a bundle.

xwayland disable
default_border none
default_floating_border none
input type:keyboard xkb_numlock enabled

exec /usr/share/axiom-greeter/scripts/greeter/greeter-session.sh shell
