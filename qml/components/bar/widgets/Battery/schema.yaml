label: Battery
keywords: ['Battery Status']
icon: battery_full
group: System
popout: menu
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments, stacked]
    description: Stacked puts the charge over the time to full or left.
colors: standard
settings:
  showPercentage: {type: boolean, title: Show percentage, default: true}
  showPeripherals:
    type: boolean
    title: Show peripherals
    default: true
    description: Connected Bluetooth devices' batteries, in the tooltip and status. With no laptop battery, the widget shows the lowest of them.
  chargingColor: {$ref: '#/definitions/WidgetColor', title: Charging color, x-autoColor: alt, x-autoGradient: true}
  lowColor:
    $ref: '#/definitions/WidgetColor'
    x-link: {setting: Battery.lowThreshold}
    title: Low color
    x-autoColor: warning
    description: At or below Battery's low level.
  criticalColor:
    $ref: '#/definitions/WidgetColor'
    x-link: {setting: Battery.criticalThreshold}
    title: Critical color
    x-autoColor: critical
    description: At or below Battery's critical level.
