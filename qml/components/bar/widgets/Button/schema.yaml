label: Button
keywords: ['Button / Command']
icon: terminal
group: Tools
popout:
  variant: menu
  menu:
    title: Menu
    description: Can differ from the click menu.
    x-emptyLabel: null
colors: standard
order: [icon, label, tooltip, action, page, menu, command, hoverActivate, rightCommand, middleCommand, labelCommand, labelInterval, popout, backgroundColor, foregroundColor]
settings:
  icon:
    type: string
    x-control: icon
    title: Icon
    default: apps
    description: A Material Symbols name, or text.
  label:
    type: string
    title: Label
    default: ''
    description: Overridden by the label command.
  tooltip: {type: string, title: Tooltip, default: ''}
  action:
    type: string
    title: Click action
    default: powerMenu
    description: Any action a key can run that needs no argument, or one of the button's own.
    x-axiomActions: {noArgument: true, except: [clipboard, emoji, calculator, fileSearch], extra: [overlayPage, menu, command, none]}
    x-enumLabels:
      overlayPage: Overlay page
      menu: Menu
      command: Run a command
      none: Nothing
  page:
    type: string
    title: Overlay page
    default: ''
    x-options: overlayPages
    x-showIf: {action: overlayPage}
  menu:
    type: string
    title: Click menu
    default: ''
    description: Opens and closes on click.
    x-options: menus
    x-showIf: {action: menu}
  command:
    x-scope: commands
    type: string
    title: Command
    default: ''
    x-showIf: {action: command}
  rightCommand:
    x-scope: commands
    type: string
    title: Right-click command
    default: ''
    description: 'Empty: nothing.'
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: 'Empty: nothing.'
  hoverActivate:
    type: boolean
    title: Activate on hover
    default: false
    description: Runs the click action after the hover delay.
    x-showIf:
      action: [powerMenu, launcher, overlay, overlayPage, workspaceOverview, command]
  labelCommand:
    x-scope: commands
    type: string
    title: Label command
    default: ''
    description: First line of output is the label.
  labelInterval:
    type: integer
    title: Label interval
    x-unit: ms
    default: 5000
    minimum: 500
    maximum: 3600000
    x-showIf: {labelCommand: {not: ''}}
