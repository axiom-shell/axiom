label: Button
keywords: ['Button / Command']
icon: terminal
group: Tools
popout:
  variant: menu
  enabled:
    title: Hover popout
    description: Open an edge menu while the button is hovered, as other widgets' popouts do.
  menu:
    title: Popout menu
    description: Can differ from the one a click opens.
    x-emptyLabel: null
colors: standard
settings:
  icon:
    type: string
    x-control: icon
    title: Icon
    default: apps
    description: A Material Symbols name, or text.
  label:
    type: string
    title: Label
    default: ''
    description: Replaced by the label command's output when set.
  tooltip: {type: string, title: Tooltip, default: '', description: Shown when hovering the button.}
  action:
    type: string
    title: Click action
    default: powerMenu
    enum:
      - powerMenu
      - appLauncher
      - overlay
      - overlayPage
      - workspaceOverlay
      - edgeMenu
      - lock
      - command
      - none
    x-enumLabels:
      powerMenu: Power menu
      appLauncher: App launcher
      overlay: Overlay
      overlayPage: Overlay page
      workspaceOverlay: Workspace overview
      edgeMenu: Edge menu
      lock: Lock
      command: Run a command
      none: Nothing
  page:
    type: string
    title: Overlay page
    default: ''
    x-options: overlayPages
    x-showIf: {action: overlayPage}
  menu:
    type: string
    title: Edge menu
    default: ''
    description: The edge menu a click opens and closes.
    x-options: edgeMenus
    x-showIf: {action: edgeMenu}
  command:
    x-scope: commands
    type: string
    title: Command
    default: ''
    x-showIf: {action: command}
  rightCommand:
    x-scope: commands
    type: string
    title: Right-click command
    default: ''
    description: Empty does nothing.
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: Empty does nothing.
  hoverActivate:
    type: boolean
    title: Activate on hover
    default: false
    description: Run the click action after hovering for the popout delay.
    x-showIf:
      action: [powerMenu, appLauncher, overlay, overlayPage, workspaceOverlay, command]
  labelCommand:
    x-scope: commands
    type: string
    title: Label command
    default: ''
    description: Its first line of output is shown as the label.
  labelInterval:
    type: integer
    title: Label interval
    x-unit: ms
    default: 5000
    minimum: 500
    maximum: 3600000
    x-showIf: {labelCommand: {not: ''}}
