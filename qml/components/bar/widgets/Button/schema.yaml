label: Button
keywords: ['Button / Command']
icon: terminal
group: Tools
popout:
  variant: menu
  enabled:
    title: Hover popout
    description: Open a menu while the button is hovered, as other widgets' popouts do.
  menu:
    title: Popout menu
    description: Can differ from the one a click opens.
    x-emptyLabel: null
colors: standard
settings:
  icon:
    type: string
    x-control: icon
    title: Icon
    default: apps
    description: A Material Symbols name, or text.
  label:
    type: string
    title: Label
    default: ''
    description: Replaced by the label command's output when set.
  tooltip: {type: string, title: Tooltip, default: '', description: Shown when hovering the button.}
  action:
    type: string
    title: Click action
    default: powerMenu
    description: Any action a key can run that needs no argument, or one of the button's own.
    x-axiomActions: {noArgument: true, except: [clipboard, emoji, calculator, fileSearch], extra: [overlayPage, menu, command, none]}
    x-enumLabels:
      overlayPage: Overlay page
      menu: Menu
      command: Run a command
      none: Nothing
  page:
    type: string
    title: Overlay page
    default: ''
    x-options: overlayPages
    x-showIf: {action: overlayPage}
  menu:
    type: string
    title: Menu
    default: ''
    description: The menu a click opens and closes.
    x-options: menus
    x-showIf: {action: menu}
  command:
    x-scope: commands
    type: string
    title: Command
    default: ''
    x-showIf: {action: command}
  rightCommand:
    x-scope: commands
    type: string
    title: Right-click command
    default: ''
    description: Empty does nothing.
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: Empty does nothing.
  hoverActivate:
    type: boolean
    title: Activate on hover
    default: false
    description: Run the click action after hovering for the popout delay.
    x-showIf:
      action: [powerMenu, launcher, overlay, overlayPage, workspaceOverview, command]
  labelCommand:
    x-scope: commands
    type: string
    title: Label command
    default: ''
    description: Its first line of output is shown as the label.
  labelInterval:
    type: integer
    title: Label interval
    x-unit: ms
    default: 5000
    minimum: 500
    maximum: 3600000
    x-showIf: {labelCommand: {not: ''}}
