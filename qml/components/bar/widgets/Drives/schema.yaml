label: Drives
keywords: ['Removable Drives']
icon: usb
group: Network & devices
popout: {variant: own, enabled: {description: 'Drives to open, eject or unlock.'}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: 'Stacked: the count over how many are mounted.'
colors: text
order: [appearance, showCount, hideWhenEmpty, popout, foregroundColor, mountedColor, idleColor]
settings:
  showCount:
    type: boolean
    title: Count
    default: true
    x-showIf: {appearance.style: [label, stacked]}
  hideWhenEmpty:
    type: boolean
    title: Hide when empty
    default: true
  mountedColor: {$ref: '#/definitions/WidgetColor', title: Mounted color}
  idleColor:
    $ref: '#/definitions/WidgetColor'
    title: Not mounted color
    x-autoColor: 'off'
