label: Keyboard layout
link: {setting: Input}
icon: keyboard
group: System
popout: {variant: own, enabled: {description: Input sources; a click picks one.}}
colors: standard
order: [showIcon, format, hideSingle, popout, backgroundColor, foregroundColor]
settings:
