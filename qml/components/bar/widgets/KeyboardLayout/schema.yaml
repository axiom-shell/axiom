label: Keyboard layout
link: {setting: Input}
icon: keyboard
group: System
popout: {variant: own, enabled: {description: List the input sources on hover; a click picks one.}}
colors: standard
settings:
  format:
    type: string
    title: Format
    default: short
    x-control: toggle
    enum: [short, full]
    x-enumLabels: {short: Short, full: Full name}
    description: A layout's code (DE) or full name (German).
  showIcon:
    type: boolean
    title: Show icon
    default: true
  hideSingle:
    type: boolean
    title: Hide single layout
    default: false
    description: Hide when there's only one input source.
