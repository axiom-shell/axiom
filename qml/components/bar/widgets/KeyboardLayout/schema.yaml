label: Keyboard layout
link: {setting: Input}
icon: keyboard
group: System
popout: {variant: own, enabled: {description: List the input sources when hovered; a click picks one.}}
colors: standard
settings:
  format:
    type: string
    title: Format
    default: short
    enum: [short, full]
    x-enumLabels: {short: Short, full: Full name}
    description: A layout's code (DE) or its full name (German). An input method shows its own label (あ) either way.
  showIcon:
    type: boolean
    title: Show icon
    default: true
    description: A keyboard for a layout, a translate mark for an input method.
  hideSingle:
    type: boolean
    title: Hide single layout
    default: false
    description: Hide the widget when there's only one input source.
