label: Lock keys
icon: keyboard_capslock
group: System
popout: menu
colors: text
order: [showCaps, showNum, showScroll, boxes, hideWhenOff, popout, foregroundColor, activeColor, inactiveColor]
boxes:
  variant: each
  boxes:
    x-boxItems: {options: {caps: showCaps, num: showNum, scroll: showScroll}}
settings:
  showCaps: {type: boolean, title: Caps Lock, default: true}
  showNum: {type: boolean, title: Num Lock, default: false}
  showScroll: {type: boolean, title: Scroll Lock, default: false}
  hideWhenOff:
    type: boolean
    title: Hide when off
    default: true
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active color, x-autoColor: warning, x-autoGradient: true}
  inactiveColor: {$ref: '#/definitions/WidgetColor', title: Inactive color, x-autoColor: 'off'}
