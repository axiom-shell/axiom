label: Lock keys
icon: keyboard_capslock
group: System
popout: menu
boxes:
  variant: each
  boxes:
    x-boxItems: {options: {caps: showCaps, num: showNum, scroll: showScroll}}
settings:
  showCaps: {type: boolean, title: Caps Lock, default: true}
  showNum: {type: boolean, title: Num Lock, default: false}
  showScroll: {type: boolean, title: Scroll Lock, default: false}
  hideWhenOff:
    type: boolean
    title: Hide when off
    default: true
    description: Show only while one of the keys is on.
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active color, x-autoColor: warning}
  inactiveColor: {$ref: '#/definitions/WidgetColor', title: Inactive color, x-autoColor: rest}
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    x-showIf: {$bar.textColorShows: true}
