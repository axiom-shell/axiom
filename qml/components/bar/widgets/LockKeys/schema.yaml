label: Lock keys
icon: keyboard_capslock
group: System
popout: menu
colors: text
order: [shows, boxes, hideWhenOff, popout, foregroundColor, activeColor, inactiveColor]
boxes:
  variant: each
  boxes:
    x-boxItems: {list: shows}
settings:
  shows: {$ref: '#/definitions/LockKeysShows', default: [capsLock]}
  hideWhenOff:
    type: boolean
    title: Hide when off
    default: true
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active color, x-autoColor: warning, x-autoGradient: true}
  inactiveColor: {$ref: '#/definitions/WidgetColor', title: Inactive color, x-autoColor: 'off'}
