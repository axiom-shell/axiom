label: Markets
keywords: [Stocks, Crypto, Ticker, Finance, Watchlist, Portfolio]
icon: show_chart
group: Tools
popout: {variant: own, enabled: {description: The watchlist.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ticker, stacked, sparkline]
    description: 'Ticker: scrolls every symbol. Stacked: price under the name. Sparkline: the day''s line.'
colors: standard
order: [appearance, symbols, showPortfolio, value, colorize, upColor, downColor, boxes, rotate, rotateInterval, popout, backgroundColor, foregroundColor]
boxes:
  variant: each
  boxes:
    x-boxItems: {source: marketSymbols}
settings:
  symbols:
    # Ids from the user's watchlist: personal, as the watchlist is
    x-scope: personal
    type: array
    title: Symbols
    default: []
    description: 'Empty: the whole watchlist.'
    x-link: {setting: Markets}
    items: {type: string, x-options: marketSymbols}
  value:
    type: string
    title: Value
    default: pricePercent
    enum: [pricePercent, price, percent, change]
    x-enumLabels: {pricePercent: Price and change, price: Price, percent: Change (%), change: Change}
  colorize:
    type: boolean
    title: Color by trend
    default: true
    x-link: {setting: Markets.redForGains}
  upColor: {$ref: '#/definitions/WidgetColor', title: Rise color, x-autoColor: rise, x-link: {setting: Markets.redForGains}, x-showIf: {colorize: true}, description: The change and the widget while a symbol is up.}
  downColor: {$ref: '#/definitions/WidgetColor', title: Fall color, x-autoColor: fall, x-link: {setting: Markets.redForGains}, x-showIf: {colorize: true}, description: The change and the widget while a symbol is down.}
  rotate:
    type: boolean
    title: Cycle symbols
    default: true
    description: 'One at a time. Off: all side by side.'
    x-showIf: {boxes: one, appearance.style: [label, icon, stacked, sparkline]}
  rotateInterval:
    type: integer
    title: Each symbol for
    x-unit: s
    default: 6000
    minimum: 2000
    maximum: 60000
    multipleOf: 1000
    x-showIf: {rotate: true, boxes: one, appearance.style: [label, icon, stacked, sparkline]}
  showPortfolio:
    type: boolean
    title: Portfolio
    default: false
    description: Total and today's change first.
    x-link: {setting: Markets}
