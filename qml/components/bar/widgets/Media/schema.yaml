label: Media
keywords: ['Media Player']
elastic: true
icon: music_note
group: Media & audio
popout: {variant: own, enabled: {description: Media controls.}}
appearance:
  variant: value
  style:
    enum: [label, icon, fill, pill, ticker, stacked]
    description: 'Fill, pill: track position. Ticker: scrolls the title. Stacked: title over artist.'
colors: text
order: [appearance, showArtist, artistLength, idleText, popout, foregroundColor, playingColor, pausedColor]
settings:
  showArtist: {type: boolean, title: Artist, default: true}
  artistLength:
    type: integer
    x-control: stepper
    title: Artist length
    default: 10
    minimum: 0
    maximum: 100
    x-unit: chars
    x-showIf: {showArtist: true}
  idleText:
    type: string
    title: Idle text
    default: ''
    description: 'Shown with no player. Empty: "No player".'
  playingColor: {$ref: '#/definitions/WidgetColor', title: Playing color}
  pausedColor: {$ref: '#/definitions/WidgetColor', title: Paused color, x-autoColor: 'off'}
