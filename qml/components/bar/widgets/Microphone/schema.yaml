label: Microphone
icon: mic
group: Media & audio
popout: {variant: own, enabled: {description: Open the input mixer when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments]
colors: standard
order: [appearance, showPercentage, showDevice, maxVolume, scrollStep, hideWhenIdle, middleCommand, popout, backgroundColor, foregroundColor, activeColor, mutedColor]
settings:
  showPercentage: {type: boolean, title: Percentage, default: false, x-showIf: {appearance.style: [label, ring, fill, pill, segments]}}
  showDevice: {type: boolean, title: Device, default: false, x-showIf: {appearance.style: [label, ring, fill, pill, segments]}}
  scrollStep:
    type: integer
    title: Scroll step
    x-unit: '%'
    default: 5
    minimum: 1
    maximum: 25
  maxVolume:
    type: integer
    title: Maximum volume
    x-unit: '%'
    default: 100
    minimum: 100
    maximum: 150
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: pavucontrol
    description: 'Empty: nothing.'
  activeColor:
    $ref: '#/definitions/WidgetColor'
    title: Active color
    x-autoColor: alt
    x-autoGradient: true
    description: While an app records.
  hideWhenIdle:
    type: boolean
    title: Hide when idle
    default: false
    description: Show only while the microphone is in use or muted.
  mutedColor: {$ref: '#/definitions/WidgetColor', title: Muted color, x-autoColor: 'off'}
