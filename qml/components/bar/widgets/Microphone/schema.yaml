label: Microphone
icon: mic
group: Media & audio
popout: {variant: own, enabled: {description: Open the input mixer when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments]
colors: standard
settings:
  showPercentage: {type: boolean, title: Show percentage, default: false}
  scrollStep:
    type: integer
    title: Scroll step
    x-unit: '%'
    default: 5
    minimum: 1
    maximum: 25
    description: Volume change per scroll notch.
  maxVolume:
    type: integer
    title: Maximum volume
    x-unit: '%'
    default: 100
    minimum: 100
    maximum: 150
    description: Highest volume scrolling and the mixer sliders allow.
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: pavucontrol
    description: Shell command run on middle click. Empty does nothing.
  activeColor:
    $ref: '#/definitions/WidgetColor'
    title: In-use color
    x-autoColor: alt
    description: Used while an app is recording from the microphone.
  hideWhenIdle:
    type: boolean
    title: Hide when idle
    default: false
    description: Only show the widget while the microphone is in use or muted.
  mutedColor: {$ref: '#/definitions/WidgetColor', title: Muted color, x-autoColor: 'off'}
