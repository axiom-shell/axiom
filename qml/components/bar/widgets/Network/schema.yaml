label: Network
keywords: ['Network Status']
icon: wifi
group: Network & devices
popout: {variant: own, enabled: {description: Open the Wi-Fi menu when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, segments, sparkline, ticker, stacked]
    description: 'Ring, segments: signal. Sparkline: download speed. Ticker, stacked: network name.'
colors: {variant: standard, backgroundColor: {title: Connected color}}
order: [appearance, showDevice, showVpn, vpnColor, middleCommand, popout, popoutVpn, backgroundColor, foregroundColor, disconnectedColor]
settings:
  showDevice:
    type: boolean
    title: Device
    default: false
    x-showIf: {appearance.style: [label, ring, segments, sparkline]}
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: 'Empty: nothing.'
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: critical
  showVpn:
    type: boolean
    title: VPN lock
    default: true
  popoutVpn:
    type: boolean
    title: VPNs
    default: true
    description: With the Import VPN action.
    x-showIf: {popout.enabled: true, popout.menu: ''}
  vpnColor:
    $ref: '#/definitions/WidgetColor'
    title: VPN lock color
    x-autoColor: accent
    x-showIf: {showVpn: true}
