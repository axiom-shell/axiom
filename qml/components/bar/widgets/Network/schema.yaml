label: Network
keywords: ['Network Status']
icon: wifi
group: Network & devices
popout: {variant: own, enabled: {description: Open the Wi-Fi menu when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, segments, sparkline, ticker, stacked]
    description: Ring and segments show the signal; sparkline the download speed; ticker and stacked the network's name.
colors: {variant: standard, backgroundColor: {title: Connected color}}
settings:
  showName:
    type: boolean
    title: Show device
    default: false
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: Empty does nothing.
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: critical
  showVpn:
    type: boolean
    title: Show VPN
    default: true
    description: A lock on the icon while a VPN is up.
  popoutVpn:
    type: boolean
    title: VPNs in the popout
    default: true
    description: The VPN section and the Import VPN action in the Wi-Fi menu.
  vpnColor:
    $ref: '#/definitions/WidgetColor'
    title: VPN lock color
    x-autoColor: alt
    x-showIf: {showVpn: true}
