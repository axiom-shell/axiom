label: Next event
link: {setting: Calendar}
icon: event
group: Time & weather
popout: {variant: own, enabled: {description: Open the calendar when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, fill, ticker, stacked]
    description: Fill shows an ongoing event's progress; stacked puts the time over the title.
colors: standard
settings:
  lookahead:
    type: integer
    title: Look ahead
    x-unit: min
    default: 43200000
    minimum: 900000
    maximum: 604800000
    description: Show the next event starting within this time. Hidden when there's none.
  showAllDay:
    type: boolean
    title: All-day events
    default: false
    description: Count all-day events as the next event.
  maxLength:
    type: integer
    x-control: stepper
    title: Title length
    default: 24
    minimum: 4
    maximum: 100
    description: In characters.
  soonColor: {$ref: '#/definitions/WidgetColor', title: Soon color, x-autoColor: warning, description: An event starting within 15 minutes.}
