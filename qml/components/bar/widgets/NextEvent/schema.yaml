label: Next event
link: {setting: Calendar}
icon: event
group: Time & weather
popout: {variant: own, enabled: {description: Open the calendar when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, fill, ticker, stacked]
    description: Fill shows an ongoing event's progress; stacked puts the time over the title.
colors: standard
order: [appearance, showAllDay, maxLength, lookahead, popout, backgroundColor, foregroundColor]
settings:
  lookahead:
    type: integer
    title: Look ahead
    x-unit: min
    default: 43200000
    minimum: 900000
    maximum: 604800000
    multipleOf: 60000
    description: Hidden when nothing starts within this time.
  showAllDay:
    type: boolean
    title: All-day events
    default: false
  maxLength:
    type: integer
    title: Title length
    default: 24
    minimum: 4
    maximum: 100
    x-unit: chars
    x-showIf: {appearance.style: [label, fill, ticker, stacked]}
