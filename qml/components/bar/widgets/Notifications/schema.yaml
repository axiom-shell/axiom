label: Notifications
keywords: ['Notification Center']
icon: notifications
group: Desktop
popout: {variant: own, enabled: {description: Open the notification list when hovered.}}
colors: standard
settings:
  showCount:
    type: boolean
    title: Show count
    default: true
  label:
    type: string
    title: Label
    enum: [none, count, lastApp]
    x-enumLabels: {none: None, count: Count, lastApp: Last app}
    default: none
    description: Beside the bell. The count as the label hides the badge.
  dndColor:
    type: string
    title: Do-not-disturb icon
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: 'off'
  badgeColor:
    type: string
    title: Badge
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: critical
