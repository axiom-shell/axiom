label: Privacy
keywords: ['Privacy Indicators']
icon: visibility
group: System
popout: menu
colors: text
order: [showMic, showScreen, showCamera, boxes, ignoreApps, popout, foregroundColor, activeColor]
boxes:
  variant: each
  boxes:
    x-boxItems: {options: {mic: showMic, screen: showScreen, camera: showCamera}}
settings:
  showMic: {type: boolean, title: Microphone, default: true}
  showScreen: {type: boolean, title: Screen share, default: true}
  showCamera: {type: boolean, title: Camera, default: true}
  ignoreApps:
    x-scope: personal
    type: array
    items: {type: string}
    title: Ignored apps
    default: [cava]
    description: Not shown as using the mic, screen or camera. Comma-separated.
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active color, x-autoColor: critical}
