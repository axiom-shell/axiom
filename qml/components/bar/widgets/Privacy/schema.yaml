label: Privacy Indicators
icon: visibility
group: System
popout: menu
settings:
  showMic: {type: boolean, title: Microphone, default: true}
  showScreen: {type: boolean, title: Screen share, default: true}
  showCamera: {type: boolean, title: Camera, default: true}
  ignoreApps:
    x-scope: personal
    type: array
    items: {type: string}
    title: Ignored apps
    default: [cava]
    description: App names that never trigger an indicator, comma-separated.
  activeColor: {$ref: '#/definitions/WidgetColor', x-autoColor: critical}
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    x-showIf:
      $bar.widgetStyle: filled
      $bar.widgetGrouping: {not: merged}
      $bar.widgetTextColor: ''
