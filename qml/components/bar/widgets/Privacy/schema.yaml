label: Privacy
keywords: ['Privacy Indicators']
icon: visibility
group: System
popout: menu
colors: text
order: [shows, boxes, ignoreApps, popout, foregroundColor, activeColor]
boxes:
  variant: each
  boxes:
    x-boxItems: {list: shows}
settings:
  shows:
    $ref: '#/definitions/PrivacyShows'
    default: [micUse, screenShare, camera]
    items: {type: string, enum: [micUse, screenShare, camera]}
  ignoreApps:
    x-scope: personal
    type: array
    items: {type: string}
    title: Ignored apps
    default: [cava]
    description: Not shown as using the mic, screen or camera. Comma-separated.
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active color, x-autoColor: critical}
