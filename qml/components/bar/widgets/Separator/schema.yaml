label: Separator
keywords: ['Divider']
icon: more_vert
group: Look & layout
order: [style, thickness, length, size, color]
settings:
  style: {$ref: '#/definitions/SeparatorStyle', enum: [line, dot, slash, chevron]}
  size:
    type: integer
    title: Size
    default: 12
    minimum: 0
    maximum: 500
    x-unit: px
  thickness:
    type: integer
    x-control: stepper
    title: Thickness
    default: 2
    minimum: 1
    maximum: 10
    x-unit: px
  length:
    type: integer
    title: Length
    x-unit: '%'
    default: 60
    minimum: 10
    maximum: 100
    description: Share of the bar's thickness.
    x-showIf: {style: [line, slash, chevron]}
  color:
    type: string
    title: Color
    x-options: colors
    default: base03
