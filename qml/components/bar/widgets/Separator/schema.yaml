label: Separator
keywords: ['Divider']
icon: more_vert
group: Look & layout
settings:
  style: {$ref: '#/definitions/SeparatorStyle', enum: [line, dot, slash, chevron]}
  size:
    type: integer
    title: Size
    default: 12
    minimum: 0
    maximum: 500
    x-unit: px
    description: Space it takes along the bar (px).
  thickness:
    type: integer
    x-control: stepper
    title: Thickness
    default: 2
    minimum: 1
    maximum: 10
    x-unit: px
    description: Line width (px); dots are twice this across.
  length:
    type: integer
    title: Line length
    x-unit: '%'
    default: 60
    minimum: 10
    maximum: 100
    description: Share of the widget height the line, slash or chevron spans.
    x-showIf: {style: [line, slash, chevron]}
  color:
    type: string
    title: Color
    x-options: colors
    default: base03
