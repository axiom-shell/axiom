label: Timer
keywords: ['Timer & stopwatch']
icon: timer_play
group: Tools
popout:
  variant: own
  enabled: {description: The timer and stopwatch on hover.}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, stacked]
    description: The value is the timer's progress or the stopwatch's second hand; stacked puts the time over its label.
settings:
  hideWhenIdle:
    type: boolean
    title: Hide when stopped
    default: false
    description: Show only while the timer or stopwatch runs or is paused.
  timerColor: {$ref: '#/definitions/WidgetColor', title: Timer color}
  stopwatchColor: {$ref: '#/definitions/WidgetColor', title: Stopwatch color, x-autoColor: alt, x-autoGradient: true}
  idleColor: {$ref: '#/definitions/WidgetColor', title: Stopped color, x-autoColor: 'off'}
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    x-showIf: {$bar.textColorShows: true}
