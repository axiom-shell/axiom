label: Timer
keywords: ['Timer & stopwatch']
icon: timer_play
group: Tools
popout:
  variant: own
  enabled: {description: The timer and stopwatch on hover.}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, stacked]
    description: Ring and fill show the timer's progress or the stopwatch's minute.
colors: text
order: [appearance, hideWhenIdle, popout, foregroundColor, timerColor, stopwatchColor, idleColor]
settings:
  hideWhenIdle:
    type: boolean
    title: Hide when stopped
    default: false
    description: Hidden while neither is running or paused.
  timerColor: {$ref: '#/definitions/WidgetColor', title: Timer color}
  stopwatchColor: {$ref: '#/definitions/WidgetColor', title: Stopwatch color, x-autoColor: alt, x-autoGradient: true}
  idleColor: {$ref: '#/definitions/WidgetColor', title: Stopped color, x-autoColor: 'off'}
