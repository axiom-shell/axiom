label: System stats
icon: memory_alt
group: System
popout: {variant: own, enabled: {description: Live graphs of the shown metrics on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments, sparkline, stacked]
    description: Pill only with one metric in a box; the disk shows a fill instead of a sparkline.
colors: standard
boxes:
  variant: each
  boxes:
    x-boxItems: {options: {cpu: showCpu, mem: showMemory, temp: showTemp, gpu: showGpu, disk: showDisk}}
settings:
  showCpu: {type: boolean, title: CPU usage, default: true}
  showMemory: {type: boolean, title: Memory, default: true}
  memoryFormat:
    type: string
    title: Memory format
    default: percent
    x-control: toggle
    enum: [percent, used]
    x-showIf: {showMemory: true}
  showTemp:
    type: boolean
    title: CPU temperature
    default: true
    description: Hidden when no temperature sensor is found.
  showGpu:
    type: boolean
    title: GPU usage
    default: false
    description: Hidden when no GPU is found.
  showDisk: {type: boolean, title: Disk usage, default: false}
  diskPath:
    x-scope: machine
    type: string
    title: Disk path
    x-control: folder
    default: /
    description: Any path on the filesystem.
    x-showIf: {showDisk: true}
  interval:
    type: integer
    title: Poll interval
    x-unit: ms
    default: 2000
    minimum: 1000
    maximum: 60000
  warnThreshold:
    type: integer
    title: Warning at
    default: 90
    minimum: 1
    maximum: 100
    description: Usage (%) or temperature (°C) at or above this shows the warning background.
  warnColor: {$ref: '#/definitions/WidgetColor', title: Warning color, x-autoColor: warning}
