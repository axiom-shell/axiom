label: System stats
icon: memory_alt
group: System
popout: {variant: own, enabled: {description: Live graphs of the shown metrics on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments, sparkline, stacked]
    description: 'Pill: with one metric shown, else fill. Disk: fill, not sparkline.'
colors: standard
order: [appearance, metrics, memoryFormat, units, diskPath, interval, warnThreshold, popout, backgroundColor, foregroundColor, warnColor]
settings:
  metrics:
    $ref: '#/definitions/SystemMetrics'
    default: [cpu, mem, cpuTemp]
    items:
      type: string
      enum: [cpu, mem, cpuTemp, gpu, disk]
    description: A metric this machine can't report is hidden.
  memoryFormat: {$ref: '#/definitions/MemoryFormat', x-showIf: {metrics: {includes: mem}}}
  units: {$ref: '#/definitions/TemperatureUnits'}
  diskPath:
    x-scope: machine
    type: string
    title: Disk path
    x-control: folder
    default: /
    description: The disk holding this path.
    x-showIf: {metrics: {includes: disk}}
  interval:
    type: integer
    title: Interval
    x-unit: ms
    default: 2000
    minimum: 1000
    maximum: 60000
  warnThreshold:
    type: integer
    title: Warning at
    default: 90
    minimum: 1
    maximum: 100
    description: Usage or temperature at or above this turns on the warning color. Temperatures in °C.
  warnColor: {$ref: '#/definitions/WidgetColor', title: Warning color, x-autoColor: warning}
