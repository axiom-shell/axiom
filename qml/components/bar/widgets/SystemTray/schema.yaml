label: System tray
icon: apps
group: Desktop
popout:
  variant: plain
  enabled: {title: Menus, description: Open an item's menu when it's hovered.}
settings:
  showPassive:
    type: boolean
    title: Show passive
    default: true
    description: Also show idle items.
  backgroundColor:
    type: string
    title: Background
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      anyOf:
        - {$bar.boxed: true, $bar.merged: false}
        - {$bar.underlined: true}
  leadIcon:
    type: string
    x-control: icon
    title: Head icon
    default: ''
    description: Drawn before the items; a split bar sets it apart as the icon part. Empty shows none.
