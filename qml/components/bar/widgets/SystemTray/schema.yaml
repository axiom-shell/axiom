label: System tray
icon: apps
group: Desktop
popout:
  variant: plain
  enabled: {title: Menus, description: An item's menu opens on hover.}
order: [showPassive, leadIcon, popout, backgroundColor]
settings:
  showPassive:
    type: boolean
    title: Passive items
    default: true
    description: Idle items too.
  backgroundColor:
    type: string
    title: Background color
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      anyOf:
        - {$bar.boxed: true, $bar.merged: false}
        - {$bar.underlined: true}
  leadIcon:
    type: string
    x-control: icon
    title: Icon
    default: ''
    description: 'Shown before the items. Empty: none.'
