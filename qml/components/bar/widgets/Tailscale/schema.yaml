label: Tailscale
keywords: ['Tailscale Status']
icon: vpn_lock
group: Network & devices
popout: {variant: own, enabled: {description: The tailnet and its devices on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: 'Stacked: the label over this machine''s address.'
colors: text
order: [appearance, showLabel, label, connectedIcon, disconnectedIcon, clickCommand, popout, foregroundColor, connectedColor, disconnectedColor]
settings:
  showLabel: {type: boolean, title: Label, default: true}
  label:
    type: string
    title: Label
    default: ''
    description: 'Empty: the tailnet name.'
    x-showIf:
      anyOf:
        - {showLabel: true}
        - {appearance.style: stacked}
  connectedIcon:
    type: string
    x-control: icon
    title: Connected icon
    default: shield_lock
  disconnectedIcon:
    type: string
    x-control: icon
    title: Disconnected icon
    default: signal_disconnected
  clickCommand:
    x-scope: commands
    type: string
    title: Click command
    default: ''
    description: Left click. Right click checks again.
  connectedColor: {$ref: '#/definitions/WidgetColor', title: Connected color}
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: 'off'
