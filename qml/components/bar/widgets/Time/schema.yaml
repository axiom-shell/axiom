label: Clock
keywords: ['Time', 'Date']
icon: schedule
priority: 5
group: Time & weather
popout: {variant: own, enabled: {description: Open the calendar when hovered.}}
colors:
  variant: standard
  backgroundColor:
    x-showIf:
      anyOf:
        - {$bar.boxed: true, $bar.merged: false}
        - {$bar.underlined: true}
settings:
  hourFormat:
    type: string
    title: Clock
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
  showSeconds: {type: boolean, title: Seconds, default: true}
  showDate: {type: boolean, title: Date, default: true}
  lead:
    type: string
    title: Head
    enum: [auto, none, icon, date]
    x-enumLabels: {auto: Auto, none: None, icon: Icon, date: Date}
    x-enumShowIf:
      date: {showDate: true}
    default: auto
    description: Drawn before the time; a split bar sets it apart as the icon part. Auto puts the date there on a split bar.
  leadIcon:
    type: string
    x-control: icon
    title: Head icon
    default: schedule
    x-showIf: {lead: icon}
  timezone:
    x-scope: personal
    type: string
    title: Time zone
    x-options: timezones
    x-control: search
    x-emptyLabel: System
    default: ''
    description: e.g. Asia/Tokyo. Empty follows the system.
  timeFormat:
    type: string
    title: Time format
    default: ''
    description: A Qt time format, e.g. HH:mm. Empty uses the language's.
  dateFormat:
    type: string
    title: Date format
    default: ''
    description: A Qt date format, e.g. ddd d MMM. Empty uses the language's.
  verticalDate:
    type: string
    title: Vertical date
    default: day
    enum: [day, monthDay, numeric]
    x-enumLabels:
      day: Day and weekday
      monthDay: Month, day and weekday
      numeric: Day over month number
    description: The date's lines on a vertical bar, without a date format.
    x-showIf: {showDate: true}
