label: Clock
keywords: ['Time', 'Date']
icon: schedule
priority: 5
group: Time & weather
popout: {variant: own, enabled: {description: Calendar on hover.}}
colors:
  variant: standard
  backgroundColor:
    x-showIf:
      anyOf:
        - {$bar.boxed: true, $bar.merged: false}
        - {$bar.underlined: true}
order: [lead, leadIcon, timeFormat, hourFormat, showSeconds, timezone, showDate, dateFormat, verticalDate, popout, backgroundColor, foregroundColor]
settings:
  hourFormat:
    type: string
    title: Hour format
    x-control: toggle
    enum: [default, '12', '24']
    x-enumLabels: {default: Default, '12': 12h, '24': 24h}
    default: default
    x-link: {setting: DateTime.hourFormat}
    x-showIf: {timeFormat: ''}
  showSeconds: {type: boolean, title: Seconds, default: true, x-showIf: {timeFormat: ''}}
  showDate: {type: boolean, title: Date, default: true}
  lead:
    type: string
    title: Head
    enum: [auto, none, icon, date]
    x-enumLabels: {auto: Auto, none: None, icon: Icon, date: Date}
    x-enumShowIf:
      date: {showDate: true}
    default: auto
    description: 'Auto: the date on a split bar, else none.'
  leadIcon:
    type: string
    x-control: icon
    title: Head icon
    default: schedule
    x-showIf: {lead: icon}
  timezone:
    x-scope: personal
    type: string
    title: Time zone
    x-options: timezones
    x-control: search
    x-emptyLabel: System
    default: ''
    description: e.g. Asia/Tokyo. Empty follows the system.
  timeFormat:
    type: string
    title: Time format
    default: ''
    description: 'A Qt time format, e.g. HH:mm. Empty: the language''s.'
  dateFormat:
    type: string
    title: Date format
    default: ''
    description: 'A Qt date format, e.g. ddd d MMM. Empty: the language''s.'
    x-showIf: {showDate: true}
  verticalDate:
    type: string
    title: Vertical date
    default: day
    enum: [day, monthDay, numeric]
    x-enumLabels:
      day: Day and weekday
      monthDay: Month, day and weekday
      numeric: Day over month number
    description: Date lines on a vertical bar.
    x-showIf: {showDate: true, dateFormat: ''}
