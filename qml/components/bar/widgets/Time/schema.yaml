label: Clock
keywords: ['Time', 'Date']
icon: schedule
priority: 5
group: Time & weather
popout: {variant: own, enabled: {description: Open the calendar when hovered.}}
colors:
  variant: standard
  backgroundColor:
    x-showIf:
      anyOf:
        - {$bar.widgetStyle: [filled, tinted, outline, split], $bar.widgetGrouping: {not: merged}}
        - {$bar.widgetStyle: underline}
settings:
  hourFormat:
    type: string
    title: Clock
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
  showSeconds: {type: boolean, title: Seconds, default: true}
  showDate: {type: boolean, title: Date, default: true}
  timezone:
    x-scope: personal
    type: string
    title: Time zone
    x-options: timezones
    x-control: search
    x-emptyLabel: System
    default: ''
    description: e.g. Asia/Tokyo. Empty follows the system.
  timeFormat:
    type: string
    title: Time format
    default: ''
    description: A Qt time format, e.g. HH:mm. Empty uses the language's.
  dateFormat:
    type: string
    title: Date format
    default: ''
    description: A Qt date format, e.g. ddd d MMM. Empty uses the language's.
  verticalDate:
    type: string
    title: Vertical date
    default: day
    enum: [day, monthDay, numeric]
    x-enumLabels:
      day: Day and weekday
      monthDay: Month, day and weekday
      numeric: Day over month number
    description: The date's lines on a vertical bar, without a date format.
    x-showIf: {showDate: true}
