label: Updates
keywords: ['Package Updates']
icon: package_2
group: System
popout: {variant: own, enabled: {description: Pending packages on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: 'Stacked: the count over the AUR''s share.'
colors: standard
order: [appearance, hideWhenEmpty, warnThreshold, popout, backgroundColor, foregroundColor, warnColor, failedColor]
settings:
  hideWhenEmpty: {type: boolean, title: Hide when up to date, default: true}
  warnThreshold:
    type: integer
    title: Warning at
    default: 50
    minimum: 1
    maximum: 1000
  warnColor: {$ref: '#/definitions/WidgetColor', title: Warning color, x-autoColor: warning}
  failedColor: {$ref: '#/definitions/WidgetColor', title: Failed color, x-autoColor: critical, description: While the check fails.}
