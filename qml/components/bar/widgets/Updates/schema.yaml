label: Updates
keywords: ['Package Updates']
icon: package_2
group: System
popout: {variant: own, enabled: {description: List pending packages when hovered.}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: Stacked puts the count over the AUR's share.
colors: standard
settings:
  hideWhenEmpty: {type: boolean, title: Hide when up to date, default: true}
  warnThreshold:
    type: integer
    title: Warning at
    default: 50
    minimum: 1
    maximum: 1000
    description: At or above this count, the widget uses the warning background.
  warnColor: {$ref: '#/definitions/WidgetColor', title: Warning color, x-autoColor: warning}
