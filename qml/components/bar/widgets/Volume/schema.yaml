label: Volume
icon: volume_up
group: Media & audio
popout: {variant: own, enabled: {description: The output mixer on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, ring, fill, pill, segments]
colors: standard
order: [appearance, showPercentage, showDevice, maxVolume, scrollStep, middleCommand, popout, backgroundColor, foregroundColor, mutedColor]
settings:
  showPercentage: {type: boolean, title: Percentage, default: false, x-showIf: {appearance.style: [label, ring, fill, pill, segments]}}
  showDevice: {type: boolean, title: Device, default: false, x-showIf: {appearance.style: [label, ring, fill, pill, segments]}}
  scrollStep:
    type: integer
    title: Scroll step
    x-unit: '%'
    default: 5
    minimum: 1
    maximum: 25
  maxVolume:
    type: integer
    title: Maximum
    x-unit: '%'
    default: 100
    minimum: 100
    maximum: 150
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: pavucontrol
    description: 'Empty: nothing.'
  mutedColor: {$ref: '#/definitions/WidgetColor', title: Muted color, x-autoColor: 'off'}
