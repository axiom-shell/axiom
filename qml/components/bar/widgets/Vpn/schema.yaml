label: VPN
keywords: ['VPN Status']
icon: vpn_lock
group: Network & devices
popout: {variant: own, enabled: {description: Every VPN on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: "Stacked puts the VPN's name over its address."
colors: text
order: [appearance, showName, hideWhenOff, middleCommand, popout, foregroundColor, connectedColor, disconnectedColor]
settings:
  showName:
    type: boolean
    title: Name
    default: true
    x-showIf: {appearance.style: label}
  hideWhenOff:
    type: boolean
    title: Hide when disconnected
    default: false
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: 'Empty: nothing.'
  connectedColor: {$ref: '#/definitions/WidgetColor', title: Connected color}
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: 'off'
