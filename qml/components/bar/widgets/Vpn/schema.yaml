label: VPN
keywords: ['VPN Status']
icon: vpn_lock
group: Network & devices
popout: {variant: own, enabled: {description: 'Every VPN on hover, to connect or disconnect one.'}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: "Stacked puts the VPN's name over its address."
settings:
  showName:
    type: boolean
    title: Show name
    default: true
    description: Show the active VPN's name.
  hideWhenOff:
    type: boolean
    title: Hide when off
    default: false
    description: Show only while a VPN is up.
  middleCommand:
    x-scope: commands
    type: string
    title: Middle-click command
    default: ''
    description: Empty does nothing. A left click toggles the last VPN.
  connectedColor: {$ref: '#/definitions/WidgetColor', title: Connected color}
  disconnectedColor:
    $ref: '#/definitions/WidgetColor'
    title: Disconnected color
    x-autoColor: 'off'
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    x-showIf:
      $bar.widgetStyle: filled
      $bar.widgetGrouping: {not: merged}
      $bar.widgetTextColor: ''
