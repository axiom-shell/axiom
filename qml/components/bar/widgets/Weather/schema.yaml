label: Weather
icon: partly_cloudy_day
group: Time & weather
popout: {variant: own, enabled: {description: Forecast on hover.}}
appearance:
  variant: value
  style:
    enum: [label, icon, stacked]
    description: "Stacked puts the temperature over the condition."
colors: standard
order: [appearance, showCondition, popout, backgroundColor, foregroundColor]
settings:
  showCondition:
    type: boolean
    title: Condition
    default: false
    x-showIf: {appearance.style: [label, stacked]}
