label: Window title
elastic: true
icon: wrap_text
group: Desktop
popout: menu
appearance:
  variant: value
  style:
    enum: [label, icon, ticker, stacked]
    description: Ticker scrolls a long title; stacked puts it over the app id.
colors: standard
order: [appearance, appIcon, icon, emptyText, popout, backgroundColor, foregroundColor]
settings:
  appIcon:
    type: boolean
    title: App icon
    default: false
    description: The window's app icon instead of the icon.
  icon:
    type: string
    x-control: icon
    title: Icon
    default: ''
    description: 'Empty: none.'
  emptyText:
    type: string
    title: Empty text
    default: '—'
    description: Shown when no window is focused.
