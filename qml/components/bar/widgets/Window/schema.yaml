label: Window title
elastic: true
icon: wrap_text
group: Desktop
popout: menu
appearance:
  variant: value
  style:
    enum: [label, icon, ticker, stacked]
    description: Ticker scrolls a long title; stacked puts it over the app id.
colors: standard
settings:
  appIcon:
    type: boolean
    title: App icon
    default: false
    description: The focused window's app icon in place of the icon.
  icon:
    x-showIf: {appIcon: false}
    type: string
    x-control: icon
    title: Icon
    default: ''
    description: A Material Symbols name, or text. Empty shows none.
  emptyText:
    type: string
    title: Empty text
    default: '—'
    description: Shown when no window is focused.
