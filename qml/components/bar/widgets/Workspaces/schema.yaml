label: Workspaces
keywords: ['Workspace Switcher']
icon: grid_view
priority: 10
group: Desktop
popout:
  variant: own
  enabled:
    x-showIf:
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
    description: The whole grid, or each strip workspace with its windows.
  menu:
    x-showIf:
      enabled: true
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
order: [showBackground, backgroundColor, solidBoxes, leadIcon, showEmpty, monitorOnly, labels, relativeNumbers, workspaceLabels, useNames, showAppIcons, appIconsLayout, appIconsCount, appIconsMax, stripWindows, activeWorkspaceIcons, specialWorkspaces, specialWorkspaceLabel, specialWorkspaceSplit, spacing, wideActive, urgentPulse, clickToSwitch, scrollToSwitch, scrollReverse, popout, foregroundColor, hoverColor, activeColor, occupiedColor, emptyColor, urgentColor]
settings:
  showEmpty:
    type: boolean
    title: Empty workspaces
    default: true
    x-showIf: {/$supports.dynamicWorkspaces: false}
    description: 'Off: only those with windows, and the active one.'
  monitorOnly:
    type: boolean
    title: Only this monitor
    default: false
    x-showIf: {/Workspaces.layout: standard, /$supports.dynamicWorkspaces: false}
    description: Hide workspaces on other monitors.
  labels:
    type: string
    title: Labels
    x-control: toggle
    enum: [numbers, dots, none]
    x-enumLabels: {numbers: Numbers, dots: Dots, none: None}
    # None on a bar whose cells have neither box nor line would leave
    # nothing to see (it shows dots there)
    x-enumShowIf:
      none:
        anyOf:
          - {$bar.boxed: true}
          - {$bar.underlined: true}
          - {solidBoxes: true}
    default: numbers
  relativeNumbers:
    type: boolean
    title: Relative numbers
    default: false
    x-showIf:
      labels: numbers
      anyOf:
        - {/Workspaces.layout: [perMonitor, grid, scrolling]}
        - {/$supports.dynamicWorkspaces: true}
    description: Number each monitor's workspaces from 1.
  workspaceLabels:
    type: array
    title: Workspace labels
    default: []
    description: Your own icon or text per workspace number; beats app icons and names.
    items:
      type: object
      additionalProperties: false
      x-order: [workspace, show, icon, text]
      properties:
        id: {$ref: '#/definitions/ItemId'}
        workspace:
          type: integer
          title: Workspace
          default: 1
          minimum: 1
          maximum: 30
        show:
          type: string
          title: Show
          enum: [icon, text, both]
          x-enumLabels: {icon: Icon, text: Text, both: Both}
          default: icon
        icon:
          type: string
          x-control: icon
          x-iconText: {mode: show, text: text}
          title: Label
          default: ''
          description: An icon, text, or both.
        text:
          type: string
          title: Text
          default: ''
  useNames:
    type: boolean
    title: Workspace names
    default: false
    description: The compositor's name where it says more than the number.
  showAppIcons:
    type: boolean
    title: App icons
    default: false
    description: Workspaces with windows show their apps' icons.
  appIconsLayout:
    type: string
    title: Icon layout
    x-control: toggle
    enum: [largest, row, square]
    x-enumLabels: {largest: Largest, row: Row, square: Square}
    default: largest
    x-showIf: {showAppIcons: true}
    description: 'Square: up to four in a cell.'
  appIconsCount:
    type: string
    title: Icon count
    x-control: toggle
    enum: [apps, windows]
    x-enumLabels: {apps: Apps, windows: Windows}
    default: apps
    x-showIf: {showAppIcons: true, appIconsLayout: [row, square]}
    description: 'Apps: each app once. Windows: an icon per window.'
  appIconsMax:
    type: integer
    title: Icons in a row
    default: 3
    minimum: 2
    maximum: 8
    x-control: stepper
    x-showIf: {showAppIcons: true, appIconsLayout: row}
  stripWindows:
    type: string
    title: Strip windows
    x-control: toggle
    enum: ['off', each, one]
    x-enumLabels: {'off': 'Off', each: Each, one: One}
    default: each
    x-showIf:
      anyOf:
        - {/Workspaces.strips: {notEmpty: true}, /$supports.strips: true}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    description: The active workspace's windows, after its cells.
  activeWorkspaceIcons:
    type: boolean
    title: Icons on active workspace
    default: true
    x-showIf:
      showAppIcons: true
      stripWindows: {not: 'off'}
      anyOf:
        - {/Workspaces.strips: {notEmpty: true}, /$supports.strips: true}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    description: 'Off: it shows its number, dot or label instead.'
  specialWorkspaces:
    type: string
    title: Special workspaces
    x-control: toggle
    enum: ['off', occupied, all]
    x-enumLabels: {'off': 'Off', occupied: Occupied, all: All}
    default: 'off'
    x-showIf: {/$supports.namedSpecial: true}
    description: Special workspaces after the cells, behind a divider; click to show or hide.
  specialWorkspaceLabel:
    type: string
    title: Special workspace labels
    x-control: toggle
    enum: [icon, name, both]
    x-enumLabels: {icon: Icon, name: Name, both: Both}
    default: icon
    x-showIf: {specialWorkspaces: {not: 'off'}, /$supports.namedSpecial: true}
    description: Hover shows the name.
  specialWorkspaceSplit:
    type: boolean
    title: Split label from apps
    default: false
    x-showIf: {specialWorkspaces: {not: 'off'}, showAppIcons: true, /$supports.namedSpecial: true}
    description: Label, divider, then app icons.
  spacing:
    type: string
    title: Spacing
    x-control: toggle
    enum: [tight, bar, wide]
    x-enumLabels: {tight: Tight, bar: Bar, wide: Wide}
    default: bar
    description: Gap between workspaces.
  wideActive:
    type: boolean
    title: Wide active cell
    default: true
  clickToSwitch:
    type: boolean
    title: Click to switch
    default: true
  scrollToSwitch:
    type: boolean
    title: Scroll to switch
    default: true
    description: Scroll over the widget to step through workspaces.
  scrollReverse:
    type: boolean
    title: Reverse scrolling
    default: false
    x-showIf: {scrollToSwitch: true}
    description: Scroll down goes back.
  showBackground:
    type: boolean
    title: Background
    default: true
    description: 'A box around the workspaces. Off: each takes the bar''s widget shape.'
    x-showIf: {$bar.boxed: true}
  leadIcon:
    type: string
    x-control: icon
    title: Icon
    default: ''
    x-showIf:
      anyOf:
        - {/Workspaces.layout: [standard, perMonitor, scrolling]}
        - {/$supports.dynamicWorkspaces: true}
    description: 'Empty: none.'
  backgroundColor:
    type: string
    title: Background color
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      showBackground: true
      $bar.boxed: true
      $bar.merged: false
  solidBoxes:
    type: boolean
    title: Solid boxes
    default: false
    description: Fill every workspace box with its state's color.
  activeColor:
    $ref: '#/definitions/WidgetColor'
    title: Active color
    x-showIf:
      anyOf:
        - {$bar.ownColorShows: true}
        - {solidBoxes: true}
  occupiedColor:
    type: string
    title: Occupied color
    x-options: colors
    default: base04
    x-showIf:
      anyOf:
        - {$bar.ownColorShows: true}
        - {solidBoxes: true}
  urgentColor:
    type: string
    title: Urgent color
    x-options: colors
    default: base08
    description: A workspace asking for attention.
  urgentPulse:
    type: boolean
    title: Pulse urgent workspaces
    default: true
    description: Fade urgent workspaces in and out until you visit them.
  emptyColor:
    type: string
    title: Empty color
    x-options: colors
    default: base01
    x-showIf:
      anyOf:
        - {$bar.boxed: true}
        - {$bar.underlined: true}
        - {solidBoxes: true}
  foregroundColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    description: Numbers, dots and labels in boxes.
    x-showIf:
      $bar.widgetTextColor: ''
      anyOf:
        - {solidBoxes: true}
        - {$bar.cellsFilled: true, labels: [numbers, dots]}
        - {$bar.cellsFilled: true, workspaceLabels: {notEmpty: true}}
        - {$bar.cellsFilled: true, useNames: true}
  hoverColor:
    type: string
    title: Hover color
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    description: 'Empty: the theme''s highlight.'
