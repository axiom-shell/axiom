label: Workspace Switcher
icon: grid_view
group: Desktop
popout:
  variant: own
  enabled:
    x-showIf:
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
    description: In a grid, open the whole grid when hovered. Otherwise, on a strip monitor, open every workspace with its windows in strip order.
  menu:
    x-showIf:
      enabled: true
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
settings:
  showEmpty:
    type: boolean
    title: Show empty workspaces
    default: true
    x-showIf: {/$supports.dynamicWorkspaces: false}
    description: 'Off: only workspaces with windows, plus the active one (in a grid, of the row shown). Down to one on a strip monitor, its windows show alone.'
  monitorOnly:
    type: boolean
    title: Only this monitor
    default: false
    x-showIf: {/Workspaces.layout: standard, /$supports.dynamicWorkspaces: false}
    description: Hide workspaces that are open on another monitor.
  labels:
    type: string
    title: Labels
    enum: [numbers, dots]
    x-enumLabels: {numbers: Numbers, dots: Dots}
    default: numbers
    description: The workspace's number, on the bar and in the grid popout.
  relativeNumbers:
    type: boolean
    title: Relative numbers
    default: false
    x-showIf:
      labels: numbers
      anyOf:
        - {/Workspaces.layout: [perMonitor, grid, scrolling]}
        - {/$supports.dynamicWorkspaces: true}
    description: Number each monitor's workspaces from 1 (11 to 20 on the second monitor show as 1 to 10) instead of by their workspace id, on the bar and in the grid popout.
  showAppIcons:
    type: boolean
    title: App icons
    default: false
    x-showIf: {/$supports.dynamicWorkspaces: false}
    description: Show the largest window's icon on occupied workspaces (in a grid, on the bar and in the popout).
  wideActive:
    type: boolean
    title: Wide active
    default: true
    x-showIf:
      anyOf:
        - {/Workspaces.layout: [standard, grid]}
        - {/$supports.dynamicWorkspaces: true}
    description: Make the active workspace twice as long.
  showActiveIcon:
    type: boolean
    title: Active icon
    default: true
    x-showIf: {/Workspaces.layout: grid, /$supports.dynamicWorkspaces: false}
    description: Show an arrow on the active workspace, pointing to where the shown row (or column) is in the grid.
  clickToSwitch:
    type: boolean
    title: Click to switch
    default: true
    description: Click a workspace (on the bar or in the grid popout) to go to it.
  scrollToSwitch:
    type: boolean
    title: Scroll to switch
    default: true
    description: Scroll over the widget to step through the workspaces (along the shown row or column in a grid).
  showBackground:
    type: boolean
    title: Background
    default: true
    description: "A box around the workspaces, in the bar's widget style. Off: the workspaces sit on the bar at the size of the widgets around them."
    x-showIf: {$bar.widgetStyle: [filled, tinted, outline]}
  backgroundColor:
    type: string
    title: Background color
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      showBackground: true
      $bar.widgetStyle: [filled, tinted, outline]
      $bar.widgetGrouping: {not: merged}
    description: Behind the workspaces, in the bar's widget style.
  activeColor: {$ref: '#/definitions/WidgetColor', title: Active}
  occupiedColor:
    type: string
    title: Occupied
    x-options: colors
    default: base04
    x-showIf: {$bar.widgetStyle: {not: plain}}
  emptyColor:
    type: string
    title: Empty
    x-options: colors
    default: base01
    x-showIf:
      $bar.widgetStyle: [filled, tinted, outline, underline]
  textColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    description: Numbers, and the grid's active arrow. The colors also apply to the grid popout.
    x-showIf: {$bar.widgetStyle: filled, $bar.widgetTextColor: ''}
  hoverColor:
    type: string
    title: Hover
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    description: "A cell's box under the pointer. Auto: the theme's highlight."
