label: Workspaces
keywords: ['Workspace Switcher']
icon: grid_view
priority: 10
group: Desktop
popout:
  variant: own
  enabled:
    x-showIf:
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
    description: Open the whole grid, or on a strip monitor every workspace with its windows.
  menu:
    x-showIf:
      enabled: true
      anyOf:
        - {/Workspaces.layout: grid}
        - {/Workspaces.strips: {notEmpty: true}}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
settings:
  showEmpty:
    type: boolean
    title: Show empty workspaces
    default: true
    x-showIf: {/$supports.dynamicWorkspaces: false}
    description: 'Off: only workspaces with windows, plus the active one.'
  monitorOnly:
    type: boolean
    title: Only this monitor
    default: false
    x-showIf: {/Workspaces.layout: standard, /$supports.dynamicWorkspaces: false}
    description: Hide workspaces on another monitor.
  labels:
    type: string
    title: Labels
    x-control: toggle
    enum: [numbers, dots, none]
    x-enumLabels: {numbers: Numbers, dots: Dots, none: None}
    # None on a bar whose cells have neither box nor line would leave
    # nothing to see (it shows dots there)
    x-enumShowIf:
      none:
        anyOf:
          - {$bar.widgetStyle: [filled, tinted, outline, underline]}
          - {solidBoxes: true}
    default: numbers
    description: 'What each workspace shows. None: just its box or line.'
  relativeNumbers:
    type: boolean
    title: Relative numbers
    default: false
    x-showIf:
      labels: numbers
      anyOf:
        - {/Workspaces.layout: [perMonitor, grid, scrolling]}
        - {/$supports.dynamicWorkspaces: true}
    description: Number each monitor's workspaces from 1.
  workspaceLabels:
    type: array
    title: Workspace labels
    default: []
    description: 'Your own label for a workspace, by the number its cell shows: an icon name, a pasted glyph or text. It wins over app icons and names.'
    items:
      type: object
      additionalProperties: false
      x-order: [workspace, label]
      properties:
        id: {$ref: '#/definitions/ItemId'}
        workspace:
          type: integer
          title: Workspace
          default: 1
          minimum: 1
          maximum: 30
        label:
          type: string
          x-control: icon
          title: Label
          default: ''
          description: A Material Symbols name, a pasted glyph, or text.
  useNames:
    type: boolean
    title: Use workspace names
    default: false
    description: Show a workspace's name from the compositor where it says more than its number.
  showAppIcons:
    type: boolean
    title: App icons
    default: false
    description: Workspaces with windows show their apps' icons instead.
  appIconsLayout:
    type: string
    title: Icons
    x-control: toggle
    enum: [largest, row, square]
    x-enumLabels: {largest: Largest, row: Row, square: Square}
    default: largest
    x-showIf: {showAppIcons: true}
    description: 'Largest: the biggest window''s icon. Row: side by side, the cell growing to fit. Square: up to four in a block the size of a cell.'
  appIconsCount:
    type: string
    title: Count
    x-control: toggle
    enum: [apps, windows]
    x-enumLabels: {apps: Apps, windows: Windows}
    default: apps
    x-showIf: {showAppIcons: true, appIconsLayout: [row, square]}
    description: 'Apps: each app once. Windows: an icon per window, so three terminals show three.'
  appIconsMax:
    type: integer
    title: Icons in a row
    default: 3
    minimum: 2
    maximum: 8
    x-control: stepper
    x-showIf: {showAppIcons: true, appIconsLayout: row}
    description: The most icons a workspace shows, for its biggest windows, in their order on screen.
  stripWindows:
    type: string
    title: Strip windows
    x-control: toggle
    enum: ['off', each, one]
    x-enumLabels: {'off': 'Off', each: A box each, one: One box}
    default: each
    x-showIf:
      anyOf:
        - {/Workspaces.strips: {notEmpty: true}, /$supports.strips: true}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    description: 'On a strip monitor, the active workspace''s windows after its cells. One box: every window''s icon in one cell, the focused one marked. The popout shows a box each whatever this says.'
  activeWorkspaceIcons:
    type: string
    title: Active workspace icons
    x-control: toggle
    enum: [keep, hide]
    x-enumLabels: {keep: Keep, hide: Hide while strip windows show}
    default: keep
    x-showIf:
      showAppIcons: true
      stripWindows: {not: 'off'}
      anyOf:
        - {/Workspaces.strips: {notEmpty: true}, /$supports.strips: true}
        - {/Workspaces.layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    description: 'Hide: while its windows show after the cells, the active workspace shows its number, dot or label instead of app icons. The others keep theirs.'
  spacing:
    type: string
    title: Spacing
    x-control: toggle
    enum: [tight, bar, wide]
    x-enumLabels: {tight: Tight, bar: Bar, wide: Wide}
    default: bar
    description: 'The gap between workspaces. Tight: none. Bar: the bar''s own gap between items. Wide: twice that.'
  wideActive:
    type: boolean
    title: Wide active
    default: true
    description: Make the active workspace one cell longer.
  showActiveIcon:
    type: boolean
    title: Active icon
    default: true
    x-showIf: {/Workspaces.layout: grid, /$supports.dynamicWorkspaces: false}
    description: An arrow on the active workspace pointing to the shown grid row.
  clickToSwitch:
    type: boolean
    title: Click to switch
    default: true
  scrollToSwitch:
    type: boolean
    title: Scroll to switch
    default: true
    description: Step through workspaces by scrolling over the widget.
  scrollReverse:
    type: boolean
    title: Reverse scrolling
    default: false
    x-showIf: {scrollToSwitch: true}
    description: Scrolling down goes back instead of on, for workspaces and a strip's windows alike.
  showBackground:
    type: boolean
    title: Background
    default: true
    description: A box around the workspaces. Off, they sit on the bar.
    x-showIf: {$bar.widgetStyle: [filled, tinted, outline]}
  backgroundColor:
    type: string
    title: Background color
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    x-autoColor: neutral
    x-showIf:
      showBackground: true
      $bar.widgetStyle: [filled, tinted, outline]
      $bar.widgetGrouping: {not: merged}
  solidBoxes:
    type: boolean
    title: Solid boxes
    default: false
    description: Every workspace a box filled with its state's color, whatever the bar's widget style.
  activeColor:
    $ref: '#/definitions/WidgetColor'
    title: Active
    x-showIf:
      anyOf:
        - {$bar.widgetStyle: {not: plain}}
        - {solidBoxes: true}
  occupiedColor:
    type: string
    title: Occupied
    x-options: colors
    default: base04
    x-showIf:
      anyOf:
        - {$bar.widgetStyle: {not: plain}}
        - {solidBoxes: true}
  urgentColor:
    type: string
    title: Urgent
    x-options: colors
    default: base08
    description: A workspace with a window asking for attention. The active one keeps its own color.
  urgentPulse:
    type: boolean
    title: Pulse urgent workspaces
    default: true
    description: Fade urgent workspaces in and out until you visit them.
  emptyColor:
    type: string
    title: Empty
    x-options: colors
    default: base01
    x-showIf:
      anyOf:
        - {$bar.widgetStyle: [filled, tinted, outline, underline]}
        - {solidBoxes: true}
  textColor:
    type: string
    title: Text color
    x-options: colors
    default: base00
    description: Numbers, dots and labels in boxes, and the grid's active arrow.
    x-showIf:
      $bar.widgetTextColor: ''
      anyOf:
        - {solidBoxes: true}
        - {$bar.widgetStyle: filled, labels: [numbers, dots]}
        - {$bar.widgetStyle: filled, workspaceLabels: {notEmpty: true}}
        - {$bar.widgetStyle: filled, useNames: true}
        - {$bar.widgetStyle: filled, showActiveIcon: true, /Workspaces.layout: grid, /$supports.dynamicWorkspaces: false}
  hoverColor:
    type: string
    title: Hover
    x-options: colors
    default: ''
    x-emptyLabel: Auto
    description: 'A cell under the pointer. Auto: the theme''s highlight.'
