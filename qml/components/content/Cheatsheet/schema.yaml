label: Keybind cheat sheet
link: {page: Keybinds}
keyboard: true
icon: keyboard
group: Tools
defaultSize: [8, 6]
order: [view, mods, sections, showUndescribed]
settings:
  sections:
    type: array
    title: Sections
    default: []
    items: {type: string}
    description: Comma-separated section titles. Empty shows them all.
  showUndescribed:
    type: boolean
    title: Undescribed binds
    default: false
    description: Listed by their dispatcher.
  view:
    type: string
    title: View
    x-control: toggle
    enum: [list, keyboard]
    x-enumLabels: {list: List, keyboard: Keyboard}
    default: list
    description: 'Keyboard: what each key does.'
  mods:
    type: array
    title: Modifiers
    default: [SUPER]
    items:
      type: string
      enum: [SUPER, CTRL, ALT, SHIFT]
    x-showIf: {view: keyboard}
    description: Held down on the keyboard.
