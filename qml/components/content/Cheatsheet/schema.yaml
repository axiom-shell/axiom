label: Keybind cheat sheet
link: {page: Keybinds}
keyboard: true
icon: keyboard
group: Tools
defaultSize: [8, 6]
order: [style, showSearch, mods, sections, showUndescribed]
settings:
  sections:
    type: array
    title: Sections
    default: []
    items: {type: string}
    description: Comma-separated section titles. Empty shows them all.
  showSearch:
    type: boolean
    title: Search
    default: true
    description: When there's room.
  showUndescribed:
    type: boolean
    title: Undescribed binds
    default: false
    description: Listed by their dispatcher.
  style:
    type: string
    title: Style
    x-control: toggle
    enum: [auto, list, keyboard]
    x-enumLabels: {auto: Auto, list: List, keyboard: Keyboard}
    default: auto
    description: 'Auto: by the card''s size. Keyboard: what each key does.'
  mods:
    type: array
    title: Modifiers
    default: [SUPER]
    items:
      type: string
      enum: [SUPER, CTRL, ALT, SHIFT]
    x-showIf: {style: [auto, keyboard]}
    description: Held down on the keyboard.
