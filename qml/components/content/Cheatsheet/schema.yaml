label: Keybind cheat sheet
link: {page: Keybinds}
keyboard: true
icon: keyboard
group: Tools
defaultSize: [8, 6]
settings:
  sections:
    type: array
    title: Sections
    default: []
    items: {type: string}
    description: Comma-separated section titles. Empty shows them all.
  showUndescribed:
    type: boolean
    title: Show undescribed binds
    default: false
    description: Listed by their dispatcher.
  view:
    type: string
    title: View
    x-control: toggle
    enum: [list, keyboard]
    x-enumLabels: {list: List, keyboard: Keyboard}
    default: list
    description: The binds by section, or a keyboard showing what each key does.
  mods:
    type: array
    title: Keyboard modifiers
    default: [SUPER]
    items:
      type: string
      enum: [SUPER, CTRL, ALT, SHIFT]
    x-showIf: {view: keyboard}
    description: Held on the keyboard view.
