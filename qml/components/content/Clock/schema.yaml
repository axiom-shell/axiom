label: Clock
icon: schedule
group: Time & weather
defaultSize: [4, 3]
canvasDetail: style
hosts: [lockscreen, greeter]
settings:
  style:
    type: string
    title: Style
    x-control: toggle
    enum: [digital, stacked, analog]
    x-enumLabels: {digital: Digital, stacked: Stacked, analog: Analog}
    default: stacked
    description: 'Stacked: hours over minutes.'
  hourFormat:
    type: string
    title: Hour format
    x-control: toggle
    enum: [default, '12', '24']
    x-enumLabels: {default: Default, '12': 12h, '24': 24h}
    default: default
    x-link: {setting: DateTime.hourFormat}
    x-showIf: {style: {not: analog}}
  showSeconds: {type: boolean, title: Seconds, default: false}
  showDate: {type: boolean, title: Date, default: true}
  timezone:
    x-scope: personal
    type: string
    title: Time zone
    x-options: timezones
    x-control: search
    x-emptyLabel: System
    default: ''
    description: e.g. Asia/Tokyo.
  label:
    type: string
    title: Label
    default: ''
    description: A caption under the clock.
  color: {type: string, title: Text color, x-options: colors, x-emptyLabel: Text, default: ''}
  accentColor:
    type: string
    title: Accent color
    x-options: colors
    x-emptyLabel: Accent
    default: ''
    description: Minutes, seconds and the label.
