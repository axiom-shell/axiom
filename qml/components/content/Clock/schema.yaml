label: Clock
icon: schedule
group: Time & weather
defaultSize: [4, 3]
canvasDetail: style
hosts: [lockscreen, greeter]
settings:
  style:
    type: string
    title: Style
    x-control: toggle
    enum: [digital, stacked, analog]
    x-enumLabels: {digital: Digital, stacked: Stacked, analog: Analog}
    default: stacked
    description: 'Digital: one large line. Stacked: hours over minutes. Analog: a clock face.'
  hourFormat:
    type: string
    title: Clock
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
    x-showIf: {style: {not: analog}}
  showSeconds: {type: boolean, title: Show seconds, default: false}
  showDate: {type: boolean, title: Show the date, default: true}
  timezone:
    x-scope: personal
    type: string
    title: Time zone
    x-options: timezones
    x-control: search
    x-emptyLabel: System
    default: ''
    description: e.g. Asia/Tokyo. Empty follows the system.
  label:
    type: string
    title: Label
    default: ''
    description: A caption under the clock.
  color: {type: string, title: Color, x-options: colors, x-emptyLabel: Text, default: ''}
  accentColor:
    type: string
    title: Accent color
    x-options: colors
    x-emptyLabel: Accent
    default: ''
    description: The stacked clock's minutes and the analog clock's second hand.
