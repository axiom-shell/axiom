label: Clock & calendar
link: {setting: Calendar}
keyboard: false
icon: calendar_clock
group: Time & weather
hosts: [lockscreen, greeter]
settings:
  hourFormat:
    type: string
    title: Clock
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
  showSeconds: {type: boolean, title: Show seconds, default: false}
  showEvents:
    type: boolean
    title: Events
    default: true
    description: Dots on days with events, and the day's events where they fit.
