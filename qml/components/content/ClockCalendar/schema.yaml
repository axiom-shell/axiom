label: Clock & calendar
link: {setting: Calendar}
keyboard: false
icon: calendar_clock
group: Time & weather
hosts: [lockscreen, greeter]
settings:
  use24Hour: {type: boolean, title: '24-hour clock', default: true}
  showSeconds: {type: boolean, title: Show seconds, default: false}
  showEvents:
    type: boolean
    title: Events
    default: true
    description: Dots on days with events, and the day's events under the calendar (under the clock when wide) where they fit; a click on a day shows its events. On the lock screen only with Calendar's Events on the lock screen; never on the login screen.
