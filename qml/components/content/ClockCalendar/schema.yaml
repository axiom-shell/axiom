label: Clock & calendar
link: {setting: Calendar}
keyboard: false
icon: calendar_clock
group: Time & weather
hosts: [lockscreen, greeter]
settings:
  hourFormat: {$ref: '#/definitions/HourFormat'}
  showSeconds: {type: boolean, title: Seconds, default: false}
  showEvents: {$ref: '#/definitions/ShowEvents'}
  showDate: {type: boolean, title: Date, default: true}
  dateFormat: {$ref: '#/definitions/DateFormat', x-showIf: {showDate: true}}
  calendars: {$ref: '#/definitions/Calendars', x-showIf: {showEvents: true}}
