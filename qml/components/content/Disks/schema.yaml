label: Disk usage
icon: hard_drive
group: System
canvasDetail: paths
defaultSize: [4, 2]
hosts: [lockscreen]
settings:
  paths:
    x-scope: machine
    type: array
    title: Mount points
    default: [/]
    items: {type: string}
    description: 'e.g. /, /home. Empty: /.'
  warnThreshold: {$ref: '#/definitions/WarnThreshold'}
  criticalThreshold: {$ref: '#/definitions/CriticalThreshold'}
  value:
    type: string
    title: Value
    default: used
    x-control: toggle
    enum: [used, free]
    x-enumLabels: {used: Used, free: Free}
