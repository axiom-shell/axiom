label: Greeting
icon: waving_hand
group: Time & weather
defaultSize: [8, 2]
canvasDetail: text
hosts: [lockscreen, greeter]
settings:
  text:
    type: string
    title: Text
    default: ''
    description: '{name} is your display name, {user} your user name, {greeting} the time of day''s greeting. Empty greets you by name.'
  color: {type: string, title: Color, x-options: colors, default: base05}
  alignment:
    type: string
    title: Alignment
    x-control: toggle
    enum: [left, center, right]
    x-enumLabels: {left: Left, center: Centre, right: Right}
    default: center
  bold: {type: boolean, title: Bold, default: false}
  showPicture:
    type: boolean
    title: Picture
    default: false
    description: Your account picture before the text.
