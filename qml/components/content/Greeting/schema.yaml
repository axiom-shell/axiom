label: Greeting
icon: waving_hand
group: Time & weather
defaultSize: [8, 2]
canvasDetail: text
hosts: [lockscreen, greeter]
settings:
  text:
    type: string
    title: Text
    default: ''
    description: What it says. {name} is your display name, {user} your user name and {greeting} good morning, afternoon or evening. Empty says hey to your display name. On the login screen, the names are those of the user logging in.
  color: {type: string, title: Color, x-options: colors, default: base05}
  alignment:
    type: string
    title: Alignment
    enum: [left, center, right]
    x-enumLabels: {left: Left, center: Centre, right: Right}
    default: center
  bold: {type: boolean, title: Bold, default: false}
