label: Greeting
icon: waving_hand
group: Time & weather
defaultSize: [8, 2]
canvasDetail: text
hosts: [lockscreen, greeter]
order: [alignment, bold, text, showPicture, color]
settings:
  alignment: {$ref: '#/definitions/TextAlignment'}
  bold: {type: boolean, title: Bold, default: false}
  text:
    type: string
    title: Text
    default: ''
    description: "{name} display name, {user} user name, {greeting} time-of-day greeting, {date} today's date. Empty: greets by name."
  showPicture:
    type: boolean
    title: Picture
    default: false
    description: Account picture before the text.
  color: {$ref: '#/definitions/TextColor'}
