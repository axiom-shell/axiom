label: Greeting
icon: waving_hand
group: Time & weather
defaultSize: [8, 2]
canvasDetail: text
hosts: [lockscreen, greeter]
order: [alignment, bold, text, showPicture, color]
settings:
  alignment:
    type: string
    title: Alignment
    x-control: toggle
    enum: [left, center, right]
    x-enumLabels: {left: Left, center: Center, right: Right}
    default: center
  bold: {type: boolean, title: Bold, default: false}
  text:
    type: string
    title: Text
    default: ''
    description: '{name} display name, {user} user name, {greeting} time-of-day greeting. Empty: greets by name.'
  showPicture:
    type: boolean
    title: Picture
    default: false
    description: Account picture before the text.
  color: {type: string, title: Text color, x-options: colors, default: base05}
