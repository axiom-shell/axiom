label: Login
link: {setting: Greeter}
icon: login
group: Session
defaultSize: [6, 3]
required: true
hosts: {only: [greeter]}
settings:
  userField:
    type: string
    title: User
    enum: [list, typed]
    x-enumLabels: {list: 'Pick from a list, or type', typed: Type the name}
    default: list
    description: Typed shows no name until one is typed.
  showPicture:
    type: boolean
    title: Picture
    default: true
  placeholder:
    type: string
    title: Placeholder
    default: ''
    description: Empty says Enter password...
  centered: {type: boolean, title: Centre the text, default: true}
  showMessages:
    type: boolean
    title: Messages
    default: true
    description: Show login prompts, failures and errors under the field.
