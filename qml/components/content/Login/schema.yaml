label: Login
link: {setting: Greeter}
icon: login
group: Session
defaultSize: [6, 3]
required: true
hosts: {only: [greeter]}
order: [centered, userField, showPicture, placeholder, showMessages]
settings:
  centered: {type: boolean, title: Centered text, default: true}
  userField:
    type: string
    title: User
    x-control: toggle
    enum: [list, typed]
    x-enumLabels: {list: List, typed: Typed}
    default: list
    description: 'Typed: no name shown until one is typed.'
  showPicture:
    type: boolean
    title: Picture
    default: true
  placeholder:
    type: string
    title: Placeholder
    default: ''
    description: 'Empty: Enter password...'
  showMessages:
    type: boolean
    title: Messages
    default: true
    description: Prompts, failures and errors under the field.
