label: Markets
link: {setting: Markets}
icon: show_chart
group: Tools
defaultSize: [4, 6]
minSize: [2, 2]
canvasDetail: layout
hosts: [lockscreen]
order: [layout, showChart, range, symbols, showHoldings]
settings:
  layout:
    type: string
    title: Layout
    default: list
    x-control: toggle
    enum: [list, tiles, focus]
    x-enumLabels: {list: List, tiles: Tiles, focus: Chart}
  showChart:
    type: boolean
    title: Charts
    default: true
    description: Each symbol's line for the day.
    x-showIf: {layout: [list, tiles]}
  range:
    type: string
    title: Range
    default: 1d
    enum: [1d, 5d, 1mo, 6mo, 1y]
    x-enumLabels: {1d: Day, 5d: 5 days, 1mo: Month, 6mo: 6 months, 1y: Year}
    x-showIf: {layout: focus}
  symbols:
    # Ids from the user's watchlist: personal, as the watchlist is
    x-scope: personal
    type: array
    title: Symbols
    default: []
    description: 'Empty: the whole watchlist. Focus shows the first.'
    items: {type: string, x-options: marketSymbols}
  showHoldings:
    type: boolean
    title: Holdings
    default: false
    description: Holding values and the portfolio total.
    x-link: {setting: Markets.holdingsOnLockscreen}
