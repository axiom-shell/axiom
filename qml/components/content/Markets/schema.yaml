label: Markets
link: {setting: Markets}
icon: show_chart
group: Tools
defaultSize: [4, 6]
minSize: [2, 2]
canvasDetail: layout
hosts: [lockscreen]
settings:
  symbols:
    type: array
    title: Symbols
    default: []
    description: The watchlist's symbols it shows. None picked shows them all; focus shows the first.
    items: {type: string, x-options: marketSymbols}
  layout:
    type: string
    title: Layout
    default: list
    enum: [list, tiles, focus]
    x-enumLabels: {list: List, tiles: Tiles, focus: One large chart}
  showChart:
    type: boolean
    title: Day charts
    default: true
    description: Each symbol's line for the day.
    x-showIf: {layout: [list, tiles]}
  showHoldings:
    type: boolean
    title: Holdings
    default: false
    description: What each holding is worth and the portfolio's total. On the lock screen only with Markets' Holdings on the lock screen.
  range:
    type: string
    title: Chart range
    default: 1d
    enum: [1d, 5d, 1mo, 6mo, 1y]
    x-enumLabels: {1d: Day, 5d: 5 days, 1mo: Month, 6mo: 6 months, 1y: Year}
    x-showIf: {layout: focus}
