label: Markets
link: {setting: Markets}
icon: show_chart
group: Tools
defaultSize: [4, 6]
minSize: [2, 2]
canvasDetail: style
hosts: [lockscreen]
order: [style, value, sortBy, showChart, range, symbols, showHoldings]
settings:
  style:
    type: string
    title: Style
    default: auto
    description: 'Auto: by the card''s size.'
    x-control: toggle
    enum: [auto, list, tiles, focus]
    x-enumLabels: {auto: Auto, list: List, tiles: Tiles, focus: Chart}
  value:
    type: string
    title: Value
    x-showIf: {style: [auto, list, tiles]}
    default: pricePercent
    enum: [pricePercent, price, percent, change]
    x-enumLabels: {pricePercent: Price and change, price: Price, percent: Change (%), change: Change}
  sortBy:
    type: string
    title: Sort by
    default: watchlist
    enum: [watchlist, change]
    x-enumLabels: {watchlist: Watchlist, change: Change}
    x-showIf: {style: [auto, list, tiles]}
  showChart:
    type: boolean
    title: Charts
    default: true
    description: Each symbol's line for the day.
    x-showIf: {style: [auto, list, tiles]}
  range:
    type: string
    title: Range
    default: 1d
    enum: [1d, 5d, 1mo, 6mo, 1y]
    x-enumLabels: {1d: Day, 5d: 5 days, 1mo: Month, 6mo: 6 months, 1y: Year}
    x-showIf: {style: focus}
  symbols:
    # Ids from the user's watchlist: personal, as the watchlist is
    x-scope: personal
    type: array
    title: Symbols
    default: []
    description: 'Empty: the whole watchlist. Focus shows the first.'
    items: {type: string, x-options: marketSymbols}
  showHoldings:
    type: boolean
    title: Holdings
    default: false
    description: Holding values and the portfolio total.
    x-link: {setting: Markets.holdingsOnLockscreen}
