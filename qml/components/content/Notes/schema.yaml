label: Notes
icon: sticky_note_2
group: Tools
keyboard: true
defaultSize: [4, 8]
settings:
  note:
    x-scope: machine
    type: string
    title: Note
    default: ''
    x-options: notes
    description: 'Path in the notes folder, e.g. work/ideas.md. Empty: the last one shown.'
  lockNote:
    type: boolean
    title: Only this note
    default: false
    description: Hides the note list.
    x-showIf: {note: {not: ''}}
  showHeader:
    type: boolean
    title: Header
    default: true
    description: The note's name, note list and new note button.
  showToolbar:
    type: boolean
    title: Toolbar
    default: true
    description: Checklist and bullet buttons.
  showCompleted:
    type: boolean
    title: Completed items
    default: true
    description: Hidden items stay in the note.
