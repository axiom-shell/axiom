label: Password
link: {setting: Lockscreen}
icon: password
group: Session
defaultSize: [6, 1]
required: true
hosts: {only: [lockscreen]}
lockActions: [unlock]
settings:
  placeholder:
    type: string
    title: Placeholder
    default: ''
    description: Empty says Enter password...
  centered: {type: boolean, title: Centre the text, default: true}
  showMessages:
    type: boolean
    title: Messages
    default: true
    description: Show login prompts, failures and errors under the field.
