label: Quick actions
icon: toggle_on
group: Tools
defaultSize: [4, 2]
order: [style, labels, actions]
settings:
  style:
    type: string
    title: Style
    default: tiles
    x-control: toggle
    enum: [tiles, pills]
    x-enumLabels: {tiles: Tiles, pills: Pills}
    description: 'Pills: wide, with a status line beside the icon.'
  labels:
    type: string
    title: Names
    default: auto
    x-control: toggle
    enum: [auto, show, hide]
    x-enumLabels: {auto: Auto, show: Show, hide: Hide}
    description: 'Auto: only when every tile fits its name.'
  actions:
    type: array
    title: Actions
    default: [wifi, bluetooth, idleInhibit, toggleDnd, darkMode]
    description: Tiles that can't work here are hidden.
    x-ordered: true
    items:
      type: string
      # The tiles of its own open a module (Brightness's sliders, Volume's
      # mixer, the Theme and Wallpaper pickers) or pin its edge menu
      x-axiomActions: {noArgument: true, except: [clipboard, emoji, calculator, fileSearch], extra: [logout, brightness, volume, themePicker, wallpaperPicker, pin]}
      x-enumLabels:
        logout: Log out
        brightness: Brightness
        volume: Volume
        themePicker: Theme
        wallpaperPicker: Wallpaper
        pin: Pin open
      x-enumIcons:
        logout: logout
        brightness: brightness_medium
        volume: volume_up
        themePicker: palette
        wallpaperPicker: wallpaper
        pin: push_pin
      x-enumGroups:
        logout: System
        brightness: Tiles
        volume: Tiles
        themePicker: Tiles
        wallpaperPicker: Tiles
        pin: Tiles
