label: Quick actions
icon: toggle_on
group: Tools
defaultSize: [4, 2]
settings:
  actions:
    type: array
    title: Actions
    default: [wifi, bluetooth, idleInhibit, toggleDnd, darkMode]
    description: Any action a key can run that needs no argument, and a few tiles of their own, in the order shown. Tiles that can't work here are hidden. Log out, restart and shut down ask for a second click.
    x-ordered: true
    items:
      type: string
      # The tiles of its own open a module (Brightness's sliders, Volume's
      # mixer, the Theme and Wallpaper pickers) or pin its edge menu
      x-axiomActions: {noArgument: true, except: [clipboard, emoji, calculator], extra: [logout, brightness, volume, themePicker, wallpaperPicker, pin]}
      x-enumLabels:
        logout: Log out
        brightness: Brightness
        volume: Volume
        themePicker: Theme
        wallpaperPicker: Wallpaper
        pin: Pin open
      x-enumIcons:
        logout: logout
        brightness: brightness_medium
        volume: volume_up
        themePicker: palette
        wallpaperPicker: wallpaper
        pin: push_pin
      x-enumGroups:
        logout: System
        brightness: Tiles
        volume: Tiles
        themePicker: Tiles
        wallpaperPicker: Tiles
        pin: Tiles
  labels:
    type: string
    title: Names
    default: auto
    x-control: toggle
    enum: [auto, show, hide]
    x-enumLabels: {auto: Auto, show: Show, hide: Hide}
    description: Auto shows names only when every tile fits its name.
  style:
    type: string
    title: Style
    default: tiles
    x-control: toggle
    enum: [tiles, pills]
    x-enumLabels: {tiles: Tiles, pills: Pills}
    description: Pills are wide, with a status line beside the icon.
