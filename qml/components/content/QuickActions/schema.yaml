label: Quick actions
icon: toggle_on
group: Tools
defaultSize: [4, 2]
settings:
  actions:
    type: array
    title: Actions
    default: [wifi, bluetooth, caffeine, dnd, darkMode]
    description: Toggles, session actions and pin, in any mix. Night light only shows where axiom can warm the screens (or wlsunset is installed), power saver only when powerprofilesctl is, brightness only with a monitor axiom can set (a laptop backlight, or one ddcutil reaches over DDC/CI; a tap opens every monitor's sliders), and pin only in an edge menu. Log out, restart and shut down ask for a second click.
    items:
      type: string
      enum:
        - wifi
        - bluetooth
        - caffeine
        - dnd
        - darkMode
        - nightLight
        - powerSaver
        - brightness
        - lock
        - suspend
        - hibernate
        - logout
        - reboot
        - poweroff
        - pin
      x-enumLabels:
        wifi: Wi-Fi
        bluetooth: Bluetooth
        caffeine: Caffeine
        dnd: Do not disturb
        darkMode: Dark mode
        nightLight: Night light
        powerSaver: Power saver
        brightness: Brightness
        lock: Lock
        suspend: Suspend
        hibernate: Hibernate
        logout: Log out
        reboot: Reboot
        poweroff: Power off
        pin: Pin open
  labels:
    type: string
    title: Names
    default: auto
    x-control: toggle
    enum: [auto, show, hide]
    x-enumLabels: {auto: Auto, show: Show, hide: Hide}
    description: Auto shows the names only when every tile has room for its whole name.
  style:
    type: string
    title: Style
    default: tiles
    x-control: toggle
    enum: [tiles, pills]
    x-enumLabels: {tiles: Tiles, pills: Pills}
    description: "Pills are wide, with a status line beside the icon. Wi-Fi, Bluetooth and Do not disturb open their networks, devices or notifications over the menu or page: from beside a pill's icon, or a tile's right click or long press."
