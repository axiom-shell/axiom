label: Submenu
icon: menu_open
group: Look & layout
defaultSize: [4, 1]
minSize: [2, 1]
canvasDetail: label
hosts: {only: [edgeMenu]}
settings:
  menu:
    type: string
    title: Menu
    default: ''
    x-options: edgeMenus
    x-emptyLabel: None
    description: The menu that opens beside this one.
  label: {type: string, title: Label, default: '', description: Empty shows none.}
  icon:
    type: string
    title: Icon
    default: menu_open
    description: A Material Symbols name. Empty shows none.
  openOnHover:
    type: boolean
    title: Open on hover
    default: true
    description: Off, it opens on click.
