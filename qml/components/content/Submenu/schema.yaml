label: Submenu
icon: menu_open
group: Look & layout
defaultSize: [4, 1]
minSize: [2, 1]
canvasDetail: label
hosts: {only: [menu]}
settings:
  menu:
    type: string
    title: Menu
    default: ''
    x-options: menus
    x-emptyLabel: None
    description: The menu that opens beside this one.
  label: {type: string, title: Label, default: '', description: 'Empty: none.'}
  icon:
    type: string
    title: Icon
    x-control: icon
    default: menu_open
    description: 'Empty: none.'
  openOnHover:
    type: boolean
    title: Open on hover
    default: true
    description: 'Off: opens on click.'
