label: Workspaces
link: {setting: Workspaces}
icon: grid_view
group: Desktop
defaultSize: [4, 2]
settings:
  showEmpty: {type: boolean, title: Empty workspaces, default: true}
  monitor: {type: string, title: Monitor, default: '', x-options: screens, x-scope: machine, x-emptyLabel: Focused monitor}
  useNames: {type: boolean, title: Workspace names, default: false, description: The compositor's name where it says more than the number.}
  appIconsCount:
    type: string
    title: Icon count
    x-control: toggle
    enum: [apps, windows]
    x-enumLabels: {apps: Apps, windows: Windows}
    default: windows
    description: 'Apps: each app once. Windows: an icon per window.'
  appIconsMax:
    type: integer
    title: Icons per workspace
    default: 6
    minimum: 2
    maximum: 8
    x-control: stepper
