label: World clocks
icon: travel_explore
group: Time & weather
defaultSize: [4, 4]
settings:
  clocks:
    x-scope: personal
    type: array
    title: Places
    default:
      - {timezone: Europe/London, label: ''}
      - {timezone: America/New_York, label: ''}
      - {timezone: Asia/Tokyo, label: ''}
    items:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          title: Time zone
          x-options: timezones
          x-control: search
          default: UTC
        label:
          type: string
          title: Label
          default: ''
          description: 'Empty: the time zone''s city.'
  showLocal:
    type: boolean
    title: Local time
    default: true
    description: The system's time first.
  hourFormat:
    type: string
    title: Hour format
    x-control: toggle
    enum: [default, '12', '24']
    x-enumLabels: {default: Default, '12': 12h, '24': 24h}
    default: default
    x-link: {setting: DateTime.hourFormat}
  showTimeline:
    type: boolean
    title: Day band
    default: true
    description: A band of each place's day and night, when there's room.
