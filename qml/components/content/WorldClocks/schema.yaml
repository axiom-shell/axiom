label: World clocks
icon: travel_explore
group: Time & weather
defaultSize: [4, 4]
settings:
  clocks:
    x-scope: personal
    type: array
    title: Places
    default:
      - {timezone: Europe/London, label: ''}
      - {timezone: America/New_York, label: ''}
      - {timezone: Asia/Tokyo, label: ''}
    items:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          title: Time zone
          x-options: timezones
          x-control: search
          default: UTC
          description: e.g. Asia/Tokyo
        label:
          type: string
          title: Label
          default: ''
          description: Empty uses the time zone's city.
  showLocal:
    type: boolean
    title: Show the time here
    default: true
    description: The system's time first.
  hourFormat:
    type: string
    title: Clock
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
  showTimeline:
    type: boolean
    title: Show the day
    default: true
    description: A band showing each place's day and night, when there's room.
