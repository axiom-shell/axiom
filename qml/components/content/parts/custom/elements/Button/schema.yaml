label: Button
icon: smart_button
defaultSize: [3, 1]
slots: [label, icon, value, enabled]
actions: [click]
color: button
size: text
settings:
  confirm: {type: boolean, title: Ask first, default: false, description: 'The first press asks "Confirm?" for 3 seconds; the second runs it.'}
  disabled:
    type: string
    title: When off
    default: dim
    x-control: toggle
    enum: [dim, hide]
    x-enumLabels: {dim: Dimmed, hide: Hidden}
    description: 'When the script or the output turns the action off.'
