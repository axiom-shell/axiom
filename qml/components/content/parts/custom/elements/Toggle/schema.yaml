label: Toggle
icon: toggle_on
defaultSize: [5, 1]
slots: [state, label]
actions: ['on', 'off']
settings:
  look:
    type: string
    title: Style
    default: switch
    x-control: toggle
    enum: [switch, pill]
    x-enumLabels: {switch: Switch, pill: Pill}
  icon: {type: string, x-control: icon, title: Icon, default: toggle_on, x-showIf: {look: pill}}
  label: {type: string, title: Label, default: ''}
