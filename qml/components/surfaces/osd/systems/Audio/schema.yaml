label: Audio
icon: volume_up
group: Audio
tile:
  variant: standard
  tile: {title: Bars and icons, description: Its bars and its status icons in the OSD.}
card: standard
# Its bars (edited in the settings' Bars part, an OSD's tab named by
# them): each by its apps, else its kind; added there with no Audio in the
# list, it starts with no icons and no cards; one bar per kind but App.
# A bar's key (exposes, an OSD's barOrder) is its kind, the microphone's
# micLevel (its tile keeps microphone), an App bar's app:<its id>
barNames: {from: bars, by: type, named: apps, repeats: [app], keys: {microphone: micLevel}, barOnly: {shows: [], card: false}}
order: [tile, bars, card, shows, quiet]
settings:
  bars:
    type: array
    title: Bars
    description: 'In order, one bar per kind but App. Other apps: the first stream no App bar matches.'
    x-link: {setting: OSD.scrollToChange}
    default:
      - {id: other, type: other, icon: music_note}
      - {id: master, type: master}
    items:
      x-scopeIf: {when: {type: app}, scope: personal}
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {$ref: '#/definitions/ItemId'}
        type:
          type: string
          title: Kind
          enum: [master, other, app, microphone]
          x-enumLabels:
            master: System volume
            other: Other apps
            app: An app
            microphone: Microphone
          x-enumIcons:
            master: volume_up
            other: music_note
            app: apps
            microphone: mic
          default: app
        apps:
          x-scope: personal
          type: array
          items: {type: string}
          title: Apps
          default: []
          x-showIf: {type: app}
          x-suggestions: audioApps
          description: Matched against a stream's binary or name.
        icon:
          type: string
          x-control: icon
          title: Icon
          default: ''
          description: 'A Material Symbols name, or text. Empty: automatic.'
        showOsd:
          type: boolean
          title: Opens OSD
          default: true
          description: 'Off: shows only while the OSD is open.'
    x-showIf: {tile: true}
  shows:
    type: array
    title: Shows
    items: {type: string, enum: [audio, microphone]}
    x-enumLabels: {audio: Output, microphone: Input}
    x-enumIcons: {audio: volume_up, microphone: mic}
    default: [audio, microphone]
    description: The output and input devices, muted or switched.
    # Its cards are the devices switching: shown while either part is on
    x-showIf: {anyOf: [{tile: true}, {card: true}]}
