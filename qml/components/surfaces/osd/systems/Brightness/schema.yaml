label: Brightness
icon: brightness_6
group: Power
# It is one bar (its key brightness), named on an OSD's tab by its own
# label
barNames: {bar: brightness}
tile:
  variant: standard
  tile: {title: Bar, description: Its bar in the OSD.}
order: [tile, allMonitors, icon, quiet]
settings:
  allMonitors:
    type: boolean
    title: All monitors
    default: false
    description: Every monitor at once, not only the OSD's.
    x-showIf: {tile: true}
  icon:
    type: string
    x-control: icon
    title: Icon
    default: ''
    description: 'A Material Symbols name, or text. Empty: automatic.'
    x-showIf: {tile: true}
