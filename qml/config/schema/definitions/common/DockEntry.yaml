# The DockEntry definition (#/definitions/DockEntry).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name:
    type: string
    title: Name
    default: ''
    description: Shown on its tab here. Empty names it by its edge.
  enabled: {type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all, named]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
          named: These monitors
        x-link: {setting: General.screen}
  edge:
    type: string
    title: Screen edge
    default: bottom
    enum: [top, bottom, left, right]
  position:
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 'Where its centre sits: 0 is the start (left/top), 100 the end.'
  detached:
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf: {detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-showIf: {detached: true}
  visibility:
    type: string
    title: Visibility
    default: always
    enum: [always, hover, intellihide]
    x-enumLabels:
      always: Always shown
      hover: Show on hover
      intellihide: Hide when a window overlaps
    description: Show on hover slides it in when the pointer reaches the edge.
  reserveSpace:
    type: boolean
    title: Reserve space
    default: true
    # A layer surface reserves from its edge only: held further off, it
    # would reserve the screen up to its distance
    x-showIf: {visibility: always, anyOf: [{detached: false}, {distance: 0}]}
    description: Keep windows out of the dock's strip.
  timing:
    $ref: '#/definitions/Timing'
    x-showIf: {visibility: [hover, intellihide]}
    x-properties:
      openDelay:
        type: integer
        title: Open delay
        x-unit: ms
        default: 150
        minimum: 0
        maximum: 2000
      closeDelay:
        type: integer
        title: Close delay
        x-unit: ms
        default: 400
        minimum: 0
        maximum: 5000
  iconSize: {type: integer, title: Icon size, default: 48, minimum: 16, maximum: 128, x-unit: px}
  spacing:
    type: integer
    x-control: stepper
    title: Icon spacing
    default: 6
    minimum: 0
    maximum: 48
    x-unit: px
  padding:
    type: integer
    x-control: stepper
    title: Padding
    default: 8
    minimum: 0
    maximum: 48
    x-unit: px
    description: Space between the dock's box and its icons.
  magnify:
    type: object
    title: Magnify
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Magnify under the pointer
        default: false
        description: Grow the icons near the pointer.
      size:
        type: integer
        title: Magnified size
        default: 80
        minimum: 16
        maximum: 256
        x-unit: px
        x-showIf: {enabled: true}
        description: Size of the icon under the pointer.
      range:
        type: integer
        x-control: stepper
        title: Magnify range
        default: 3
        minimum: 1
        maximum: 8
        x-showIf: {enabled: true}
        description: How many icons on each side grow with it.
  running:
    type: object
    title: Running apps
    additionalProperties: false
    properties:
      show:
        type: boolean
        title: Show running apps
        default: true
        description: Also show unpinned apps with open windows, after the pinned ones.
      scope:
        type: string
        title: Windows counted
        default: all
        enum: [all, monitor, workspace]
        x-enumLabels:
          all: Every window
          monitor: Windows on this monitor
          workspace: Windows on this monitor's workspace
        description: Which windows make an app count as running.
      indicator:
        type: string
        title: Running indicator
        default: dots
        enum: [dots, line, none]
        x-enumLabels: {dots: A dot per window (up to 3), line: A line, none: None}
      separator:
        type: boolean
        title: Separator
        default: true
        description: A line between pinned and other running apps.
        x-showIf: {show: true}
  showLabels:
    type: boolean
    title: Names on hover
    default: true
    description: Show an app's name when hovered.
  backgroundColor: {type: string, title: Background, x-options: colors, default: base00}
  borderColor: {type: string, title: Border, x-options: colors, default: base05}
  pinnedOwn:
    type: boolean
    title: Own pinned apps
    x-settings: false
    default: false
    description: Use its own pinned apps instead of the shared list.
  pinned:
    x-scope: personal
    type: array
    title: Pinned apps
    x-settings: false
    default: []
    items: {type: string}
    description: Desktop entry ids, in order.
required: [id]
