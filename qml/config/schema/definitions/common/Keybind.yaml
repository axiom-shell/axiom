# The Keybind definition (#/definitions/Keybind).

x-scopeIf:
  when: {action: [exec, raw]}
  scope: commands
type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  key:
    type: string
    title: Key
    default: ''
    description: 'Modifiers and key, joined by +: "SUPER + SHIFT + space". A modifier key alone ("Super_L") fires when tapped, on compositors that can bind one.'
  action:
    type: string
    title: Action
    enum:
      - launcher
      - launcherSearch
      - overlay
      - overlayPage
      - edgeMenu
      - dock
      - workspaceOverview
      - powerMenu
      - lock
      - toggleDnd
      - clearNotifications
      - idleInhibit
      - nightLight
      - nextWallpaper
      - randomWallpaper
      - monitorsIdentify
      - darkMode
      - wifi
      - bluetooth
      - vpn
      - workspaceStep
      - moveWindowStep
      - moveWindowStepSilent
      - workspaceNth
      - moveWindowNth
      - moveWindowNthSilent
      - scrollStep
      - focusDir
      - moveWindowDir
      - resizeWindow
      - closeWindow
      - fullscreen
      - toggleFloat
      - pin
      - centerWindow
      - toggleGroup
      - windowSwitcher
      - windowSwitcherReverse
      - mouseDrag
      - mouseResize
      - toggleSpecial
      - moveToSpecial
      - restartShell
      - volumeUp
      - volumeDown
      - toggleMute
      - toggleMicMute
      - brightnessUp
      - brightnessDown
      - mediaPlayPause
      - mediaNext
      - mediaPrevious
      - mediaStop
      - audioOutputNext
      - terminal
      - fileManager
      - browser
      - screenshot
      - screenRecord
      - clipboard
      - emoji
      - calculator
      - notes
      - calendar
      - calendarNewEvent
      - chat
      - chatNew
      - pomodoro
      - pomodoroSkip
      - pomodoroStop
      - stopwatch
      - stopwatchLap
      - stopwatchReset
      - timerStart
      - timerToggle
      - timerReset
      - exitSession
      - exec
      - pseudo
      - toggleSplit
      - stripSwapColumn
      - stripWider
      - stripNarrower
      - stripFit
      - stripConsume
      - stripCenter
      - raw
    x-enumLabels:
      launcher: App launcher
      launcherSearch: Launcher with text
      overlay: Overlay
      overlayPage: Overlay page
      edgeMenu: Edge menu
      dock: Dock
      workspaceOverview: Workspace overview
      powerMenu: Power menu
      lock: Lock
      toggleDnd: Do not disturb
      clearNotifications: Clear all notifications
      idleInhibit: Caffeine
      nightLight: Night light
      nextWallpaper: Next wallpaper
      randomWallpaper: Random wallpaper
      monitorsIdentify: Identify monitors
      darkMode: Dark mode
      wifi: Wi-Fi
      bluetooth: Bluetooth
      vpn: VPN on or off
      workspaceStep: Workspace in a direction
      moveWindowStep: Move window in a direction
      workspaceNth: Workspace by number
      moveWindowStepSilent: Send window in a direction
      moveWindowNth: Move window to number
      moveWindowNthSilent: Send window to number
      scrollStep: Scroll along the layout
      focusDir: Focus in a direction
      moveWindowDir: Move window within the workspace
      resizeWindow: Resize window
      closeWindow: Close window
      fullscreen: Fullscreen
      toggleFloat: Toggle floating
      pin: Pin window
      centerWindow: Center window
      toggleGroup: Toggle window group
      windowSwitcher: Switch windows
      windowSwitcherReverse: Switch windows backwards
      mouseDrag: Drag window with the mouse
      mouseResize: Resize window with the mouse
      toggleSpecial: Toggle special workspace
      moveToSpecial: Move window to special workspace
      restartShell: Restart axiom
      volumeUp: Volume up
      volumeDown: Volume down
      toggleMute: Toggle mute
      toggleMicMute: Toggle microphone
      brightnessUp: Brightness up
      brightnessDown: Brightness down
      mediaPlayPause: Play/Pause
      mediaNext: Next track
      mediaPrevious: Previous track
      mediaStop: Stop playback
      audioOutputNext: Switch audio output
      terminal: Terminal
      fileManager: File manager
      browser: Browser
      screenshot: Screenshot
      screenRecord: Screen recording
      clipboard: Clipboard history
      emoji: Emoji picker
      calculator: Calculator
      notes: Notes
      calendar: Calendar
      calendarNewEvent: New calendar event
      chat: Chat
      chatNew: New chat
      pomodoro: Pomodoro start or pause
      pomodoroSkip: Skip pomodoro phase
      pomodoroStop: Stop pomodoro
      stopwatch: Stopwatch start or pause
      stopwatchLap: Stopwatch lap
      stopwatchReset: Reset stopwatch
      timerStart: Start a timer
      timerToggle: Pause or resume timer
      timerReset: Reset timer
      exitSession: Log out
      exec: Run a command
      pseudo: Pseudotile window
      toggleSplit: Toggle split direction
      stripSwapColumn: Swap strip column
      stripWider: Widen strip column
      stripNarrower: Narrow strip column
      stripFit: Fit visible strip columns
      stripConsume: Join or leave a strip column
      stripCenter: Center strip column
      raw: Compositor command
    default: launcher
  argument:
    type: string
    title: Argument
    default: ''
    description: 'Search text, page, edge menu or dock id, direction, workspace number, special workspace name, resize step ("50 0"), screenshot kind (region, window or screen), timer length (10m, 1:30), command, or a compositor command in its own language (Hyprland: a dispatcher as Lua, hl.dsp.layout("swapsplit"); sway: a command, layout tabbed; niri: an action as its config writes it, focus-column-first).'
    x-showIf:
      action:
        - launcherSearch
        - overlayPage
        - edgeMenu
        - dock
        - workspaceStep
        - moveWindowStep
        - moveWindowStepSilent
        - workspaceNth
        - moveWindowNth
        - moveWindowNthSilent
        - scrollStep
        - focusDir
        - moveWindowDir
        - resizeWindow
        - toggleSpecial
        - moveToSpecial
        - screenshot
        - timerStart
        - exec
        - raw
  call:
    type: string
    title: Call
    default: toggle
    enum: [toggle, open, close]
    x-enumLabels: {toggle: Toggle, open: Open, close: Close}
    description: 'For actions that open and close or turn on and off something: whether the bind toggles it, only opens it or only closes it.'
    x-showIf:
      action:
        - launcher
        - overlay
        - edgeMenu
        - dock
        - workspaceOverview
        - powerMenu
        - idleInhibit
        - nightLight
        - darkMode
        - wifi
        - bluetooth
        - screenRecord
        - toggleMicMute
        - toggleDnd
  compositor:
    type: string
    title: Compositor
    enum: [hyprland, sway, niri]
    x-enumLabels: {hyprland: Hyprland, sway: Sway, niri: niri}
    default: hyprland
    description: 'The compositor the command is written for: the bind does nothing under another.'
    x-showIf: {action: raw}
  repeating: {type: boolean, title: Repeat while held, default: false}
  locked: {type: boolean, title: Works while locked, default: false}
  release: {type: boolean, title: On release, default: false}
  paused:
    type: boolean
    title: Paused
    default: false
    description: Kept in the list but not bound.
  description:
    type: string
    title: Description
    default: ''
    description: 'Label on the Keybinds page; empty uses the action''s name. The action picks the section unless you write "Section: Label".'
required: [id]
