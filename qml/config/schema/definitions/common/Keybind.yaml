# The Keybind definition (#/definitions/Keybind).

x-scopeIf:
  when: {action: [exec, raw]}
  scope: commands
type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  key:
    type: string
    title: Key
    default: ''
    description: Modifiers and key joined by +, e.g. SUPER + SHIFT + space. A modifier alone fires when tapped, where supported.
  action:
    type: string
    title: Action
    enum:
      - launcher
      - launcherSearch
      - overlay
      - overlayPage
      - edgeMenu
      - dock
      - bar
      - workspaceOverview
      - powerMenu
      - lock
      - suspend
      - hibernate
      - reboot
      - poweroff
      - toggleDnd
      - clearNotifications
      - idleInhibit
      - nightLight
      - nextWallpaper
      - randomWallpaper
      - monitorsIdentify
      - darkMode
      - theme
      - wifi
      - bluetooth
      - airplane
      - vpn
      - powerSaver
      - workspaceStep
      - moveWindowStep
      - moveWindowStepSilent
      - workspaceNth
      - moveWindowNth
      - moveWindowNthSilent
      - scrollStep
      - focusDir
      - moveWindowDir
      - resizeWindow
      - closeWindow
      - fullscreen
      - toggleFloat
      - pin
      - centerWindow
      - toggleGroup
      - windowSwitcher
      - windowSwitcherReverse
      - mouseDrag
      - mouseResize
      - toggleSpecial
      - moveToSpecial
      - restartShell
      - volumeUp
      - volumeDown
      - toggleMute
      - toggleMicMute
      - brightnessUp
      - brightnessDown
      - mediaPlayPause
      - mediaNext
      - mediaPrevious
      - mediaStop
      - audioOutputNext
      - inputSourceNext
      - inputSourcePrev
      - terminal
      - fileManager
      - browser
      - screenshot
      - screenRecord
      - clipboard
      - emoji
      - calculator
      - fileSearch
      - notes
      - calendar
      - calendarNewEvent
      - chat
      - chatNew
      - pomodoro
      - pomodoroSkip
      - pomodoroStop
      - stopwatch
      - stopwatchLap
      - stopwatchReset
      - timerStart
      - timerToggle
      - timerReset
      - exitSession
      - exec
      - pseudo
      - toggleSplit
      - stripSwapColumn
      - stripWider
      - stripNarrower
      - stripFit
      - stripConsume
      - stripCenter
      - raw
    x-enumLabels:
      launcher: App launcher
      launcherSearch: Launcher with text
      overlay: Overlay
      overlayPage: Overlay page
      edgeMenu: Edge menu
      dock: Dock
      bar: Auto-hiding bar
      workspaceOverview: Workspace overview
      powerMenu: Power menu
      lock: Lock
      suspend: Suspend
      hibernate: Hibernate
      reboot: Restart
      poweroff: Shut down
      toggleDnd: Do not disturb
      clearNotifications: Clear all notifications
      idleInhibit: Caffeine
      nightLight: Night light
      nextWallpaper: Next wallpaper
      randomWallpaper: Random wallpaper
      monitorsIdentify: Identify monitors
      darkMode: Dark mode
      theme: Theme
      wifi: Wi-Fi
      bluetooth: Bluetooth
      airplane: Airplane mode
      vpn: VPN on or off
      powerSaver: Power saver
      workspaceStep: Workspace in a direction
      moveWindowStep: Move window in a direction
      workspaceNth: Workspace by number
      moveWindowStepSilent: Send window in a direction
      moveWindowNth: Move window to number
      moveWindowNthSilent: Send window to number
      scrollStep: Scroll along the layout
      focusDir: Focus in a direction
      moveWindowDir: Move window within the workspace
      resizeWindow: Resize window
      closeWindow: Close window
      fullscreen: Fullscreen
      toggleFloat: Toggle floating
      pin: Pin window
      centerWindow: Center window
      toggleGroup: Toggle window group
      windowSwitcher: Switch windows
      windowSwitcherReverse: Switch windows backwards
      mouseDrag: Drag window with the mouse
      mouseResize: Resize window with the mouse
      toggleSpecial: Toggle special workspace
      moveToSpecial: Move window to special workspace
      restartShell: Restart axiom
      volumeUp: Volume up
      volumeDown: Volume down
      toggleMute: Toggle mute
      toggleMicMute: Toggle microphone
      brightnessUp: Brightness up
      brightnessDown: Brightness down
      mediaPlayPause: Play/Pause
      mediaNext: Next track
      mediaPrevious: Previous track
      mediaStop: Stop playback
      audioOutputNext: Switch audio output
      inputSourceNext: Next input source
      inputSourcePrev: Previous input source
      terminal: Terminal
      fileManager: File manager
      browser: Browser
      screenshot: Screenshot
      screenRecord: Screen recording
      clipboard: Clipboard history
      emoji: Emoji picker
      calculator: Calculator
      fileSearch: File search
      notes: Notes
      calendar: Calendar
      calendarNewEvent: New calendar event
      chat: Chat
      chatNew: New chat
      pomodoro: Pomodoro start or pause
      pomodoroSkip: Skip pomodoro phase
      pomodoroStop: Stop pomodoro
      stopwatch: Stopwatch start or pause
      stopwatchLap: Stopwatch lap
      stopwatchReset: Reset stopwatch
      timerStart: Start a timer
      timerToggle: Pause or resume timer
      timerReset: Reset timer
      exitSession: Log out
      exec: Run a command
      pseudo: Pseudotile window
      toggleSplit: Toggle split direction
      stripSwapColumn: Swap strip column
      stripWider: Widen strip column
      stripNarrower: Narrow strip column
      stripFit: Fit visible strip columns
      stripConsume: Join or leave a strip column
      stripCenter: Center strip column
      raw: Compositor command
    default: launcher
  argument:
    type: string
    title: Argument
    default: ''
    description: 'Depends on the action: search text, a page, menu or bar id, a direction, a workspace, a theme (or random), a command, or a compositor command in its own syntax.'
    x-showIf:
      action:
        - launcherSearch
        - overlayPage
        - edgeMenu
        - dock
        - bar
        - workspaceStep
        - moveWindowStep
        - moveWindowStepSilent
        - workspaceNth
        - moveWindowNth
        - moveWindowNthSilent
        - scrollStep
        - focusDir
        - moveWindowDir
        - resizeWindow
        - toggleSpecial
        - moveToSpecial
        - screenshot
        - theme
        - timerStart
        - exec
        - raw
  call:
    type: string
    title: Call
    default: toggle
    x-control: toggle
    enum: [toggle, open, close]
    x-enumLabels: {toggle: Toggle, open: Open, close: Close}
    description: Toggle it, only open it, or only close it.
    x-showIf:
      action:
        - launcher
        - overlay
        - edgeMenu
        - dock
        - bar
        - workspaceOverview
        - powerMenu
        - idleInhibit
        - nightLight
        - darkMode
        - wifi
        - bluetooth
        - airplane
        - powerSaver
        - screenRecord
        - toggleMicMute
        - toggleDnd
  compositor:
    type: string
    title: Compositor
    enum: [hyprland, sway, niri]
    x-enumLabels: {hyprland: Hyprland, sway: Sway, niri: niri}
    default: hyprland
    description: The bind does nothing under another compositor.
    x-showIf: {action: raw}
  repeating: {type: boolean, title: Repeat while held, default: false}
  locked: {type: boolean, title: Works while locked, default: false}
  release: {type: boolean, title: On release, default: false}
  paused:
    type: boolean
    title: Paused
    default: false
    description: Kept in the list but not bound.
  # Only when: every part set must hold for the bind to be bound
  # (BindConditions.holds, the daemon's render.BindHolds)
  whenCompositors:
    type: array
    title: Only under
    items: {type: string, enum: [hyprland, sway, niri]}
    x-enumLabels: {hyprland: Hyprland, sway: Sway, niri: niri}
    default: []
    description: Bound only under these compositors. None picked is every compositor.
  whenLayout:
    type: string
    title: Only with
    enum: ['', strips, tiling, grid, dynamic]
    x-enumLabels: {'': Any layout, strips: Strips, tiling: Tiling (no strips), grid: Grid workspaces, dynamic: Dynamic workspaces}
    default: ''
    description: Bound only with this workspace layout. Strip actions are bound only with strips whatever this says.
  whenMonitors:
    type: string
    title: Only while
    enum: ['', external, laptopOnly]
    x-enumLabels: {'': Any monitors, external: External monitor, laptopOnly: Laptop panel only}
    default: ''
    description: 'Bound only while an external monitor is connected, or while the laptop''s own panel is the only one.'
  description:
    type: string
    title: Description
    default: ''
    description: 'Label on the Keybinds page. Empty uses the action''s name. Write "Section: Label" to pick its section.'
required: [id]
