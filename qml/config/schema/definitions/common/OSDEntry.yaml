# The OSDEntry definition (#/definitions/OSDEntry).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name:
    type: string
    title: Name
    default: ''
    description: 'The tab''s name. Empty: what it shows.'
  enabled: {type: boolean, title: Enabled, default: true}
  screen:
    x-group: Placement
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all, named]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
          named: These monitors
        x-link: {setting: General.screen}
  edge:
    x-group: Placement
    type: string
    title: Screen edge
    default: bottom
    enum: [top, bottom, left, right]
  position:
    x-group: Placement
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-group: Placement
    type: boolean
    title: Detached
    default: false
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    x-group: Placement
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: '0: in line with your window border. 50: centered.'
    x-showIf: {detached: true}
  animation:
    x-group: Placement
    $ref: '#/definitions/DetachedAnimation'
    x-showIf: {detached: true}
  barLayout:
    type: object
    title: Bars
    description: For the systems that show bars.
    additionalProperties: false
    properties:
      orientation:
        type: string
        title: Orientation
        default: vertical
        x-control: toggle
        enum: [vertical, horizontal]
        description: 'Vertical: side by side. Horizontal: stacked rows.'
      alongEdge:
        type: boolean
        title: Line up along the edge
        default: false
        x-showIf:
          anyOf:
            - {../edge: [top, bottom], orientation: horizontal}
            - {../edge: [left, right], orientation: vertical}
        description: Bars end to end along the edge instead of stacked away from it.
      showPercent:
        type: boolean
        title: Percentages
        default: true
  systems:
    x-group: Content
    type: array
    title: Shows
    description: In order (icons and bars). A change to one opens the OSD, unless quiet.
    default:
      - {type: Audio}
      - {type: LockKeys}
      - {type: KeyboardLayout}
      - {type: Dnd}
      - {type: Caffeine}
      - {type: NightLight}
      - {type: Recording}
      - {type: Drives}
      - {type: Message}
    items: {$ref: '#/definitions/OSDSystem'}
  row:
    x-group: Content
    type: string
    title: Icons shown
    default: notable
    enum: [notable, all, changed]
    x-enumLabels:
      notable: What's unusual
      all: Every one picked
      changed: Only the one that changed
    description: 'What''s unusual: out-of-the-ordinary states, plus the one that changed.'
  cardsEnabled:
    x-group: Content
    type: boolean
    title: Cards
    default: true
    description: 'Off: statuses show as icons, the rest as notifications.'
  cardTimeout:
    x-group: Content
    type: integer
    title: Card timeout
    x-unit: ms
    default: 4000
    minimum: 1000
    maximum: 15000
    x-showIf: {cardsEnabled: true}
    description: How long a card stays out. Hovering keeps it out.
  barOrder:
    type: array
    title: Bar order
    x-settings: false
    default: []
    items: {type: string}
    description: 'Bar keys ("Audio/master"), set by dragging in the Bars part. Unnamed bars follow.'
  timeout:
    x-group: Timing and behaviour
    type: integer
    title: Timeout
    x-unit: ms
    default: 1000
    minimum: 250
    maximum: 10000
    description: How long the bars and status icons stay out after the last change.
  openOnHover:
    x-group: Timing and behaviour
    type: boolean
    title: Open on hover
    default: false
    description: Also open when the pointer touches its screen edge.
  holdStill:
    x-group: Timing and behaviour
    type: boolean
    title: Hold still under the mouse
    default: true
    description: While the pointer is on the OSD, nothing under it moves.
  openTogether:
    x-group: Timing and behaviour
    type: boolean
    title: Open together
    default: false
    description: A change to the bars or the status icons brings out both.
  iconsPlace:
    x-group: Timing and behaviour
    type: string
    title: Icon position
    default: outside
    x-control: toggle
    enum: [inside, outside]
    x-enumLabels: {inside: Inner, outside: Outer}
required: [id]
