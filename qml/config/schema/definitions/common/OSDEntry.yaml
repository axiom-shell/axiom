# The OSDEntry definition (#/definitions/OSDEntry).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name:
    type: string
    title: Name
    default: ''
    description: Shown on its tab here. Empty names it by what it shows.
  enabled: {type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all, named]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
          named: These monitors
        x-link: {setting: General.screen}
  edge:
    type: string
    title: Screen edge
    default: bottom
    enum: [top, bottom, left, right]
  position:
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    type: boolean
    title: Detach from edge
    default: false
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf: {detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-showIf: {detached: true}
  openOnHover:
    type: boolean
    title: Open on hover
    default: false
    description: Also open when the pointer touches its screen edge.
  timeout:
    type: integer
    title: Timeout
    x-unit: ms
    default: 1000
    minimum: 250
    maximum: 10000
    description: How long the bars and status icons stay out after the last change.
  openTogether:
    type: boolean
    title: Bars and status icons together
    default: false
    description: A change to either brings out both.
  iconsPlace:
    type: string
    title: Status icons
    default: outside
    x-control: toggle
    enum: [outside, inside]
    x-enumLabels:
      outside: Past the bars
      inside: By the edge
    description: Where the status icons go when shown with the bars.
  holdStill:
    type: boolean
    title: Hold still under the mouse
    default: true
    description: While the pointer is on the OSD, nothing under it moves.
  barLayout:
    type: object
    title: Bars
    description: How the levels are laid out, for the systems that show bars.
    additionalProperties: false
    properties:
      orientation:
        type: string
        title: Bar orientation
        default: vertical
        x-control: toggle
        enum: [vertical, horizontal]
        description: Vertical bars sit side by side; horizontal bars stack as rows.
      alongEdge:
        type: boolean
        title: Line up along the edge
        default: false
        x-showIf:
          anyOf:
            - {../edge: [top, bottom], orientation: horizontal}
            - {../edge: [left, right], orientation: vertical}
        description: Bars end to end along the edge instead of stacked away from it.
      showPercent:
        type: boolean
        title: Show percentages
        default: true
        description: Show each level as a percentage.
  row:
    type: string
    title: Icons shown
    default: notable
    enum: [notable, all, changed]
    x-enumLabels:
      notable: What's unusual
      all: Every one picked
      changed: Only the one that changed
    description: What's unusual shows only states out of the ordinary, plus the one that changed.
  cardsEnabled:
    type: boolean
    title: Show cards
    default: true
    description: Off, statuses show as icons, and the rest as notifications.
  cardTimeout:
    type: integer
    title: Card timeout
    x-unit: ms
    default: 4000
    minimum: 1000
    maximum: 15000
    x-showIf: {cardsEnabled: true}
    description: How long a card stays out. Hovering keeps it out.
  systems:
    type: array
    title: Shows
    description: What the OSD shows, in order (its icons' and its bars' order). A change to one opens the OSD, unless it's quiet.
    default:
      - {type: Audio}
      - {type: LockKeys}
      - {type: KeyboardLayout}
      - {type: Dnd}
      - {type: Caffeine}
      - {type: NightLight}
      - {type: Recording}
      - {type: Drives}
      - {type: Message}
    items: {$ref: '#/definitions/OSDSystem'}
  barOrder:
    type: array
    title: Bar order
    x-settings: false
    default: []
    items: {type: string}
    description: The bars' order, by key ("<System>/<its bar key>", e.g. Audio/master, Audio/app:<id>, Brightness/brightness), set by dragging them in the Bars part. Bars it doesn't name follow in their systems' order; empty, all do.
required: [id]
