# The CustomShowWhen definition (#/definitions/CustomShowWhen): when a custom
# widget element is shown (its Visible setting), read from the output
# (docs/dev/features/custom-widgets.md).

type: object
additionalProperties: false
default: {}
properties:
  test:
    type: string
    title: Show
    enum: [always, is, isNot, above, below, set, unset]
    default: always
    x-enumLabels: {always: Always, is: When it is, isNot: When it is not, above: When above, below: When below, set: When set, unset: When not set}
  key: {type: string, title: Key, default: '', description: 'Empty: what the element shows.'}
  value: {type: string, title: Value, default: ''}
