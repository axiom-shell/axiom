# The CustomWidget definition (#/definitions/CustomWidget): one custom JSON
# widget, a script drawn as a bar widget, its popout and a module
# (docs/dev/features/custom-widgets.md).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name: {type: string, title: Name, default: Custom widget, description: Its name in the widget and module libraries.}
  icon: {type: string, x-control: icon, title: Icon, default: widgets, description: 'A Material Symbols name, used when the script gives none.'}
  command:
    x-scope: commands
    type: string
    title: Command
    default: ''
    description: A script's path or a command line. Its output is the widget.
  mode:
    type: string
    title: Run mode
    enum: [poll, stream, once]
    default: poll
    x-enumLabels: {poll: Every interval, stream: Continuously (one sample a line), once: Once (then on refresh)}
  interval: {type: integer, title: Interval, x-unit: ms, default: 5000, minimum: 500, maximum: 86400000, x-showIf: {mode: poll}}
  output:
    type: string
    title: Output
    enum: [waybar, json, text]
    default: waybar
    x-enumLabels: {waybar: Waybar (JSON or text lines), json: JSON, text: Plain text}
  execIf:
    x-scope: commands
    type: string
    title: Run only if
    default: ''
    description: Command that must succeed first (Waybar's exec-if).
  refreshName:
    type: string
    title: Refresh name
    default: ''
    description: 'Empty: its id.'
  bar:
    $ref: '#/definitions/BarDisplay'
    x-order: [style, segments, width, colorText, icon, popout]
    x-properties:
      icon:
        type: string
        title: Icon
        x-control: toggle
        enum: [none, glyph, material]
        default: material
        x-enumLabels: {none: None, glyph: Inline, material: Icon}
        description: 'Inline: the format''s {icon}, drawn with the text.'
      popout: {type: boolean, title: Module on hover, default: true}
  tooltip:
    type: boolean
    title: Tooltip
    default: true
    description: Shown when hovering doesn't open the module.
  format: {type: string, title: Format, default: '{}', description: '{} is the text, {icon} the icon, plus {percentage}, {alt} or any output key.'}
  formatIcons:
    title: Format icons
    default: {}
    description: Shown as {icon} in the format. A list is picked by percentage, an object by alt.
  maxLength: {type: integer, title: Max length, default: 0, minimum: 0, maximum: 500, x-unit: chars, description: '0: no limit.'}
  escape: {type: boolean, title: Plain text, default: false, description: Show markup as typed instead of drawing it.}
  hideEmpty: {type: boolean, title: Hide when empty, default: true}
  actions:
    type: object
    additionalProperties: false
    description: Commands run on click and scroll. Never on the lock screen.
    properties:
      click: {x-scope: commands, type: string, title: Click command, default: ''}
      rightClick: {x-scope: commands, type: string, title: Right-click command, default: ''}
      middleClick: {x-scope: commands, type: string, title: Middle-click command, default: ''}
      scrollUp: {x-scope: commands, type: string, title: Scroll up command, default: ''}
      scrollDown: {x-scope: commands, type: string, title: Scroll down command, default: ''}
      refreshAfter: {type: boolean, title: Rerun after actions, default: true}
  states:
    type: object
    title: State colors
    default: {}
    additionalProperties: {type: string}
    description: A class or state → a theme color.
  module:
    type: object
    additionalProperties: false
    properties:
      size:
        type: array
        title: Design size
        description: In grid units (4 to a card).
        default: [4, 2]
        minItems: 2
        maxItems: 2
        items: {type: integer, minimum: 1, maximum: 8}
      lockscreen:
        type: boolean
        title: Lock screen
        default: false
        description: Runs while locked and shows to anyone at the screen.
      elements:
        type: array
        default: []
        items: {$ref: '#/definitions/CustomElement'}
required: [id]
