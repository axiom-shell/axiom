# The CustomWidget definition (#/definitions/CustomWidget): one custom JSON
# widget, a script drawn as a bar widget, its popout and a module
# (docs/dev/features/custom-widgets.md).

type: object
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name: {type: string, title: Name, default: Custom widget, description: Its name in the widget and module libraries.}
  icon: {type: string, x-control: icon, title: Icon, default: widgets, description: 'A Material Symbols name, used when the script gives none.'}
  command:
    x-scope: commands
    type: string
    title: Command
    default: ''
    description: A script's path or a command line. Its output is the widget.
  mode:
    type: string
    title: Run mode
    enum: [poll, stream, once]
    default: poll
    x-enumLabels: {poll: Every interval, stream: Continuously (one sample a line), once: Once (then on refresh)}
  interval: {type: integer, title: Interval, x-unit: ms, default: 5000, minimum: 500, maximum: 86400000, x-showIf: {mode: poll}}
  output:
    type: string
    title: Output
    enum: [waybar, json, text]
    default: waybar
    x-enumLabels: {waybar: Auto, json: Auto (JSON), text: Plain text}
  execIf:
    x-scope: commands
    type: string
    title: Run only if
    default: ''
    description: Command that must succeed first (Waybar's exec-if).
  refreshName:
    type: string
    title: Refresh name
    default: ''
    description: 'Empty: its id.'
  bar:
    $ref: '#/definitions/BarDisplay'
    x-order: [style, segments, width, icon, popout, run]
    x-properties:
      icon:
        type: string
        title: Icon
        x-control: toggle
        enum: [none, glyph, material]
        default: material
        x-enumLabels: {none: None, glyph: Inline, material: Icon}
        description: 'Inline: the format''s {icon}, drawn with the text.'
      popout: {type: boolean, title: Module on hover, default: true}
      run:
        type: object
        additionalProperties: false
        default: {}
        description: The action each click or scroll runs.
        properties:
          click: {$ref: '#/definitions/ActionId', title: Click}
          rightClick: {$ref: '#/definitions/ActionId', title: Right click}
          middleClick: {$ref: '#/definitions/ActionId', title: Middle click}
          scrollUp: {$ref: '#/definitions/ActionId', title: Scroll up}
          scrollDown: {$ref: '#/definitions/ActionId', title: Scroll down}
  tooltip:
    type: boolean
    title: Tooltip
    default: true
    description: Shown when hovering doesn't open the module.
  format: {type: string, title: Format, default: '{}', description: '{} is the text, {icon} the icon, plus {percentage}, {alt} or any output key.'}
  formatIcons:
    title: Format icons
    default: {}
    description: Shown as {icon} in the format. A list is picked by percentage, an object by alt.
  maxLength: {type: integer, title: Max length, default: 0, minimum: 0, maximum: 500, x-unit: chars, description: '0: no limit.'}
  escape: {type: boolean, title: Plain text, default: false, description: Show markup as typed instead of drawing it.}
  hideEmpty: {type: boolean, title: Hide when empty, default: true}
  actions:
    type: object
    additionalProperties: false
    description: What the widget can run. Elements and the bar pick one by its id. Never on the lock screen.
    properties:
      items:
        type: array
        default: []
        maxItems: 32
        items: {$ref: '#/definitions/CustomWidgetAction'}
      refreshAfter: {type: boolean, title: Rerun the script after an action, default: true}
  samples:
    type: object
    title: Samples
    default: {}
    x-settings: false
    additionalProperties: {type: object}
    description: 'A sample output per screen (a screen id, "" for none): what the editor previews it with.'
  states:
    type: object
    title: State colors
    default: {}
    additionalProperties: {type: string}
    description: A class or state → a theme color.
  module:
    type: object
    additionalProperties: false
    properties:
      size:
        type: array
        title: Design size
        description: In grid units (4 to a card).
        default: [4, 2]
        minItems: 2
        maxItems: 2
        items: {type: integer, minimum: 1, maximum: 8}
      lockscreen:
        type: boolean
        title: Lock screen
        default: false
        description: Runs while locked and shows to anyone at the screen.
      elements:
        type: array
        default: []
        description: Drawn under every screen.
        items: {$ref: '#/definitions/CustomElement'}
      views:
        type: array
        default: []
        description: Screens drawn over the base elements, the first whose condition holds.
        items:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {$ref: '#/definitions/ItemId'}
            name: {type: string, title: Name, default: ''}
            base: {type: boolean, title: Show the base elements, default: true}
            when:
              type: object
              additionalProperties: false
              properties:
                key: {type: string, title: Key, default: state, description: 'A key or path in the output; error: the failure.'}
                test:
                  type: string
                  title: Test
                  default: is
                  enum: [is, isNot, set, unset]
                  x-enumLabels: {is: Is one of, isNot: Is none of, set: Is set, unset: Is not set}
                values: {type: array, title: Values, default: [], items: {type: string}, x-showIf: {test: [is, isNot]}}
            elements:
              type: array
              default: []
              items: {$ref: '#/definitions/CustomElement'}
      font: {type: string, title: Font, default: '', description: 'Text elements'' font family when they set none.'}
required: [id]
