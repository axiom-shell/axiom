# The base every custom widget element's schema.yaml is expanded into
# (index.yaml's kinds): one piece of a custom widget's module, on its
# lattice of 4 sub-cells a grid unit (docs/dev/features/custom-widgets.md).

type: object
required: [type, id]
additionalProperties: false
x-settingsAt: /properties/options/properties
# Every kind's bindings: kinds.go merges this list in ahead of the kind's own; CustomWidgetsConfig.elementKinds lists them last
x-slots: [show, tone]
x-parts:
  color:
    # Graphics: the state's colour when the script gives one
    state:
      color:
        type: string
        title: Color
        x-options: colors
        default: ''
        x-emptyLabel: Auto
        description: 'Empty: the state''s color, else the accent.'
    # Text: the text colour, or the state's when asked
    text:
      color:
        type: string
        title: Text color
        x-options: colors
        default: ''
        x-emptyLabel: Auto

      stateColor:
        type: boolean
        title: Color by state
        default: false
        description: The state's colour, when the script gives one.
properties:
  type: {}
  id: {$ref: '#/definitions/ItemId'}
  name: {type: string, title: Name, default: '', description: 'Shown on the canvas. Empty: the kind.'}
  place:
    type: object
    additionalProperties: false
    description: In sub-cells from the top left (4 to a grid unit).
    properties:
      x: {type: integer, default: 0, minimum: 0}
      'y': {type: integer, default: 0, minimum: 0}
      w: {type: integer, default: 4, minimum: 1, maximum: 64}
      h: {type: integer, default: 4, minimum: 1, maximum: 64}
  bind:
    type: object
    default: {}
    additionalProperties: {type: string}
    description: 'Per field: typed text is shown as it is; {path} inserts a value from the output ({cpu}, {player.title}). Exactly one {path} passes the value itself (a list, a number). Empty: the output''s own key. show: hidden while false; tone: a word the definition''s states map to a colour.'
  options: {type: object, additionalProperties: false, properties: {}}
  run:
    type: object
    additionalProperties: false
    default: {}
    description: The widget action each trigger runs.
    properties:
      click: {$ref: '#/definitions/ActionId', title: On press}
      change: {$ref: '#/definitions/ActionId', title: On change}
      'on': {$ref: '#/definitions/ActionId', title: Turn on}
      'off': {$ref: '#/definitions/ActionId', title: Turn off}
      submit: {$ref: '#/definitions/ActionId', title: On Enter}
