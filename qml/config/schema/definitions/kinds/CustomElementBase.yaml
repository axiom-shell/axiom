# The base every custom widget element's schema.yaml is expanded into
# (index.yaml's kinds): one piece of a custom widget's module, on its
# lattice of 4 sub-cells a grid unit (docs/dev/features/custom-widgets.md).

type: object
required: [type, id]
additionalProperties: false
x-settingsAt: /properties/options/properties
x-parts:
  color:
    # Graphics: the state's colour when the script gives one
    state:
      color:
        type: string
        title: Color
        x-options: colors
        default: ''
        x-emptyLabel: Auto
        description: 'Empty: the state''s color, else the accent.'
    # Text: the text colour, or the state's when asked
    text:
      color:
        type: string
        title: Text color
        x-options: colors
        default: ''
        x-emptyLabel: Auto

      stateColor:
        type: boolean
        title: Color by state
        default: false
        description: The state's colour, when the script gives one.
properties:
  type: {}
  id: {$ref: '#/definitions/ItemId'}
  place:
    type: object
    additionalProperties: false
    description: In sub-cells from the top left (4 to a grid unit).
    properties:
      x: {type: integer, default: 0, minimum: 0}
      'y': {type: integer, default: 0, minimum: 0}
      w: {type: integer, default: 4, minimum: 1, maximum: 64}
      h: {type: integer, default: 4, minimum: 1, maximum: 64}
  bind:
    type: object
    default: {}
    additionalProperties: {type: string}
    description: 'Per slot: a key, a path (data.temp), a format ({text}%) or a number. Empty: the output''s own key.'
  options: {type: object, additionalProperties: false, properties: {}}
  actions:
    type: object
    additionalProperties: false
    description: Commands it runs; {value} is filled in.
    properties:
      click: {x-scope: commands, type: string, title: Click command, default: '', description: '{value}: the label, or the row''s text.'}
      change: {x-scope: commands, type: string, title: Change command, default: '', description: '{value} is the new value.'}
      'on': {x-scope: commands, type: string, title: Turn-on command, default: ''}
      'off': {x-scope: commands, type: string, title: Turn-off command, default: ''}
