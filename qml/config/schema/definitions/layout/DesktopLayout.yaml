# The DesktopLayout definition (#/definitions/DesktopLayout).

$ref: '#/definitions/Layout'
description: Overlay modules on a grid fitted to each monitor.
x-properties:
  id: {$ref: '#/definitions/ItemId'}
  enabled:
    type: boolean
    x-settings: false
    default: true
    description: Off on a monitor's own layout leaves its desktop empty.
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        x-control: toggle
        enum: [all, primary, named]
        default: primary
        x-enumLabels: {primary: Primary, all: All, named: Named}
        x-link: {setting: General.screen}
      names:
        x-scope: machine
        x-monitorRef: drop
        type: array
        title: Monitors
        default: []
        items: {type: string, x-options: screens}
        x-showIf: {mode: named}
  grid: {$ref: '#/definitions/ScreenGrid'}
