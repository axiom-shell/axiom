# The EdgeMenu definition (#/definitions/EdgeMenu).

type: object
required: [id]
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name: {x-group: General, type: string, title: Name, default: ''}
  enabled: {x-group: General, type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    x-group: General
    title: Monitor
    description: Empty uses the primary monitor.
    x-showIf: {placement: {not: free}}
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [primary, named]
        default: primary
        x-enumLabels: {primary: Primary monitor, named: These monitors}
        x-link: {setting: General.screen}
  open:
    type: object
    title: Opening
    additionalProperties: false
    properties:
      onHover:
        x-group: Opening
        type: boolean
        title: Open on hover
        default: false
        description: Open when the pointer rests on the screen edge.
      delay:
        x-group: Opening
        type: integer
        title: Open delay
        default: 10
        minimum: 0
        maximum: 2000
        x-unit: ms
        x-showIf: {onHover: true}
    x-showIf: {placement: {not: free}}
  edge:
    x-group: Placement
    type: string
    title: Edge
    default: left
    enum: [top, bottom, left, right]
    x-showIf: {placement: {not: free}}
  placement:
    x-group: Placement
    type: string
    title: Placement
    default: edge
    enum: [edge, strip, free]
    x-enumLabels: {edge: Edge, strip: Strip, free: Free}
    description: Edge opens over windows from its edge. Strip pushes the bars and windows inwards. Free has no edge, and opens beside an edge menu from its Submenu module.
  offset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    description: Grid cells from centred along its edge. Set on the layouts editor's grid.
  gridOffset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    x-unit: px
    description: Shifts the menu's grid along its edge (px). Set on the layouts editor's grid.
  length:
    x-group: Placement
    type: string
    title: Length
    default: content
    x-control: toggle
    enum: [content, edge]
    x-enumLabels: {content: Fit its modules, edge: Whole edge}
    description: Whole edge stretches the menu along its edge.
    x-showIf: {placement: edge}
  popoutAtWidget:
    x-group: Placement
    type: boolean
    title: Popout at its widget
    default: false
    description: Opened as a bar widget's popout, it opens at that widget.
    x-showIf: {placement: edge, length: content}
  layout:
    $ref: '#/definitions/Layout'
    x-properties:
      grid: {$ref: '#/definitions/Grid', x-group: Placement}
      moduleScale:
        x-link: {setting: Interface.cardSize}
        x-group: Placement
        type: integer
        x-control: stepper
        title: Module size
        default: 100
        minimum: 50
        maximum: 200
        x-unit: '%'
        description: Relative to the card size in Look & Feel.
      moduleBorders:
        x-group: Style
        type: boolean
        title: Module borders
        default: true
        description: Draw each module's card box.
  detached:
    x-group: Placement
    type: boolean
    title: Detach from edge
    default: false
    description: A separate box held off the edge, instead of growing out of it.
    x-showIf: {placement: edge}
  distance:
    x-group: Placement
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf: {placement: edge, detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-group: Placement
    x-showIf: {placement: edge, detached: true}
  frame:
    x-group: Style
    type: boolean
    title: Frame
    default: true
    description: A rounded box along the whole edge around the modules.
    x-showIf: {placement: strip}
  pinButton:
    x-group: Style
    type: boolean
    title: Pin button
    default: false
    description: A pinned menu stays open until unpinned.
    x-showIf: {placement: {not: free}}
  backgroundColor:
    x-group: Style
    type: string
    title: Background
    x-options: colors
    default: base00
    x-showIf: {placement: {not: free}}
  borderColor:
    x-group: Style
    type: string
    title: Border
    x-options: colors
    default: base05
    x-showIf: {placement: {not: free}}
  close:
    type: object
    title: Closing
    additionalProperties: false
    properties:
      onLeave:
        x-group: Closing
        type: boolean
        title: Close when the pointer leaves
        default: true
        description: A pinned menu stays open.
        x-showIf: {../placement: {not: free}}
      delay:
        x-group: Closing
        type: integer
        title: Close delay
        default: 250
        minimum: 0
        maximum: 5000
        x-unit: ms
        x-showIf: {../placement: {not: free}, onLeave: true}
      onOutsideClick:
        x-group: Closing
        type: boolean
        title: Close on outside click
        default: false
        x-showIf: {../placement: edge}
