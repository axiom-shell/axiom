# The Layout definition (#/definitions/Layout).

type: object
description: A grid of modules.
additionalProperties: false
properties:
  grid: {$ref: '#/definitions/Grid', x-group: Grid}
  moduleScale:
    x-link: {setting: Interface.cardSize}
    x-group: Grid
    type: integer
    x-control: stepper
    title: Module size
    default: 100
    minimum: 50
    maximum: 200
    x-unit: '%'
    description: Relative to the card size in Look & Feel.
  moduleBorders:
    x-group: Style
    type: boolean
    title: Module borders
    default: false
    description: 'Off: modules sit on the wallpaper.'
  modules:
    type: array
    default: []
    x-settings: false
    items: {$ref: '#/definitions/OverlayModule'}
