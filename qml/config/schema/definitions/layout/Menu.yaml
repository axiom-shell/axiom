# The Menu definition (#/definitions/Menu): one menu of the Menus section.

type: object
required: [id]
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name: {x-group: General, type: string, title: Name, default: ''}
  enabled: {x-group: General, type: boolean, title: Enabled, default: true}
  placement:
    x-group: Placement
    type: string
    title: Placement
    default: edge
    enum: [edge, strip, free]
    x-control: toggle
    x-enumLabels: {edge: Edge, strip: Strip, free: Free}
    description: 'Edge: over windows. Strip: pushes bars and windows in. Free: floats, no edge.'
  edge:
    x-group: Placement
    type: string
    title: Screen edge
    default: left
    enum: [top, bottom, left, right]
    x-showIf: {placement: {not: free}}
  freeAnchor:
    type: object
    title: Opens at
    additionalProperties: false
    x-showIf: {placement: free}
    properties:
      at:
        x-group: Placement
        type: string
        title: Opens at
        default: centre
        enum: [centre, cursor, point]
        x-control: toggle
        x-enumLabels: {centre: Center, cursor: Cursor, point: Point}
        x-enumShowIf: {cursor: {/$supports.cursorPos: true}}
        description: Bind or script opens it here; a bar widget's opens at the widget.
      x:
        x-group: Placement
        type: integer
        title: Across
        default: 50
        minimum: 0
        maximum: 100
        x-unit: '%'
        description: Its centre, from the screen's left edge.
        x-showIf: {at: point}
      'y':
        x-group: Placement
        type: integer
        title: Down
        default: 50
        minimum: 0
        maximum: 100
        x-unit: '%'
        description: Its centre, from the screen's top edge.
        x-showIf: {at: point}
        x-beside: true
  screen:
    $ref: '#/definitions/ScreenTarget'
    x-group: General
    title: Monitors
    description: A free menu opened by a bar widget uses that widget's monitor.
    x-showIf:
      anyOf:
        - {placement: {not: free}}
        - {freeAnchor.at: {not: cursor}}
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [primary, named]
        default: primary
        x-enumLabels: {primary: Primary monitor, named: These monitors}
        x-link: {setting: General.screen}
  length:
    x-group: Placement
    type: string
    title: Length
    default: content
    x-control: toggle
    enum: [content, edge]
    x-enumLabels: {content: Fit, edge: Full}
    x-showIf: {placement: edge}
  popoutAtWidget:
    x-group: Placement
    type: boolean
    title: At its widget
    default: false
    description: Opened as a bar widget's popout, it opens centered on that widget.
    x-showIf: {placement: edge, length: content}
  background:
    x-group: Placement
    type: string
    title: Box
    default: panel
    enum: [panel, none]
    x-control: toggle
    x-enumLabels: {panel: Panel, none: None}
    description: 'None: cards float as tiles. An edge menu is then held off its edge.'
    x-showIf: {placement: [edge, free]}
  detached:
    x-group: Placement
    type: boolean
    title: Detached
    default: false
    description: A separate box held off the edge, instead of growing out of it.
    x-showIf: {placement: edge, background: panel}
  distance:
    x-group: Placement
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: '0: at the window border. 50: centered.'
    x-showIf:
      anyOf:
        - {placement: edge, detached: true}
        - {placement: edge, background: none}
  layout:
    $ref: '#/definitions/Layout'
    x-properties:
      grid: {$ref: '#/definitions/Grid', x-group: Size}
      moduleScale:
        x-link: {setting: Interface.cardSize}
        x-group: Size
        type: integer
        title: Module size
        default: 100
        minimum: 50
        maximum: 200
        x-unit: '%'
        description: Relative to the card size in Look & Feel.
      moduleBorders:
        x-group: Look
        type: boolean
        title: Module borders
        default: true
        description: Draw each module's card box.
  offset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    description: Grid cells from centered along its edge.
  gridOffset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    x-unit: px
    description: Grid shift along its edge.
  open:
    type: object
    title: Opening
    additionalProperties: false
    properties:
      onHover:
        x-group: Behaviour
        type: boolean
        title: Open on hover
        default: false
        description: At the screen edge.
        x-showIf: {../placement: {not: free}}
  pinButton:
    x-group: Behaviour
    type: boolean
    title: Pin button
    default: false
    description: A pinned menu stays open until unpinned.
  closeButton:
    x-group: Behaviour
    type: boolean
    title: Close button
    default: false
    description: Closes the menu, unpinning it if it's pinned.
  popOutButton:
    x-group: Behaviour
    type: boolean
    title: Pop-out button
    default: false
    description: Lifts the open menu off its edge, staying open like a pinned one.
    x-showIf: {placement: edge}
  draggable:
    x-group: Behaviour
    type: boolean
    title: Draggable
    default: true
    description: Drag it by the top. A free menu reopens there until you log out.
    x-showIf:
      anyOf:
        - {placement: free}
        - {placement: edge, popOutButton: true}
  close:
    type: object
    title: Closing
    additionalProperties: false
    properties:
      onLeave:
        x-group: Closing
        type: boolean
        title: Close on leave
        default: true
        description: A pinned menu stays open.
      delay:
        x-group: Closing
        type: integer
        title: Close delay
        default: 250
        minimum: 0
        maximum: 5000
        x-unit: ms
        x-showIf: {onLeave: true}
      onOutsideClick:
        x-group: Closing
        type: boolean
        title: Close on outside click
        default: false
        description: Holds the keyboard while open, so windows behind can't be typed in.
        x-showIf: {../placement: [edge, free]}
  animation:
    x-group: Motion
    type: string
    title: Animation
    default: slide
    enum: [slide, fade, scale]
    x-control: toggle
    x-enumLabels: {slide: Slide, fade: Fade, scale: Scale}
    x-enumShowIf: {scale: {placement: free}}
    x-showIf:
      anyOf:
        - {placement: free}
        - {placement: edge, detached: true}
        - {placement: edge, background: none}
  frame:
    x-group: Look
    type: boolean
    title: Frame
    default: true
    description: A rounded box along the whole edge around the modules.
    x-showIf: {placement: strip}
  backgroundColor:
    x-group: Look
    type: string
    title: Background color
    x-options: colors
    default: base00
    description: The menu's box, or with Box set to None, the tile under each card.
  borderColor:
    x-group: Look
    type: string
    title: Border color
    x-options: colors
    default: base05
    x-showIf:
      anyOf:
        - {placement: strip}
        - {background: panel}
