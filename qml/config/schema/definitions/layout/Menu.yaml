# The Menu definition (#/definitions/Menu): one menu of the Menus section.

type: object
required: [id]
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  name: {x-group: General, type: string, title: Name, default: ''}
  enabled: {x-group: General, type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    x-group: General
    title: Monitor
    description: Empty uses the primary monitor. A free menu opened by a bar widget opens on that widget's monitor.
    x-showIf:
      anyOf:
        - {placement: {not: free}}
        - {freeAnchor.at: {not: cursor}}
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [primary, named]
        default: primary
        x-enumLabels: {primary: Primary monitor, named: These monitors}
        x-link: {setting: General.screen}
  open:
    type: object
    title: Opening
    additionalProperties: false
    properties:
      onHover:
        x-group: Opening
        type: boolean
        title: Open on hover
        default: false
        description: Open when the pointer rests on the screen edge.
        x-showIf: {../placement: {not: free}}
  edge:
    x-group: Placement
    type: string
    title: Edge
    default: left
    enum: [top, bottom, left, right]
    x-showIf: {placement: {not: free}}
  placement:
    x-group: Placement
    type: string
    title: Placement
    default: edge
    enum: [edge, strip, free]
    x-enumLabels: {edge: Edge, strip: Strip, free: Free}
    description: Edge opens over windows from its edge. Strip pushes the bars and windows inwards. Free has no edge, and opens where it's asked for, at the bar widget that opens it, or beside a menu from its Submenu module.
  freeAnchor:
    type: object
    title: Opens at
    additionalProperties: false
    x-showIf: {placement: free}
    properties:
      at:
        x-group: Placement
        type: string
        title: Opens at
        default: centre
        enum: [centre, cursor, point]
        x-control: tiles
        x-enumLabels: {centre: Centre, cursor: Cursor, point: A point}
        x-enumShowIf: {cursor: {/$supports.cursorPos: true}}
        x-tileHint: {cursor: Your compositor can't say where the cursor is.}
        description: Where a bind or a script opens it. Opened by a bar widget, it opens at that widget. Cursor opens on the monitor the cursor is on.
      x:
        x-group: Placement
        type: integer
        title: Across
        default: 50
        minimum: 0
        maximum: 100
        x-unit: '%'
        description: Its centre, from the screen's left edge.
        x-showIf: {at: point}
      'y':
        x-group: Placement
        type: integer
        title: Down
        default: 50
        minimum: 0
        maximum: 100
        x-unit: '%'
        description: Its centre, from the screen's top edge.
        x-showIf: {at: point}
        x-beside: true
  freeAnimation:
    x-group: Placement
    type: string
    title: Animation
    default: fade
    enum: [fade, scale, slide]
    x-control: toggle
    x-enumLabels: {fade: Fade, scale: Scale, slide: Slide}
    description: Slide comes in from the bar widget that opened it, or from the nearest screen edge.
    x-showIf: {placement: free}
  offset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    description: Grid cells from centred along its edge. Set on the layouts editor's grid.
  gridOffset:
    x-settings: false
    type: integer
    default: 0
    minimum: -200
    maximum: 200
    x-unit: px
    description: Shifts the menu's grid along its edge (px). Set on the layouts editor's grid.
  length:
    x-group: Placement
    type: string
    title: Length
    default: content
    x-control: toggle
    enum: [content, edge]
    x-enumLabels: {content: Fit its modules, edge: Whole edge}
    description: Whole edge stretches the menu along its edge.
    x-showIf: {placement: edge}
  popoutAtWidget:
    x-group: Placement
    type: boolean
    title: Popout at its widget
    default: false
    description: Opened as a bar widget's popout, it opens at that widget. For a menu meant mainly as a widget's popout, set Placement to Free instead.
    x-showIf: {placement: edge, length: content}
  layout:
    $ref: '#/definitions/Layout'
    x-properties:
      grid: {$ref: '#/definitions/Grid', x-group: Placement}
      moduleScale:
        x-link: {setting: Interface.cardSize}
        x-group: Placement
        type: integer
        x-control: stepper
        title: Module size
        default: 100
        minimum: 50
        maximum: 200
        x-unit: '%'
        description: Relative to the card size in Look & Feel.
      moduleBorders:
        x-group: Style
        type: boolean
        title: Module borders
        default: true
        description: Draw each module's card box.
  detached:
    x-group: Placement
    type: boolean
    title: Detach from edge
    default: false
    description: A separate box held off the edge, instead of growing out of it.
    x-showIf: {placement: edge, background: panel}
  distance:
    x-group: Placement
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf:
      anyOf:
        - {placement: edge, detached: true}
        - {placement: edge, background: none}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-group: Placement
    x-showIf:
      anyOf:
        - {placement: edge, detached: true}
        - {placement: edge, background: none}
  frame:
    x-group: Style
    type: boolean
    title: Frame
    default: true
    description: A rounded box along the whole edge around the modules.
    x-showIf: {placement: strip}
  pinButton:
    x-group: Behaviour
    type: boolean
    title: Pin button
    default: false
    description: A pinned menu stays open until unpinned.
  closeButton:
    x-group: Behaviour
    type: boolean
    title: Close button
    default: false
    description: Closes the menu, unpinning it if it's pinned.
    x-showIf: {placement: free}
  popOutButton:
    x-group: Behaviour
    type: boolean
    title: Pop-out button
    default: false
    description: Lifts the open menu off its edge where it is, staying open like a pinned one. Closed, it's back on its edge.
    x-showIf: {placement: edge}
  draggable:
    x-group: Behaviour
    type: boolean
    title: Draggable
    default: true
    description: Drag it by its top to move it. A free menu then opens there again when a bind or a script opens it, until you log out.
    x-showIf:
      anyOf:
        - {placement: free}
        - {placement: edge, popOutButton: true}
  background:
    x-group: Style
    type: string
    title: Box
    default: panel
    enum: [panel, none]
    x-control: toggle
    x-enumLabels: {panel: Panel, none: None}
    description: None leaves out the menu's box, so its cards float as tiles of their own. An edge menu is then held off its edge.
    x-showIf: {placement: [edge, free]}
  backgroundColor:
    x-group: Style
    type: string
    title: Background
    x-options: colors
    default: base00
    description: The menu's box, or with Box set to None, the tile under each card.
  borderColor:
    x-group: Style
    type: string
    title: Border
    x-options: colors
    default: base05
    x-showIf:
      anyOf:
        - {placement: strip}
        - {background: panel}
  close:
    type: object
    title: Closing
    additionalProperties: false
    properties:
      onLeave:
        x-group: Closing
        type: boolean
        title: Close when the pointer leaves
        default: true
        description: A pinned menu stays open.
      delay:
        x-group: Closing
        type: integer
        title: Close delay
        default: 250
        minimum: 0
        maximum: 5000
        x-unit: ms
        x-showIf: {onLeave: true}
      onOutsideClick:
        x-group: Closing
        type: boolean
        title: Close on outside click
        default: false
        x-showIf: {../placement: [edge, free]}
