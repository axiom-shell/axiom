# The PopoutSizing definition (#/definitions/PopoutSizing): a bar widget's own
# popout's ContentSizing, which says how to size its box and content apart.

x-inline: true
$ref: '#/definitions/ContentSizing'
x-properties:
  contentSize:
    x-link: {setting: Interface.contentSize}
    type: integer
    x-control: stepper
    x-auto: {value: null, start: 100}
    title: Content size
    default: null
    minimum: 50
    maximum: 200
    x-unit: '%'
    description: Relative to the Content size in Look & Feel. Auto follows it. The whole popout zooms with it. For separate box and content sizes, use a menu.
