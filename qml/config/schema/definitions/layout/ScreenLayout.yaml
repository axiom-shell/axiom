# The ScreenLayout definition (#/definitions/ScreenLayout).

$ref: '#/definitions/Layout'
description: 'Overlay modules on a grid fitted to each monitor: the lock screen and greeter.'
x-properties:
  grid: {$ref: '#/definitions/ScreenGrid', x-group: Grid}
  moduleBorders:
    x-group: Style
    type: boolean
    title: Module borders
    default: true
    description: Draw each module's card box. The password field and greeting have their own switches.
  otherScreens:
    x-group: Grid
    type: string
    title: Other monitors
    enum: [layout, background]
    x-enumLabels: {layout: 'The same modules, without the password', background: The background only}
    default: layout
    description: What monitors without the password field show.
  backdrop:
    type: object
    title: Backdrop
    additionalProperties: false
    properties:
      source:
        x-group: Background
        type: string
        title: Background
        x-control: toggle
        enum: [wallpaper, color]
        x-enumLabels: {wallpaper: Wallpaper, color: Color}
        default: wallpaper
      blur:
        x-group: Background
        type: boolean
        title: Blur wallpaper
        default: true
        x-showIf: {source: wallpaper}
      color:
        x-group: Background
        type: string
        title: Color
        x-options: colors
        default: base00
        x-showIf: {source: color}
      dim:
        x-group: Background
        type: integer
        title: Dim
        default: 40
        minimum: 0
        maximum: 100
        x-unit: '%'
        x-control: slider
        description: Darken the background so modules stand out.
  borders:
    type: object
    title: Borders
    additionalProperties: false
    properties:
      password:
        x-group: Style
        type: boolean
        title: Password field border
        default: false
      greeting:
        x-group: Style
        type: boolean
        title: Greeting border
        default: false
