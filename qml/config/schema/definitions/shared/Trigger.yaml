# The Trigger definition (#/definitions/Trigger).

x-inline: true
type: object
title: Hover trigger
description: The strip along the screen edge that opens it when the pointer reaches it.
additionalProperties: false
properties:
  size:
    type: integer
    x-control: stepper
    title: Trigger size
    x-unit: px
    default: 5
    minimum: 1
    maximum: 50
    description: How far from the screen edge the pointer opens it.
  length:
    type: integer
    title: Trigger length
    x-unit: px
    default: 0
    minimum: 0
    maximum: 4000
    x-emptyLabel: Its own length
    description: 'How long the strip along the edge is (0: as long as it is).'
