# The Bar definition (#/definitions/Bar). Its defaults are the default bar's
# (Bars.items), which sets only what differs.

type: object
required: [id]
additionalProperties: false
properties:
  id: {$ref: '#/definitions/ItemId'}
  enabled: {x-group: Placement, type: boolean, title: Enabled, default: true}
  screen:
    $ref: '#/definitions/ScreenTarget'
    x-group: Placement
    title: Monitor
    description: Every monitor puts a copy on each.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [primary, all, named]
        default: primary
        x-enumLabels: {primary: Primary monitor, all: Every monitor, named: These monitors}
        x-link: {setting: General.screen}
  edge:
    x-group: Placement
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
    description: Bars can share an edge, stacked one inside the other.
  thickness:
    x-group: Size
    type: integer
    x-control: stepper
    title: Thickness
    default: 26
    minimum: 10
    maximum: 150
    x-unit: px
    description: How thick the widgets are; text and icons scale with it.
  edgePadding:
    x-group: Size
    type: integer
    x-control: stepper
    title: Edge padding
    default: 4
    minimum: 0
    maximum: 50
    x-unit: px
    description: Space between the widgets and the bar's ends.
  widgetGap:
    x-group: Size
    type: integer
    x-control: stepper
    title: Widget gap
    default: 4
    minimum: 0
    maximum: 50
    x-unit: px
    description: Pills this close or closer join into one.
  innerPadding:
    x-group: Size
    type: integer
    x-control: stepper
    title: Inner padding
    default: 10
    minimum: 0
    maximum: 40
    x-unit: px
    description: Space inside each widget at 26 px thickness; scales with it.
  innerGap:
    x-group: Size
    type: integer
    x-control: stepper
    title: Inner gap
    default: 4
    minimum: 0
    maximum: 20
    x-unit: px
    description: Gap between items in a widget at 26 px thickness; scales with it.
  surface:
    x-group: Surface
    type: string
    title: Surface
    default: pills
    enum: [bar, pills, none]
    x-enumLabels: {bar: One bar, pills: A pill per group, none: None (widgets on the wallpaper)}
    description: What the widgets sit on.
  floating:
    x-group: Surface
    type: boolean
    title: Floating
    default: false
    x-showIf: {surface: {not: none}}
    description: Hold the bar away from the screen border, as windows are.
  floatingGap:
    x-link: {setting: WindowLook.gaps.outer}
    x-group: Surface
    type: integer
    x-control: stepper
    x-auto: {value: null, start: 8}
    title: Floating gap
    default: null
    minimum: 0
    maximum: 60
    x-unit: px
    x-showIf: {floating: true, surface: {not: none}}
    description: Distance from the screen border. Auto uses the compositor's gap.
  lockCenter:
    x-group: Behaviour
    type: boolean
    title: Lock center
    default: true
    description: Keep the center section centered; the other sections shrink instead.
  autoHide:
    x-group: Behaviour
    type: string
    title: Auto-hide
    default: never
    enum: [never, always, whenCovered]
    x-enumLabels: {never: Never, always: Always, whenCovered: When a window covers it}
    description: Hide until the pointer reaches its edge.
  reserveSpace:
    x-group: Behaviour
    type: boolean
    title: Reserve space
    default: true
    x-showIf: {autoHide: never}
    description: Keep windows from tiling under the bar.
  revealOnWorkspace:
    x-group: Behaviour
    type: boolean
    title: Show on workspace change
    default: true
    x-showIf: {autoHide: {not: never}}
    description: Show the hidden bar briefly on workspace change.
  revealOnActivity:
    x-group: Behaviour
    type: boolean
    title: Show on activity
    default: true
    x-beside: true
    x-showIf: {autoHide: {not: never}}
    description: Show the hidden bar briefly when a widget has news.
  revealFor:
    x-group: Behaviour
    type: integer
    title: Shown for
    default: 1500
    minimum: 250
    maximum: 10000
    x-unit: ms
    x-showIf: {autoHide: {not: never}}
  timing:
    $ref: '#/definitions/Timing'
    x-group: Behaviour
    x-showIf: {autoHide: {not: never}}
    x-properties:
      openDelay:
        type: integer
        title: Open delay
        x-unit: ms
        default: 150
        minimum: 0
        maximum: 2000
      closeDelay:
        type: integer
        title: Close delay
        x-unit: ms
        default: 400
        minimum: 0
        maximum: 5000
  style: {$ref: '#/definitions/BarStyle', x-inherit: Bars.style, title: Widget style}
  widgets:
    type: object
    additionalProperties: false
    properties:
      left: {type: array, default: [], items: {$ref: '#/definitions/BarWidget'}}
      center: {type: array, default: [], items: {$ref: '#/definitions/BarWidget'}}
      right: {type: array, default: [], items: {$ref: '#/definitions/BarWidget'}}
