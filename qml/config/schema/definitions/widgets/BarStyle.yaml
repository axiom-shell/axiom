# The BarStyle definition (#/definitions/BarStyle).

type: object
x-links: [BarEditor]
description: How every bar draws its widgets. A bar can override any of these in the bar editor.
additionalProperties: false
properties:
  textScale:
    x-group: Size
    type: integer
    x-control: stepper
    title: Text size
    default: 100
    minimum: 50
    maximum: 200
    x-unit: '%'
    description: Relative to the font size at 26 px thickness; scales with thickness.
  widgetRadius:
    x-group: Size
    type: integer
    x-control: stepper
    title: Widget corner radius
    default: null
    minimum: 0
    maximum: 50
    x-unit: px
    x-inherit: Interface.radius
  widgetStyle:
    x-group: Look
    type: string
    x-control: tiles
    title: Widget style
    default: filled
    enum: [filled, tinted, outline, split, underline, accentText, plain]
    x-enumLabels:
      filled: Filled
      tinted: Tinted
      outline: Outline
      split: Split
      underline: Underline
      accentText: Colored icons
      plain: Plain text
    description: How each widget shows its color.
  splitIcon:
    x-group: Look
    type: string
    title: Icon part
    default: joined
    x-control: tiles
    enum: [joined, badge]
    x-enumLabels: {joined: Joined, badge: Badge}
    x-showIf: {widgetStyle: split}
    description: 'Joined: one box cut in two. Badge: a small shape behind the icon, the label on the bar.'
    x-tileHint: Only the Split style sets its icon apart
  splitLabelFill:
    x-group: Look
    type: string
    title: Label background
    default: tint
    x-control: toggle
    enum: [tint, color, none]
    x-enumLabels: {tint: Tint, color: Color, none: None}
    x-showIf: {widgetStyle: split, splitIcon: joined, widgetGrouping: {not: merged}}
    description: 'Tint: the widget''s color, faded. None: the bar shows through.'
  tintOpacity:
    x-group: Look
    type: integer
    x-control: slider
    title: Tint strength
    default: 20
    minimum: 5
    maximum: 100
    x-unit: '%'
    x-showIf:
      anyOf:
        - {widgetStyle: tinted}
        - {widgetStyle: split, splitIcon: joined, splitLabelFill: tint, widgetGrouping: {not: merged}}
        - {widgetStyle: split, widgetGrouping: merged, gradient: true}
  splitLabelColor:
    x-group: Look
    type: string
    title: Label color
    x-options: colors
    default: backgroundAlt
    x-showIf: {widgetStyle: split, splitIcon: joined, splitLabelFill: color, widgetGrouping: {not: merged}}
  splitDivider:
    x-group: Look
    type: string
    x-control: tiles
    title: Divider
    default: match
    enum: [match, straight, slant, arrow, curve]
    x-enumLabels: {match: Match the shape, straight: Straight, slant: Slanted, arrow: Arrow, curve: Curve}
    x-showIf: {widgetStyle: split, splitIcon: joined}
    description: Where the icon's part meets the label's. Match is slanted or an arrow for those shapes, else straight.
    x-tileHint: Only a joined Split box is cut in two
  outlineWidth:
    x-group: Look
    type: integer
    x-control: stepper
    title: Outline width
    default: 2
    minimum: 1
    maximum: 6
    x-unit: px
    x-showIf: {widgetStyle: outline}
  outlineStroke:
    x-group: Look
    type: string
    title: Outline stroke
    default: solid
    enum: [solid, dashed, dotted, double, ends]
    x-enumLabels: {solid: Solid, dashed: Dashed, dotted: Dotted, double: Double, ends: Ends only}
    x-beside: true
    x-showIf: {widgetStyle: outline}
    description: 'Double: two lines, each the outline width. Ends only: a mark at each end, in the widget shape.'
  hoverFill:
    x-group: Look
    type: boolean
    title: Fill on hover
    default: false
    x-showIf: {widgetStyle: [tinted, outline]}
    description: A widget under the pointer fills with its color.
  lineWidth:
    x-group: Look
    type: integer
    x-control: stepper
    title: Line width
    default: 2
    minimum: 1
    maximum: 8
    x-unit: px
    x-showIf: {widgetStyle: underline}
  lineSide:
    x-group: Look
    type: string
    title: Line side
    default: inner
    enum: [inner, outer]
    x-enumLabels: {inner: Toward the windows, outer: Toward the screen edge}
    x-beside: true
    x-showIf: {widgetStyle: underline}
  widgetShape:
    x-group: Look
    type: string
    x-control: tiles
    title: Shape
    default: rounded
    enum: [rounded, capsule, slant, arrow, tab]
    x-enumLabels: {rounded: Rounded, capsule: Capsule, slant: Slanted, arrow: Arrow, tab: Tab}
    x-showIf: {widgetStyle: [filled, tinted, outline, split]}
    x-enumShowIf:
      tab:
        anyOf:
          - {widgetStyle: {not: split}}
          - {splitIcon: joined}
          - {widgetGrouping: merged}
    description: Rounded follows the corner radius. Capsule always has round ends. Tab reaches out to the bar's outer edge.
    x-tileHint:
      '*': This style draws no box to shape
      tab: A badge on its own has no box to hang from the edge
  widgetGrouping:
    x-group: Look
    type: string
    x-control: tiles
    title: Grouping
    default: separate
    enum: [separate, merged, powerline]
    x-enumLabels: {separate: Separate, merged: Merged, powerline: Powerline}
    x-beside: true
    x-showIf: {widgetStyle: [filled, tinted, outline, split]}
    x-enumShowIf:
      powerline:
        widgetShape: {not: tab}
        anyOf:
          - {widgetStyle: {not: split}}
          - {splitIcon: joined}
    description: 'Merged: neighbours share one background. Powerline: each runs into the next.'
    x-tileHint:
      '*': This style draws no box to group
      powerline: Tabs hang from the edge and a badge has no box, so neither can chain
  tabCorners:
    x-group: Look
    type: string
    title: Tab sides
    default: square
    x-control: tiles
    enum: [square, flared]
    x-enumLabels: {square: Square, flared: Flared}
    x-showIf: {widgetStyle: [filled, tinted, outline, split], widgetShape: tab}
    description: Where a tab meets the edge it hangs from. Flared curves out into it, by at most half the gap between widgets.
    x-link: {page: 'BarEditor:widgetGap'}
    x-tileHint: Only tabs meet the edge they hang from
  widgetEnds:
    x-group: Look
    type: string
    title: Ends
    default: shaped
    x-control: tiles
    enum: [shaped, pointed, rounded]
    x-enumLabels: {shaped: Shaped, pointed: Pointed, rounded: Rounded}
    x-showIf:
      widgetStyle: [filled, tinted, outline, split]
      widgetShape: [slant, arrow]
      anyOf:
        - {widgetStyle: {not: split}}
        - {splitIcon: joined}
        - {widgetGrouping: merged}
    x-enumShowIf: {pointed: {widgetShape: arrow}}
    description: The ends of a slanted or arrow widget, or a run of them.
    x-tileHint:
      '*': Only a slanted or arrow box, or a run of them, has shaped ends
      pointed: Only an arrow comes to a point
  groupColor:
    x-group: Colors
    type: string
    title: Merged background
    x-options: colors
    default: backgroundAlt
    x-showIf: {widgetStyle: [filled, tinted, split], widgetGrouping: merged, gradient: false}
    description: Widget colors show on their icons instead.
  groupStrokeColor:
    x-group: Colors
    type: string
    title: Merged outline
    x-options: colors
    default: accent
    x-showIf: {widgetStyle: outline, widgetGrouping: merged, gradient: false}
    description: The line round each merged run. Widget colors show on their icons instead.
  widgetTextColor:
    x-group: Colors
    type: string
    title: Text color
    x-options: colors
    x-emptyLabel: Auto
    default: ''
    description: One color for every widget's text and icons. Auto picks one per widget.
  gradient:
    x-group: Colors
    type: boolean
    title: Gradient
    default: false
    x-showIf: {widgetStyle: {not: plain}}
    description: One gradient along the whole bar, each widget showing its part. It takes the place of Auto widget colors; a color set on a widget, and state colors, stay.
  gradientFrom:
    x-group: Colors
    type: string
    title: From
    x-options: colors
    default: accent
    x-showIf: {widgetStyle: {not: plain}, gradient: true}
  gradientTo:
    x-group: Colors
    type: string
    title: To
    x-options: colors
    default: accentAlt
    x-beside: true
    x-showIf: {widgetStyle: {not: plain}, gradient: true}
  gradientVia:
    x-group: Colors
    type: string
    title: Through
    x-options: colors
    x-emptyLabel: None
    default: ''
    x-showIf: {widgetStyle: {not: plain}, gradient: true}
    description: A color it passes through halfway along the bar.
  separatorStyle:
    x-group: Accents
    type: string
    x-control: tiles
    title: Separators
    default: none
    enum: [none, line, dot, slash, chevron]
    x-enumLabels: {none: None, line: Line, dot: Dot, slash: Slash, chevron: Chevron}
    description: Drawn between neighbouring widgets.
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
        - {widgetShape: tab}
    x-tileHint: A powerline's widgets touch, leaving no gap to divide
  separatorColor:
    x-group: Accents
    type: string
    title: Separator color
    x-options: colors
    default: base03
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
        - {widgetShape: tab}
      separatorStyle: {not: none}
  separatorThickness:
    x-group: Accents
    type: integer
    x-control: stepper
    title: Separator thickness
    default: 2
    minimum: 1
    maximum: 6
    x-unit: px
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
        - {widgetShape: tab}
      separatorStyle: {not: none}
  separatorGap:
    x-group: Accents
    type: integer
    x-control: stepper
    title: Separator margin
    default: 2
    minimum: 0
    maximum: 24
    x-unit: px
    description: Space between a separator and the widgets beside it.
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
        - {widgetShape: tab}
      separatorStyle: {not: none}
  accentLine:
    x-group: Accents
    type: string
    title: Accent line
    default: none
    x-control: toggle
    enum: [none, inner, outer]
    x-enumLabels: {none: None, inner: Inner edge, outer: Outer edge}
    description: A line along the bar's inner or outer edge.
  accentLineColor:
    x-group: Accents
    type: string
    title: Line color
    x-options: colors
    default: accent
    x-showIf: {accentLine: {not: none}}
  accentLineFade:
    x-group: Accents
    type: string
    title: Fade to
    x-options: colors
    x-emptyLabel: None
    default: ''
    x-beside: true
    x-showIf: {accentLine: {not: none}}
    description: Fades the line into this color along the bar.
  accentLineWidth:
    x-group: Accents
    type: integer
    x-control: stepper
    title: Line width
    default: 2
    minimum: 1
    maximum: 8
    x-unit: px
    x-showIf: {accentLine: {not: none}}
  shadow:
    $ref: '#/definitions/Shadow'
    x-group: Shadow
    x-properties:
      enabled:
        x-group: Shadow
        type: boolean
        title: Shadow
        default: false
        description: Around every bar, the screen border, popouts, menus and docks.
      color:
        x-group: Shadow
        type: string
        title: Shadow color
        x-options: colors
        x-emptyLabel: Auto
        default: ''
        x-showIf: {enabled: true}
        description: "Auto: the theme's accent."
      size:
        x-group: Shadow
        type: integer
        x-control: stepper
        title: Shadow size
        default: 12
        minimum: 2
        maximum: 64
        x-unit: px
        x-beside: true
        x-showIf: {enabled: true}
title: Widget style
