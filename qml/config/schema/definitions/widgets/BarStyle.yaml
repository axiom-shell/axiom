# The BarStyle definition (#/definitions/BarStyle).

type: object
x-links: [BarEditor]
description: How every bar draws its widgets, accents and shadow. A bar can take its own of any of these in the bar editor.
additionalProperties: false
properties:
  fontSize:
    x-group: Bar widgets
    type: integer
    x-control: stepper
    title: Font size
    default: null
    minimum: 8
    maximum: 32
    x-unit: px
    x-inherit: Appearance.font.size
  widgetRadius:
    x-group: Bar widgets
    type: integer
    x-control: stepper
    title: Widget corner radius
    default: null
    minimum: 0
    maximum: 50
    x-unit: px
    x-inherit: Interface.radius
  widgetStyle:
    x-group: Bar widgets
    type: string
    title: Widget style
    default: filled
    enum: [filled, tinted, outline, underline, accentText, plain]
    x-enumLabels:
      filled: Filled
      tinted: Tinted
      outline: Outline
      underline: Underline
      accentText: Colored icons
      plain: Plain text
    description: 'How each widget shows its color: as its background, a faint tint, an outline, a line beside it, or on its icon. Plain text draws them straight onto the bar.'
  tintOpacity:
    x-group: Bar widgets
    type: integer
    x-control: slider
    title: Tint strength
    default: 20
    minimum: 5
    maximum: 100
    x-unit: '%'
    x-showIf: {widgetStyle: tinted}
  outlineWidth:
    x-group: Bar widgets
    type: integer
    x-control: stepper
    title: Outline width
    default: 2
    minimum: 1
    maximum: 6
    x-unit: px
    x-showIf: {widgetStyle: outline}
  lineWidth:
    x-group: Bar widgets
    type: integer
    x-control: stepper
    title: Line width
    default: 2
    minimum: 1
    maximum: 8
    x-unit: px
    x-showIf: {widgetStyle: underline}
  lineSide:
    x-group: Bar widgets
    type: string
    title: Line side
    default: inner
    enum: [inner, outer]
    x-enumLabels: {inner: Toward the windows, outer: Toward the screen edge}
    x-beside: true
    x-showIf: {widgetStyle: underline}
  widgetShape:
    x-group: Bar widgets
    type: string
    title: Shape
    default: rounded
    enum: [rounded, capsule, slant, arrow]
    x-enumLabels: {rounded: Rounded, capsule: Capsule, slant: Slanted, arrow: Arrow}
    x-showIf: {widgetStyle: [filled, tinted, outline]}
    description: Rounded follows the widget corner radius. Capsule always gives fully round pill ends, whatever the radius. Slanted and arrow widgets take a little more room for their points.
  widgetGrouping:
    x-group: Bar widgets
    type: string
    title: Grouping
    default: separate
    enum: [separate, merged, powerline]
    x-enumLabels: {separate: Separate, merged: Merged, powerline: Powerline}
    x-beside: true
    x-showIf: {widgetStyle: [filled, tinted, outline]}
    description: "Merged: neighbouring widgets share one background. Powerline: each widget's shape runs into the next."
  widgetEnds:
    x-group: Bar widgets
    type: string
    title: Ends
    default: shaped
    enum: [shaped, pointed, rounded]
    x-enumLabels: {shaped: Shaped, pointed: Pointed, rounded: Rounded}
    x-showIf: {widgetStyle: [filled, tinted, outline], widgetShape: [slant, arrow]}
    x-enumShowIf: {pointed: {widgetShape: arrow}}
    description: 'The ends of a slanted or arrow widget, or of a run of them: as shaped, rounded, or (arrows) pointed at both.'
  groupColor:
    x-group: Bar widgets
    type: string
    title: Merged background
    x-options: colors
    default: backgroundAlt
    x-showIf: {widgetStyle: [filled, tinted, outline], widgetGrouping: merged}
    description: Widget colors show on their icons instead.
  widgetTextColor:
    x-group: Bar widgets
    type: string
    title: Text color
    x-options: colors
    x-emptyLabel: Auto
    default: ''
    description: "One color for every widget's text and icons. Auto: each widget's own on a filled background, its color when tinted or outlined, else one that contrasts with the bar."
  separatorStyle:
    x-group: Bar accents
    type: string
    title: Separators
    default: none
    enum: [none, line, dot, slash, chevron]
    x-enumLabels: {none: None, line: Line, dot: Dot, slash: Slash, chevron: Chevron}
    description: Drawn in the gap between neighbouring widgets in a section (not in a powerline). Give them room with Spacing.
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
  separatorColor:
    x-group: Bar accents
    type: string
    title: Separator color
    x-options: colors
    default: base03
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
      separatorStyle: {not: none}
  separatorThickness:
    x-group: Bar accents
    type: integer
    x-control: stepper
    title: Separator thickness
    default: 2
    minimum: 1
    maximum: 6
    x-unit: px
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
      separatorStyle: {not: none}
  separatorGap:
    x-group: Bar accents
    type: integer
    x-control: stepper
    title: Separator margin
    default: 2
    minimum: 0
    maximum: 24
    x-unit: px
    description: Room between a separator and the widgets on either side of it.
    x-showIf:
      anyOf:
        - {widgetGrouping: {not: powerline}}
        - {widgetStyle: [underline, accentText, plain]}
      separatorStyle: {not: none}
  accentLine:
    x-group: Bar accents
    type: string
    title: Accent line
    default: none
    enum: [none, inner, outer]
    x-enumLabels: {none: None, inner: Inner edge, outer: Outer edge}
    description: A line along the bar's edge toward the windows (inner) or the screen edge (outer); on pills, along each pill.
  accentLineColor:
    x-group: Bar accents
    type: string
    title: Line color
    x-options: colors
    default: accent
    x-showIf: {accentLine: {not: none}}
  accentLineFade:
    x-group: Bar accents
    type: string
    title: Fade to
    x-options: colors
    x-emptyLabel: None
    default: ''
    x-beside: true
    x-showIf: {accentLine: {not: none}}
    description: Runs the line from its color into this one along the bar.
  accentLineWidth:
    x-group: Bar accents
    type: integer
    x-control: stepper
    title: Line width
    default: 2
    minimum: 1
    maximum: 8
    x-unit: px
    x-showIf: {accentLine: {not: none}}
  shadow:
    $ref: '#/definitions/Shadow'
    x-group: Surface shadow
    x-properties:
      enabled:
        x-group: Surface shadow
        type: boolean
        title: Shadow
        default: false
        description: Spread evenly round every bar (or its pills), the screen border, popouts, menus and docks. A transparent bar has nothing to cast one; a solid bar on the border leaves it to the border.
      color:
        x-group: Surface shadow
        type: string
        title: Shadow color
        x-options: colors
        x-emptyLabel: Auto
        default: ''
        x-showIf: {enabled: true}
        description: "Auto: the theme's accent."
      size:
        x-group: Surface shadow
        type: integer
        x-control: stepper
        title: Shadow size
        default: 12
        minimum: 2
        maximum: 64
        x-unit: px
        x-beside: true
        x-showIf: {enabled: true}
title: Widget style
