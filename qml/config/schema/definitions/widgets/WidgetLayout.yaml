# The WidgetLayout definition (#/definitions/WidgetLayout).

type: object
title: Sizing
description: Overrides for how much room a bar widget takes. Only shrinking widgets take a minimum and maximum.
additionalProperties: false
properties:
  priority:
    type: integer
    x-control: stepper
    title: Priority
    minimum: -100
    maximum: 100
    description: Lower priorities hide first when the bar is crowded.
  minSize:
    type: integer
    title: Minimum size
    minimum: 0
    maximum: 2000
    x-unit: px
    description: Smallest length when the bar is crowded (px).
  maxSize:
    type: integer
    title: Maximum size
    minimum: 0
    maximum: 2000
    x-unit: px
    description: Most length along the bar (px).
