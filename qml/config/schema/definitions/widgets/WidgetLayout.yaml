# The WidgetLayout definition (#/definitions/WidgetLayout).

type: object
title: Sizing
description: Overrides for how much room a bar widget takes. Anything left out uses the widget's own sizing; only a widget that shrinks when crowded (Window title, Media) takes a minimum and maximum.
additionalProperties: false
properties:
  priority:
    type: integer
    x-control: stepper
    title: Priority
    minimum: -100
    maximum: 100
    description: "When the bar can't fit its widgets, lower priorities are hidden first: higher ones stay longest."
  minSize:
    type: integer
    title: Minimum size
    minimum: 0
    maximum: 2000
    x-unit: px
    description: Smallest length the widget may shrink to when the bar is crowded (px).
  maxSize:
    type: integer
    title: Maximum size
    minimum: 0
    maximum: 2000
    x-unit: px
    description: Most length the widget takes along the bar, however long its content (px).
