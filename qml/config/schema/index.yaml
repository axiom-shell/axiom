# The root of the config schema. `axiom schema build` joins it, the sections
# (sections/<Name>.yaml, in the order `sections` lists them, after `properties`)
# and the definitions (definitions/**/<Name>.yaml, then each kind's type
# folders, <root>/<Type>/schema.yaml expanded into the kind's base) into
# config/json/config.schema.json (docs/dev/core/config-v2.md).

$schema: 'http://json-schema.org/draft-07/schema#'
title: Axiom Configuration Schema
type: object
x-categories:
  - {name: General, icon: home, cards: [{card: DeveloperOptions, title: Developer options}]}
  - {name: Look & Feel, icon: palette}
  - {name: Compositor, icon: desktop_windows}
  - {name: Workspaces, icon: grid_view}
  - {name: Overlay & Popouts, icon: layers}
  - {name: Dock, icon: dock_to_bottom}
  - {name: OSD, icon: picture_in_picture}
  - {name: Launcher, icon: rocket_launch}
  - {name: Notifications, icon: notifications}
  - {name: Screen & Power, icon: power_settings_new}
  - {name: Calendar, icon: calendar_month}
  - {name: Modules, icon: widgets}
  - {name: Theme integrations, icon: format_paint}
  - {name: System, icon: computer, cards: [{card: SystemInfo, title: System info, first: true}, {card: Dependencies, title: Optional packages}, {card: SavedConfigs, title: Saved configurations}]}
  - {name: Development, icon: code, showIf: {/$devOptions: true}, cards: [{card: DevTree, title: Dev tree}, {card: DevConfigDiff, title: Dev config and live}]}
x-libraryGroups:
  - Desktop
  - Time & weather
  - Media & audio
  - Network & devices
  - System
  - Tools
  - Look & layout
  - Session
  - Custom
  # The OSD systems' groups (their own library: none of the above has one)
  - Keys & input
  - Audio
  - Connections
  - Power
  - Privacy
  - Capture
  - Events
additionalProperties: false
properties:
  $schema: {type: string, x-settings: false}
  format:
    type: integer
    const: 2
    default: 2
    x-settings: false
    description: 'The config file''s format: 2. A file without it is format 1, which axiom converts once.'
  version:
    type: integer
    default: 101
    x-settings: false
    description: Config version within format 2, used for migration.
  meta:
    type: object
    x-settings: false
    x-scope: personal
    description: A saved or exported config's title, description and source. A live config.json has none.
    additionalProperties: {type: string}
sections:
  - Lockscreen
  - Greeter
  - Idle
  - Polkit
  - ScreenSharing
  - NightLight
  - General
  - Launcher
  - Apps
  - PowerMenu
  - Screenshots
  - Battery
  - Notifications
  - Compositor
  - Keybinds
  - Monitors
  - WindowBehaviour
  - Input
  - Session
  - WindowLook
  - Appearance
  - Interface
  - Popouts
  - Chat
  - Notes
  - Calendar
  - Weather
  - ClaudeUsage
  - Markets
  - Tailscale
  - Vpn
  - Drives
  - Bluetooth
  - CustomWidgets
  - Updates
  - Todo
  - Stopwatch
  - Pomodoro
  - OSD
  - Dock
  - ThemeIntegrations
  - Icons
  - Overlay
  - HotCorners
  - Workspaces
  - WorkspaceOverlay
  - WindowSwitcher
  - DateTime
  - SelfUpdate
  - CommunitySetups
  - Bars
  - EdgeMenus
  - Desktop
kinds:
  BarWidget: {root: components/bar/widgets, suffix: Widget, base: WidgetBase}
  OverlayModule: {root: components/content, suffix: OverlayModule, base: ModuleBase}
  OverlayView: {root: components/views, suffix: OverlayView, base: ViewBase}
  CustomElement: {root: components/content/parts/custom/elements, suffix: CustomElement, base: CustomElementBase}
  OSDSystem: {root: components/surfaces/osd/systems, suffix: OSDSystem, base: OSDSystemBase}
