# The Appearance section of the config (config.json's "Appearance").

type: object
x-category: Look & Feel
x-links: [Themes]
title: Appearance
additionalProperties: false
properties:
  theme:
    type: object
    title: Theme
    x-scope: look
    additionalProperties: false
    properties:
      name:
        type: string
        default: gruvbox-dark
        description: Active theme (set on the Themes page).
        x-settings: false
      schedule:
        type: object
        title: Light and dark by time
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Switch by time of day
            default: false
            description: Light variant by day, dark at night. Switching by hand lasts until the next change.
          lightAt:
            type: string
            title: Light from
            default: '07:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: '24-hour time, like 07:00.'
            x-showIf: {enabled: true}
          darkAt:
            type: string
            title: Dark from
            default: '19:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: '24-hour time, like 19:00.'
            x-showIf: {enabled: true}
  wallpaper:
    type: object
    title: Wallpaper
    additionalProperties: false
    properties:
      mode:
        type: string
        x-snapshot: true
        title: Wallpaper mode
        enum: [fixed, rotate, variant]
        x-enumLabels:
          fixed: Fixed
          rotate: Rotate on a timer
          variant: One for light, one for dark
        default: fixed
        description: Fixed keeps the wallpaper you pick. Rotate changes it on a timer. One for light, one for dark follows the theme's variant.
      file:
        type: string
        x-snapshot: true
        default: ''
        description: The primary monitor's wallpaper file URL (set on the Themes page).
        x-settings: false
      perScreen:
        type: object
        x-snapshot: true
        default: {}
        description: Monitor name → wallpaper file URL (set on the Themes page).
        additionalProperties: {type: string}
        x-settings: false
      folder:
        type: string
        x-snapshot: true
        title: Wallpaper folder
        x-control: folder
        default: '~/Pictures/wallpapers'
        pattern: '\S'
        description: Images the pickers list (jpg, png and bmp, and webp, avif and jxl where their Qt image plugin is installed).
      collection:
        type: string
        x-snapshot: true
        title: Collection
        default: ''
        x-suggestions: wallpaperCollections
        description: A subfolder to pick and rotate from. Empty uses the folder itself.
      subfolders:
        type: boolean
        x-snapshot: true
        title: Include subfolders
        default: false
        description: Also list images in subfolders.
      rotation:
        type: object
        x-snapshot: true
        title: Wallpaper rotation
        additionalProperties: false
        x-showIf: {mode: rotate}
        properties:
          interval:
            type: integer
            title: Change every
            x-unit: min
            default: 1800000
            minimum: 60000
            maximum: 86400000
          order:
            type: string
            title: Order
            x-control: toggle
            enum: [random, sequential]
            x-enumLabels: {random: Random, sequential: 'In order, by name'}
            default: random
            description: Random shows every wallpaper once before repeating.
          sameOnAll:
            type: boolean
            title: Same on every monitor
            default: false
            description: Off, each monitor gets its own.
          pause:
            type: object
            title: Hold the rotation
            additionalProperties: false
            description: The wallpaper stays while any of these holds.
            properties:
              fullscreen:
                type: boolean
                title: While a window is fullscreen
                default: true
              locked:
                type: boolean
                title: While the screen is locked
                default: true
                description: Axiom's own lock screen only.
              battery:
                type: boolean
                title: On battery
                default: false
      variants:
        type: object
        x-snapshot: true
        default: {}
        description: The light and dark wallpapers, as file URLs (set on the Themes page).
        additionalProperties: false
        properties: {dark: {type: string, default: ''}, light: {type: string, default: ''}}
        x-settings: false
      transition:
        x-scope: look
        type: object
        title: Wallpaper transition
        additionalProperties: false
        properties:
          type:
            type: string
            title: Transition
            enum: [random, none, fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {random: Random, none: None, fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            default: random
            description: Random picks one from the list below each time.
          pool:
            type: array
            title: Random picks from
            default: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            items:
              type: string
              enum: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            x-showIf: {type: random}
            description: None ticked picks from all.
          direction:
            type: string
            title: Direction
            enum: [random, right, left, down, up, downRight, downLeft, upRight, upLeft]
            x-enumLabels: {random: Random, right: Left to right, left: Right to left, down: Top to bottom, up: Bottom to top, downRight: Top left to bottom right, downLeft: Top right to bottom left, upRight: Bottom left to top right, upLeft: Bottom right to top left}
            default: random
            x-showIf: {type: {not: none}}
            description: Random picks one each time.
          position:
            type: string
            title: Starts from
            enum: [random, click, center, topLeft, topRight, bottomLeft, bottomRight]
            x-enumLabels: {random: Random, click: Where you click, center: The center, topLeft: Top left corner, topRight: Top right corner, bottomLeft: Bottom left corner, bottomRight: Bottom right corner}
            default: random
            x-showIf: {type: {not: none}}
            description: Where the transition starts or spreads from. Where you click uses the clicked thumbnail.
          easing:
            type: string
            title: Pace
            enum: [smooth, easeOut, easeIn, linear, snappy]
            x-enumLabels: {smooth: Smooth, easeOut: Slowing down, easeIn: Speeding up, linear: Steady, snappy: Snappy}
            default: smooth
            x-showIf: {type: {not: none}}
            description: Smooth starts and ends gently; Snappy covers most of the way at once.
          duration:
            type: integer
            title: Length
            x-unit: ms
            default: 1000
            minimum: 100
            maximum: 5000
      fill:
        x-scope: look
        type: string
        title: Wallpaper fit
        enum: [crop, fit, stretch, center]
        x-enumLabels: {crop: Fill the screen, fit: Show it whole, stretch: Stretch, center: Center at its own size}
        default: crop
        description: How a wallpaper that isn't the screen's shape is drawn.
      parallax:
        x-scope: look
        type: object
        title: Workspace parallax
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Move with the workspaces
            default: false
            description: The wallpaper slides a step with each workspace.
          strength:
            type: integer
            title: How far
            x-unit: '%'
            default: 4
            minimum: 1
            maximum: 15
            x-showIf: {enabled: true}
            description: How far it slides end to end, as a share of the screen.
          workspaces:
            type: integer
            title: Workspaces it spans
            default: 5
            minimum: 2
            maximum: 20
            x-showIf: {enabled: true, /$supports.dynamicWorkspaces: true}
            description: Where workspaces are made as needed, how many it takes to slide end to end.
  font:
    x-scope: look
    type: object
    title: Font
    additionalProperties: false
    properties:
      family:
        type: string
        title: Family
        default: monospace
      size:
        type: integer
        x-control: stepper
        title: Size
        default: 14
        minimum: 8
        maximum: 32
        x-unit: px
        description: Base font size (px).
  shape:
    x-scope: look
    type: object
    title: Shape
    additionalProperties: false
    properties:
      radius:
        x-link: {setting: Interface.radius}
        type: integer
        x-control: stepper
        title: Corner radius
        default: 6
        minimum: 0
        maximum: 50
        x-unit: px
        description: 'Outer edges: the screen border, bars, popouts and windows (px).'
      borderWidth:
        type: integer
        x-control: stepper
        title: Border width
        default: 1
        minimum: 0
        maximum: 10
        x-unit: px
        description: Every outline (px).
      screenBorder:
        type: boolean
        title: Screen border
        default: true
        description: A frame around the screen edges.
      screenMargin:
        type: integer
        x-control: stepper
        title: Screen margin
        default: 8
        minimum: 0
        maximum: 100
        x-unit: px
        description: Width of the screen frame and the gap from the screen edges (px).
  surface:
    x-scope: look
    type: object
    title: Translucency
    x-intro: TranslucencyStatus
    additionalProperties: false
    properties:
      opacity:
        x-link:
          - {setting: WindowLook.opacity}
          - {setting: WindowLook.surfaceBlur}
        type: integer
        title: Surface opacity
        x-unit: '%'
        default: 100
        minimum: 60
        maximum: 100
        description: How solid bars, popouts, menus and panels are. 100 is fully solid. Translucency needs the compositor's blur.
        x-hintedIf: {/$supports.blur: true}
  motion:
    x-scope: look
    type: object
    title: Motion
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Animations
        default: true
      speed:
        type: integer
        title: Animation speed
        x-unit: '%'
        default: 100
        minimum: 25
        maximum: 400
        description: 100 is normal, 200 twice as fast, 50 half speed.
