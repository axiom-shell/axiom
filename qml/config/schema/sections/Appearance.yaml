# The Appearance section of the config (config.json's "Appearance").

type: object
x-category: Look & Feel
x-links: [Themes]
title: Appearance
additionalProperties: false
properties:
  font:
    x-scope: look
    type: object
    title: Font
    additionalProperties: false
    properties:
      family:
        type: string
        title: Family
        default: monospace
      size:
        type: integer
        x-control: stepper
        title: Size
        default: 14
        minimum: 8
        maximum: 32
        x-unit: px
  shape:
    x-scope: look
    type: object
    title: Shape
    additionalProperties: false
    properties:
      radius:
        type: integer
        x-control: stepper
        title: Corner radius
        default: 6
        minimum: 0
        maximum: 50
        x-unit: px
        description: 'Outer edges: screen border, bars, popouts, windows.'
      innerRadius:
        type: integer
        x-control: stepper
        title: Inner radius
        default: null
        minimum: 0
        maximum: 50
        x-unit: px
        description: Buttons, fields, rows and bar widgets. Outer edges keep the main radius.
        x-inherit: Appearance.shape.radius
      borderWidth:
        type: integer
        x-control: stepper
        title: Border width
        default: 1
        minimum: 0
        maximum: 10
        x-unit: px
        description: Every outline.
      screenBorder:
        type: boolean
        title: Screen border
        default: true
      screenMargin:
        type: integer
        x-control: stepper
        title: Screen margin
        default: 8
        minimum: 0
        maximum: 100
        x-unit: px
        description: Frame width and gap from the screen edges.
  theme:
    type: object
    title: Theme
    x-scope: look
    additionalProperties: false
    properties:
      name:
        type: string
        default: gruvbox-dark
        description: Active theme (set on the Themes page).
        x-settings: false
      schedule:
        type: object
        title: Light and dark by time
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Switch by time
            default: false
            description: Light by day, dark at night.
          lightAt:
            type: string
            title: Light from
            default: '07:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: e.g. 07:00.
            x-showIf: {enabled: true}
          darkAt:
            type: string
            title: Dark from
            default: '19:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: e.g. 19:00.
            x-showIf: {enabled: true}
  wallpaper:
    type: object
    title: Wallpaper
    additionalProperties: false
    properties:
      mode:
        type: string
        x-snapshot: true
        title: Mode
        enum: [fixed, rotate, variant]
        x-enumLabels:
          fixed: Fixed
          rotate: Rotate on a timer
          variant: One for light, one for dark
        default: fixed
      rotation:
        type: object
        x-snapshot: true
        title: Rotation
        additionalProperties: false
        x-showIf: {mode: rotate}
        properties:
          interval:
            type: integer
            title: Change every
            x-unit: min
            default: 1800000
            minimum: 60000
            maximum: 86400000
            multipleOf: 60000
          order:
            type: string
            title: Order
            x-control: toggle
            enum: [random, sequential]
            x-enumLabels: {random: Random, sequential: Sorted}
            default: random
            description: Random shows every wallpaper once before repeating.
          sameOnAll:
            type: boolean
            title: Same on every monitor
            default: false
            description: 'Off: each monitor gets its own.'
          pause:
            type: object
            title: Pause rotation
            additionalProperties: false
            description: The wallpaper stays while any of these holds.
            properties:
              fullscreen:
                type: boolean
                title: While a window is fullscreen
                default: true
              locked:
                type: boolean
                title: While the screen is locked
                default: true
                description: Axiom's own lock screen only.
              battery:
                type: boolean
                title: On battery
                default: false
      variants:
        type: object
        x-snapshot: true
        default: {}
        description: The light and dark wallpapers, as file URLs (set on the Themes page).
        additionalProperties: false
        properties: {dark: {type: string, default: ''}, light: {type: string, default: ''}}
        x-settings: false
      file:
        type: string
        x-snapshot: true
        default: ''
        description: The primary monitor's wallpaper file URL (set on the Themes page).
        x-settings: false
      perScreen:
        type: object
        x-snapshot: true
        default: {}
        description: Monitor name → wallpaper file URL (set on the Themes page).
        additionalProperties: {type: string}
        x-settings: false
      fill:
        x-scope: look
        type: string
        title: Fit
        enum: [crop, fit, stretch, center]
        x-enumLabels: {crop: Fill the screen, fit: Show it whole, stretch: Stretch, center: Center at its own size}
        default: crop
      transition:
        x-scope: look
        type: object
        title: Wallpaper transition
        additionalProperties: false
        properties:
          type:
            type: string
            title: Effect
            enum: [random, none, fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {random: Random, none: None, fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            default: random
            description: 'Random: picks from the list below.'
          pool:
            type: array
            title: Random pool
            default: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            items:
              type: string
              enum: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            x-showIf: {type: random}
            description: None ticked picks from all.
          direction:
            type: string
            title: Direction
            enum: [random, right, left, down, up, downRight, downLeft, upRight, upLeft]
            x-enumLabels: {random: Random, right: Left to right, left: Right to left, down: Top to bottom, up: Bottom to top, downRight: Top left to bottom right, downLeft: Top right to bottom left, upRight: Bottom left to top right, upLeft: Bottom right to top left}
            default: random
            x-showIf: {type: {not: none}}
            description: Random picks one each time.
          position:
            type: string
            title: Starts from
            enum: [random, click, center, topLeft, topRight, bottomLeft, bottomRight]
            x-enumLabels: {random: Random, click: Where you click, center: The center, topLeft: Top left corner, topRight: Top right corner, bottomLeft: Bottom left corner, bottomRight: Bottom right corner}
            default: random
            x-showIf: {type: {not: none}}
            description: Where the transition starts or spreads from. Where you click uses the clicked thumbnail.
          easing:
            type: string
            title: Pace
            enum: [smooth, easeOut, easeIn, linear, snappy]
            x-enumLabels: {smooth: Smooth, easeOut: Slowing down, easeIn: Speeding up, linear: Steady, snappy: Snappy}
            default: smooth
            x-showIf: {type: {not: none}}
            description: Smooth starts and ends gently; Snappy covers most of the way at once.
          duration:
            type: integer
            title: Duration
            x-unit: ms
            default: 1000
            minimum: 100
            maximum: 5000
            x-showIf: {type: {not: none}}
      parallax:
        x-scope: look
        type: object
        title: Workspace parallax
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Slide with workspaces
            default: false
          strength:
            type: integer
            title: Distance
            x-unit: '%'
            default: 4
            minimum: 1
            maximum: 15
            x-showIf: {enabled: true}
            description: Share of the screen, end to end.
          workspaces:
            type: integer
            title: Workspaces spanned
            default: 5
            minimum: 2
            maximum: 20
            x-showIf: {enabled: true, /$supports.dynamicWorkspaces: true}
            description: Slides end to end across this many.
      folder:
        type: string
        x-snapshot: true
        title: Folder
        x-control: folder
        default: '~/Pictures/wallpapers'
        pattern: '\S'
        description: Where the pickers look for images.
      collection:
        type: string
        x-snapshot: true
        title: Collection
        default: ''
        x-suggestions: wallpaperCollections
        description: 'A subfolder to pick and rotate from. Empty: the folder itself.'
      subfolders:
        type: boolean
        x-snapshot: true
        title: Subfolders
        default: false
  motion:
    x-scope: look
    type: object
    title: Motion
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Animations
        default: true
      speed:
        type: integer
        title: Speed
        x-unit: '%'
        default: 100
        minimum: 25
        maximum: 400
        description: '100: normal. 200: twice as fast.'
        x-showIf: {enabled: true}
  surface:
    x-scope: look
    type: object
    title: Translucency
    x-intro: TranslucencyStatus
    additionalProperties: false
    properties:
      opacity:
        x-link: {setting: WindowLook.opacity}
        type: integer
        title: Opacity
        x-unit: '%'
        default: 100
        minimum: 60
        maximum: 100
        description: Bars, popouts, menus and panels.
        x-hintedIf: {/$supports.blur: true}
      blur:
        type: object
        title: Blur behind axiom
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Surface blur
            default: true
            description: Blur what shows through axiom's translucent surfaces. Costs GPU time.
            x-showIf: {/Appearance.surface.opacity: {not: 100}}
            x-hintedIf: {/$supports.blur: true}
          throughWindows:
            type: boolean
            title: Blur windows too
            default: true
            description: 'Off: only the wallpaper blurs, cheaper.'
            x-showIf: {/Appearance.surface.opacity: {not: 100}, enabled: true}
            x-hintedIf: {/$supports.blur: true}
          backdrops:
            type: boolean
            title: Blur overlay backdrops
            default: false
            description: Also behind the launcher, power menu and overview.
            x-showIf: {/Appearance.surface.opacity: {not: 100}, enabled: true}
            x-hintedIf: {/$supports.blur: true}
          pauseFullscreen:
            x-scope: machine
            type: boolean
            title: Pause over fullscreen
            default: true
            description: Surfaces turn opaque on a monitor with a fullscreen window.
            x-showIf: {/Appearance.surface.opacity: {not: 100}, enabled: true}
            x-hintedIf: {/$supports.blur: true}
