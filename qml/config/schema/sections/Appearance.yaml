# The Appearance section of the config (config.json's "Appearance").

type: object
x-category: Look & Feel
x-links: [Themes]
title: Appearance
additionalProperties: false
properties:
  theme:
    type: object
    title: Theme
    x-scope: look
    additionalProperties: false
    properties:
      name:
        type: string
        default: gruvbox-dark
        description: Active theme (set on the overlay's Themes page).
        x-settings: false
      schedule:
        type: object
        title: Light and dark by time
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Switch by time of day
            default: false
            description: Use the theme's light variant during the day and its dark one at night. Switching by hand lasts until the next change.
          lightAt:
            type: string
            title: Light from
            default: '07:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: '24-hour time, like 07:00.'
            x-showIf: {enabled: true}
          darkAt:
            type: string
            title: Dark from
            default: '19:00'
            pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
            description: '24-hour time, like 19:00.'
            x-showIf: {enabled: true}
  wallpaper:
    type: object
    title: Wallpaper
    additionalProperties: false
    properties:
      mode:
        type: string
        x-snapshot: true
        title: Wallpaper mode
        enum: [fixed, rotate, variant]
        x-enumLabels:
          fixed: Fixed
          rotate: Rotate on a timer
          variant: One for light, one for dark
        default: fixed
        description: Fixed keeps the wallpaper you pick. Rotate changes it on a timer, from the wallpaper folder. One for light, one for dark shows the wallpaper you picked for the theme's current variant on every monitor. A generated theme follows the wallpaper as it changes. Also set on the overlay's Themes page.
      file:
        type: string
        x-snapshot: true
        default: ''
        description: The primary monitor's wallpaper file URL, used by the lockscreen (set on the overlay's Themes page).
        x-settings: false
      perScreen:
        type: object
        x-snapshot: true
        default: {}
        description: Monitor name → wallpaper file URL (set on the overlay's Themes page). A monitor with no entry shows `wallpaper`.
        additionalProperties: {type: string}
        x-settings: false
      folder:
        type: string
        x-snapshot: true
        title: Wallpaper folder
        x-control: folder
        default: '~/Pictures/wallpapers'
        pattern: '\S'
        description: Folder the wallpaper pickers list images from (jpg, png, bmp). A leading ~ is your home folder.
      collection:
        type: string
        x-snapshot: true
        title: Collection
        default: ''
        x-suggestions: wallpaperCollections
        description: A subfolder of the wallpaper folder to pick and rotate from (its path inside it), empty for the folder itself. Also chosen in the wallpaper picker.
      subfolders:
        type: boolean
        x-snapshot: true
        title: Include subfolders
        default: false
        description: Also list the images in the folders inside it, at any depth.
      rotation:
        type: object
        x-snapshot: true
        title: Wallpaper rotation
        additionalProperties: false
        x-showIf: {mode: rotate}
        properties:
          interval:
            type: integer
            title: Change every
            x-unit: min
            default: 1800000
            minimum: 60000
            maximum: 86400000
            description: How long each wallpaper stays up.
          order:
            type: string
            title: Order
            enum: [random, sequential]
            x-enumLabels: {random: Random, sequential: 'In order, by name'}
            default: random
            description: Random shuffles the folder, showing every wallpaper once before any comes back.
          sameOnAll:
            type: boolean
            title: Same on every monitor
            default: false
            description: Show one wallpaper on all monitors. Off, each monitor gets its own.
          pause:
            type: object
            title: Hold the rotation
            additionalProperties: false
            description: While any of these holds, the wallpaper stays. Once none does and its time has passed, it changes at once.
            properties:
              fullscreen:
                type: boolean
                title: While a window is fullscreen
                default: true
              locked:
                type: boolean
                title: While the screen is locked
                default: true
                description: Axiom's own lock screen only; another locker isn't seen.
              battery:
                type: boolean
                title: On battery
                default: false
      variants:
        type: object
        x-snapshot: true
        default: {}
        description: The wallpapers for the light and dark variants, as file URLs (set on the overlay's Themes page).
        additionalProperties: false
        properties: {dark: {type: string, default: ''}, light: {type: string, default: ''}}
        x-settings: false
      transition:
        x-scope: look
        type: object
        title: Wallpaper transition
        additionalProperties: false
        properties:
          type:
            type: string
            title: Transition
            enum: [random, none, fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {random: Random, none: None, fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            default: random
            description: How a new wallpaper replaces the old one. Random picks one from the list below each time; every monitor that changes together plays the same one. With animations off, it switches at once.
          pool:
            type: array
            title: Random picks from
            default: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            items:
              type: string
              enum: [fade, wipe, slide, grow, shrink, wave, dissolve, pixelate, blinds, tiles, zoom, ripple, swirl, blur, clock]
            x-enumLabels: {fade: Fade, wipe: Wipe, slide: Slide, grow: Grow, shrink: Shrink, wave: Wave, dissolve: Dissolve, pixelate: Pixelate, blinds: Blinds, tiles: Tiles, zoom: Zoom, ripple: Ripple, swirl: Swirl, blur: Blur, clock: Clock}
            x-showIf: {type: random}
            description: The transitions Random chooses between. None ticked chooses from all of them.
          direction:
            type: string
            title: Direction
            enum: [random, right, left, down, up, downRight, downLeft, upRight, upLeft]
            x-enumLabels: {random: Random, right: Left to right, left: Right to left, down: Top to bottom, up: Bottom to top, downRight: Top left to bottom right, downLeft: Top right to bottom left, upRight: Bottom left to top right, upLeft: Bottom right to top left}
            default: random
            x-showIf: {type: {not: none}}
            description: The way a transition moves across the screen. Fade, dissolve, pixelate and blur sweep across in it too, and Clock starts its hand pointing that way. Random picks one each time.
          position:
            type: string
            title: Starts from
            enum: [random, click, center, topLeft, topRight, bottomLeft, bottomRight]
            x-enumLabels: {random: Random, click: Where you click, center: The center, topLeft: Top left corner, topRight: Top right corner, bottomLeft: Bottom left corner, bottomRight: Bottom right corner}
            default: random
            x-showIf: {type: {not: none}}
            description: Where grow, shrink, zoom, ripple, swirl and Clock start, and where fade, dissolve, pixelate and blur spread out from. Where you click starts at the thumbnail clicked in a wallpaper picker, and moving transitions move away from it; a change from anything else (rotation, light and dark) starts at random.
          easing:
            type: string
            title: Pace
            enum: [smooth, easeOut, easeIn, linear, snappy]
            x-enumLabels: {smooth: Smooth, easeOut: Slowing down, easeIn: Speeding up, linear: Steady, snappy: Snappy}
            default: smooth
            x-showIf: {type: {not: none}}
            description: How a transition speeds up and slows down over its length. Smooth starts and ends gently; Snappy covers most of the way at once and settles.
          duration:
            type: integer
            title: Length
            x-unit: ms
            default: 1000
            minimum: 100
            maximum: 5000
            description: How long a transition takes.
      fill:
        x-scope: look
        type: string
        title: Wallpaper fit
        enum: [crop, fit, stretch, center]
        x-enumLabels: {crop: Fill the screen, fit: Show it whole, stretch: Stretch, center: Center at its own size}
        default: crop
        description: How a wallpaper that isn't the screen's shape is drawn, everywhere it shows (the desktop, lock screen, login screen and workspace overview). Around one that doesn't fill the screen is the theme's background.
      parallax:
        x-scope: look
        type: object
        title: Workspace parallax
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Move with the workspaces
            default: false
            description: The wallpaper is drawn a little larger than the screen and slides a step with each workspace you go to, and across as you scroll along a scrolling layout's windows.
          strength:
            type: integer
            title: How far
            x-unit: '%'
            default: 4
            minimum: 1
            maximum: 15
            x-showIf: {enabled: true}
            description: How far the wallpaper slides from one end to the other, as a share of the screen, the same both ways.
          workspaces:
            type: integer
            title: Workspaces it spans
            default: 5
            minimum: 2
            maximum: 20
            x-showIf: {enabled: true, /$supports.dynamicWorkspaces: true}
            description: Where the compositor makes workspaces as you need them, how many it takes to slide from one end to the other. Each workspace down moves it the same step, so opening and closing windows never moves it; past the last, it stays at the end.
  font:
    x-scope: look
    type: object
    title: Font
    additionalProperties: false
    properties:
      family:
        type: string
        title: Family
        default: monospace
        description: Font used throughout the shell.
      size:
        type: integer
        x-control: stepper
        title: Size
        default: 14
        minimum: 8
        maximum: 32
        x-unit: px
        description: Base font size (px). Larger text is derived from it.
  shape:
    x-scope: look
    type: object
    title: Shape
    additionalProperties: false
    properties:
      radius:
        x-link: {setting: Interface.radius}
        type: integer
        x-control: stepper
        title: Corner radius
        default: 6
        minimum: 0
        maximum: 50
        x-unit: px
        description: 'Roundness of outer edges: the screen border, bars, popouts and windows (px). Everything inside follows it unless Panels & controls sets its own.'
      borderWidth:
        type: integer
        x-control: stepper
        title: Border width
        default: 1
        minimum: 0
        maximum: 10
        x-unit: px
        description: Thickness of every outline (px).
      screenBorder:
        type: boolean
        title: Screen border
        default: true
        description: Draw a frame around the screen edges.
      screenMargin:
        type: integer
        x-control: stepper
        title: Screen margin
        default: 8
        minimum: 0
        maximum: 100
        x-unit: px
        description: Width of the screen frame, and the gap kept from the screen edges (px).
  surface:
    x-scope: look
    type: object
    title: Translucency
    x-intro: TranslucencyStatus
    additionalProperties: false
    properties:
      opacity:
        x-link:
          - {setting: WindowLook.opacity}
          - {setting: WindowLook.surfaceBlur}
        type: integer
        title: Surface opacity
        x-unit: '%'
        default: 100
        minimum: 60
        maximum: 100
        description: "How solid the shell's surfaces are: bars, the screen border, popouts, menus and panels (not your apps' windows: Compositor → Window look → Window opacity). 100 is fully solid. A translucent surface needs the compositor to blur behind it (Compositor → Window look → Blur)."
        x-enabledIf: {/$supports.blur: true}
  motion:
    x-scope: look
    type: object
    title: Motion
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Animations
        default: true
        description: Turn every animation in the shell on or off.
      speed:
        type: integer
        title: Animation speed
        x-unit: '%'
        default: 100
        minimum: 25
        maximum: 400
        description: Speed of every animation. 100 is normal, 200 is twice as fast, 50 is half speed.
