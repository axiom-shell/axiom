# The Apps section of the config (config.json's "Apps").

x-scope: personal
type: object
x-category: General
x-card: {file: DefaultApps, title: Default apps}
title: App commands
description: "Commands axiom runs in place of the default apps above, for the Terminal, File manager and Browser keybinds, the launcher's terminal apps and Shift+Enter commands, and opening folders; and the network editor. Empty uses the default app."
additionalProperties: false
properties:
  terminal:
    x-scope: commands
    type: string
    title: Terminal
    default: ''
    description: "A terminal command in place of the default terminal, for the Terminal keybind, terminal apps and Shift+Enter commands, started as: terminal -e command. Empty uses the default terminal."
  fileManager:
    x-scope: commands
    type: string
    title: File manager
    default: ''
    description: A file manager command in place of the default one, given the folder to open. Empty uses the default file manager.
  browser:
    x-scope: commands
    type: string
    title: Browser
    default: ''
    description: A browser command in place of the default browser, given the link to open. Empty uses the default browser.
  networkEditor:
    x-scope: commands
    type: string
    title: Network editor
    default: nm-connection-editor
    description: "Command the Wi-Fi menu's Settings button and the VPN module's Edit connections button run, to add or change network connections and VPNs. Empty hides both."
  pinned:
    x-scope: personal
    type: array
    title: Pinned apps
    x-settings: false
    default: []
    items: {type: string}
    description: 'Desktop entry ids, in order: the apps every dock shows first, unless it has its own (Dock → pinnedOwn).'
