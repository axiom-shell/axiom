# The Bars section of the config (config.json's "Bars").

type: object
x-scope: look
x-category: Look & Feel
title: Bars
additionalProperties: false
properties:
  style:
    $ref: '#/definitions/BarStyle'
    title: Widget style
    description: How every bar draws its widgets, accents and shadow. A bar can take its own of any of these in the bar editor.
  items:
    type: array
    x-settings: false
    default:
      - id: primary
        location: top
        widgetSize: 26
        padding: 4
        background: pills
        lockCenter: true
        style:
          fontSize: null
          widgetRadius: null
          widgetStyle: null
          tintOpacity: null
          outlineWidth: null
          lineWidth: null
          lineSide: null
          widgetShape: null
          widgetGrouping: null
          widgetEnds: null
          groupColor: null
          widgetTextColor: null
          separatorStyle: null
          separatorColor: null
          separatorThickness: null
          separatorGap: null
          accentLine: null
          accentLineColor: null
          accentLineFade: null
          accentLineWidth: null
          shadow: {enabled: null, color: null, size: null}
        widgets:
          left:
            - id: button
              type: Button
              properties: {action: overlay, icon: menu, tooltip: Overlay}
            - {id: workspaces, type: Workspaces}
            - {id: window, type: Window}
          center:
            - {id: time, type: Time, properties: {showSeconds: false}}
          right:
            - {id: systemTray, type: SystemTray}
            - {id: volume, type: Volume}
            - {id: network, type: Network}
            - {id: bluetooth, type: Bluetooth, properties: {hideWhenOff: true}}
            - {id: battery, type: Battery}
            - {id: notifications, type: Notifications}
            - {id: button-2, type: Button, properties: {action: powerMenu, tooltip: Power}}
    items: {$ref: '#/definitions/Bar'}
