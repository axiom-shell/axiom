# The Battery section of the config (config.json's "Battery").

type: object
x-category: General
title: Battery
description: Low and critical battery levels, on laptops.
additionalProperties: false
properties:
  notify:
    type: boolean
    title: Low battery notifications
    default: true
    description: Notify when the battery becomes low, and again when critical.
    x-link: {setting: OSD}
  lowThreshold: {type: integer, title: Low at, x-unit: '%', default: 20, minimum: 0, maximum: 100}
  criticalThreshold:
    type: integer
    title: Critical at
    x-unit: '%'
    default: 10
    minimum: 0
    maximum: 100
