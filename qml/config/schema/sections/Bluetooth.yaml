# The Bluetooth section of the config (config.json's "Bluetooth").

type: object
x-category: Modules
title: Bluetooth
description: How axiom pairs Bluetooth devices, and when it warns of a device's low battery.
additionalProperties: false
properties:
  pairingAgent:
    type: boolean
    title: Pairing prompts
    default: true
    description: 'Off: leave pairing to another agent (blueman).'
  lowThreshold:
    type: integer
    title: Low at
    x-unit: '%'
    default: 20
    minimum: 0
    maximum: 100
    description: Headphones, mice and other devices.
    x-link: {setting: OSD}
  criticalThreshold:
    type: integer
    title: Critical at
    x-unit: '%'
    default: 5
    minimum: 0
    maximum: 100
  notify:
    type: boolean
    title: Battery notifications
    default: true
    description: A connected device's battery is low, then critical.
    x-link: {setting: OSD}
