# The Bluetooth section of the config (config.json's "Bluetooth").

type: object
x-category: Modules
title: Bluetooth
description: How axiom pairs Bluetooth devices, and when it warns of a device's low battery.
additionalProperties: false
properties:
  pairingAgent:
    type: boolean
    title: Answer pairing requests
    default: true
    description: Ask for a device's PIN or passkey, or to confirm its code, in axiom's prompt. Turn off to leave pairing to another agent, such as blueman.
  notify:
    type: boolean
    title: Device battery notifications
    default: true
    description: Notify when a connected device's battery becomes low, and again when critical (an OSD showing Bluetooth says it as its card instead).
    x-link: {setting: OSD}
  lowBattery:
    type: integer
    title: Device battery low at
    x-unit: '%'
    default: 20
    minimum: 0
    maximum: 100
    description: Say when a connected device's battery (headphones, a mouse) drops to this level, on an OSD showing Bluetooth, else as a notification (with notifications on).
    x-link: {setting: OSD}
  criticalBattery:
    type: integer
    title: Device battery critical at
    x-unit: '%'
    default: 5
    minimum: 0
    maximum: 100
    description: Say it again when the battery drops to this level.
