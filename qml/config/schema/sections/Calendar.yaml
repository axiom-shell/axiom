# The Calendar section of the config (config.json's "Calendar").

type: object
x-category: Calendar
x-links: [CalendarPage]
x-card: {file: CalendarAccounts, title: Accounts, wide: true, folds: true}
title: Calendar
description: Events from CalDAV accounts and .ics subscriptions. Passwords go to your keyring, never here.
additionalProperties: false
properties:
  defaultCalendar:
    type: string
    title: New events go to
    x-group: Events
    default: ''
    x-options: calendars
    x-emptyLabel: The first calendar
    description: Also used by the launcher's /event.
  defaultDuration:
    x-scope: personal
    type: integer
    title: Event length
    x-unit: min
    x-group: Events
    default: 3600000
    minimum: 300000
    maximum: 86400000
  defaultReminder:
    x-scope: personal
    type: integer
    title: Reminder
    x-unit: min
    x-group: Events
    default: 600000
    minimum: -60000
    maximum: 604800000
    description: '-1 adds none.'
  reminders:
    x-scope: personal
    type: boolean
    title: Notify reminders
    x-group: Events
    default: true
    description: Notify when an event's reminder is due.
  syncInterval:
    type: integer
    title: Sync every
    x-unit: min
    x-group: Sync
    default: 900000
    minimum: 60000
    maximum: 86400000
    description: How often calendars are checked for changes.
  pastMonths:
    x-scope: personal
    type: integer
    title: Months back
    x-group: Sync
    default: 2
    minimum: 0
    maximum: 24
    description: How far back events are kept.
  futureMonths:
    x-scope: personal
    type: integer
    title: Months ahead
    x-group: Sync
    default: 12
    minimum: 1
    maximum: 60
  hourFormat:
    x-scope: look
    type: string
    title: Event times
    x-group: Display
    enum: [default, '12', '24']
    x-enumLabels: {default: 'Date & time setting', '12': 12-hour, '24': 24-hour}
    default: default
    description: Default follows Date & time settings.
  maxDots:
    x-scope: look
    type: integer
    title: Dots per day
    x-group: Display
    default: 3
    minimum: 1
    maximum: 6
    description: Most dots under a day in the month grids.
  showOnLockscreen:
    type: boolean
    title: Events on the lock screen
    x-group: Display
    default: false
    description: Anyone at the locked screen can read them.
  items:
    type: array
    title: Accounts
    x-settings: false
    default: []
    items: {$ref: '#/definitions/CalendarAccount'}
