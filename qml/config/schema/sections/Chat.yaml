# The Chat section of the config (config.json's "Chat").

type: object
x-category: Modules
x-card: {file: ChatProviders, title: Chat API keys, wide: true}
title: Chat
description: The Chat module and the launcher's @ prefix. API keys go to your keyring, never here.
additionalProperties: false
properties:
  defaultProvider:
    type: string
    title: Default provider
    x-group: Conversations
    default: anthropic
    x-options: chatProviders
    description: Used by presets that name no provider.
  defaultPreset:
    x-scope: personal
    type: string
    title: Default preset
    x-group: Conversations
    default: Default
    x-options: chatPresets
  maxTokens:
    type: integer
    title: Longest reply
    x-unit: tokens
    x-group: Conversations
    default: 16000
    minimum: 256
    maximum: 128000
    description: Longer replies are cut off.
  keepConversations:
    x-scope: personal
    type: integer
    title: Conversations kept
    x-group: Conversations
    default: 50
    minimum: 0
    maximum: 500
    description: 'Older ones are deleted. 0: none are saved.'
  showThinking:
    x-scope: personal
    type: boolean
    title: Thinking
    x-group: Display
    default: true
    description: A reasoning model's thinking summary, above the reply.
  renderMarkdown:
    x-scope: personal
    type: boolean
    title: Markdown
    x-group: Display
    default: true
    description: Render replies as Markdown, not raw text.
  sendKey:
    x-scope: personal
    type: string
    title: Send with
    x-group: Display
    x-control: toggle
    enum: [enter, ctrlEnter]
    x-enumLabels: {enter: Enter, ctrlEnter: Ctrl+Enter}
    default: enter
    description: The other key makes a new line.
  providers:
    x-wide: true
    type: array
    title: Providers
    description: Where chats are sent. OpenAI-compatible covers any OpenAI-style API.
    default:
      - id: anthropic
        name: Anthropic
        kind: anthropic
        baseUrl: 'https://api.anthropic.com/v1'
        auth: key
        keyEnv: ANTHROPIC_API_KEY
        models: [claude-opus-5, claude-sonnet-5, claude-haiku-4-5, claude-fable-5-1, claude-opus-5-5]
        defaultModel: claude-opus-5
        fallbacks: true
      - id: openai
        name: OpenAI
        kind: openai
        baseUrl: 'https://api.openai.com/v1'
        auth: key
        keyEnv: OPENAI_API_KEY
        models: [gpt-5, gpt-5-mini]
        defaultModel: gpt-5
        fallbacks: false
      - id: gemini
        name: Gemini
        kind: gemini
        baseUrl: 'https://generativelanguage.googleapis.com/v1beta'
        auth: key
        keyEnv: GEMINI_API_KEY
        models: [gemini-2.5-pro, gemini-2.5-flash]
        defaultModel: gemini-2.5-flash
        fallbacks: false
      - id: ollama
        name: Ollama
        kind: openai
        baseUrl: 'http://localhost:11434/v1'
        auth: none
        keyEnv: ''
        models: []
        defaultModel: ''
        fallbacks: false
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        name: {type: string, title: Name, default: ''}
        kind:
          type: string
          title: API
          enum: [anthropic, openai, gemini]
          x-enumLabels:
            anthropic: Anthropic Messages
            openai: OpenAI-compatible
            gemini: Google Gemini
          default: openai
        baseUrl:
          type: string
          title: Address
          default: ''
          description: The API's base URL, including its version (e.g. http://localhost:11434/v1).
        auth:
          type: string
          title: Authentication
          x-control: toggle
          enum: [key, none]
          x-enumLabels: {key: Key, none: None}
          default: key
        keyEnv:
          type: string
          title: Key variable
          default: ''
          description: An environment variable holding the key. It wins over a stored one.
          x-showIf: {auth: key}
        models:
          type: array
          title: Models
          default: []
          items: {type: string}
          description: Model ids, comma-separated.
        defaultModel:
          type: string
          title: Default model
          default: ''
          description: 'Empty: the first model.'
        fallbacks:
          type: boolean
          title: Refusal fallback
          default: true
          description: Retry on another model when one declines.
          x-showIf: {kind: anthropic}
      required: [id]
  presets:
    x-scope: personal
    type: array
    title: Presets
    description: Saved setups to start a conversation with.
    default:
      - id: default
        name: Default
        icon: chat
        systemPrompt: You are a helpful assistant built into the user's Linux desktop. Answer concisely, and use Markdown when it helps.
        provider: ''
        model: ''
        effort: default
      - id: coder
        name: Coder
        icon: code
        systemPrompt: You are an expert programmer. Lead with working code, then explain briefly. Prefer small, idiomatic changes.
        provider: ''
        model: ''
        effort: high
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        name: {type: string, title: Name, default: ''}
        icon:
          type: string
          x-control: icon
          title: Icon
          default: chat
        provider:
          type: string
          title: Provider
          default: ''
          x-options: chatProviders
          x-emptyLabel: Default provider
          description: 'Empty: the default provider.'
        model:
          type: string
          title: Model
          default: ''
          description: 'Empty: the provider''s default model.'
        effort:
          type: string
          title: Effort
          enum: [default, low, medium, high, xhigh, max]
          x-enumLabels:
            default: Model default
            low: Low
            medium: Medium
            high: High
            xhigh: Extra high
            max: Max
          default: default
          description: How hard a reasoning model thinks.
        systemPrompt: {type: string, title: System prompt, default: '', x-multiline: true}
      required: [id]
