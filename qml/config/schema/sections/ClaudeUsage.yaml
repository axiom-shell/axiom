# The ClaudeUsage section of the config (config.json's "ClaudeUsage").

type: object
x-category: Modules
title: Claude usage
description: The Claude Code logins every Claude usage widget reports on.
additionalProperties: false
properties:
  items:
    type: array
    title: Accounts
    default:
      - {id: personal, label: Personal, configDir: '~/.claude'}
    description: "One per Claude Code login: the CLAUDE_CONFIG_DIR it uses (~/.claude when unset). Usage is read with that login's token, which is never changed."
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        label:
          type: string
          title: Label
          default: ''
          description: Shown in the popout; its first letter tells accounts apart on the bar.
        configDir: {type: string, title: Config directory, x-control: folder, default: '~/.claude'}
      required: [id]
  interval:
    type: integer
    title: Check interval
    x-unit: min
    default: 300000
    minimum: 120000
    maximum: 3600000
