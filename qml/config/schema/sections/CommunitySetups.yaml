# The CommunitySetups section of the config (config.json's "CommunitySetups").

type: object
x-category: System
x-card: {file: CommunitySetups, title: Community setups, wide: true}
title: Community gallery
description: Setups shared by other axiom users. Applying one changes only the look and layout, and saves your current setup first.
additionalProperties: false
properties:
  enabled:
    type: boolean
    title: Gallery
    default: true
    description: Nothing is downloaded until you open the gallery.
  indexUrl:
    type: string
    title: Catalog URL
    default: 'https://raw.githubusercontent.com/axiom-shell/community-setups/catalog/index.json'
    x-showIf: {enabled: true}
    description: The catalog's index.json. Mirror or fork only.
