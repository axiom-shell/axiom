# The CommunitySetups section of the config (config.json's "CommunitySetups").

type: object
x-category: Maintenance
x-card: {file: CommunitySetups, title: Community setups, wide: true}
title: Community gallery
description: Setups other people built with axiom and shared at github.com/axiom-shell/community-setups. Applying one changes the look and layout only, never keybinds, apps, commands, monitors or accounts, and saves your current setup first.
additionalProperties: false
properties:
  enabled:
    type: boolean
    title: Browse community setups
    default: true
    description: Shows the gallery here and in the launcher's /config community. Nothing is downloaded until you open it.
  indexUrl:
    type: string
    title: Catalog
    default: 'https://raw.githubusercontent.com/axiom-shell/community-setups/catalog/index.json'
    x-showIf: {enabled: true}
    description: "Where the gallery comes from: the community-setups catalog's index.json. Change it only for a mirror or a fork."
