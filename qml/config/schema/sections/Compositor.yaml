# The Compositor section of the config (config.json's "Compositor").

type: object
x-category: Compositor
x-showIf: {/$supports.configModes: true}
x-links: [Keybinds, Monitors]
x-card: {file: CompositorStatus, title: Compositor status}
title: Compositor
description: How axiom sets up your compositor.
additionalProperties: false
properties:
  mode:
    x-takeover: true
    x-recommended: managed
    type: string
    title: Mode
    x-group: Compositor setup
    enum: [detached, included, managed]
    x-enumLabels:
      detached: Detached (nothing to set up)
      included: Included from your config
      managed: Managed by axiom
    default: detached
    x-applyOnSave: true
  requiredSettings:
    type: boolean
    title: Required settings
    x-group: Compositor setup
    default: true
    description: Lock restore, ignoring apps' maximize requests, a workspace slide animation.
    x-showIf: {/$compositor: hyprland}
  hyprland:
    x-scope: personal
    type: object
    x-showIf: {/$compositor: hyprland, /Compositor.mode: managed}
    title: Managed config
    description: Written into hyprland.lua. Anything else goes in ~/.config/hypr/user/*.lua.
    additionalProperties: false
    properties:
      layout:
        x-link: {setting: Workspaces}
        type: string
        title: Layout
        x-group: Layout
        enum: [dwindle, master]
        x-enumLabels: {dwindle: Dwindle (binary splits), master: Master and stack}
        default: dwindle
        x-compositor: {hyprland: {key: general.layout, always: true}}
      preserveSplit:
        type: boolean
        title: Keep split direction
        x-group: Layout
        default: true
        x-showIf: {layout: dwindle}
        x-compositor: {hyprland: {key: dwindle.preserve_split, always: true}}
      smartSplit:
        type: boolean
        title: Split by cursor position
        x-group: Layout
        default: false
        x-showIf: {layout: dwindle}
        x-compositor: {hyprland: {key: dwindle.smart_split}}
      smartResizing:
        type: boolean
        title: Resize by cursor position
        x-group: Layout
        default: true
        x-showIf: {layout: dwindle}
        x-compositor: {hyprland: {key: dwindle.smart_resizing}}
      forceSplit:
        type: string
        title: New windows go
        x-group: Layout
        enum: ['0', '1', '2']
        x-enumLabels: {'0': Towards the cursor, '1': Left or above, '2': Right or below}
        default: '0'
        x-showIf: {layout: dwindle}
        x-compositor: {hyprland: {key: dwindle.force_split, value: number}}
      splitRatio:
        type: integer
        title: Split ratio
        x-unit: '%'
        x-group: Layout
        default: 100
        minimum: 10
        maximum: 190
        description: '100: even split.'
        x-showIf: {layout: dwindle}
        x-compositor: {hyprland: {key: dwindle.default_split_ratio, scale: 0.01}}
      masterSize:
        type: integer
        title: Master size
        x-unit: '%'
        x-group: Layout
        default: 55
        minimum: 5
        maximum: 95
        x-showIf: {layout: master}
        x-compositor: {hyprland: {key: master.mfact, scale: 0.01}}
      masterOrientation:
        type: string
        title: Master side
        x-group: Layout
        enum: [left, right, top, bottom, center]
        x-enumLabels: {left: Left, right: Right, top: Top, bottom: Bottom, center: Center}
        default: left
        x-showIf: {layout: master}
        x-compositor: {hyprland: {key: master.orientation}}
      masterNewStatus:
        type: string
        title: New windows become
        x-group: Layout
        enum: [slave, master, inherit]
        x-enumLabels:
          slave: Part of the stack
          master: The master
          inherit: Like the focused window
        default: slave
        x-showIf: {layout: master}
        x-compositor: {hyprland: {key: master.new_status}}
      snap:
        type: boolean
        title: Window snapping
        x-group: Windows
        default: false
        description: To each other and the screen edges.
        x-compositor: {hyprland: {key: general.snap.enabled}}
      resizeOnBorder:
        type: boolean
        title: Resize by dragging borders
        x-group: Windows
        default: true
        x-compositor: {hyprland: {key: general.resize_on_border, always: true}}
      floatSwitchOverrideFocus:
        type: string
        title: Focus across tiled/floating
        x-link: {setting: WindowBehaviour.followMouse}
        x-group: Windows
        enum: ['0', '1', '2']
        x-enumLabels:
          '0': Leaves focus alone
          '1': Moves focus
          '2': Moves focus, also floating to floating
        default: '1'
        x-showIf: {/WindowBehaviour.followMouse: true}
        x-compositor: {hyprland: {key: input.float_switch_override_focus, value: number}}
      swallow:
        type: boolean
        title: Window swallowing
        x-group: Windows
        default: true
        description: A GUI app started from a terminal takes its place until it closes.
        x-compositor: {hyprland: {key: misc.enable_swallow, always: true}}
      swallowRegex:
        type: string
        title: Swallowing terminals
        x-group: Windows
        default: '^(kitty|foot|Alacritty|com\.mitchellh\.ghostty|org\.wezfurlong\.wezterm)$'
        description: A regex of terminal window classes.
        x-showIf: {swallow: true}
        x-compositor: {hyprland: {key: misc.swallow_regex, if: swallow}}
      closeSpecialOnEmpty:
        type: boolean
        title: Close when empty
        x-group: Special workspaces
        default: true
        x-compositor: {hyprland: {key: misc.close_special_on_empty}}
      hideSpecialOnWorkspaceChange:
        type: boolean
        title: Hide on switching
        x-group: Special workspaces
        default: false
        x-compositor: {hyprland: {key: binds.hide_special_on_workspace_change}}
      dimSpecial:
        x-scope: look
        type: integer
        title: Dim behind
        description: '0: no dimming.'
        x-unit: '%'
        x-group: Special workspaces
        default: 20
        minimum: 0
        maximum: 100
        x-compositor: {hyprland: {key: decoration.dim_special, scale: 0.01}}
      animations:
        x-scope: look
        type: boolean
        title: Animations
        x-group: Animations
        default: true
        x-compositor: {hyprland: {key: animations.enabled, always: true}}
      animationPreset:
        x-link: {setting: Appearance.motion}
        x-scope: look
        type: string
        title: Style
        x-group: Animations
        enum: [hyprland, axiom, instant, snappy, bouncy, lightning, custom]
        x-enumLabels:
          hyprland: Hyprland's defaults
          axiom: Follow axiom's motion
          instant: Instant
          snappy: Snappy
          bouncy: Bouncy
          lightning: Lightning
          custom: Custom
        default: axiom
        x-showIf: {animations: true}
      workspaceWraparound:
        type: boolean
        title: Workspace wrap-around
        x-group: Animations
        default: false
        description: Going from the last workspace to the first slides forward.
        x-showIf: {animations: true}
        x-compositor: {hyprland: {key: animations.workspace_wraparound}}
      curves:
        x-scope: look
        x-wide: true
        type: array
        title: Curves
        x-group: Animations
        default: []
        description: Named bezier curves.
        x-showIf: {animations: true, animationPreset: custom}
        items:
          type: object
          additionalProperties: false
          properties:
            id: {$ref: '#/definitions/ItemId'}
            name: {type: string, title: Name, default: ''}
            points:
              type: string
              title: Points
              default: '0.25, 0.1, 0.25, 1'
              description: x1, y1, x2, y2, as in CSS cubic-bezier().
          required: [id]
      customAnimations:
        x-scope: look
        type: array
        title: Custom animations
        x-group: Animations
        default: []
        description: One entry per animation; a parent (windows) covers its children.
        x-showIf: {animations: true, animationPreset: custom}
        items:
          type: object
          additionalProperties: false
          properties:
            id: {$ref: '#/definitions/ItemId'}
            leaf:
              type: string
              title: Animation
              enum:
                - global
                - windows
                - windowsIn
                - windowsOut
                - windowsMove
                - layers
                - layersIn
                - layersOut
                - fade
                - fadeIn
                - fadeOut
                - fadeSwitch
                - fadeShadow
                - fadeDim
                - border
                - borderangle
                - workspaces
                - workspacesIn
                - workspacesOut
                - specialWorkspace
                - specialWorkspaceIn
                - specialWorkspaceOut
                - zoomFactor
                - monitorAdded
              default: windows
            enabled: {type: boolean, title: 'On', default: true}
            duration:
              type: integer
              title: Duration
              x-unit: ms
              default: 300
              minimum: 10
              maximum: 5000
            curve:
              type: string
              title: Curve
              default: default
              description: A curve's name from above, or default.
            style:
              type: string
              title: Style
              default: ''
              description: 'e.g. popin 80%, slidefade 20%, fade. Empty: none.'
          required: [id]
      hideLogo:
        x-scope: look
        type: boolean
        title: Hide logo and splash
        x-group: Look
        default: true
        x-compositor:
          hyprland: {key: [misc.disable_hyprland_logo, misc.disable_splash_rendering], always: true}
      backgroundThemed:
        x-scope: look
        type: boolean
        title: Background in a theme color
        x-group: Look
        default: false
        description: What shows where there's no wallpaper.
      backgroundColor:
        x-scope: look
        type: string
        title: Background color
        x-group: Look
        x-options: colors
        default: base00
        x-showIf: {backgroundThemed: true}
        x-compositor: {hyprland: {key: misc.background_color, value: color, if: backgroundThemed}}
      mouseWakesScreen:
        x-scope: machine
        type: boolean
        title: Mouse wakes the screen
        x-group: Screen and input
        default: true
        x-compositor: {hyprland: {key: misc.mouse_move_enables_dpms, always: true}}
      keyWakesScreen:
        x-scope: machine
        type: boolean
        title: Keys wake the screen
        x-group: Screen and input
        default: false
        x-compositor: {hyprland: {key: misc.key_press_enables_dpms}}
      vrr:
        x-scope: machine
        type: string
        title: Variable refresh rate
        x-group: Screen and input
        enum: ['0', '1', '2']
        x-enumLabels: {'0': 'Off', '1': 'On', '2': Fullscreen only}
        default: '0'
        x-compositor: {hyprland: {key: misc.vrr, value: number}}
      scrollEventDelay:
        x-scope: machine
        type: integer
        title: Scroll bind delay
        x-unit: ms
        x-group: Screen and input
        default: 300
        minimum: 0
        maximum: 2000
        description: How long a bound scroll ignores further scrolling.
        x-compositor: {hyprland: {key: binds.scroll_event_delay}}
      xwaylandZeroScaling:
        x-scope: machine
        type: boolean
        title: Unscaled X11 apps
        x-group: Screen and input
        default: true
        description: X11 apps draw at native resolution on scaled monitors.
        x-compositor: {hyprland: {key: xwayland.force_zero_scaling, always: true}}
  sway:
    x-scope: personal
    type: object
    x-showIf: {/$compositor: sway, /Compositor.mode: managed}
    title: Managed config
    description: Written into the managed config. Anything else goes in ~/.config/sway/user/.
    additionalProperties: false
    properties:
      workspaceLayout:
        type: string
        title: New workspace layout
        x-control: toggle
        enum: [default, stacking, tabbed]
        x-enumLabels: {default: Tiled, stacking: Stacked, tabbed: Tabbed}
        default: default
        x-compositor: {sway: {key: 'workspace_layout {}'}}
      smartGaps:
        x-scope: look
        type: string
        title: Smart gaps
        enum: ['off', 'on', inverse_outer]
        x-enumLabels:
          'off': 'Off'
          'on': No gaps around a lone window
          inverse_outer: Outer gaps only around a lone window
        default: 'off'
        x-compositor: {sway: {key: 'smart_gaps {}'}}
      hideEdgeBorders:
        x-scope: look
        type: string
        title: Hide edge borders
        enum: [none, vertical, horizontal, both, smart, smart_no_gaps]
        x-enumLabels:
          none: Never
          vertical: Left and right
          horizontal: Top and bottom
          both: All
          smart: With one window
          smart_no_gaps: With one window and no gaps
        default: none
        x-compositor: {sway: {key: 'hide_edge_borders {}'}}
      focusWrapping:
        type: string
        title: Focus wrapping
        enum: ['yes', 'no', force, workspace]
        x-enumLabels:
          'yes': Within a container
          'no': Never
          force: Always
          workspace: Within the workspace
        default: 'yes'
        x-compositor: {sway: {key: 'focus_wrapping {}'}}
      popupDuringFullscreen:
        type: string
        title: Popups in fullscreen
        enum: [smart, ignore, leave_fullscreen]
        x-enumLabels: {smart: Show its own, ignore: Never show, leave_fullscreen: Leave fullscreen}
        default: smart
        x-compositor: {sway: {key: 'popup_during_fullscreen {}'}}
      font:
        x-scope: look
        type: string
        title: Title bar font
        default: ''
        description: 'e.g. pango:Inter 10. Empty: sway''s.'
        x-compositor: {sway: {key: 'font {}', value: raw, skip: ''}}
      xwayland:
        x-scope: machine
        type: string
        title: X11 apps
        enum: [enable, disable, force]
        x-enumLabels: {enable: When one starts, disable: 'Off', force: Always running}
        default: enable
        x-compositor: {sway: {key: 'xwayland {}'}}
  niri:
    x-scope: personal
    type: object
    x-showIf: {/$compositor: niri, /Compositor.mode: managed}
    title: Managed config
    description: Written into the managed config. Anything else goes in ~/.config/niri/user/.
    additionalProperties: false
    properties:
      centerFocusedColumn:
        type: string
        title: Center focused column
        enum: [never, always, on-overflow]
        x-enumLabels:
          never: Never
          always: Always
          on-overflow: When it doesn't fit beside the last one
        default: never
        x-compositor: {niri: {key: layout.center-focused-column}}
      alwaysCenterSingleColumn:
        type: boolean
        title: Center a lone column
        default: false
        x-compositor: {niri: {key: layout.always-center-single-column}}
      defaultColumnDisplay:
        x-scope: look
        type: string
        title: New column display
        x-control: toggle
        enum: [normal, tabbed]
        x-enumLabels: {normal: Stacked, tabbed: Tabs}
        default: normal
        x-compositor: {niri: {key: layout.default-column-display}}
      tabIndicator:
        x-scope: look
        type: boolean
        title: Tab indicator
        default: true
        description: A bar beside a tabbed column, a segment per tab.
        x-compositor: {niri: {key: layout.tab-indicator, value: onOff}}
      emptyWorkspaceAboveFirst:
        type: boolean
        title: Empty workspace above first
        default: false
        x-compositor: {niri: {key: layout.empty-workspace-above-first}}
      overviewZoom:
        x-scope: look
        type: integer
        title: Overview zoom
        x-unit: '%'
        default: 50
        minimum: 10
        maximum: 75
        x-compositor: {niri: {key: overview.zoom, scale: 0.01, value: float}}
      preferNoCsd:
        type: boolean
        title: No title bars on windows
        default: false
        description: Ask apps to drop their own title bar and shadow. Open apps change once restarted.
        x-compositor: {niri: {key: prefer-no-csd}}
      animations:
        x-scope: look
        type: boolean
        title: Animations
        default: true
        x-compositor: {niri: {key: animations, value: onOff}}
      animationSlowdown:
        x-scope: look
        type: integer
        title: Animation length
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 1000
        description: 100 is niri's own speed; more is slower.
        x-showIf: {animations: true}
        x-compositor:
          niri: {key: animations.slowdown, scale: 0.01, value: float, skip: 100}
      skipHotkeyOverlay:
        type: boolean
        title: Skip hotkey help at start
        default: true
        x-compositor: {niri: {key: hotkey-overlay.skip-at-startup}}
      primaryClipboard:
        type: boolean
        title: Middle-click paste
        default: true
        x-compositor: {niri: {key: clipboard.disable-primary, value: not}}
      xwayland:
        x-scope: machine
        type: boolean
        title: X11 apps
        default: true
        description: Runs X11 apps when xwayland-satellite is installed.
        x-compositor: {niri: {key: xwayland-satellite, value: onOff}}
