# The Desktop section of the config (config.json's "Desktop").

type: object
x-scope: look
x-settings: false
title: Desktop
additionalProperties: false
properties:
  items:
    type: array
    default:
      - id: all
        enabled: false
        screen: {mode: all, names: []}
      - id: primary
        modules:
          - id: clock
            type: Clock
            place: {x: 1, 'y': 1, w: 3, h: 3}
        screen: {mode: primary, names: []}
    items: {$ref: '#/definitions/DesktopLayout'}
