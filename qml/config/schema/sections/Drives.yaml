# The Drives section of the config (config.json's "Drives").

type: object
x-category: Modules
title: Removable drives
description: How removable drives are announced and handled.
additionalProperties: false
x-order: [onInsert, warnUnplugged, notify, ignore]
properties:
  onInsert:
    type: string
    title: When plugged in
    x-control: toggle
    enum: [ask, mount, nothing]
    x-enumLabels: {ask: Ask, mount: Mount, nothing: Nothing}
    default: ask
    description: 'Ask: offer to mount or open. Nothing: leave it to the Drives widget.'
    x-link: {setting: Apps}
  warnUnplugged:
    type: boolean
    title: Warn on unplug
    default: true
    description: Files still being written can be lost.
  notify:
    type: boolean
    title: Notifications
    default: true
    description: Plugged in, mounted, unmounted, safe to remove, unplugged, failed.
    x-link: {setting: OSD}
  ignore:
    x-scope: machine
    type: array
    items: {type: string}
    title: Ignored drives
    default: []
    description: Volume UUIDs or labels (see `lsblk -f`).
