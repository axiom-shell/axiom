# The Drives section of the config (config.json's "Drives").

type: object
x-category: Modules
title: Removable drives
description: How removable drives are announced and handled.
additionalProperties: false
x-order: [notify, onInsert, warnUnplugged, ignore]
properties:
  notify:
    type: boolean
    title: Drive event notifications
    default: true
    description: Notify when a drive is plugged in, mounted, unmounted, safe to remove or unplugged, or fails.
    x-link: {setting: OSD}
  onInsert:
    type: string
    title: When a drive is plugged in
    x-control: toggle
    enum: [ask, mount, nothing]
    x-enumLabels:
      ask: Ask
      mount: Mount it
      nothing: Do nothing
    default: ask
    description: Ask offers to mount or open it. Mount it mounts it at once, once unlocked. Do nothing leaves it to the Drives widget and module.
    x-link: {setting: Apps}
  warnUnplugged:
    type: boolean
    title: Warn when unplugged without ejecting
    default: true
    description: Files still being written can be lost.
  ignore:
    x-scope: machine
    type: array
    items: {type: string}
    title: Ignored drives
    default: []
    description: Volume UUIDs or labels to leave alone (see `lsblk -f`).
