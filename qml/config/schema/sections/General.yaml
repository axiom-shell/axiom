# The General section of the config (config.json's "General").

type: object
x-category: General
x-card: {file: Account, title: Account, wide: true}
title: General
additionalProperties: false
properties:
  language:
    x-scope: personal
    type: string
    title: Language
    default: en
    x-options: languages
  displayName:
    type: string
    title: Display name
    default: ''
    description: Shown on the lock screen and in chat. Empty uses your login name.
  primaryMonitor:
    type: string
    title: Primary monitor
    default: ''
    description: Hosts the lock screen's password field and single-monitor surfaces. Empty uses the first screen.
    x-options: screens
    x-emptyLabel: First screen
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the overlay, launcher, power menu and OSD appear, unless they set their own.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [primary, focused, all]
        default: primary
        x-enumLabels:
          primary: Primary monitor only
          focused: Focused monitor only
          all: Every monitor
      names: null
