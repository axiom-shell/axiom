# The General section of the config (config.json's "General").

type: object
x-category: General
x-card: {file: Account, title: Account, wide: true}
title: General
additionalProperties: false
properties:
  primaryMonitor:
    type: string
    title: Primary monitor
    default: ''
    description: Where the lock password and single-monitor surfaces go.
    x-options: screens
    x-emptyLabel: First screen
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Default monitors for overlay, launcher, power menu and OSD.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        x-control: toggle
        enum: [primary, focused, all]
        default: primary
        x-enumLabels: {primary: Primary, focused: Focused, all: All}
      names: null
  language:
    x-scope: personal
    type: string
    title: Language
    default: en
    x-options: languages
  displayName:
    type: string
    title: Display name
    default: ''
    description: 'Empty: your login name.'
