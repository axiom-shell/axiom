# The Greeter section of the config (config.json's "Greeter").

type: object
x-category: Screen & Power
x-card: {file: GreeterStatus, title: greetd}
x-links: ['Layouts:greeter']
title: Login screen
description: Axiom as your login screen (a greetd greeter), laid out on the Layouts page.
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Login monitor
    description: Login box on one monitor; others show the layout or only the background.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        x-control: toggle
        enum: [primary, named]
        default: primary
        x-enumLabels: {primary: Primary, named: Chosen}
  rememberUser:
    type: boolean
    title: Remember user
    default: true
    description: 'Off: start with an empty user field.'
  source:
    type: string
    title: Source
    x-showIf: {/$packaged: false, /$clone: true}
    x-control: toggle
    enum: [git, local]
    x-enumLabels: {git: Git, local: Local}
    default: git
    description: 'Git: newest official release, checksum-verified. Local: your clone as is; anything running as you can change it.'
  enabled:
    type: boolean
    x-takeover: true
    x-recommended: true
    x-settings: false
    title: Use axiom's login screen
    default: false
    description: Set by the card's Install and Remove.
  layout:
    x-scope: look
    $ref: '#/definitions/ScreenLayout'
    x-settings: false
    title: Login screen
    description: Edited on the Layouts page.
    default:
      modules:
        - id: clockCalendar
          type: ClockCalendar
          place: {x: 0, 'y': 0, w: 4, h: 2}
        - id: greeting
          type: Greeting
          place: {x: 4, 'y': 2, w: 8, h: 2}
        - id: login
          type: Login
          place: {x: 5, 'y': 4, w: 6, h: 3}
        - id: session
          type: Session
          place: {x: 6, 'y': 7, w: 4, h: 1}
        - id: keyboardLayout
          type: KeyboardLayout
          place: {x: 0, 'y': 8, w: 2, h: 1}
        - id: power
          type: Power
          place: {x: 13, 'y': 8, w: 3, h: 1}
