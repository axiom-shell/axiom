# The HotCorners section of the config (config.json's "HotCorners").

x-scope: personal
type: object
x-category: Overlay & Popouts
title: Hot corners
description: Screen corners that run an action when the pointer reaches them, on every compositor.
additionalProperties: false
properties:
  items:
    x-wide: true
    type: array
    title: Hot corners
    default: []
    description: "Each runs its action once the pointer has rested in its corner for its delay, and again only after the pointer has left. A corner takes the screen's last pixel: a click there doesn't reach what's under it. Quiet over fullscreen windows."
    items:
      x-scopeIf:
        when: {action: exec}
        scope: commands
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        corner:
          type: string
          title: Corner
          enum: [topLeft, topRight, bottomLeft, bottomRight]
          x-enumLabels: {topLeft: Top left, topRight: Top right, bottomLeft: Bottom left, bottomRight: Bottom right}
          default: topLeft
        action:
          type: string
          title: Action
          # A stray pointer fires a corner: none of the actions that lose state
          # or move a window with no sign
          x-axiomActions: {except: [clearNotifications, moveWindowStep, moveWindowStepSilent, moveWindowNth, moveWindowNthSilent, stopwatchReset, timerReset, pomodoroStop]}
          default: workspaceOverview
        argument:
          type: string
          title: Argument
          default: ''
          description: 'Search text, page, edge menu, dock or bar id (focused: the auto-hiding bars on the focused monitor), direction, workspace number, screenshot kind (region, window or screen), timer length (10m, 1:30), or the command.'
        call:
          type: string
          title: Call
          default: toggle
          enum: [toggle, open, close]
          x-enumLabels: {toggle: Toggle, open: Open, close: Close}
          description: 'For actions that open and close or turn on and off something: whether the corner toggles it, only opens it or only closes it.'
        screen:
          $ref: '#/definitions/ScreenTarget'
          title: Monitors
          x-properties:
            mode:
              x-scope: machine
              type: string
              title: Monitors
              enum: [all, primary, named]
              default: all
              x-enumLabels: {all: Every monitor, primary: Primary monitor, named: These monitors}
            names:
              x-scope: machine
              x-monitorRef: drop
              type: array
              title: Monitors
              default: []
              items: {type: string, x-options: screens}
              x-showIf: {mode: named}
        delay:
          type: integer
          title: Delay
          x-unit: ms
          default: 0
          minimum: 0
          maximum: 5000
          description: How long the pointer rests in the corner before the action runs.
      required: [id]
