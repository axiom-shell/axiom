# The HotCorners section of the config (config.json's "HotCorners").

x-scope: personal
type: object
x-category: Overlay & Popouts
title: Hot corners
description: Screen corners that run an action when the pointer reaches them.
additionalProperties: false
properties:
  items:
    x-wide: true
    type: array
    title: Hot corners
    default: []
    description: Acts once the pointer rests in a corner for its delay. Quiet over fullscreen windows.
    items:
      x-scopeIf:
        when: {action: exec}
        scope: commands
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        corner:
          type: string
          title: Corner
          enum: [topLeft, topRight, bottomLeft, bottomRight]
          x-enumLabels: {topLeft: Top left, topRight: Top right, bottomLeft: Bottom left, bottomRight: Bottom right}
          default: topLeft
        screen:
          $ref: '#/definitions/ScreenTarget'
          title: Monitors
          x-properties:
            mode:
              x-scope: machine
              type: string
              title: Monitors
              enum: [all, primary, named]
              default: all
              x-enumLabels: {all: Every monitor, primary: Primary monitor, named: These monitors}
            names:
              x-scope: machine
              x-monitorRef: drop
              type: array
              title: Monitors
              default: []
              items: {type: string, x-options: screens}
              x-showIf: {mode: named}
        action:
          type: string
          title: Action
          # A stray pointer fires a corner: none of the actions that lose state,
          # move a window with no sign or end the session
          x-axiomActions: {except: [clearNotifications, moveWindowStep, moveWindowStepSilent, moveWindowNth, moveWindowNthSilent, stopwatchReset, timerReset, pomodoroStop, reboot, poweroff]}
          default: workspaceOverview
        argument:
          type: string
          title: Argument
          default: ''
          description: Search text, id, direction, workspace, kind, theme, timer length or command.
        call:
          type: string
          title: Call
          default: toggle
          x-control: toggle
          enum: [toggle, open, close]
          x-enumLabels: {toggle: Toggle, open: Open, close: Close}
        delay:
          type: integer
          title: Delay
          x-unit: ms
          default: 0
          minimum: 0
          maximum: 5000
      required: [id]
