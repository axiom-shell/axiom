# The Idle section of the config (config.json's "Idle").

x-scope: personal
type: object
x-category: Screen & Power
x-card: {file: IdleStatus, title: Idle}
title: Idle
description: Dimming, locking, turning screens off and suspending when you step away.
additionalProperties: false
properties:
  enabled:
    x-scope: machine
    type: boolean
    x-takeover: true
    title: Handle idle
    default: false
    description: 'Replaces an idle daemon such as hypridle: remove yours while this is on.'
  dim:
    type: object
    title: Dim
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Dim the screens after
        x-unit: s
        default: 150000
        minimum: 0
        maximum: 7200000
        description: 0 never dims.
      mode:
        type: string
        title: Dim
        default: to
        enum: [to, by]
        x-enumLabels: {to: To a set brightness, by: By a share of the current brightness}
        description: A set level leaves darker screens alone; a share always dims.
      level:
        type: integer
        title: Dim to
        x-unit: '%'
        default: 30
        minimum: 5
        maximum: 100
        x-showIf: {mode: to}
      by:
        type: integer
        title: Dim by
        x-unit: '%'
        default: 50
        minimum: 5
        maximum: 95
        description: 50% takes 80% down to 40%.
        x-showIf: {mode: by}
    x-showIf: {enabled: true}
    x-group: Idle
  lock:
    type: object
    title: Lock
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Lock after
        x-unit: s
        default: 300000
        minimum: 0
        maximum: 7200000
        description: 0 never locks on idle.
    x-showIf: {enabled: true}
    x-group: Idle
  screenOff:
    type: object
    title: Screen off
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Turn the screens off after
        x-unit: s
        default: 330000
        minimum: 0
        maximum: 7200000
        description: 0 keeps them on.
    x-showIf: {enabled: true}
    x-group: Idle
  suspend:
    type: object
    title: Suspend
    additionalProperties: false
    properties:
      timeout:
        type: integer
        title: Suspend after
        x-unit: s
        default: 0
        minimum: 0
        maximum: 14400000
        description: 0 never suspends on idle.
    x-showIf: {enabled: true}
    x-group: Idle
  lockBeforeSleep:
    type: boolean
    title: Lock before sleep
    x-group: Sleep
    default: true
    x-showIf: {enabled: true}
  screenOnAfterSleep:
    type: boolean
    title: Screens on after sleep
    x-group: Sleep
    default: true
    x-showIf: {enabled: true}
  respectInhibitors:
    type: boolean
    title: Respect apps that keep the screen on
    x-group: Sleep
    default: true
    description: Let video players and browsers keep the screen awake.
    x-showIf: {enabled: true}
  caffeineWarning:
    type: boolean
    title: Warn before caffeine ends
    x-group: Caffeine
    default: true
    description: A notification 5 minutes before a caffeine timer ends.
  items:
    x-scope: commands
    type: array
    title: Extra listeners
    x-group: Idle listeners
    default: []
    description: Commands of your own to run after a time idle, and when you return.
    x-showIf: {enabled: true}
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        timeout:
          type: integer
          title: After
          x-unit: s
          default: 600000
          minimum: 1000
          maximum: 14400000
        onTimeout: {type: string, title: Run, default: ''}
        onResume: {type: string, title: On return, default: ''}
        enabled: {type: boolean, title: 'On', default: true}
      required: [id]
