# The Input section of the config (config.json's "Input").

type: object
x-category: General
title: Input
description: Keyboard, input methods, mouse, touchpad and cursor. A part that's on overrides your compositor's config.
additionalProperties: false
properties:
  keyboard:
    type: object
    title: Keyboard
    additionalProperties: false
    properties:
      enabled:
        x-greeter: true
        type: boolean
        title: Set the keyboard
        default: false
        description: Off, your compositor's config applies.
        x-showIf: {/$supports.inputConfig: true}
      sources:
        x-scope: personal
        x-greeter: true
        x-row: InputSourcesField
        x-rowDraws: [method.enabled]
        type: array
        title: Layouts
        default:
          - {id: us, kind: xkb, layout: us, variant: '', engine: ''}
        description: Layouts and input method engines, switched between in order. The first is the one you start on.
        x-compositor:
          hyprland:
            - {key: input.kb_layout, from: xkbLayout, if: enabled}
            - {key: input.kb_variant, from: xkbVariant, if: enabled}
          sway:
            - {key: 'input type:keyboard xkb_layout {}', from: xkbLayout, if: enabled}
            - {key: 'input type:keyboard xkb_variant {}', from: xkbVariant, if: enabled}
          niri:
            - {key: input.keyboard.xkb.layout, from: xkbLayout, if: enabled}
            - {key: input.keyboard.xkb.variant, from: xkbVariant, if: enabled}
        items:
          type: object
          additionalProperties: false
          properties:
            id: {$ref: '#/definitions/ItemId'}
            kind:
              type: string
              title: Kind
              enum: [xkb, ime]
              x-enumLabels: {xkb: Keyboard layout, ime: Input method}
              default: xkb
            layout:
              type: string
              title: Layout
              default: ''
              description: An XKB layout (us, de). For an input method, the layout it types on; empty, the first.
            variant:
              type: string
              title: Variant
              default: ''
              description: The layout's XKB variant (colemak), or empty.
            engine:
              type: string
              title: Engine
              default: ''
              description: The input method's engine (e.g. pinyin, hangul).
              x-showIf: {kind: ime}
          required: [id]
      method:
        type: object
        title: Input method options
        x-fold: true
        x-showIf: {/$supports.inputMethod: true, method.enabled: true}
        additionalProperties: false
        properties:
          enabled:
            x-scope: personal
            type: boolean
            title: Type other languages with an input method
            default: false
            description: Let axiom manage fcitx5 or ibus, to type Japanese, Chinese, Korean and more.
          framework:
            x-scope: personal
            type: string
            title: Input method framework
            enum: [auto, none, fcitx5, ibus]
            x-enumLabels: {auto: Whichever is running, none: None, fcitx5: fcitx5 (recommended), ibus: ibus}
            default: fcitx5
            x-showIf: {enabled: true}
            description: fcitx5 supports every option below; ibus only listing and switching engines.
          autostart:
            x-scope: commands
            type: boolean
            title: Start the input method
            default: true
            description: Start the framework with the compositor and set the environment apps need.
            x-showIf: {enabled: true, /$supports.configModes: true, /Compositor.mode: managed, framework: {not: none}}
          legacyApps:
            type: boolean
            title: Older and X11 apps
            default: false
            description: Also set GTK_IM_MODULE and QT_IM_MODULE for X11 apps. Can break typing in GTK apps on Wayland.
            x-showIf: {enabled: true, /$supports.configModes: true, /Compositor.mode: managed, framework: {not: none}}
          shareState:
            x-scope: personal
            type: string
            title: Share the input method between windows
            enum: ['No', All, Program]
            x-enumLabels: {'No': 'No', All: Every window, Program: Windows of the same app}
            default: 'No'
            description: Switching in one window switches it in others too. fcitx5 only.
            x-showIf: {enabled: true, framework: [auto, fcitx5]}
          verticalCandidates:
            x-scope: personal
            type: boolean
            title: Candidates in a column
            default: false
            description: List candidates top to bottom instead of in a row. fcitx5 only.
            x-showIf: {enabled: true, framework: [auto, fcitx5]}
          candidateFont:
            x-scope: look
            type: string
            title: Candidate font
            default: ''
            description: Font and size, e.g. "Noto Sans CJK JP 12". Empty keeps the framework's.
            x-showIf: {enabled: true, framework: {not: none}}
          showSwitchPopup:
            x-scope: personal
            type: boolean
            title: fcitx5's switch popup
            default: false
            description: Off, axiom's OSD shows the switch. fcitx5 only.
            x-showIf: {enabled: true, framework: [auto, fcitx5]}
      options:
        x-scope: personal
        x-greeter: true
        type: string
        title: XKB options
        default: ''
        description: 'e.g. caps:escape,grp:alt_shift_toggle.'
        x-compositor:
          hyprland: {key: input.kb_options, if: enabled}
          sway: {key: 'input type:keyboard xkb_options {}', if: enabled}
          niri: {key: input.keyboard.xkb.options, if: enabled}
        x-showIf: {enabled: true, /$supports.inputConfig: true}
      repeatRate:
        x-scope: personal
        x-greeter: true
        type: integer
        x-control: stepper
        title: Key repeat rate
        default: 50
        minimum: 1
        maximum: 100
        x-compositor:
          hyprland: {key: input.repeat_rate, if: enabled}
          sway: {key: 'input type:keyboard repeat_rate {}', if: enabled}
          niri: {key: input.keyboard.repeat-rate, if: enabled}
        x-showIf: {enabled: true, /$supports.inputConfig: true}
      repeatDelay:
        x-scope: personal
        x-greeter: true
        type: integer
        title: Key repeat delay
        default: 300
        minimum: 100
        maximum: 2000
        x-compositor:
          hyprland: {key: input.repeat_delay, if: enabled}
          sway: {key: 'input type:keyboard repeat_delay {}', if: enabled}
          niri: {key: input.keyboard.repeat-delay, if: enabled}
        x-showIf: {enabled: true, /$supports.inputConfig: true}
      numlock:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Num Lock on at start
        default: true
        x-compositor:
          hyprland: {key: input.numlock_by_default, if: enabled}
          sway: {key: 'input type:keyboard xkb_numlock {}', value: enabled, configOnly: true, if: enabled}
          niri: {key: input.keyboard.numlock, if: enabled}
        x-showIf: {enabled: true, /$supports.inputConfig: true}
    x-group: Keyboard
  mouse:
    type: object
    title: Mouse
    additionalProperties: false
    properties:
      enabled:
        x-greeter: true
        type: boolean
        title: Set the mouse
        default: false
        description: Off, your compositor's config applies.
      accel:
        x-greeter: true
        type: string
        title: Pointer acceleration
        enum: [default, flat, adaptive]
        x-enumLabels: {default: Device default, flat: Flat (none), adaptive: Adaptive}
        default: default
        x-compositor:
          hyprland: {key: input.accel_profile, skip: default, if: enabled}
          sway: {key: 'input type:pointer accel_profile {}', skip: default, if: enabled}
          niri: {key: input.mouse.accel-profile, skip: default, if: enabled}
        x-showIf: {enabled: true}
      sensitivity:
        x-greeter: true
        type: integer
        title: Pointer speed
        default: 0
        minimum: -100
        maximum: 100
        description: '-100 to 100; 0 leaves it as the device reports.'
        x-compositor:
          hyprland: {key: input.sensitivity, scale: 0.01, if: enabled}
          sway: {key: 'input type:pointer pointer_accel {}', scale: 0.01, if: enabled}
          niri: {key: input.mouse.accel-speed, scale: 0.01, value: float, if: enabled}
        x-showIf: {enabled: true}
      leftHanded:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Left-handed buttons
        default: false
        x-compositor:
          hyprland: {key: input.left_handed, if: enabled}
          sway: {key: 'input type:pointer left_handed {}', value: enabled, if: enabled}
          niri: {key: input.mouse.left-handed, value: flag, if: enabled}
        x-showIf: {enabled: true}
    x-group: Mouse & cursor
    x-showIf: {/$supports.inputConfig: true}
  touchpad:
    type: object
    title: Touchpad
    additionalProperties: false
    properties:
      enabled:
        x-greeter: true
        type: boolean
        title: Set the touchpad
        default: false
        description: Off, your compositor's config applies.
      naturalScroll:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Natural scrolling
        default: false
        x-compositor:
          hyprland: {key: input.touchpad.natural_scroll, if: enabled}
          sway: {key: 'input type:touchpad natural_scroll {}', value: enabled, if: enabled}
          niri: {key: input.touchpad.natural-scroll, value: flag, if: enabled}
        x-showIf: {enabled: true}
      tapToClick:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Tap to click
        default: true
        x-compositor:
          hyprland: {key: input.touchpad.tap_to_click, if: enabled}
          sway: {key: 'input type:touchpad tap {}', value: enabled, if: enabled}
          niri: {key: input.touchpad.tap, value: flag, if: enabled}
        x-showIf: {enabled: true}
      disableWhileTyping:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Off while typing
        default: true
        x-compositor:
          hyprland: {key: input.touchpad.disable_while_typing, if: enabled}
          sway: {key: 'input type:touchpad dwt {}', value: enabled, if: enabled}
          niri: {key: input.touchpad.dwt, value: flag, if: enabled}
        x-showIf: {enabled: true}
      scrollFactor:
        x-greeter: true
        type: integer
        title: Scroll speed
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 500
        x-compositor:
          hyprland: {key: input.touchpad.scroll_factor, scale: 0.01, if: enabled}
          sway: {key: 'input type:touchpad scroll_factor {}', scale: 0.01, if: enabled}
          niri: {key: input.touchpad.scroll-factor, scale: 0.01, value: float, if: enabled}
        x-showIf: {enabled: true}
      accel:
        x-greeter: true
        type: string
        title: Pointer acceleration
        enum: [default, flat, adaptive]
        x-enumLabels: {default: Device default, flat: Flat (none), adaptive: Adaptive}
        default: default
        x-compositor:
          hyprland: {device: touchpad, key: accel_profile, skip: default, if: enabled}
          sway: {key: 'input type:touchpad accel_profile {}', skip: default, if: enabled}
          niri: {key: input.touchpad.accel-profile, skip: default, if: enabled}
        x-showIf: {enabled: true}
      sensitivity:
        x-greeter: true
        type: integer
        title: Pointer speed
        default: 0
        minimum: -100
        maximum: 100
        description: '-100 to 100; 0 leaves it as the device reports.'
        x-compositor:
          hyprland: {device: touchpad, key: sensitivity, scale: 0.01, if: enabled}
          sway: {key: 'input type:touchpad pointer_accel {}', scale: 0.01, if: enabled}
          niri: {key: input.touchpad.accel-speed, scale: 0.01, value: float, if: enabled}
        x-showIf: {enabled: true}
      leftHanded:
        x-scope: personal
        x-greeter: true
        type: boolean
        title: Left-handed buttons
        default: false
        x-compositor:
          hyprland: {device: touchpad, key: left_handed, if: enabled}
          sway: {key: 'input type:touchpad left_handed {}', value: enabled, if: enabled}
          niri: {key: input.touchpad.left-handed, value: flag, if: enabled}
        x-showIf: {enabled: true}
    x-group: Touchpad
    x-showIf: {/$supports.inputConfig: true}
  cursor:
    type: object
    title: Cursor
    additionalProperties: false
    properties:
      enabled:
        x-greeter: true
        type: boolean
        title: Set the cursor
        default: false
        description: Off, the cursor is left alone.
      theme:
        x-scope: look
        x-greeter: true
        type: string
        title: Cursor theme
        x-options: cursorThemes
        x-enumLabels: {'': None}
        default: ''
        x-showIf: {enabled: true}
      size:
        x-scope: look
        x-greeter: true
        type: integer
        x-control: stepper
        title: Cursor size
        default: 24
        minimum: 8
        maximum: 128
        x-showIf: {enabled: true}
    x-group: Mouse & cursor
    x-showIf: {/$supports.inputConfig: true}
