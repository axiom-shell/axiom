# The Interface section of the config (config.json's "Interface").

x-scope: look
type: object
x-category: Look & Feel
title: Panels & controls
description: Sizing outside the bars. Each bar has its own, in the bar editor.
additionalProperties: false
properties:
  scale:
    x-scope: personal
    type: integer
    x-control: stepper
    title: Scale
    default: 100
    minimum: 75
    maximum: 150
    x-unit: '%'
    description: Size of text and controls outside the bars.
  density:
    x-scope: personal
    type: string
    title: Density
    x-control: toggle
    enum: [compact, normal, roomy]
    x-enumLabels: {compact: Compact, normal: Normal, roomy: Roomy}
    default: normal
    description: How tightly controls are packed.
  cardSize:
    x-scope: personal
    type: integer
    title: Card size
    default: 100
    minimum: 50
    maximum: 150
    x-unit: '%'
    description: 'Share of the screen: at 100 two cards fill its shorter side.'
