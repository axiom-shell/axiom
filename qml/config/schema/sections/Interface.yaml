# The Interface section of the config (config.json's "Interface").

x-scope: look
type: object
x-category: Look & Feel
title: Panels & controls
description: Sizing for the overlay, edge menus, desktop, lock screen, popouts, launcher and settings. Each bar has its own, in the bar editor.
additionalProperties: false
properties:
  scale:
    x-scope: personal
    type: integer
    x-control: stepper
    title: Interface scale
    default: 100
    minimum: 75
    maximum: 150
    x-unit: '%'
    description: "Size of text and controls everywhere outside the bars: modules, popouts, the launcher, settings and notifications. Sizes set in px there (the launcher's width, a toast's, tiles, padding) grow with it. Higher is easier to read but fits less in each card and panel."
  cardSize:
    x-scope: personal
    type: integer
    title: Card size
    default: 100
    minimum: 50
    maximum: 150
    x-unit: '%'
    description: "How big module cards are, as a share of the screen: at 100 two cards fill its shorter side. The overlay, edge menus, desktop, lock screen and greeter all start from it, and each can be made bigger or smaller with its own Module size. Text stays the Interface scale's size, so on a smaller screen a higher card size gives modules back their room. The overlay never grows past filling its screen."
  density:
    x-scope: personal
    type: string
    title: Density
    enum: [compact, normal, roomy]
    x-enumLabels: {compact: Compact, normal: Normal, roomy: Roomy}
    default: normal
    description: How tightly controls, padding and gaps are packed in panels and cards.
  radius:
    type: integer
    x-control: stepper
    title: Interior corner radius
    default: null
    minimum: 0
    maximum: 50
    x-unit: px
    description: "Roundness of what sits inside panels, cards and bars: buttons, fields, rows, cells and bar widgets. Outer edges (screen border, bars, popouts, the overlay's outer box) keep the main radius."
    x-inherit: Appearance.shape.radius
