# The Launcher section of the config (config.json's "Launcher").

x-scope: personal
type: object
x-category: Launcher
title: Launcher
description: Apps, windows, a calculator, web search, commands and / commands.
x-intro: LauncherPlace
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the launcher opens.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-scope: look
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    x-scope: look
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 30
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf: {detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-scope: look
    x-showIf: {detached: true}
  reverse:
    x-scope: look
    type: boolean
    title: Search bar at the bottom
    default: false
    description: The best match sits nearest the field. Suits the bottom edge.
  width:
    x-scope: look
    type: integer
    title: Width
    x-unit: px
    default: 680
    minimum: 400
    maximum: 1200
  maxResults:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Results shown
    default: 8
    minimum: 3
    maximum: 20
    description: Rows shown before the list scrolls.
  iconSize:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Icon size
    x-unit: px
    default: 32
    minimum: 16
    maximum: 64
  showBackdrop:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Dim background
    default: true
    description: Dim the screen behind the launcher.
  backdrop:
    x-scope: look
    x-group: Launcher look
    type: integer
    title: Backdrop darkness
    x-unit: '%'
    default: 25
    minimum: 0
    maximum: 90
    x-showIf: {showBackdrop: true}
  showDescriptions:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Descriptions
    default: true
    description: A second line under each result.
  showRecent:
    x-group: Launcher look
    type: boolean
    title: Frequent apps when empty
    default: true
    description: List your most used apps before you type.
  showHint:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Controls hint
    default: true
    description: Show search prefixes and keys under the results.
  hiddenApps:
    x-group: Launcher search
    type: array
    title: Hidden apps
    default: []
    items: {type: string}
    description: Desktop entry ids, comma-separated.
  providers:
    type: object
    title: Launcher search
    additionalProperties: false
    properties:
      windows:
        type: boolean
        title: Open windows
        default: true
        description: Match windows by title and class; picking one focuses it.
      calculator:
        type: boolean
        title: Calculator
        default: true
        description: Show the result of math as you type, using qalc. Enter copies it.
      commands:
        type: boolean
        title: Shell commands (/)
        default: true
        description: Type / for commands that control the shell.
      run:
        type: boolean
        title: Run commands (>)
        default: true
        description: Type > and a command to run it. Shift+Enter runs it in a terminal.
      web:
        type: object
        title: Web search
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Web search (?)
            default: true
            description: Offer a web search for what you typed (first after ?).
          engine:
            type: string
            title: Search engine URL
            default: 'https://duckduckgo.com/?q={}'
            description: '{} is replaced by the search terms.'
            x-showIf: {enabled: true}
      chat:
        x-link: {setting: Chat}
        type: boolean
        title: Ask chat (@)
        default: true
        description: Type @ and a question to ask the Chat module.
      clipboard:
        type: object
        title: Clipboard history
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: 'Clipboard history (:)'
            default: true
            description: 'Type : to search what you''ve copied. Kept in memory only, skipping items marked sensitive; turning this off clears it.'
          maxEntries:
            type: integer
            title: Clipboard history size
            default: 100
            minimum: 10
            maximum: 1000
            x-showIf: {enabled: true}
      emoji:
        type: boolean
        title: Emoji (;)
        default: true
        description: Type ; to search emoji. Enter copies one, Shift+Enter types it.
