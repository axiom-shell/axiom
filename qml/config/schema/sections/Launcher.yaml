# The Launcher section of the config (config.json's "Launcher").

x-scope: personal
type: object
x-category: Launcher
title: Launcher
description: Apps, windows, a calculator, web search, commands and / commands.
x-intro: LauncherPlace
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the launcher opens.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-scope: look
    type: boolean
    title: Detached
    default: true
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    x-scope: look
    type: integer
    title: Distance
    x-unit: '%'
    default: 30
    minimum: 0
    maximum: 50
    description: '0: in line with the window border. 50: centered.'
    x-showIf: {detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-scope: look
    x-showIf: {detached: true}
  width:
    x-scope: look
    type: integer
    title: Width
    x-unit: px
    default: 680
    minimum: 400
    maximum: 1200
  reverse:
    x-scope: look
    type: boolean
    title: Search bar at the bottom
    default: false
    description: The best match sits nearest the field.
  iconSize:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Icon size
    x-unit: px
    default: 32
    minimum: 16
    maximum: 64
  maxResults:
    x-scope: look
    x-group: Launcher look
    type: integer
    x-control: stepper
    title: Results shown
    default: 8
    minimum: 3
    maximum: 20
  showDescriptions:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Descriptions
    default: true
  showHint:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Hints
    default: true
    description: Search prefixes and keys under the results.
  showBackdrop:
    x-scope: look
    x-group: Launcher look
    type: boolean
    title: Backdrop
    default: true
  backdrop:
    x-scope: look
    x-group: Launcher look
    type: integer
    title: Darkness
    x-unit: '%'
    default: 25
    minimum: 0
    maximum: 90
    x-showIf: {showBackdrop: true}
  showRecent:
    x-group: Launcher search
    type: boolean
    title: Frequent apps
    default: true
    description: Listed before you type.
  hiddenApps:
    x-group: Launcher search
    type: array
    title: Hidden apps
    default: []
    items: {type: string}
    description: Desktop entry ids, comma-separated.
  providers:
    type: object
    title: Launcher search
    additionalProperties: false
    properties:
      windows:
        type: boolean
        title: Windows
        default: true
        description: Matched by title and class.
      calculator:
        type: boolean
        title: Calculator
        default: true
        description: Math results as you type (needs qalc). Enter copies.
      commands:
        type: boolean
        title: Shell commands (/)
        default: true
        description: Type / for shell commands.
      run:
        type: boolean
        title: Run commands (>)
        default: true
        description: 'Type > and a command. Shift+Enter: in a terminal.'
      chat:
        x-link: {setting: Chat}
        type: boolean
        title: Ask chat (@)
        default: true
        description: Type @ and a question for Chat.
      emoji:
        type: boolean
        title: Emoji (;)
        default: true
        description: Type ; for emoji. Enter copies, Shift+Enter types.
      web:
        type: object
        title: Web search
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: Web search (?)
            default: true
            description: Search the web for what you typed.
          engine:
            type: string
            title: Search URL
            default: 'https://duckduckgo.com/?q={}'
            description: '{} marks the search terms.'
            x-showIf: {enabled: true}
      clipboard:
        type: object
        title: Clipboard history
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: 'Clipboard history (:)'
            default: true
            description: 'Type : to search what you copied. Turning off clears it.'
          maxEntries:
            type: integer
            title: History size
            default: 100
            minimum: 10
            maximum: 1000
            x-showIf: {enabled: true}
      files:
        type: object
        title: Files
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            title: 'Files (~)'
            default: true
            description: Type ~ to search files, ~/ to browse.
          inSearch:
            type: integer
            x-control: stepper
            title: Files in search
            default: 3
            minimum: 0
            maximum: 5
            description: 'Best matches below the apps. 0: only after ~.'
            x-showIf: {enabled: true}
          thumbnails:
            type: boolean
            title: Image thumbnails
            default: true
            x-showIf: {enabled: true}
          showHidden:
            type: boolean
            title: Hidden files
            default: false
            description: Dotfiles and dot folders.
            x-showIf: {enabled: true}
          roots:
            x-scope: machine
            type: array
            title: Folders searched
            default: ['~']
            items: {type: string}
            description: Indexed with everything below.
            x-showIf: {enabled: true}
          excludes:
            type: array
            title: Skipped names
            default: [.git, node_modules, .cache, __pycache__, .venv, venv, target, build, dist, .gradle, .npm, .cargo, .rustup, go/pkg, .local/share/Trash, .local/share/Steam, .steam, .var/app, '*.o', '*.pyc']
            items: {type: string}
            description: Names or paths below the folders; * matches any text.
            x-showIf: {enabled: true}
