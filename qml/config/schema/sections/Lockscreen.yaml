# The Lockscreen section of the config (config.json's "Lockscreen").

type: object
x-category: Screen & Power
title: Lockscreen
x-links: ['Layouts:lockscreen']
description: Which locker locks the session.
additionalProperties: false
properties:
  mode:
    x-takeover: true
    type: string
    title: Locker
    enum: [quickshell, none]
    x-enumLabels: {quickshell: Built-in (Quickshell), none: None (bring your own)}
    default: quickshell
    description: Built-in uses the session-lock protocol with PAM. None leaves locking to your own locker.
  lockCommand:
    type: string
    title: Lock command
    default: loginctl lock-session
    description: Run by axiom's lock buttons when the locker is your own.
    x-showIf: {mode: none}
  layout:
    x-scope: look
    $ref: '#/definitions/ScreenLayout'
    x-properties:
      modules: {type: array, default: [], x-settings: false, items: {$ref: '#/definitions/OverlayModule@lockscreen'}}
    x-settings: false
    title: Built-in lock screen
    description: Edited on the Layouts page.
    default:
      modules:
        - id: clockCalendar
          type: ClockCalendar
          place: {x: 0, 'y': 0, w: 4, h: 2}
        - id: greeting
          type: Greeting
          place: {x: 4, 'y': 2, w: 8, h: 2}
        - id: password
          type: Password
          place: {x: 5, 'y': 4, w: 6, h: 1}
        - id: nowPlaying
          type: NowPlaying
          place: {x: 0, 'y': 7, w: 5, h: 2}
