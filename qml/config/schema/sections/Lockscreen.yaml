# The Lockscreen section of the config (config.json's "Lockscreen").

type: object
x-category: Screen & Power
title: Lockscreen
x-links: ['Layouts:lockscreen']
description: Which locker locks the session.
additionalProperties: false
properties:
  mode:
    x-takeover: true
    x-recommended: quickshell
    type: string
    title: Locker
    enum: [quickshell, none]
    x-enumLabels: {quickshell: Built-in, none: Own}
    default: quickshell
    description: 'Built-in: session lock with PAM. Own: your own locker.'
  lockCommand:
    x-scope: commands
    type: string
    title: Lock command
    default: loginctl lock-session
    description: Used by axiom's lock actions.
    x-showIf: {mode: none}
  layout:
    x-scope: look
    $ref: '#/definitions/ScreenLayout'
    x-settings: false
    title: Built-in lock screen
    description: Edited on the Layouts page.
    default:
      modules:
        - id: clockCalendar
          type: ClockCalendar
          place: {x: 0, 'y': 0, w: 4, h: 2}
        - id: greeting
          type: Greeting
          place: {x: 4, 'y': 2, w: 8, h: 2}
        - id: password
          type: Password
          place: {x: 5, 'y': 4, w: 6, h: 1}
        - id: nowPlaying
          type: NowPlaying
          place: {x: 0, 'y': 7, w: 5, h: 2}
