# The Markets section of the config (config.json's "Markets").

# Personal: the watchlist (with its holdings and alerts) and how it's
# fetched are the user's own, shared only with an export's personal switch
x-scope: personal
type: object
x-category: Modules
x-card: {file: MarketsWatchlist, title: Watchlist, folds: true}
title: Markets
description: Stock, index, currency and crypto prices from Yahoo Finance and CoinGecko (no account needed).
additionalProperties: false
x-order: [symbols, baseCurrency, redForGains, alerts, interval, pauseWhenClosed, holdingsOnLockscreen]
properties:
  symbols:
    type: array
    title: Watchlist
    x-settings: false
    description: In the order every widget and module shows them.
    default:
      - {id: sp500, symbol: '^GSPC', label: S&P 500}
      - {id: aapl, symbol: AAPL}
      - {id: btc, symbol: BTC-USD, label: Bitcoin}
      - {id: eth, symbol: ETH-USD, label: Ethereum}
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {$ref: '#/definitions/ItemId'}
        source:
          type: string
          title: Source
          default: yahoo
          enum: [yahoo, coingecko]
        symbol:
          type: string
          title: Symbol
          default: ''
          description: Yahoo symbol (AAPL, ^GSPC, EURUSD=X) or CoinGecko coin id.
        label:
          type: string
          title: Label
          default: ''
          description: 'Empty: the symbol.'
        quantity:
          type: number
          title: Holding
          default: 0
          minimum: 0
          description: '0: none held.'
        averageCost:
          type: number
          title: Average cost
          default: 0
          minimum: 0
          description: 'In the symbol''s currency. 0: not counted.'
        alertAbove:
          type: number
          title: Alert above
          default: 0
          minimum: 0
          description: 'Notifies once when the price rises past it. 0: none.'
        alertBelow:
          type: number
          title: Alert below
          default: 0
          minimum: 0
          description: 'Notifies once when the price falls past it. 0: none.'
  interval:
    type: integer
    title: Interval
    x-unit: min
    default: 120000
    minimum: 60000
    maximum: 3600000
  pauseWhenClosed:
    type: boolean
    title: Pause when closed
    default: true
    description: Closed markets refresh hourly. Crypto never closes.
  baseCurrency:
    type: string
    title: Currency
    default: USD
    x-suggestions: currencies
    description: Holdings are totalled in it. CoinGecko coins are priced in it.
  alerts:
    type: boolean
    title: Alerts
    default: true
    description: Notifies when a price crosses a watchlist alert.
  redForGains:
    type: boolean
    title: Red for gains
    default: false
    description: 'Rises red, falls green (East Asian style).'
  holdingsOnLockscreen:
    type: boolean
    title: Holdings on lock screen
    default: false
    description: Modules on the lock screen show holdings. Anyone at the screen can read them.
