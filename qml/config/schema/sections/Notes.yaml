# The Notes section of the config (config.json's "Notes").

type: object
x-category: Modules
title: Notes
description: Notes are plain Markdown files, one per note, in folders of your own.
additionalProperties: false
properties:
  directory:
    type: string
    title: Notes folder
    x-control: folder
    default: ''
    description: An absolute path (~/ works). Empty uses ~/.local/share/axiom/notes.
  extensions:
    x-scope: personal
    type: array
    title: File types
    default: [md, txt]
    items: {type: string}
    description: Comma-separated. New notes are .md.
  showHidden:
    x-scope: personal
    type: boolean
    title: Show hidden files
    default: false
  confirmDelete:
    x-scope: personal
    type: boolean
    title: Confirm before deleting
    default: true
    description: Deleted notes go to the trash.
