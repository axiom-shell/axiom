# The Notifications section of the config (config.json's "Notifications").

x-scope: personal
type: object
x-category: Notifications
x-intro: NotificationsPreview
title: Notifications
description: Where toasts appear, how they move, how long they stay, and what the history keeps.
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
    x-enumLabels: {top: Top, bottom: Bottom, left: Left, right: Right}
    description: On the top or bottom they stack away from the edge; on a side, along it.
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 0
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-scope: look
    type: boolean
    title: Detached
    default: true
    description: Separate cards held off the edge, instead of one box growing out of it.
  gap:
    x-scope: look
    type: integer
    x-control: stepper
    x-auto: {value: null, start: 12}
    x-beside: true
    title: Gap
    default: null
    minimum: 0
    maximum: 200
    x-unit: px
    description: From the border or bar on their edge.
  motion:
    type: object
    title: Motion
    additionalProperties: false
    properties:
      style:
        x-scope: look
        type: string
        title: Animation
        default: slide
        x-control: toggle
        enum: [slide, fade, none]
        x-enumLabels: {slide: Slide, fade: Fade, none: None}
        description: How toasts come and go.
      direction:
        x-scope: look
        type: string
        title: Slide from
        default: auto
        enum: [auto, top, bottom, left, right]
        x-enumLabels: {auto: Auto, top: Top, bottom: Bottom, left: Left, right: Right}
        description: 'Auto: from their own edge, or the nearest screen edge when detached.'
        x-showIf: {style: slide}
  width:
    x-scope: look
    type: integer
    title: Toast width
    x-unit: px
    x-group: Toasts
    default: 360
    minimum: 240
    maximum: 600
  maxToasts:
    x-scope: look
    type: integer
    x-control: stepper
    title: Visible toasts
    x-group: Toasts
    default: 5
    minimum: 1
    maximum: 10
    description: A new one pushes out the oldest.
  timeout:
    type: integer
    x-control: stepper
    title: Toast duration
    x-unit: s
    x-group: Toasts
    default: 5000
    minimum: 1000
    maximum: 60000
    description: Hovering a toast pauses it.
  followApps:
    type: boolean
    title: Follow apps
    x-group: Toasts
    default: true
    description: Use an app's own duration; drop ones it withdraws.
  criticalStays:
    type: boolean
    title: Critical toasts stay
    x-group: Toasts
    default: true
    description: Stay up until you dismiss them.
  quietFullscreen:
    type: boolean
    title: Quiet over fullscreen
    x-group: Toasts
    default: true
    description: No toasts over a fullscreen window. Critical ones still show.
  devNotifications:
    type: boolean
    title: Dev notifications
    x-group: Toasts
    default: true
    x-showIf: {/$devOptions: true}
    description: Dev build failures and recoveries, live config changes.
  dnd:
    type: object
    title: Do not disturb
    x-group: Do not disturb
    additionalProperties: false
    properties:
      allowCritical:
        type: boolean
        title: Critical still toast
        default: true
      schedule:
        type: boolean
        title: Schedule
        default: false
        description: Switching by hand lasts until the next change.
      startAt:
        type: string
        title: Turn on at
        default: '22:00'
        pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
        description: 24-hour time, e.g. 22:00.
        x-showIf: {schedule: true}
      endAt:
        type: string
        title: Turn off at
        default: '07:00'
        pattern: '^([01]?\d|2[0-3]):[0-5]\d$'
        description: 24-hour time, e.g. 07:00. Earlier than the start runs past midnight.
        x-showIf: {schedule: true}
  lowUrgency:
    type: string
    title: Low-urgency notifications
    x-group: Per-app rules
    default: silent
    x-control: toggle
    enum: [silent, alert]
    x-enumLabels: {silent: Silent, alert: Alert}
    description: 'Apps no rule names. Silent: Quiet section.'
  apps:
    type: array
    title: Rules
    x-group: Per-app rules
    x-wide: true
    default: []
    description: 'Per app: alert level, urgency, duration.'
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        app:
          type: string
          title: App
          default: ''
          x-suggestions: notificationApps
          description: Its name as its notifications show it, or its desktop entry.
        level:
          type: string
          title: Level
          default: alert
          enum: [alert, silent, toast, 'off']
          x-enumLabels: {alert: Alert, silent: Silent, toast: Toast only, 'off': Block}
          description: 'Alert: toast and keep. Silent: Quiet section only. Toast only: not kept. Block: dropped.'
        urgency:
          type: string
          title: Urgency
          default: app
          enum: [app, low, normal, critical]
          x-enumLabels: {app: As the app sends it, low: Low, normal: Normal, critical: Critical}
        timeout:
          type: integer
          x-control: stepper
          x-auto: {value: null, start: 5000}
          title: Toast duration
          x-unit: s
          default: null
          minimum: 1000
          maximum: 60000
      required: [id]
  clearOnFocus:
    type: boolean
    title: Clear on focus
    x-group: Notification history
    default: false
    description: Focusing an app removes its notifications from the history.
  clickFocuses:
    type: boolean
    title: Clicking focuses the app
    x-group: Notification history
    default: true
    description: Bring the app's window forward after a click runs its action.
  removeOnClick:
    type: boolean
    title: Remove when clicked
    x-group: Notification history
    default: false
    description: Clicking a notification removes it from the history.
  closeRemoves:
    type: boolean
    title: Closing a toast removes it
    x-group: Notification history
    default: false
    description: 'Off: closing only hides the toast.'
  maxEntries:
    type: integer
    title: History size
    x-group: Notification history
    default: 100
    minimum: 10
    maximum: 500
    description: The oldest go first.
  maxAge:
    type: integer
    title: Keep for
    x-unit: d
    x-group: Notification history
    default: 0
    minimum: 0
    maximum: 31536000000
    description: '0: until removed.'
  quiet:
    type: object
    title: Quiet section
    x-group: Notification history
    additionalProperties: false
    description: Silent notifications, kept apart under the list and never counted on the badge.
    properties:
      connectivity:
        type: boolean
        title: Connection notes
        default: false
        description: A silent note when the network or a Bluetooth device connects or drops.
      maxEntries:
        type: integer
        title: Size
        default: 50
        minimum: 5
        maximum: 500
        description: The oldest go first.
      maxAge:
        type: integer
        title: Keep for
        x-unit: d
        default: 604800000
        minimum: 0
        maximum: 31536000000
        description: '0: until removed.'
