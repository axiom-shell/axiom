# The OSD section of the config (config.json's "OSD").

x-scope: look
type: object
x-category: OSD
x-card: {file: OSDList, title: OSDs, wide: true, folds: true}
title: OSD
description: Volume, brightness, lock keys, layout, toggles and the playing track, shown when they change.
additionalProperties: false
properties:
  scrollToChange:
    type: boolean
    title: Scroll to change
    default: true
  scrollStep:
    type: integer
    title: Scroll step
    x-unit: '%'
    default: 5
    minimum: 1
    maximum: 25
    x-showIf: {scrollToChange: true}
  onScreenChanges:
    type: boolean
    title: On-screen changes
    default: false
    description: Open for changes made in axiom's bar and panels. Keys and apps always open it.
  cardsToHistory:
    type: boolean
    title: Cards in history
    default: true
    description: Also filed in the notification history, without a popup.
    x-link: {setting: Notifications}
  items:
    type: array
    title: OSDs
    x-settings: false
    description: A change opens every OSD holding that item.
    default:
      - id: main
        screen: {mode: inherit, names: []}
    items: {$ref: '#/definitions/OSDEntry'}
