# The Pomodoro section of the config (config.json's "Pomodoro").

type: object
x-category: Modules
x-scope: personal
title: Pomodoro
description: Shared by every Pomodoro widget and module.
additionalProperties: false
properties:
  work:
    type: integer
    title: Focus
    x-unit: min
    default: 1500000
    minimum: 60000
    multipleOf: 60000
    maximum: 10800000
  shortBreak:
    type: integer
    title: Short break
    x-unit: min
    default: 300000
    minimum: 60000
    multipleOf: 60000
    maximum: 3600000
  longBreak:
    type: integer
    title: Long break
    x-unit: min
    default: 900000
    minimum: 60000
    multipleOf: 60000
    maximum: 7200000
  longBreakEvery:
    type: integer
    title: Long break every
    x-unit: sessions
    x-control: stepper
    default: 4
    minimum: 1
    maximum: 12
  autoStartBreaks: {type: boolean, title: Auto-start breaks, default: true}
  autoStartWork:
    type: boolean
    title: Auto-start focus
    default: false
    description: 'Off: a break waits for you.'
  notify:
    type: boolean
    title: Notify
    default: true
    description: A notification when a session or break ends.
