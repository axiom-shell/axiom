# The Popouts section of the config (config.json's "Popouts").

x-scope: look
type: object
x-category: Overlay & Popouts
x-links: [BarEditor]
title: Popouts
description: Behaviour shared by bar popouts and screen-edge popouts (side panel, OSD).
additionalProperties: false
properties:
  timing:
    $ref: '#/definitions/Timing'
    x-properties:
      closeDelay:
        type: integer
        title: Close delay
        x-unit: ms
        default: 250
        minimum: 0
        maximum: 5000
  trigger: {$ref: '#/definitions/Trigger', x-properties: {length: null}}
  padding:
    type: integer
    x-control: stepper
    title: Padding
    x-unit: px
    default: 16
    minimum: 0
    maximum: 64
    description: "Space between a popout's box and its content: bar popouts, OSDs, and edge menus that don't set their own."
