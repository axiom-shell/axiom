# The PowerMenu section of the config (config.json's "PowerMenu").

type: object
x-category: Screen & Power
title: Power menu
description: Lock, suspend, hibernate, log out, restart and shut down.
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    description: Where the power menu opens.
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  actions:
    x-scope: look
    type: array
    title: Actions
    default: [lock, suspend, hibernate, logout, reboot, poweroff]
    items:
      type: string
      enum: [lock, suspend, hibernate, logout, reboot, poweroff]
    description: In order.
  confirm:
    x-scope: look
    type: boolean
    title: Confirm destructive actions
    default: true
    description: Log out, restart and shut down ask for a second click first.
  tileSize:
    x-scope: look
    type: integer
    title: Tile size
    x-unit: px
    default: 120
    minimum: 80
    maximum: 200
  showHeader:
    x-scope: look
    type: boolean
    title: Greeting and uptime
    default: true
    description: Show a greeting and uptime above the actions.
  showHint:
    x-scope: look
    type: boolean
    title: Controls hint
    default: true
    description: Show the keys under the actions.
  showBackdrop:
    x-scope: look
    type: boolean
    title: Dim background
    default: true
    description: Dim the screen behind the power menu.
  backdrop:
    x-scope: look
    type: integer
    title: Backdrop darkness
    x-unit: '%'
    default: 36
    minimum: 0
    maximum: 90
    x-showIf: {showBackdrop: true}
