# The PowerMenu section of the config (config.json's "PowerMenu").

type: object
x-category: Screen & Power
title: Power menu
description: Lock, suspend, hibernate, log out, restart and shut down.
additionalProperties: false
properties:
  screen:
    $ref: '#/definitions/ScreenTarget'
    title: Monitors
    x-properties:
      mode:
        x-scope: look
        type: string
        title: Monitors
        enum: [inherit, primary, focused, all]
        default: inherit
        x-enumLabels:
          inherit: As in General
          primary: Primary monitor
          focused: Focused monitor
          all: Every monitor
        x-link: {setting: General.screen}
      names: null
  tileSize:
    x-scope: look
    type: integer
    title: Tile size
    x-unit: px
    default: 120
    minimum: 80
    maximum: 200
  actions:
    x-scope: look
    type: array
    title: Actions
    default: [lock, suspend, hibernate, logout, reboot, poweroff]
    items:
      type: string
      enum: [lock, suspend, hibernate, logout, reboot, poweroff]
    x-ordered: true
    x-enumLabels: {lock: Lock, suspend: Suspend, hibernate: Hibernate, logout: Log out, reboot: Restart, poweroff: Shut down}
    x-enumIcons: {lock: lock, suspend: bedtime, hibernate: ac_unit, logout: logout, reboot: restart_alt, poweroff: power_settings_new}
  showHeader:
    x-scope: look
    type: boolean
    title: Greeting and uptime
    default: true
  showHint:
    x-scope: look
    type: boolean
    title: Controls hint
    default: true
    description: The keys, under the actions.
  confirm:
    x-scope: look
    type: boolean
    title: Confirm destructive actions
    default: true
    description: Log out, restart and shut down ask for a second click first.
  showBackdrop:
    x-scope: look
    type: boolean
    title: Backdrop
    default: true
  backdrop:
    x-scope: look
    type: integer
    title: Darkness
    x-unit: '%'
    default: 36
    minimum: 0
    maximum: 90
    x-showIf: {showBackdrop: true}
