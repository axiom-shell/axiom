# The ScreenSharing section of the config (config.json's "ScreenSharing").

type: object
x-category: Screen & Power
x-intro: {file: ScreenSharingStatus, setup: [enabled]}
title: Screen sharing
description: The picker apps show to share a screen or window (a call, a stream).
additionalProperties: false
x-order: [enabled, remember, reuseFor]
properties:
  enabled:
    type: boolean
    x-recommended: true
    title: Axiom's picker
    x-footprint: {/$compositor: [hyprland, sway]}
    default: false
    description: Apps ask it instead of the compositor portal's own.
  remember:
    type: boolean
    title: Remember choices
    default: true
    description: Apps may reshare the same screen or window without asking.
    x-showIf: {enabled: true, /$supports.shareRestore: true}
  reuseFor:
    type: integer
    title: Reuse choice for
    x-unit: s
    default: 10000
    minimum: 0
    maximum: 60000
    multipleOf: 1000
    description: 'For apps that ask several times per share (Discord). 0: always ask.'
    x-showIf: {enabled: true}
