# The Screenshots section of the config (config.json's "Screenshots").

type: object
x-category: General
title: Screenshots & recordings
description: Where screenshots and recordings are saved.
additionalProperties: false
properties:
  folder:
    type: string
    title: Screenshot folder
    x-control: folder
    default: ''
    description: ~ is your home. Empty uses Pictures/Screenshots.
  recordingFolder:
    type: string
    title: Recording folder
    x-control: folder
    default: ''
    description: Empty saves them with the screenshots.
  notify:
    type: boolean
    title: Screenshot notifications
    default: true
    description: Notify when a screenshot is taken.
    x-link: {setting: OSD}
