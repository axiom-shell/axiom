# The Screenshots section of the config (config.json's "Screenshots").

type: object
x-category: General
title: Screenshots & recordings
description: Where screenshots and recordings are saved.
additionalProperties: false
properties:
  notify:
    type: boolean
    title: Notifications
    default: true
    description: When a screenshot is taken.
    x-link: {setting: OSD}
  folder:
    type: string
    title: Screenshot folder
    x-control: folder
    default: ''
    description: 'Empty: Pictures/Screenshots.'
  recordingFolder:
    type: string
    title: Recording folder
    x-control: folder
    default: ''
    description: 'Empty: the screenshot folder.'
