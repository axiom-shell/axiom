# The SelfUpdate section of the config (config.json's "SelfUpdate").

type: object
x-category: System
x-intro: {file: SelfUpdateStatus, setup: [mode, channel]}
x-showIf: {/$packaged: false}
title: axiom updates
description: Updates come from the repository axiom was cloned from. A clone with changes of its own is never touched.
additionalProperties: false
properties:
  mode:
    type: string
    title: Mode
    x-control: toggle
    enum: [auto, notify, 'off']
    x-enumLabels: {auto: Auto, notify: Notify, 'off': 'Off'}
    default: notify
    description: Checked at start and daily.
  channel:
    type: string
    title: Channel
    x-control: toggle
    enum: [tags, main]
    x-enumLabels: {tags: Releases, main: Main}
    default: tags
    x-showIf: {mode: {not: 'off'}}
    description: 'Main: newer, less tested.'
