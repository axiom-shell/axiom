# The SelfUpdate section of the config (config.json's "SelfUpdate").

type: object
x-category: System
x-card: {file: SelfUpdateStatus, title: Update status}
x-showIf: {/$packaged: false}
title: axiom updates
description: Updates come from the repository axiom was cloned from. A clone with changes of its own is never touched.
additionalProperties: false
properties:
  mode:
    type: string
    title: Updates
    enum: [auto, notify, 'off']
    x-enumLabels: {auto: Update automatically, notify: Notify me, 'off': 'Off'}
    default: notify
    description: Checked at start and once a day. Off never checks.
  channel:
    type: string
    title: Follow
    x-control: toggle
    enum: [tags, main]
    x-enumLabels: {tags: Releases, main: Main branch}
    default: tags
    x-showIf: {mode: {not: 'off'}}
    description: Main branch is newer, but less tested.
