# The Stopwatch section of the config (config.json's "Stopwatch").

type: object
x-category: Modules
x-scope: personal
title: Stopwatch
description: Shared by every Stopwatch widget and module.
additionalProperties: false
properties:
  presets:
    type: array
    title: Presets
    default: ['1m', '5m', '10m', '25m']
    items: {type: string}
    description: 'Durations like 5m, 1h30m, 90s; add a label: 10m tea.'
  notify:
    type: boolean
    title: Notify
    default: true
    description: A notification when a timer ends.
