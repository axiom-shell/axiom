# The Stopwatch section of the config (config.json's "Stopwatch").

type: object
x-category: Modules
x-scope: personal
title: Timer and stopwatch
description: The one-off timer and the stopwatch every Stopwatch widget and module shows.
additionalProperties: false
properties:
  presets:
    type: array
    title: Timer presets
    default: ['1m', '5m', '10m', '25m']
    items: {type: string}
    description: 'One-click timers, comma-separated: 5m, 1h30m, 90s, or 10m tea for a label.'
  notify:
    type: boolean
    title: Notify
    default: true
    description: A notification when a timer ends.
