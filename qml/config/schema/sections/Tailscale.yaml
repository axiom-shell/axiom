# The Tailscale section of the config (config.json's "Tailscale").

type: object
x-category: Modules
x-scope: personal
title: Tailscale
description: How Tailscale widgets and modules show the tailnet.
additionalProperties: false
properties:
  actions:
    type: boolean
    title: Actions
    default: true
    description: 'Connect, switch accounts, exit node. Needs operator rights: the popout''s Grant access asks.'
  showOffline:
    type: boolean
    title: Offline devices
    default: true
    description: After the online ones.
  interval:
    type: integer
    title: Interval
    x-unit: ms
    default: 10000
    minimum: 1000
    maximum: 60000
