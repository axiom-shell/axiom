# The ThemeIntegrations section of the config (config.json's "ThemeIntegrations").

type: object
x-category: Theme integrations
x-card: {perField: true}
x-links: [Themes]
title: Theme integrations
description: Re-theme other apps when the shell theme changes. Each writes its own axiom file; turned on, it shows the line that loads it.
additionalProperties: false
properties:
  gtk:
    type: boolean
    title: GTK
    default: false
    description: Writes axiom.css for GTK 3 and 4, and follows light/dark. GTK 3 apps need the adw-gtk3 theme.
    # every desktop has GTK
    x-commands: []
    x-hookup:
      - file: '{config}/gtk-3.0/gtk.css'
        place: start
        text: '@import url("axiom.css");'
        accept: '^@import url\(["'']?axiom\.css'
      - file: '{config}/gtk-4.0/gtk.css'
        place: start
        text: '@import url("axiom.css");'
        accept: '^@import url\(["'']?axiom\.css'
        wrapLink: '@import url("file://{link}");'
  qt:
    type: boolean
    title: Qt and KDE apps
    default: false
    description: Writes an "axiom" color scheme for qt5ct and qt6ct, and an "Axiom" KDE color scheme.
    # qt*ct, or a KDE app (which reads the KDE scheme without them)
    x-commands: [qt6ct, qt5ct, okular, dolphin, kate, kwrite, gwenview, konsole, ark, spectacle, systemsettings]
    x-hookupNote: Qt apps need QT_QPA_PLATFORMTHEME=qt5ct, which a managed compositor config sets. KDE apps read kdeglobals, which axiom keeps in step. Restart apps after a theme change.
    x-hookup:
      - file: '{config}/qt5ct/qt5ct.conf'
        place: section
        section: Appearance
        comment: ';'
        requires: qt5ct
        text: "custom_palette=true\ncolor_scheme_path={config}/qt5ct/colors/axiom.conf"
      - file: '{config}/qt6ct/qt6ct.conf'
        place: section
        section: Appearance
        comment: ';'
        requires: qt6ct
        text: "custom_palette=true\ncolor_scheme_path={config}/qt6ct/colors/axiom.conf"
      - file: '{config}/kdeglobals'
        title: KDE apps
        place: section
        section: General
        text: ColorScheme=Axiom
      - file: '{config}/kdeglobals'
        title: KDE apps with a color scheme menu (Okular, Dolphin, Kate…)
        place: section
        section: UiSettings
        text: ColorScheme=Axiom
  fcitx5:
    type: boolean
    title: fcitx5
    default: false
    description: Writes the "axiom" theme for fcitx5's candidate window and menus.
    x-hookupNote: Both name axiom, which follows axiom's variant. Picking another theme in fcitx5 undoes this; Apply again to come back.
    x-hookup:
      - file: '{config}/fcitx5/conf/classicui.conf'
        place: top
        text: "Theme=axiom\nDarkTheme=axiom"
  kitty:
    type: boolean
    title: Kitty
    default: false
    description: Writes kitty/axiom.conf. Reloads running kitty.
    x-hookup:
      - file: '{config}/kitty/kitty.conf'
        place: end
        text: include axiom.conf
        accept: '^include\s+\S*axiom\.conf'
  alacritty:
    type: boolean
    title: Alacritty
    default: false
    description: Writes alacritty/axiom.toml.
    x-hookupNote: 'Colors set in alacritty.toml still win: remove them to use axiom''s.'
    x-hookup:
      - file: '{config}/alacritty/alacritty.toml'
        place: section
        section: general
        replace: conflict
        text: import = ["{config}/alacritty/axiom.toml"]
        accept: '^(general\.)?import\s*=.*axiom\.toml'
  foot:
    type: boolean
    title: Foot
    default: false
    description: Writes foot/axiom.ini. Applies to new windows.
    x-hookup:
      - file: '{config}/foot/foot.ini'
        place: top
        replace: keep
        text: include={config}/foot/axiom.ini
        accept: '^include\s*=\s*\S*axiom\.ini'
  wezterm:
    type: boolean
    title: WezTerm
    default: false
    description: Writes the "axiom" color scheme. Applies on WezTerm's next config reload.
    x-hookup:
      - text: config.color_scheme = "axiom"
        where: In wezterm.lua, before the final 'return config'.
  ghostty:
    type: boolean
    title: Ghostty
    default: false
    description: Writes the "axiom" theme. Ghostty 1.2+ reloads it.
    x-hookup:
      - file: ['{config}/ghostty/config', '{config}/ghostty/config.ghostty']
        place: end
        text: theme = axiom
        accept: '^theme\s*=\s*axiom\s*$'
  nvim:
    type: boolean
    title: Neovim
    default: false
    description: Writes the theme for the axiom_theme module, and reloads running instances.
    x-hookupNote: 'Neovim has no single line to add: copy the axiom_theme module into your config, then call its setup() once your plugins are loaded.'
    x-hookup:
      - file: '{config}/nvim/lua/axiom_theme.lua'
        place: copy
        from: templates/nvim/axiom_theme.lua
      - text: require("axiom_theme").setup()
        where: In init.lua, after your plugin manager's setup (with lazy.nvim, after require("lazy").setup(…)).
  helix:
    type: boolean
    title: Helix
    default: false
    description: Writes the "axiom" theme. Helix 23.10+ reloads it.
    x-commands: [hx, helix]
    x-hookup:
      - file: '{config}/helix/config.toml'
        place: top
        text: theme = "axiom"
        accept: '^theme\s*=\s*"axiom"'
  vscode:
    type: boolean
    title: VS Code / VSCodium
    default: false
    description: Installs a local "Axiom" color theme extension.
    x-commands: [code, codium]
    x-hookup:
      - text: '"workbench.colorTheme": "Axiom"'
        where: 'In settings.json (Preferences: Open User Settings (JSON)), or pick Axiom under Preferences: Color Theme.'
  zed:
    type: boolean
    title: Zed
    default: false
    description: Writes the "Axiom" theme, which follows light/dark.
    x-commands: [zed, zeditor, zedit, dev.zed.Zed]
    x-hookup:
      - text: '"theme": "Axiom"'
        where: 'In Zed''s settings.json (zed: open settings), or pick Axiom in the theme selector (ctrl-k ctrl-t). With "mode": "system", set both "light" and "dark" to Axiom.'
  vesktop:
    type: boolean
    title: Vesktop / Vencord
    default: false
    description: Writes the axiom.theme.css Vencord theme. Recolors live.
    x-commands: [vesktop, dev.vencord.Vesktop, equibop, discord]
    x-hookup:
      - {text: axiom.theme.css, where: 'In Vesktop: Settings → Vencord → Themes, switch it on.'}
  firefox:
    type: boolean
    title: Firefox / LibreWolf / Zen
    default: false
    description: Writes chrome/axiom.css into every profile of Firefox and its forks. Applies from the browser's next start.
    x-commands: [firefox, librewolf, zen-browser, zen, floorp, waterfox, org.mozilla.firefox, io.gitlab.librewolf-community, app.zen_browser.zen, one.ablaze.floorp, net.waterfox.waterfox]
    x-hookupNote: Apply imports axiom.css in each profile's userChrome.css and turns on the stylesheet pref it needs. Restart the browser afterwards.
    x-profiles:
      - '{home}/.mozilla/firefox/profiles.ini'
      - '{config}/mozilla/firefox/profiles.ini'
      - '{home}/.var/app/org.mozilla.firefox/.mozilla/firefox/profiles.ini'
      - '{home}/.var/app/org.mozilla.firefox/config/mozilla/firefox/profiles.ini'
      - '{home}/.librewolf/profiles.ini'
      - '{config}/librewolf/librewolf/profiles.ini'
      - '{home}/.var/app/io.gitlab.librewolf-community/.librewolf/profiles.ini'
      - '{home}/.zen/profiles.ini'
      - '{config}/zen/profiles.ini'
      - '{home}/.var/app/app.zen_browser.zen/.zen/profiles.ini'
      - '{home}/.floorp/profiles.ini'
      - '{home}/.var/app/one.ablaze.floorp/.floorp/profiles.ini'
      - '{home}/.waterfox/profiles.ini'
      - '{home}/.var/app/net.waterfox.waterfox/.waterfox/profiles.ini'
    x-hookup:
      - perProfile: true
        file: chrome/userChrome.css
        place: start
        text: '@import url("axiom.css");'
        accept: '^@import url\(["'']?axiom\.css'
      - perProfile: true
        file: user.js
        place: end
        comment: //
        text: user_pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
        accept: '^user_pref\("toolkit\.legacyUserProfileCustomizations\.stylesheets",\s*true\)'
  k9s:
    type: boolean
    title: k9s
    default: false
    description: Writes the "axiom" skin.
    x-hookup:
      - text: "k9s:\n  ui:\n    skin: axiom"
        where: 'In ~/.config/k9s/config.yaml, merged into its k9s: section.'
  cava:
    type: boolean
    title: Cava
    default: false
    description: Writes cava/colors/axiom.conf. Reloads running Cava.
    x-hookup:
      - file: '{config}/cava/config'
        place: top
        replace: keep
        text: include = {config}/cava/colors/axiom.conf
        accept: '^include\s*=\s*\S*axiom\.conf'
  btop:
    type: boolean
    title: btop
    default: false
    description: Writes the "axiom" theme. Applies from btop's next start.
    x-hookup:
      - file: '{config}/btop/btop.conf'
        place: top
        text: color_theme = "axiom"
        accept: '^color_theme\s*=\s*"(axiom|\S*/axiom\.theme)"'
  ncspot:
    type: boolean
    title: ncspot
    default: false
    description: Writes the colors into ncspot's config.toml between axiom's markers.
    x-hookupNote: Apply adds two marker lines to config.toml's [theme] table; every theme change rewrites what's between them. Keep your own edits outside.
    x-hookup:
      - file: '{config}/ncspot/config.toml'
        place: section
        section: theme
        replace: keep
        text: "# axiom theme: begin (rewritten on every theme change)\n# axiom theme: end"
  fzf:
    type: boolean
    title: fzf
    default: false
    description: Writes --color options for fzf 0.49+.
    x-hookup:
      - place: shellrc
        replace: keep
        text: export FZF_DEFAULT_OPTS_FILE="{state}/axiom/fzf-colors"
        accept: FZF_DEFAULT_OPTS_FILE[= ].*axiom/fzf-colors
  lazygit:
    type: boolean
    title: lazygit
    default: false
    description: Writes lazygit/axiom.yml. Applies from lazygit's next start.
    x-hookupNote: 'This sets LG_CONFIG_FILE, replacing any value of your own: add your own files to it.'
    x-hookup:
      - place: shellrc
        replace: keep
        text: export LG_CONFIG_FILE="{config}/lazygit/config.yml,{config}/lazygit/axiom.yml"
        accept: LG_CONFIG_FILE[= ].*axiom\.yml
  bat:
    type: boolean
    title: bat / delta
    default: false
    description: Writes the "axiom" syntax theme for bat and delta.
    x-hookup:
      - file: '{config}/bat/config'
        place: end
        text: '--theme=axiom'
        accept: '^--theme[= ]"?axiom"?\s*$'
      - file: ['{home}/.gitconfig', '{config}/git/config']
        place: section
        section: delta
        requires: delta
        text: syntax-theme = axiom
  yazi:
    type: boolean
    title: Yazi
    default: false
    description: Writes the "axiom" flavor (Yazi 25.5+).
    x-hookup:
      - file: '{config}/yazi/theme.toml'
        place: section
        section: flavor
        text: "dark = \"axiom\"\nlight = \"axiom\""
  zathura:
    type: boolean
    title: zathura
    default: false
    description: Writes zathura/axiom. Reloads running zathura.
    x-hookup:
      - file: '{config}/zathura/zathurarc'
        place: end
        text: include axiom
        accept: '^include\s+\S*axiom\s*$'
