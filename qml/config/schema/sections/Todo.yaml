# The Todo section of the config (config.json's "Todo").

type: object
x-category: Modules
x-scope: personal
title: Todo list
description: The one todo list every todo widget and module shows. The items themselves are kept in your data folder, not in the config.
additionalProperties: false
properties:
  showCompleted:
    type: boolean
    title: Show completed items
    default: true
    description: Under the open ones, the last finished first, until you clear them.
