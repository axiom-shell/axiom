# The Updates section of the config (config.json's "Updates").

type: object
x-category: Modules
title: Package updates
description: How updates widgets and modules check for and install updates.
additionalProperties: false
properties:
  interval:
    type: integer
    title: Interval
    x-unit: min
    default: 1800000
    minimum: 300000
    maximum: 86400000
    description: How often to check for updates.
  includeAur:
    type: boolean
    title: Include AUR
    default: false
    x-showIf: {/$distro: arch}
  aurHelper:
    type: string
    title: AUR helper
    default: paru
    x-control: toggle
    enum: [paru, yay]
    x-showIf: {includeAur: true, /$distro: arch}
  terminal:
    x-link: {setting: Apps}
    x-scope: commands
    type: string
    title: Terminal
    default: ''
    description: Empty uses the default terminal.
  upgradeCommand:
    x-scope: commands
    type: string
    title: Upgrade command
    default: ''
    description: Run on click. Empty uses your distribution's upgrade.
