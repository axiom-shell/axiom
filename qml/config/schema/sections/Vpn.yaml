# The Vpn section of the config (config.json's "Vpn").

type: object
x-category: Modules
x-scope: personal
title: VPN
description: How VPN widgets, modules and the Wi-Fi menu show NetworkManager's VPNs.
additionalProperties: false
properties:
  notifyOnDrop:
    type: boolean
    title: Notify when a VPN drops
    default: true
    description: Notify when a VPN goes down unasked.
  showTailscale:
    type: boolean
    title: List Tailscale
    default: true
    description: Show Tailscale with the other VPNs when it's installed.
  publicIpUrl:
    type: string
    title: Public IP lookup
    default: https://api.ipify.org
    description: Asked for your public IP when you click Check. Empty hides the check.
