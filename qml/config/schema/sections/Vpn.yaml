# The Vpn section of the config (config.json's "Vpn").

type: object
x-category: Modules
x-scope: personal
title: VPN
description: How VPN widgets, modules and the Wi-Fi menu show NetworkManager's VPNs.
additionalProperties: false
properties:
  showTailscale:
    type: boolean
    title: Tailscale
    default: true
    description: Listed with the other VPNs, when installed.
  publicIpUrl:
    type: string
    title: Public IP URL
    default: https://api.ipify.org
    description: 'Asked for your public IP on Check. Empty: no check.'
  notifyOnDrop:
    type: boolean
    title: Drop notifications
    default: true
    description: Notify when a VPN goes down unasked.
