# The Weather section of the config (config.json's "Weather").

type: object
x-category: Modules
title: Weather
description: Weather from Open-Meteo (no account needed).
additionalProperties: false
properties:
  units:
    x-scope: personal
    type: string
    title: Units
    default: celsius
    x-control: toggle
    enum: [celsius, fahrenheit]
    x-enumLabels: {celsius: °C, fahrenheit: °F}
  location:
    type: string
    title: Location
    default: ''
    description: 'City name. Empty: your IP''s location.'
  latitude:
    type: string
    title: Latitude
    default: ''
    description: Used with longitude instead of the location.
  longitude: {type: string, title: Longitude, default: '', x-beside: true}
  interval:
    type: integer
    title: Interval
    x-unit: min
    default: 900000
    minimum: 300000
    maximum: 86400000
