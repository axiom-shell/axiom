# The Weather section of the config (config.json's "Weather").

type: object
x-category: Modules
title: Weather
description: Weather from Open-Meteo (no account needed).
additionalProperties: false
properties:
  location:
    type: string
    title: Location
    default: ''
    description: City name. Empty uses your IP's location.
  latitude:
    type: string
    title: Latitude
    default: ''
    description: With longitude, overrides the location.
  longitude: {type: string, title: Longitude, default: ''}
  units:
    x-scope: personal
    type: string
    title: Units
    default: celsius
    x-control: toggle
    enum: [celsius, fahrenheit]
  interval:
    type: integer
    title: Refresh interval
    x-unit: min
    default: 900000
    minimum: 300000
    maximum: 86400000
