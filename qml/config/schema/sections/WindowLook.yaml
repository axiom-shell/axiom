# The WindowLook section of the config (config.json's "WindowLook").

x-scope: look
type: object
x-category: Compositor
title: Window look
description: While on, these win over your compositor's own config.
additionalProperties: false
properties:
  borders:
    type: object
    title: Borders
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Themed borders
        default: false
        x-hintedIf: {/$supports.windowBorders: true}
      activeColor:
        type: string
        title: Focused border
        x-options: colors
        x-emptyLabel: Theme
        default: ''
        description: Empty follows the theme.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowBorders: true}
      inactiveColor:
        type: string
        title: Unfocused border
        x-options: colors
        x-emptyLabel: Theme
        default: ''
        description: Empty follows the theme.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowBorders: true}
    x-group: Window look
  shape:
    type: object
    title: Shape
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Set border width and corners
        default: false
        description: 'Sway draws square corners: only the width applies there.'
        x-hintedIf: {/$supports.windowShape: true}
      matchShell:
        x-link: {setting: Appearance.shape}
        type: boolean
        title: Match axiom's shape
        default: true
        description: Use Look & Feel's border width and corner radius.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShape: true}
      size:
        type: integer
        x-control: stepper
        title: Border width
        x-unit: px
        default: 2
        minimum: 0
        maximum: 20
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShape: true}
      rounding:
        type: integer
        x-control: stepper
        title: Corner rounding
        x-unit: px
        default: 8
        description: On SwayFX, open windows keep their rounding until sway reloads.
        minimum: 0
        maximum: 50
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShape: true, /$supports.windowRounding: true}
    x-group: Window look
  gaps:
    type: object
    title: Gaps
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Set window gaps
        default: false
        description: Floating bars and detached surfaces set to Automatic use these gaps too.
        x-hintedIf: {/$supports.windowGaps: true}
      inner:
        type: integer
        x-control: stepper
        title: Gaps between windows
        x-unit: px
        default: 3
        minimum: 0
        maximum: 50
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowGaps: true}
      outer:
        type: integer
        x-control: stepper
        title: Gaps to the edges
        x-unit: px
        default: 6
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowGaps: true}
    x-group: Window look
  blur: {$ref: '#/definitions/Blur', x-group: Blur}
  shadow:
    $ref: '#/definitions/Shadow'
    title: Window shadows
    x-properties:
      enabled:
        type: boolean
        title: Window shadows
        default: false
        x-hintedIf: {/$supports.windowShadow: true}
      matchShell:
        x-link: {setting: Bars.style.shadow}
        type: boolean
        title: Match axiom's shadow
        default: true
        description: Use Look & Feel's shadow color and size.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShadow: true}
      size:
        type: integer
        x-control: stepper
        title: Shadow size
        x-unit: px
        default: 10
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShadow: true}
      power:
        type: integer
        title: Shadow falloff
        default: 3
        minimum: 1
        maximum: 4
        description: 1 fades slowly, 4 ends sharply.
        x-showIf: {enabled: true, matchShell: false, /$compositor: hyprland}
        x-hintedIf: {/$supports.windowShadow: true}
      color:
        type: string
        title: Shadow color
        x-options: colors
        x-emptyLabel: Compositor's
        default: ''
        description: Unfocused windows cast it too.
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShadow: true}
      strength:
        type: integer
        x-control: stepper
        title: Shadow strength
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 400
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShadow: true}
    x-group: Window shadows
  dim:
    type: object
    title: Window dimming
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Dim unfocused windows
        default: false
        x-hintedIf: {/$supports.windowDim: true}
      strength:
        type: integer
        title: Dim strength
        x-unit: '%'
        default: 8
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowDim: true}
    x-group: Window dimming
  opacity:
    type: object
    title: Window opacity
    additionalProperties: false
    properties:
      enabled:
        x-link: {setting: Appearance.surface.opacity}
        type: boolean
        title: Set window opacity
        default: false
        description: Your apps' windows. Off, your own config's applies.
        x-hintedIf: {/$supports.windowOpacity: true}
      active:
        type: integer
        title: Focused window opacity
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowOpacity: true}
        x-compositor: {hyprland: {key: decoration.active_opacity, scale: 0.01, if: enabled}}
      inactive:
        type: integer
        title: Unfocused window opacity
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowOpacity: true}
        x-compositor: {hyprland: {key: decoration.inactive_opacity, scale: 0.01, if: enabled}}
      fullscreen:
        type: integer
        title: Fullscreen opacity
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.fullscreenOpacity: true}
        x-compositor: {hyprland: {key: decoration.fullscreen_opacity, scale: 0.01, if: enabled}}
    x-group: Window opacity
