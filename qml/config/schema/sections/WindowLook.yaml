# The WindowLook section of the config (config.json's "WindowLook").

x-scope: look
type: object
x-category: Compositor
title: Window look
description: Each part that is on wins over your compositor's own config.
additionalProperties: false
properties:
  gaps:
    type: object
    title: Gaps
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Window gaps
        default: false
        description: Also the automatic gap of floating bars and detached surfaces.
        x-hintedIf: {/$supports.windowGaps: true}
      inner:
        type: integer
        x-control: stepper
        title: Gap between windows
        x-unit: px
        default: 3
        minimum: 0
        maximum: 50
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowGaps: true}
      outer:
        type: integer
        x-control: stepper
        title: Gap to screen edges
        x-unit: px
        default: 6
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowGaps: true}
    x-group: Frame
  shape:
    type: object
    title: Shape
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Border width and corners
        default: false
        x-hintedIf: {/$supports.windowShape: true}
      matchShell:
        x-link: {setting: Appearance.shape}
        type: boolean
        title: Match axiom's shape
        default: true
        description: Use Look & Feel's border width and corner radius.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShape: true}
      size:
        type: integer
        x-control: stepper
        title: Border width
        x-unit: px
        default: 2
        minimum: 0
        maximum: 20
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShape: true}
      rounding:
        type: integer
        x-control: stepper
        title: Corner radius
        x-unit: px
        default: 8
        description: On SwayFX, open windows keep their rounding until sway reloads.
        minimum: 0
        maximum: 50
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShape: true, /$supports.windowRounding: true}
    x-group: Frame
  borders:
    type: object
    title: Borders
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Themed borders
        default: false
        x-hintedIf: {/$supports.windowBorders: true}
      activeColor:
        type: string
        title: Focused border
        x-options: colors
        x-emptyLabel: Theme
        default: ''
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowBorders: true}
      inactiveColor:
        type: string
        title: Unfocused border
        x-options: colors
        x-emptyLabel: Theme
        default: ''
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowBorders: true}
    x-group: Frame
  shadow:
    $ref: '#/definitions/Shadow'
    title: Window shadows
    x-properties:
      enabled:
        type: boolean
        title: Shadows
        default: false
        x-hintedIf: {/$supports.windowShadow: true}
      matchShell:
        x-link: {setting: Bars.style.shadow}
        type: boolean
        title: Match axiom's shadow
        default: true
        description: Color and size from Look & Feel.
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShadow: true}
      size:
        type: integer
        x-control: stepper
        title: Size
        x-unit: px
        default: 10
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShadow: true}
      color:
        type: string
        title: Color
        x-options: colors
        x-emptyLabel: Compositor's
        default: ''
        x-showIf: {enabled: true, matchShell: false}
        x-hintedIf: {/$supports.windowShadow: true}
      strength:
        type: integer
        title: Strength
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 400
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowShadow: true}
      power:
        type: integer
        title: Falloff
        x-control: stepper
        default: 3
        minimum: 1
        maximum: 4
        description: 1 fades slowly, 4 ends sharply.
        x-showIf: {enabled: true, matchShell: false, /$compositor: hyprland}
        x-hintedIf: {/$supports.windowShadow: true}
    x-group: Shadows
  dim:
    type: object
    title: Window dimming
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        title: Dim unfocused windows
        default: false
        x-hintedIf: {/$supports.windowDim: true}
      strength:
        type: integer
        title: Strength
        x-unit: '%'
        default: 8
        minimum: 0
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowDim: true}
    x-group: Dimming
  opacity:
    type: object
    title: Window opacity
    additionalProperties: false
    properties:
      enabled:
        x-link: {setting: Appearance.surface.opacity}
        type: boolean
        title: Window opacity
        default: false
        description: 'Apps'' windows. Off: your config''s applies.'
        x-hintedIf: {/$supports.windowOpacity: true}
      active:
        type: integer
        title: Focused
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowOpacity: true}
        x-compositor: {hyprland: {key: decoration.active_opacity, scale: 0.01, if: enabled}}
      inactive:
        type: integer
        title: Unfocused
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.windowOpacity: true}
        x-compositor: {hyprland: {key: decoration.inactive_opacity, scale: 0.01, if: enabled}}
      fullscreen:
        type: integer
        title: Fullscreen
        x-unit: '%'
        default: 100
        minimum: 10
        maximum: 100
        x-showIf: {enabled: true}
        x-hintedIf: {/$supports.fullscreenOpacity: true}
        x-compositor: {hyprland: {key: decoration.fullscreen_opacity, scale: 0.01, if: enabled}}
    x-group: Opacity
  blur: {$ref: '#/definitions/Blur', x-group: Blur}
