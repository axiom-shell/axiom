# The WindowSwitcher section of the config (config.json's "WindowSwitcher").

x-scope: personal
type: object
x-category: Workspaces
title: Window switcher
description: Your windows, most recent first, while the switch windows keys are held.
x-intro: WindowSwitcherPlace
additionalProperties: false
properties:
  compositorSwitcher:
    type: boolean
    title: Compositor's switcher
    x-showIf: {/$supports.compositorSwitcher: true, /Compositor.mode: [included, managed]}
    default: true
  edge:
    x-scope: look
    type: string
    title: Screen edge
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    default: top
    enum: [top, bottom, left, right]
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-scope: look
    type: boolean
    title: Detached
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    default: true
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    x-scope: look
    type: integer
    title: Distance
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 50
    description: '0: in line with the window border. 50: centered.'
    x-showIf: {detached: true, anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-scope: look
    x-showIf: {detached: true, anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
  tileSize:
    x-scope: look
    type: integer
    x-control: stepper
    title: Tile size
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    x-unit: px
    default: 200
    minimum: 64
    maximum: 480
  scope:
    type: string
    title: Windows listed
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    default: all
    enum: [all, monitor, workspace]
    x-enumLabels:
      all: Every window
      monitor: Windows on the focused monitor
      workspace: Windows on the focused workspace
  previews:
    x-scope: look
    type: boolean
    title: Window previews
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    default: true
    description: 'Off: app icons.'
  order:
    x-scope: look
    type: string
    title: Tile order
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    default: leftToRight
    enum: [leftToRight, rightToLeft, topToBottom, bottomToTop]
    x-enumLabels:
      leftToRight: Left to right
      rightToLeft: Right to left
      topToBottom: Top to bottom
      bottomToTop: Bottom to top
    description: Direction the windows run, most recent first.
  showDelay:
    type: integer
    x-control: stepper
    title: Show delay
    x-showIf: {anyOf: [{compositorSwitcher: false}, {/$supports.compositorSwitcher: false}, {/Compositor.mode: detached}]}
    x-unit: ms
    default: 120
    minimum: 0
    maximum: 1000
    description: A quick tap swaps to the last window without showing the switcher.
