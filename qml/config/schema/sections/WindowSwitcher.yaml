# The WindowSwitcher section of the config (config.json's "WindowSwitcher").

x-scope: personal
type: object
x-category: Workspaces
title: Window switcher
description: Your windows, most recent first, while the switch windows keys are held.
x-intro: WindowSwitcherPlace
additionalProperties: false
properties:
  compositorSwitcher:
    type: boolean
    title: Use the compositor's switcher
    x-showIf: {/$supports.compositorSwitcher: true}
    default: true
    description: Open the compositor's own switcher instead. Only while axiom writes its config.
  scope:
    type: string
    title: Windows listed
    default: all
    enum: [all, monitor, workspace]
    x-enumLabels:
      all: Every window
      monitor: Windows on the focused monitor
      workspace: Windows on the focused workspace
  edge:
    x-scope: look
    type: string
    title: Screen edge
    default: top
    enum: [top, bottom, left, right]
  position:
    x-scope: look
    type: integer
    title: Position along edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 100
    description: 0 is the start (left/top), 100 the end.
  detached:
    x-scope: look
    type: boolean
    title: Detach from edge
    default: true
    description: A separate box held off the edge, instead of growing out of it.
  distance:
    x-scope: look
    type: integer
    title: Distance from edge
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 50
    description: 0 lines it up with your window border, 50 centres it.
    x-showIf: {detached: true}
  animation:
    $ref: '#/definitions/DetachedAnimation'
    x-scope: look
    x-showIf: {detached: true}
  order:
    x-scope: look
    type: string
    title: Tile order
    default: leftToRight
    enum: [leftToRight, rightToLeft, topToBottom, bottomToTop]
    x-enumLabels:
      leftToRight: Left to right
      rightToLeft: Right to left
      topToBottom: Top to bottom
      bottomToTop: Bottom to top
    description: Which way the windows run, most recent first.
  previews:
    x-scope: look
    type: boolean
    title: Window previews
    default: true
    description: Off shows app icons.
  tileSize:
    x-scope: look
    type: integer
    x-control: stepper
    title: Tile size
    x-unit: px
    default: 200
    minimum: 64
    maximum: 480
  showDelay:
    type: integer
    x-control: stepper
    title: Show after
    x-unit: ms
    default: 120
    minimum: 0
    maximum: 1000
    description: A quicker tap swaps to the last window without showing it.
