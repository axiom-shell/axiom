# The WorkspaceOverlay section of the config (config.json's "WorkspaceOverlay").

x-scope: look
type: object
x-category: Workspaces
title: Workspace overview
description: Drag windows between workspaces, right-drag to resize, middle-click to close.
additionalProperties: false
properties:
  compositorOverview:
    type: boolean
    title: Use the compositor's overview
    x-scope: personal
    x-showIf: {/$supports.overview: true}
    default: true
    description: Open the compositor's own overview instead.
  background:
    type: string
    title: Workspace background
    enum: [wallpaper, color]
    x-enumLabels: {wallpaper: Monitor's wallpaper, color: Theme color}
    default: color
  color:
    type: string
    title: Background color
    x-options: colors
    default: base01
    x-showIf: {background: color}
  dimInactive:
    type: integer
    title: Dim other workspaces
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 90
    description: How much darker inactive workspaces are drawn.
  size:
    type: integer
    title: Size
    x-unit: '%'
    default: 85
    minimum: 40
    maximum: 100
    description: How much of the screen the grid takes.
  backdrop:
    type: integer
    title: Backdrop darkness
    x-unit: '%'
    default: 70
    minimum: 0
    maximum: 100
  showNumbers:
    type: boolean
    title: Workspace numbers
    default: true
  showTitles:
    type: boolean
    title: Window titles
    default: true
    description: Show a window's title when hovered.
  scratchpads:
    type: string
    title: Scratchpads
    x-control: toggle
    enum: ['off', occupied, all]
    x-enumLabels: {'off': 'Off', occupied: With windows, all: All}
    default: occupied
    x-showIf: {/$supports.namedSpecial: true}
    description: 'Special workspaces in a column right of the workspaces; click one to show or hide it, drag windows in and out. With windows: those holding any, or shown. All: also every one your Toggle special workspace binds or the Workspaces settings name.'
  scratchpadColor:
    type: string
    title: Scratchpad color
    x-options: colors
    default: base0E
    x-showIf: {scratchpads: {not: 'off'}, /$supports.namedSpecial: true}
    description: The border and label color of scratchpad cells.
  showHint:
    type: boolean
    title: Controls hint
    default: true
    description: Show the mouse controls under the grid.
