# The WorkspaceOverlay section of the config (config.json's "WorkspaceOverlay").

x-scope: look
type: object
x-category: Workspaces
title: Workspace overview
description: Drag windows between workspaces, right-drag to resize, middle-click to close.
additionalProperties: false
properties:
  compositorOverview:
    type: boolean
    title: Compositor overview
    x-scope: personal
    x-showIf: {/$supports.overview: true}
    default: true
    description: Replaces this overview.
  size:
    type: integer
    title: Size
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    x-unit: '%'
    default: 85
    minimum: 40
    maximum: 100
    description: Share of the screen.
  showNumbers:
    type: boolean
    title: Numbers
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    default: true
  showTitles:
    type: boolean
    title: Titles
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    default: true
    description: On hover.
  showHint:
    type: boolean
    title: Hint
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    default: true
    description: Mouse controls under the grid.
  scratchpads:
    type: string
    title: Scratchpads
    x-control: toggle
    enum: ['off', occupied, all]
    x-enumLabels: {'off': 'Off', occupied: Occupied, all: All}
    default: occupied
    x-showIf: {/$supports.namedSpecial: true, anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    description: Special workspaces in a column beside the workspaces; click one to show or hide it, drag windows in and out.
  scratchpadColor:
    type: string
    title: Scratchpad color
    x-options: colors
    default: base0E
    x-showIf: {scratchpads: {not: 'off'}, /$supports.namedSpecial: true, anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    description: Border and label of their cells.
  dimInactive:
    type: integer
    title: Dim inactive
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    x-unit: '%'
    default: 50
    minimum: 0
    maximum: 90
  backdrop:
    type: integer
    title: Darkness
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    x-unit: '%'
    default: 70
    minimum: 0
    maximum: 100
  background:
    type: string
    title: Background
    x-control: toggle
    x-showIf: {anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
    enum: [wallpaper, color]
    x-enumLabels: {wallpaper: Wallpaper, color: Color}
    default: color
  color:
    type: string
    title: Color
    x-options: colors
    default: base01
    x-showIf: {background: color, anyOf: [{compositorOverview: false}, {/$supports.overview: false}]}
