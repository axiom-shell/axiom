# The Workspaces section of the config (config.json's "Workspaces").

x-scope: personal
type: object
x-category: Workspaces
x-intro: WorkspacesStatus
title: Workspaces
description: How workspaces are laid out. Point your workspace keybinds at `axiom ipc workspaces …` so they follow it.
additionalProperties: false
properties:
  layout:
    type: string
    title: Layout
    x-enabledIf:
      anyOf:
        - {/$supports.dynamicWorkspaces: false}
        - {layout: scrolling, /$supports.stripsAlways: false}
    x-disabledNote: false
    enum: [standard, perMonitor, grid, scrolling]
    x-enumLabels:
      standard: Standard (1 to N)
      perMonitor: Per monitor (1 to N)
      grid: Grid per monitor
      scrolling: Scrolling (niri style)
    x-enumShowIf: {scrolling: {/$supports.strips: true, /$supports.stripsAlways: false}}
    default: perMonitor
    description: 'Standard: one set for all monitors. Per monitor: each its own. Grid: columns × rows each. Scrolling: made as you fill them.'
  count:
    type: integer
    x-control: stepper
    title: Count
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 10
    minimum: 1
    maximum: 30
    x-showIf:
      anyOf:
        - {layout: [standard, perMonitor]}
        - {layout: scrolling, /$supports.strips: false}
  columns:
    type: integer
    x-control: stepper
    title: Columns
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 5
    minimum: 1
    maximum: 10
    x-showIf: {layout: grid}
  rows:
    type: integer
    x-control: stepper
    x-beside: true
    title: Rows
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 5
    minimum: 1
    maximum: 10
    x-showIf: {layout: grid}
  wrap:
    type: boolean
    title: Wrap around
    default: false
    description: Stepping past the last workspace goes back to the first.
  animate:
    type: boolean
    title: Directional slides
    x-enabledIf:
      anyOf:
        - {/$supports.dynamicWorkspaces: false}
        - {layout: scrolling, /$supports.workspaceSlide: true}
    x-disabledNote: false
    default: true
    description: Slide between workspaces in the direction you move.
  strips:
    type: array
    x-group: Workspace strips
    title: Strips
    x-showIf: {layout: {not: scrolling}, /$supports.strips: true, /$supports.stripsAlways: false}
    default: []
    description: Monitors whose windows sit side by side on a scrolling strip.
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        screen:
          $ref: '#/definitions/ScreenTarget'
          title: Monitor
          x-properties:
            mode:
              x-scope: personal
              type: string
              title: Monitors
              x-control: toggle
              enum: [primary, all, named]
              default: primary
              x-enumLabels: {primary: Primary, all: All, named: Named}
              x-link: {setting: General.screen}
            names:
              x-scope: machine
              x-monitorRef: drop
              type: array
              title: Monitors
              default: []
              items: {type: string, x-options: screens}
              x-showIf: {mode: named}
        direction:
          type: string
          title: Direction
          x-control: toggle
          enum: [horizontal, vertical]
          x-enumLabels: {horizontal: Horizontal, vertical: Vertical}
          default: horizontal
      required: [id]
  stripColumnWidth:
    type: integer
    x-group: Workspace strips
    title: Column width
    x-unit: '%'
    default: 50
    minimum: 10
    maximum: 100
    description: A new column's share of the monitor.
    x-showIf:
      anyOf:
        - {strips: {notEmpty: true}, /$supports.strips: true}
        - {layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    x-compositor:
      hyprland: {key: scrolling.column_width, scale: 0.01}
      niri: {key: layout.default-column-width.proportion, scale: 0.01, value: float}
  stripFollowFocus:
    type: boolean
    x-group: Workspace strips
    title: Scroll to the focused window
    default: true
    x-showIf:
      anyOf:
        - {strips: {notEmpty: true}}
        - {layout: scrolling}
      /$supports.strips: true
      /$supports.stripsAlways: false
    x-compositor: {hyprland: {key: scrolling.follow_focus}}
  scratchpads:
    type: array
    x-group: Scratchpads
    title: Scratchpads
    x-showIf: {/$supports.namedSpecial: true}
    default: []
    description: Own icon and label for a special workspace, by name. Also adds it to the switcher's All list.
    items:
      type: object
      additionalProperties: false
      x-order: [name, icon, text]
      properties:
        id: {$ref: '#/definitions/ItemId'}
        name: {type: string, x-options: specialWorkspaces, title: Name, default: '', description: "Its bind's name, e.g. magic."}
        icon: {type: string, x-control: icon, x-iconText: {text: text}, title: Label, default: '', description: "An icon name or glyph, and text. The widget's Scratchpad labels picks which shows."}
        text: {type: string, title: Label, default: ''}
      required: [id]
