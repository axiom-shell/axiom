# The Workspaces section of the config (config.json's "Workspaces").

x-scope: personal
type: object
x-category: Workspaces
x-intro: WorkspacesStatus
title: Workspaces
description: How workspaces are laid out, for the bar's workspace widget, the workspace overview and the Workspaces module. Point your workspace keybinds at `axiom ipc workspaces <left|right|up|down|go N|nth N>` (and the move… versions) so they follow it too.
additionalProperties: false
properties:
  layout:
    type: string
    title: Layout
    x-enabledIf:
      anyOf:
        - {/$supports.dynamicWorkspaces: false}
        - {layout: scrolling, /$supports.stripsAlways: false}
    x-disabledNote: false
    enum: [standard, perMonitor, grid, scrolling]
    x-enumLabels:
      standard: Standard (1 to N)
      perMonitor: Per monitor (1 to N)
      grid: Grid per monitor
      scrolling: Scrolling (niri style)
    x-enumShowIf: {scrolling: {/$supports.strips: true, /$supports.stripsAlways: false}}
    default: perMonitor
    description: "Standard: workspaces 1 to N, shared by every monitor. Per monitor: each monitor has its own 1 to N workspaces. Grid: each monitor has its own columns × rows workspaces. Scrolling, as on niri: each monitor has a column of workspaces, made as you fill them and removed once left empty, with an empty one at the end, and every monitor is a horizontal strip whose windows open side by side as columns. Its workspace numbers move as workspaces come and go, so workspace rules naming one don't stay with it. Where the compositor has no strips it works as per monitor. Per monitor, grid and scrolling assign monitors a stable order (the primary monitor first, then the rest by their monitor identity), so a hotplug or Hyprland restart can't reshuffle which monitor owns which ids."
  count:
    type: integer
    x-control: stepper
    title: Workspaces
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 10
    minimum: 1
    maximum: 30
    x-showIf:
      anyOf:
        - {layout: [standard, perMonitor]}
        - {layout: scrolling, /$supports.strips: false}
  columns:
    type: integer
    x-control: stepper
    title: Columns
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 5
    minimum: 1
    maximum: 10
    x-showIf: {layout: grid}
  rows:
    type: integer
    x-control: stepper
    x-beside: true
    title: Rows
    x-enabledIf: {/$supports.dynamicWorkspaces: false}
    x-disabledNote: false
    default: 5
    minimum: 1
    maximum: 10
    x-showIf: {layout: grid}
  wrap:
    type: boolean
    title: Wrap around
    default: false
    description: Stepping past the last workspace (of a row or column in a grid) goes back to the first.
  animate:
    type: boolean
    title: Directional slides
    x-enabledIf:
      anyOf:
        - {/$supports.dynamicWorkspaces: false}
        - {layout: scrolling, /$supports.workspaceSlide: true}
    x-disabledNote: false
    default: true
    description: "Slide between workspaces whatever the compositor's own workspace animation style is: sideways in the standard layout; in a grid, sideways between columns and vertically between rows, going by row first, then column; with scrolling, always vertically."
  strips:
    type: array
    x-group: Workspace strips
    title: Strips
    x-showIf: {layout: {not: scrolling}, /$supports.strips: true, /$supports.stripsAlways: false}
    default: []
    description: Monitors whose windows sit side by side on a strip that scrolls (Hyprland's scrolling layout) instead of tiling. New windows open as a new column after the focused one.
    items:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/definitions/ItemId'}
        screen:
          $ref: '#/definitions/ScreenTarget'
          title: Monitor
          description: Empty uses the primary monitor; All monitors makes every monitor a strip, unless another entry names it.
          x-properties:
            mode:
              x-scope: personal
              type: string
              title: Monitors
              enum: [primary, all, named]
              default: primary
              x-enumLabels: {primary: Primary monitor, all: Every monitor, named: These monitors}
              x-link: {setting: General.screen}
            names:
              x-scope: machine
              x-monitorRef: drop
              type: array
              title: Monitors
              default: []
              items: {type: string, x-options: screens}
              x-showIf: {mode: named}
        direction:
          type: string
          title: Direction
          enum: [horizontal, vertical]
          x-enumLabels: {horizontal: Horizontal, vertical: Vertical}
          default: horizontal
          description: 'Horizontal: columns side by side, scrolling sideways. Vertical: rows one under another, scrolling up and down.'
      required: [id]
  stripColumnWidth:
    type: integer
    x-group: Workspace strips
    title: Column width
    x-unit: '%'
    default: 50
    minimum: 10
    maximum: 100
    description: A new column's share of the monitor.
    x-showIf:
      anyOf:
        - {strips: {notEmpty: true}, /$supports.strips: true}
        - {layout: scrolling, /$supports.strips: true}
        - {/$supports.stripsAlways: true}
    x-compositor:
      hyprland: {key: scrolling.column_width, scale: 0.01}
      niri: {key: layout.default-column-width.proportion, scale: 0.01, value: float}
  stripFollowFocus:
    type: boolean
    x-group: Workspace strips
    title: Scroll to the focused window
    default: true
    x-showIf:
      anyOf:
        - {strips: {notEmpty: true}}
        - {layout: scrolling}
      /$supports.strips: true
      /$supports.stripsAlways: false
    x-compositor: {hyprland: {key: scrolling.follow_focus}}
